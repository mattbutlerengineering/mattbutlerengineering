# GitHub Actions workflow for Prisma migrations
#
# This workflow:
# 1. Tests migrations against a fresh database
# 2. Applies migrations to production
# 3. Deploys the application
#
# Required secrets:
# - DATABASE_URL: Production database connection string
# - VERCEL_TOKEN: (optional) For Vercel deployments

name: Deploy with Migrations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # Test migrations against a fresh PostgreSQL database
  test-migrations:
    name: Test Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run migrations on test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Verify schema
        run: npx prisma migrate status
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  # Apply migrations to production (only on main branch)
  migrate-production:
    name: Migrate Production
    runs-on: ubuntu-latest
    needs: test-migrations
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check pending migrations
        id: check
        run: |
          STATUS=$(npx prisma migrate status 2>&1) || true
          echo "$STATUS"
          if echo "$STATUS" | grep -q "Database schema is up to date"; then
            echo "pending=false" >> $GITHUB_OUTPUT
            echo "No pending migrations"
          else
            echo "pending=true" >> $GITHUB_OUTPUT
            echo "Pending migrations detected"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Apply migrations to production
        if: steps.check.outputs.pending == 'true'
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify production schema
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Deploy application after migrations succeed
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: migrate-production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Option 1: Deploy to Vercel
      # - name: Deploy to Vercel
      #   run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Option 2: Deploy to Railway
      # - name: Deploy to Railway
      #   run: railway up
      #   env:
      #     RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Option 3: Deploy to custom server
      # - name: Deploy to server
      #   run: |
      #     ssh deploy@server "cd /app && git pull && npm ci && npm run build && pm2 restart app"

      - name: Deployment complete
        run: echo "Application deployed successfully"
