      data-font-stylesheet
    />
    <script>
      // Swap the preloaded font stylesheet to rel="stylesheet" once it loads.
      // Uses a nonce'd script (the edge injects the CSP nonce into <script>
      // tags) instead of an inline event-handler attribute, which would violate
      // nonce-based script-src CSP. Runs during head parse so the listener is
      // attached before the preload resolves.
      (function () {
        var link = document.querySelector("link[data-font-stylesheet]");
        if (link) {
          link.addEventListener("load", function () {
            link.rel = "stylesheet";
          });
        }
      })();
    </script>
