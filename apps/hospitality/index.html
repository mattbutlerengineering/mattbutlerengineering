    <!-- Kept identical across apps; guarded by scripts/__tests__/app-html-shared-fonts.test.mjs -->
    <!-- shared-fonts:start -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300;1,9..40,400&family=DM+Mono:wght@300;400&family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500&display=swap"
      data-font-stylesheet
    />
    <script>
      // Swap the preloaded font stylesheet to rel="stylesheet" once it loads.
      // Uses a nonce'd script (the edge injects the CSP nonce into <script>
      // tags) instead of an inline event-handler attribute, which would violate
      // nonce-based script-src CSP. Runs during head parse so the listener is
      // attached before the preload resolves.
      (function () {
        var link = document.querySelector("link[data-font-stylesheet]");
        if (link) {
          link.addEventListener("load", function () {
            link.rel = "stylesheet";
          });
        }
      })();
    </script>
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300;1,9..40,400&family=DM+Mono:wght@300;400&family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500&display=swap"

    <script>
      // Zod 4 probes new Function("") the first time an object schema is built.
      // The throw is caught, but the edge CSP (script-src, no 'unsafe-eval')
      // still reports it, and Chrome files that as an eval violation. The
      // entry chunk builds @mbe/types object schemas while it evaluates, so
      // the probe runs on every visit, including the signed-out shell.
      // jitless skips the probe. It has to be set before Zod's module loads:
      // this classic script runs during parse, and the entry is a deferred
      // module, so the assignment wins even after Vite hoists that module
      // into <head>. Zod reads the object off globalThis (shared by every
      // copy of the package). Do not mark this script type="module", defer,
      // or async — any of those can run it after the probe.
      globalThis.__zod_globalConfig = { jitless: true };
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) {
            r.unregister();
          });
        });
      }
    </script>
