# Workers Static Assets — replaces CF Pages for CDN-bypass via Service Bindings
name = "mattbutlerengineering-rialto-web"
compatibility_date = "2026-03-25"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[[headers]]
pattern = "/assets/*"
[headers.headers]
Cache-Control = "public, max-age=31536000, immutable"
