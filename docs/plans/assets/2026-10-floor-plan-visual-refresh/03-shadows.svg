<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190" role="img" aria-labelledby="t d">
  <title id="t">Shadows and furniture tones, before and after</title>
  <desc id="d">Before: a hard two-pixel offset shadow that disappears on a dark floor, chairs with no shadow. After: a soft contact shadow under tables and chairs that stays visible in the dark theme.</desc>
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="240" height="190" fill="#141312"/>
  <rect x="240" width="240" height="190" fill="#141312"/>
  <text x="120" y="22" fill="#fdfcfa" font-family="sans-serif" font-size="12" text-anchor="middle">Before (dark theme)</text>
  <text x="360" y="22" fill="#fdfcfa" font-family="sans-serif" font-size="12" text-anchor="middle">After</text>
  <!-- before -->
  <rect x="92" y="68" width="16" height="13" rx="4" fill="#4a3f32"/>
  <rect x="132" y="68" width="16" height="13" rx="4" fill="#4a3f32"/>
  <rect x="80" y="82" width="80" height="60" rx="6" fill="#9aaa4c"/>
  <rect x="80" y="84" width="80" height="60" rx="6" fill="rgb(0 0 0 / 0.12)" opacity="0"/>
  <text x="120" y="165" fill="#a8a49d" font-family="sans-serif" font-size="10" text-anchor="middle">shadow rgba(0,0,0,.12) on #141312: invisible</text>
  <!-- after -->
  <ellipse cx="360" cy="146" rx="46" ry="10" fill="#000" opacity="0.55" filter="url(#soft)"/>
  <rect x="332" y="72" width="16" height="13" rx="4" fill="#6b5c4a"/>
  <rect x="372" y="72" width="16" height="13" rx="4" fill="#6b5c4a"/>
  <rect x="320" y="82" width="80" height="60" rx="6" fill="#9aaa4c"/>
  <text x="360" y="170" fill="#a8a49d" font-family="sans-serif" font-size="10" text-anchor="middle">blurred contact shadow, tone per theme</text>
</svg>
