<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190" role="img" aria-labelledby="t d">
  <title id="t">Table and chair scale, before and after</title>
  <desc id="d">Before: a 140-wide template table drawn at the 80-wide default with chairs bunched at its centre, and one chair size for every party. After: art follows the stored footprint, chairs spread along the real edges and shrink slightly for large parties.</desc>
  <rect width="480" height="190" fill="#edeae5"/>
  <text x="120" y="20" fill="#1a1918" font-family="sans-serif" font-size="12" text-anchor="middle">Before (8-top long table, stored 140x60)</text>
  <text x="360" y="20" fill="#1a1918" font-family="sans-serif" font-size="12" text-anchor="middle">After</text>
  <line x1="240" y1="28" x2="240" y2="182" stroke="#a8a49d"/>
  <g fill="#4a3f32">
    <rect x="72" y="62" width="16" height="13" rx="4"/><rect x="96" y="62" width="16" height="13" rx="4"/>
    <rect x="72" y="125" width="16" height="13" rx="4"/><rect x="96" y="125" width="16" height="13" rx="4"/>
  </g>
  <rect x="60" y="75" width="80" height="50" rx="6" fill="#5e6a2e"/>
  <rect x="50" y="75" width="140" height="0" fill="none"/>
  <text x="100" y="155" fill="#4a4744" font-family="sans-serif" font-size="10" text-anchor="middle">art 80 wide, footprint 140: hit area and art disagree</text>
  <g fill="#4a3f32">
    <rect x="278" y="62" width="14" height="11" rx="3.5"/><rect x="304" y="62" width="14" height="11" rx="3.5"/><rect x="330" y="62" width="14" height="11" rx="3.5"/><rect x="356" y="62" width="14" height="11" rx="3.5"/>
    <rect x="278" y="127" width="14" height="11" rx="3.5"/><rect x="304" y="127" width="14" height="11" rx="3.5"/><rect x="330" y="127" width="14" height="11" rx="3.5"/><rect x="356" y="127" width="14" height="11" rx="3.5"/>
  </g>
  <rect x="266" y="75" width="116" height="50" rx="6" fill="#5e6a2e"/>
  <text x="324" y="155" fill="#4a4744" font-family="sans-serif" font-size="10" text-anchor="middle">art follows stored width and height</text>
</svg>
