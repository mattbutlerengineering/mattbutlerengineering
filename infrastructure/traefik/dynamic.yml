# Dynamic Traefik configuration
# This file is watched and can be updated without restarting Traefik

http:
  # Middlewares
  middlewares:
    # Strip /api/v1/users prefix before forwarding to service
    strip-users-prefix:
      stripPrefix:
        prefixes:
          - "/api/v1/users"

    # Strip /api/v1/reservations prefix
    strip-reservations-prefix:
      stripPrefix:
        prefixes:
          - "/api/v1/reservations"

    # Strip /api prefix for agent
    strip-agent-prefix:
      stripPrefix:
        prefixes:
          - "/api"

    # Security headers
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000

    # Rate limiting
    rate-limit:
      rateLimit:
        average: 100
        burst: 50

  # Routers
  routers:
    users-router:
      rule: "PathPrefix(/api/v1/users)"
      service: users-service
      middlewares:
        - strip-users-prefix
        - security-headers
      entryPoints:
        - web

    reservations-router:
      rule: "PathPrefix(/api/v1/reservations)"
      service: reservations-service
      middlewares:
        - strip-reservations-prefix
        - security-headers
      entryPoints:
        - web

    agent-router:
      rule: "PathPrefix(/api/gen)"
      service: agent-service
      middlewares:
        - strip-agent-prefix
        - security-headers
      entryPoints:
        - web

  # Services
  services:
    users-service:
      loadBalancer:
        servers:
          - url: "http://users-api:3001"

    reservations-service:
      loadBalancer:
        servers:
          - url: "http://reservations-api:3004"

    agent-service:
      loadBalancer:
        servers:
          - url: "http://agent-api:3003"
