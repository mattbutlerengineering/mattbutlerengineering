services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mbe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mbe_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mbe}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mbe}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Users API Service
  users-api:
    build:
      context: ..
      dockerfile: services/users/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://mbe:mbe_dev_password@postgres:5432/mbe
      - AUTH_AUTHORITY=https://mattbutlerengineering.auth0.com
      - AUTH_AUDIENCE=https://api.mattbutlerengineering.com
      - NODE_ENV=development
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  # Reservations API Service
  reservations-api:
    build:
      context: ..
      dockerfile: services/reservations/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3004
      - DATABASE_URL=postgresql://mbe:mbe_dev_password@postgres:5432/mbe
      - AUTH_AUTHORITY=https://mattbutlerengineering.auth0.com
      - AUTH_AUDIENCE=https://api.mattbutlerengineering.com
      - NODE_ENV=development
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy

  # Agent API Service
  agent-api:
    build:
      context: ..
      dockerfile: services/agent/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3003
      - DATABASE_URL=postgresql://mbe:mbe_dev_password@postgres:5432/mbe_agent
      - AUTH_AUTHORITY=https://mattbutlerengineering.auth0.com
      - AUTH_AUDIENCE=https://api.mattbutlerengineering.com
      - NODE_ENV=development
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy

  # Traefik reverse proxy
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik/dynamic:ro
    depends_on:
      - users-api
      - reservations-api
      - agent-api

  # Users API Service
  users-api:
    build:
      context: ..
      dockerfile: services/users/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-mbe}:${POSTGRES_PASSWORD:-mbe_dev_password}@postgres:5432/${POSTGRES_DB:-mbe}
      LOG_LEVEL: info
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.users-api.rule=PathPrefix(`/api/v1/users`)"
      - "traefik.http.routers.users-api.entrypoints=web"
      - "traefik.http.middlewares.users-api-strip.stripprefix.prefixes=/api/v1/users"
      - "traefik.http.routers.users-api.middlewares=users-api-strip"
      - "traefik.http.services.users-api.loadbalancer.server.port=3001"

  # Reservations API Service
  reservations-api:
    build:
      context: ..
      dockerfile: services/reservations/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://${POSTGRES_USER:-mbe}:${POSTGRES_PASSWORD:-mbe_dev_password}@postgres:5432/${POSTGRES_DB:-mbe}
      LOG_LEVEL: info
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reservations-api.rule=PathPrefix(`/api/reservations`)"
      - "traefik.http.routers.reservations-api.entrypoints=web"
      - "traefik.http.services.reservations-api.loadbalancer.server.port=3004"

  # Agent API Service
  agent-api:
    build:
      context: ..
      dockerfile: services/agent/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-mbe}:${POSTGRES_PASSWORD:-mbe_dev_password}@postgres:5432/mbe_agent
      LOG_LEVEL: info
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent-api.rule=PathPrefix(`/api/gen`)"
      - "traefik.http.routers.agent-api.entrypoints=web"
      - "traefik.http.services.agent-api.loadbalancer.server.port=3003"

volumes:
  postgres_data:

networks:
  default:
    name: mbe_network
