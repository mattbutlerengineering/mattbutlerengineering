services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mbe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mbe_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mbe}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mbe}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Traefik reverse proxy
  traefik:
    image: traefik:v3.0@sha256:a208c74fd80a566d4ea376053bff73d31616d7af3f1465a7747b8b89ee34d97e
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik/dynamic:ro
    depends_on:
      - users-api
      - reservations-api
      - agent-api

  # Users API Service
  users-api:
    build:
      context: ..
      dockerfile: services/users/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-mbe}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mbe}
      AUTH_AUTHORITY: ${AUTH_AUTHORITY:-https://dev-ytbgmz5ls3wh4xdx.us.auth0.com} # dev-only default; set AUTH_AUTHORITY env var for prod
      AUTH_AUDIENCE: https://api.mattbutlerengineering.com
      LOG_LEVEL: info
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.users-api.rule=PathPrefix(`/api/v1/users`)"
      - "traefik.http.routers.users-api.entrypoints=web"
      - "traefik.http.middlewares.users-api-strip.stripprefix.prefixes=/api/v1/users"
      - "traefik.http.routers.users-api.middlewares=users-api-strip"
      - "traefik.http.services.users-api.loadbalancer.server.port=3001"

  # Reservations API Service
  reservations-api:
    build:
      context: ..
      dockerfile: services/reservations/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://${POSTGRES_USER:-mbe}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mbe}
      AUTH_AUTHORITY: ${AUTH_AUTHORITY:-https://dev-ytbgmz5ls3wh4xdx.us.auth0.com} # dev-only default; set AUTH_AUTHORITY env var for prod
      AUTH_AUDIENCE: https://api.mattbutlerengineering.com
      LOG_LEVEL: info
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reservations-api.rule=PathPrefix(`/api/reservations`)"
      - "traefik.http.routers.reservations-api.entrypoints=web"
      - "traefik.http.services.reservations-api.loadbalancer.server.port=3004"

  # Agent API Service
  agent-api:
    build:
      context: ..
      dockerfile: services/agent/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-mbe}:${POSTGRES_PASSWORD}@postgres:5432/mbe_agent
      AUTH_AUTHORITY: ${AUTH_AUTHORITY:-https://dev-ytbgmz5ls3wh4xdx.us.auth0.com} # dev-only default; set AUTH_AUTHORITY env var for prod
      AUTH_AUDIENCE: https://api.mattbutlerengineering.com
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      LOG_LEVEL: info
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent-api.rule=PathPrefix(`/api/gen`)"
      - "traefik.http.routers.agent-api.entrypoints=web"
      - "traefik.http.services.agent-api.loadbalancer.server.port=3003"

volumes:
  postgres_data:

networks:
  default:
    name: mbe_network
