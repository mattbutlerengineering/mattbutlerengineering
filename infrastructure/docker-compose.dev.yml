# Development overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mbe_dev_password}

  # Users API Service
  users-api:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mbe_dev_password}

  # Reservations API Service
  reservations-api:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mbe_dev_password}

  # Agent API Service
  agent-api:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mbe_dev_password}
