name = "mattbutlerengineering-edge-router"
main = "edge-router.js"
compatibility_date = "2026-03-25"

routes = [
  { pattern = "mattbutlerengineering.com/*", zone_name = "mattbutlerengineering.com" },
  { pattern = "www.mattbutlerengineering.com/*", zone_name = "mattbutlerengineering.com" },
]

[vars]
API_ORIGIN = "https://api.mattbutlerengineering.com"

# Secrets (set via `wrangler secret put <NAME>`):
#   HEALTH_TOKEN  — Bearer token for detailed /health/system responses
#   AUDIT_TOKEN   — Token for automated site audits (bypasses rate limiting)

[[services]]
binding = "MARKETING"
service = "mattbutlerengineering-marketing"

[[services]]
binding = "HOSPITALITY"
service = "mattbutlerengineering-hospitality"

[[services]]
binding = "RIALTO"
service = "mattbutlerengineering-rialto-web"

[[services]]
binding = "GEN"
service = "mattbutlerengineering-gen"

# Health state KV — stores CI/deploy status written by GitHub Actions.
# ID comes from: cd infrastructure/pulumi && pulumi stack output healthKvNamespaceId
[[kv_namespaces]]
binding = "HEALTH_STATE"
id = "dda61075cc654b0a849046ae563d8d45"

# Analytics Engine — custom request metrics (free tier, non-blocking writes)
# Query via SQL API: https://developers.cloudflare.com/analytics/analytics-engine/sql-api/
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "edge_requests"

# CSP violation reports from POST /csp-report (csp-report.js, #8895)
[[analytics_engine_datasets]]
binding = "CSP_REPORTS"
dataset = "csp_reports"

# Rate limiting — one binding per rule in rate-limiter.js RATE_LIMITS (limit and
# period are fixed per binding, period must be 10 or 60). No KV writes, unlike the
# old per-request counter (#9209). namespace_id is a unique positive integer per
# limiter across the whole Cloudflare account. Kept in sync with Pulumi and
# RATE_LIMITS by scripts/check-rate-limit-bindings.mjs.
[[ratelimits]]
name = "RATE_LIMIT_FLAGS"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_HEALTH_SYSTEM"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_API"
namespace_id = "1003"
simple = { limit = 100, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_PUBLIC"
namespace_id = "1004"
simple = { limit = 100, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_CSP_REPORT"
namespace_id = "1005"
simple = { limit = 60, period = 60 }
