name: CodeQL Configuration

# Disable queries that trigger on legitimate patterns
queries:
  - uses: security-and-quality
    # Exclude false-positive queries
    filters:
      - exclude:
          id:
            - js/resource-exhaustion
            - js/missing-rate-limiting

# Path filters - exclude test files from certain queries
paths:
  exclude:
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/__tests__/**"
