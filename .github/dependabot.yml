version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      production-deps:
        patterns: ["*"]
        exclude-patterns: ["@types/*", "eslint*", "prettier*", "vitest*", "playwright*"]
      dev-deps:
        dependency-type: "development"
        patterns: ["@types/*", "eslint*", "prettier*", "vitest*", "playwright*"]
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci-fix"
    commit-message:
      prefix: "ci(deps)"
