version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # `vitest*` does NOT match `@vitest/coverage-v8` — dependabot patterns are
      # matched against the full package name, and a scoped name starts with
      # `@`. That split sent vitest and its `@vitest/*` companions into two
      # different groups, which is why vitest 5 could not land as one bump:
      # #5111 (vitest alone) mismatched `@vitest/coverage-v8@4`, and #5135
      # (`@vitest/*` alone) died with `coverageFilesDirectory is required`
      # against vitest 4. `@vitest/*` keeps the family in one group.
      production-deps:
        patterns: ["*"]
        exclude-patterns:
          ["@types/*", "eslint*", "prettier*", "vitest*", "@vitest/*", "playwright*"]
      # `@types/*` is auto-merged on green CI whatever its dependency type
      # (#6650), so it gets its own group with NO `dependency-type` key —
      # under `dev-deps` it was missed whenever a package declared it in
      # `dependencies`. Each package matches exactly one group.
      types:
        patterns: ["@types/*"]
      dev-deps:
        dependency-type: "development"
        patterns: ["eslint*", "prettier*", "vitest*", "@vitest/*", "playwright*"]
    ignore:
      # TypeScript 7 removes the JavaScript Compiler API, breaking unplugin-dts
      # (rialto lib build) and typescript-eslint. Remove once #3253 lands.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # Official actions auto-merge on green CI (patch/minor only, #6650).
      # Third-party actions (e.g. hadolint/*) match no group and stay manual.
      official-actions:
        patterns: ["actions/*", "github/*"]
    labels:
      - "dependencies"
      - "ci-fix"
    commit-message:
      prefix: "ci(deps)"
