name: Post-Deploy Check

on:
  workflow_run:
    workflows: ["Deploy Services", "Deploy Static Sites"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4/v5

      - name: Wait for deploy propagation
        run: sleep 30

      - name: Smoke test deployed sites
        id: smoke
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PASS_COUNT=0
          FAIL_COUNT=0
          REPORT=""

          smoke_check() {
            local NAME="$1"
            local URL="$2"
            local EXPECT_PATTERN="$3"
            local HTTP_CODE BODY PASS

            HTTP_CODE=$(curl -sf -o /tmp/smoke-response.txt -w '%{http_code}' --max-time 15 "$URL" 2>/dev/null || echo "000")
            BODY=""
            [ -f /tmp/smoke-response.txt ] && BODY=$(cat /tmp/smoke-response.txt)

            PASS=true
            if [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" -ge 400 ]; then
              PASS=false
            fi

            if [ -n "$EXPECT_PATTERN" ] && [ "$PASS" = true ]; then
              if ! echo "$BODY" | grep -q "$EXPECT_PATTERN"; then
                PASS=false
              fi
            fi

            if [ "$PASS" = true ]; then
              PASS_COUNT=$((PASS_COUNT + 1))
              REPORT="${REPORT}| ${NAME} | ${HTTP_CODE} | PASS |\n"
              echo "PASS: ${NAME} (HTTP ${HTTP_CODE})"
            else
              FAIL_COUNT=$((FAIL_COUNT + 1))
              REPORT="${REPORT}| ${NAME} | ${HTTP_CODE} | **FAIL** |\n"
              echo "FAIL: ${NAME} (HTTP ${HTTP_CODE})"
            fi
          }

          smoke_check "Marketing Homepage" "https://mattbutlerengineering.com" "<html"
          smoke_check "Marketing /about" "https://mattbutlerengineering.com/about" "<html"
          smoke_check "Hospitality Homepage" "https://hospitality.mattbutlerengineering.com" "<html"
          smoke_check "Rialto Storybook" "https://mattbutlerengineering.github.io/mattbutlerengineering/" "<html"
          smoke_check "Users Health API" "https://api.mattbutlerengineering.com/api/v1/users/health" "status"
          smoke_check "Users Liveness" "https://api.mattbutlerengineering.com/health" "ok"

          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "pass_count=$PASS_COUNT" >> "$GITHUB_OUTPUT"
          echo "fail_count=$FAIL_COUNT" >> "$GITHUB_OUTPUT"
          echo "report<<REPORT_EOF" >> "$GITHUB_OUTPUT"
          echo -e "$REPORT" >> "$GITHUB_OUTPUT"
          echo "REPORT_EOF" >> "$GITHUB_OUTPUT"

          # Write step summary
          {
            echo "### Post-Deploy Smoke Test: ${TIMESTAMP}"
            echo
            echo "| Site | HTTP | Result |"
            echo "|------|------|--------|"
            echo -e "$REPORT"
            echo
            echo "**Passed:** ${PASS_COUNT} | **Failed:** ${FAIL_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "::error::${FAIL_COUNT} smoke test(s) failed"
            exit 1
          fi

      - name: Find most recent merged PR
        if: always()
        id: find-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main --limit 1 --json number --jq '.[0].number // empty')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Found most recent merged PR: #${PR_NUMBER:-none}"

      - name: Post results to PR
        if: always() && steps.find-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.find-pr.outputs.pr_number }}
          TIMESTAMP: ${{ steps.smoke.outputs.timestamp }}
          PASS_COUNT: ${{ steps.smoke.outputs.pass_count }}
          FAIL_COUNT: ${{ steps.smoke.outputs.fail_count }}
          REPORT: ${{ steps.smoke.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event.workflow_run.name }}
        run: |
          if [ "$FAIL_COUNT" -gt 0 ]; then
            VERDICT="Some checks failed"
          else
            VERDICT="All checks passed"
          fi

          {
            echo "## Post-Deploy Smoke Test"
            echo
            echo "**Timestamp:** ${TIMESTAMP}"
            echo "**Trigger:** ${TRIGGER:-manual}"
            echo "**Verdict:** ${VERDICT}"
            echo "**Run:** [View logs](${RUN_URL})"
            echo
            echo "| Site | HTTP | Result |"
            echo "|------|------|--------|"
            echo "$REPORT"
            echo
            echo "**Passed:** ${PASS_COUNT} | **Failed:** ${FAIL_COUNT}"
            echo
            echo "---"
            echo "*Auto-generated by post-deploy-check workflow*"
          } > /tmp/smoke-comment.md

          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/smoke-comment.md

  playwright-smoke:
    name: Playwright Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4/v5

      - name: Install pnpm
        run: npm install -g pnpm@9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Poll for deploy to land
        id: poll-deploy
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Only poll when triggered by a real workflow_run (not manual dispatch)
          if [ -z "$EXPECTED_SHA" ]; then
            echo "Manual dispatch — skipping SHA poll"
            echo "sha_confirmed=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHORT_SHA="${EXPECTED_SHA:0:7}"
          echo "Waiting for marketing site to serve build-id=${SHORT_SHA}"

          MAX_ATTEMPTS=12
          SLEEP_SECS=15
          for i in $(seq 1 $MAX_ATTEMPTS); do
            LIVE_BUILD=$(curl -sf --max-time 10 "https://mattbutlerengineering.com/" 2>/dev/null \
              | grep -oP '(?<=<meta name="build-id" content=")[^"]+' || true)

            echo "Attempt ${i}/${MAX_ATTEMPTS}: live build-id='${LIVE_BUILD}', expected='${SHORT_SHA}'"

            if [ "${LIVE_BUILD:0:7}" = "$SHORT_SHA" ]; then
              echo "Deploy confirmed on production"
              echo "sha_confirmed=true" >> "$GITHUB_OUTPUT"
              echo "live_build_id=$LIVE_BUILD" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECS"
            fi
          done

          echo "::warning::Deploy SHA not confirmed after $((MAX_ATTEMPTS * SLEEP_SECS))s — proceeding with tests anyway"
          echo "sha_confirmed=timeout" >> "$GITHUB_OUTPUT"
          echo "live_build_id=$LIVE_BUILD" >> "$GITHUB_OUTPUT"

      - name: Run smoke tests
        id: run-tests
        env:
          SMOKE_BASE_URL: "https://mattbutlerengineering.com"
          SMOKE_API_URL: "https://api.mattbutlerengineering.com"
        run: npx playwright test --config tests/smoke/playwright.config.ts

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-results
          path: |
            tests/smoke/test-results/
            tests/smoke/playwright-report/
          retention-days: 7

      - name: Find originating issue from merge commit
        if: failure()
        id: find-issue
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Extract issue numbers referenced in the merge commit (Closes #N / Fixes #N)
          if [ -z "$HEAD_SHA" ]; then
            echo "issue_numbers=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMIT_MSG=$(git log --format="%B" -n 1 "$HEAD_SHA" 2>/dev/null || \
            gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq '.commit.message' 2>/dev/null || true)

          # Extract issue numbers from common close keywords (case-insensitive)
          ISSUE_NUMBERS=$(echo "$COMMIT_MSG" | grep -oiE '(closes|fixes|resolves|close|fix|resolve)[[:space:]:#]+[0-9]+' \
            | grep -oE '[0-9]+' | tr '\n' ' ' | xargs || true)

          echo "issue_numbers=$ISSUE_NUMBERS" >> "$GITHUB_OUTPUT"
          echo "Originating issues from commit: ${ISSUE_NUMBERS:-none}"

      - name: Reopen originating issues
        if: failure() && steps.find-issue.outputs.issue_numbers != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBERS: ${{ steps.find-issue.outputs.issue_numbers }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for ISSUE_NUM in $ISSUE_NUMBERS; do
            ISSUE_STATE=$(gh issue view "$ISSUE_NUM" --repo "$GITHUB_REPOSITORY" --json state --jq '.state' 2>/dev/null || true)
            if [ "$ISSUE_STATE" = "CLOSED" ]; then
              gh issue reopen "$ISSUE_NUM" --repo "$GITHUB_REPOSITORY"
              REOPEN_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              printf 'Post-deploy smoke tests failed after this issue was merged. Reopening for investigation.\n\nRun: %s\nDate: %s\n\nAuto-reopened by post-deploy-check workflow\n' \
                "$RUN_URL" "$REOPEN_DATE" > /tmp/reopen-comment.md
              gh issue comment "$ISSUE_NUM" \
                --repo "$GITHUB_REPOSITORY" \
                --body-file /tmp/reopen-comment.md
              echo "Reopened issue #${ISSUE_NUM}"
            else
              echo "Issue #${ISSUE_NUM} is already open or not found — skipping reopen"
            fi
          done

      - name: Create regression issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ORIGINATING_ISSUES: ${{ steps.find-issue.outputs.issue_numbers }}
          LIVE_BUILD_ID: ${{ steps.poll-deploy.outputs.live_build_id }}
          SHA_CONFIRMED: ${{ steps.poll-deploy.outputs.sha_confirmed }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"

          ORIG_REF=""
          if [ -n "$ORIGINATING_ISSUES" ]; then
            for NUM in $ORIGINATING_ISSUES; do
              ORIG_REF="${ORIG_REF} #${NUM}"
            done
          fi

          {
            echo "## Post-Deploy Smoke Test Failure"
            echo
            echo "Production smoke tests failed after a successful deploy to main."
            echo
            echo "### Deploy Details"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Date** | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| **Trigger** | ${TRIGGER_NAME:-manual} |"
            echo "| **Commit SHA** | \`${SHORT_SHA:-unknown}\` |"
            echo "| **Live Build ID** | \`${LIVE_BUILD_ID:-unknown}\` |"
            echo "| **SHA Confirmed** | ${SHA_CONFIRMED:-unknown} |"
            if [ -n "$ORIG_REF" ]; then
              echo "| **Originating Issues** |${ORIG_REF} |"
            fi
            echo
            echo "### Failure Run"
            echo "[View test run logs and artifacts](${RUN_URL})"
            echo
            echo "### Next Steps"
            echo "1. Check test artifacts (screenshots, traces) in the run linked above"
            echo "2. Verify the deploy did not break critical user flows"
            echo "3. Consider rollback if critical paths are broken"
            if [ -n "$ORIG_REF" ]; then
              echo "4. The originating issue(s) (${ORIG_REF}) have been reopened automatically"
            fi
            echo
            echo "---"
            echo "*Auto-created by post-deploy-check workflow*"
          } > /tmp/regression-body.md

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Post-deploy smoke tests failed (${SHORT_SHA:-unknown})" \
            --label "ci-fix" \
            --label "ready" \
            --body-file /tmp/regression-body.md

      - name: Log verification result for learning-loop
        if: always()
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          SHA_CONFIRMED: ${{ steps.poll-deploy.outputs.sha_confirmed }}
          LIVE_BUILD_ID: ${{ steps.poll-deploy.outputs.live_build_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Determine outcome based on test step result
          if [ "${{ steps.run-tests.outcome }}" = "success" ]; then
            RESULT="pass"
          elif [ "${{ steps.run-tests.outcome }}" = "skipped" ]; then
            RESULT="skipped"
          else
            RESULT="fail"
          fi

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHORT_SHA="${HEAD_SHA:0:7}"

          # Emit structured JSON for sensor-report.mjs consumption
          # Written to step summary so it's accessible in the workflow run
          {
            echo "### Production Verification Log"
            echo '```json'
            printf '{"event":"post_deploy_verification","timestamp":"%s","result":"%s","sha":"%s","live_build_id":"%s","sha_confirmed":"%s","trigger":"%s","run_url":"%s"}\n' \
              "$TIMESTAMP" \
              "$RESULT" \
              "${SHORT_SHA:-unknown}" \
              "${LIVE_BUILD_ID:-unknown}" \
              "${SHA_CONFIRMED:-unknown}" \
              "${TRIGGER_NAME:-manual}" \
              "$RUN_URL"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Also emit as a workflow output annotation for downstream consumers
          echo "::notice title=Post-Deploy Verification::result=${RESULT} sha=${SHORT_SHA:-unknown} sha_confirmed=${SHA_CONFIRMED:-unknown}"
