name: Circuit Breaker

on:
  workflow_run:
    # `"Deploy Static"` used to be listed here and matched NOTHING for this
    # workflow's entire life - the real workflow is named `Deploy Static
    # Sites` (see post-deploy-check.yml and pulumi-up.yml, which both use the
    # correct name). A workflow_run trigger naming a workflow that does not
    # exist fires silently never, so the observed behaviour has always been
    # "triggered by Deploy Services only".
    #
    # Deliberately NOT repaired to `Deploy Static Sites`: the analysis below
    # only ever examines `Deploy Services` runs, so triggering on static
    # deploys would re-analyse service deploys on an unrelated event. Naming
    # only what is actually used keeps the trigger honest. Whether static
    # deploy failures *should* trip the breaker is a real question, and a
    # larger one - it needs its own failure counting.
    workflows: ["Deploy Services"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      force:
        description: "Force deploy (reset circuit breaker)"
        required: false
        default: "false"
        type: boolean

permissions: {}

jobs:
  circuit-breaker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      blocked: ${{ steps.analyze.outputs.blocked || steps.check.outputs.blocked }}
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_FILE: .github/circuit-breaker-state
      # Shared by the file step and the close step below — a title that
      # drifts between them silently disables close-on-recovery.
      BREAKER_ISSUE_TITLE: "Circuit breaker tripped - deploys blocked"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          sparse-checkout: |
            .github/circuit-breaker-state
          sparse-checkout-cone-mode: false
          ref: circuit-breaker-state
          token: ${{ github.token }}

      - name: Configure GitHub CLI
        run: gh config set prompt disabled

      - name: Read current state
        id: read
        run: |
          if [ -f "$STATE_FILE" ]; then
            STATE=$(jq -r '.state // "closed"' "$STATE_FILE" 2>/dev/null || echo "closed")
          else
            STATE="closed"
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "Current state: $STATE"

      - name: Check circuit breaker state
        id: check
        env:
          FORCE: ${{ github.event.inputs.force }}
          CURRENT_STATE: ${{ steps.read.outputs.state }}
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [ "$FORCE" = "true" ]; then
            echo "Force flag set - resetting circuit breaker"
            printf '{"state":"closed","updatedAt":"%s"}\n' "$NOW" > "$STATE_FILE"
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            echo "new_state=closed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$CURRENT_STATE" = "open" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi
          echo "new_state=$CURRENT_STATE" >> "$GITHUB_OUTPUT"

      # The breaker job's own checkout is a sparse-checkout of the state file
      # off the `circuit-breaker-state` branch, so repo scripts are not on
      # disk. Same pattern as the issue-filing module step further down.
      - name: Checkout deploy-failure classifier
        if: github.event.workflow_run.conclusion != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          sparse-checkout: |
            scripts/circuit-breaker-deploy-failures.mjs
          sparse-checkout-cone-mode: false
          path: _breaker-lib

      - name: Analyze deploy results
        id: analyze
        if: github.event.workflow_run.conclusion != ''
        run: |
          set -o pipefail

          # A `Deploy Services` run can fail WITHOUT attempting a deployment:
          # `Wait for CI` fails when CI on that commit is not green, which
          # leaves `Deploy API Services` as `skipped`. Counting that as a
          # deploy failure is what tripped the breaker on 2026-09-22 (run
          # 35674731430 -> #5659) over one real deploy failure and one run
          # that never deployed, while production was healthy. So ask each
          # run what its DEPLOY JOB concluded, not what the run concluded.
          #
          # A breaker-blocked run is NOT part of that story, contrary to the
          # obvious guess: measured on run 35152567274, `Deploy Blocked`
          # concludes `success` (it only echoes a warning and exits 0) and a
          # skipped job does not fail a run, so the run concluded `success`
          # and the old logic *reset* the count on blocked runs. Reading the
          # deploy job removes that false close; the trade is stickiness,
          # since escaping an open breaker then needs `force=true` or enough
          # later runs to scroll the failures out of this `--limit 5` window.
          #
          # The verify job is collected too. It has no `continue-on-error`
          # and exits 1 on a non-200, so a deploy that ships and leaves
          # production unhealthy is `Deploy API Services: success` +
          # `Post-Deploy Verification: failure` - which the deploy job alone
          # would read as a SUCCESS and use to reset a real streak.
          RUN_IDS=$(gh run list --workflow "Deploy Services" --limit 5 --json databaseId --jq '.[].databaseId')

          RUNS_JSON="[]"
          for ID in $RUN_IDS; do
            JOBS=$(gh run view "$ID" --json jobs)
            DEPLOY_CONCLUSION=$(printf '%s' "$JOBS" | jq -r \
              '[.jobs[] | select(.name=="Deploy API Services")] | .[0].conclusion // ""')
            VERIFY_CONCLUSION=$(printf '%s' "$JOBS" | jq -r \
              '[.jobs[] | select(.name=="Post-Deploy Verification")] | .[0].conclusion // ""')
            RUNS_JSON=$(printf '%s' "$RUNS_JSON" | jq \
              --arg d "$DEPLOY_CONCLUSION" --arg v "$VERIFY_CONCLUSION" \
              '. + [{deployJobConclusion: $d, verifyJobConclusion: $v}]')
          done

          FAIL_COUNT=$(printf '%s' "$RUNS_JSON" | node _breaker-lib/scripts/circuit-breaker-deploy-failures.mjs count)

          # The only place in this step that could fail OPEN: a non-numeric
          # count falls through to the `else` below and writes `closed`,
          # because `set -e` does not fire inside an `if` condition.
          # Unreachable while the script either prints an integer or exits
          # nonzero, which is exactly why it is cheap to pin here.
          case "$FAIL_COUNT" in
            '' | *[!0-9]*)
              echo "::error::deploy-failure classifier returned a non-numeric count: '$FAIL_COUNT'"
              exit 1
              ;;
          esac

          echo "Recent consecutive DEPLOY failures: $FAIL_COUNT"
          echo "Deploy/verify conclusions (newest first): $(printf '%s' "$RUNS_JSON" | jq -c '[.[] | [.deployJobConclusion, .verifyJobConclusion]]')"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Update state based on failure count
          if [ "$FAIL_COUNT" -ge 2 ]; then
            printf '{"state":"open","updatedAt":"%s"}\n' "$NOW" > "$STATE_FILE"
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "new_state=open" >> "$GITHUB_OUTPUT"
          else
            printf '{"state":"closed","updatedAt":"%s"}\n' "$NOW" > "$STATE_FILE"
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            echo "new_state=closed" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist state to git
        run: |
          if git diff --quiet "$STATE_FILE"; then
            echo "No state change — skipping commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATE_FILE"
          git commit -m "ci(circuit-breaker): persist state [skip ci]"
          git push origin HEAD:circuit-breaker-state

      # The main checkout above is a sparse, non-cone checkout pinned to the
      # orphaned `circuit-breaker-state` ref (state-persistence only — it
      # never merges from main, so it can't be relied on to carry an
      # up-to-date scripts/lib). Fetch the issue-filing CLI separately, into
      # its own path, from the ref that actually triggered this run.
      - name: Checkout issue-filing module
        if: steps.analyze.outputs.blocked == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          sparse-checkout: |
            scripts/lib/file-issue-cli.mjs
            scripts/lib/issue-filing.mjs
          sparse-checkout-cone-mode: false
          path: _issue-filing

      - name: Create issue on circuit trip (dedup)
        if: steps.analyze.outputs.blocked == 'true'
        run: |
          {
            echo "The deploy circuit breaker has tripped after 2+ consecutive failures."
            echo
            echo "Deployments are blocked until manually approved."
            echo
            echo "To force a deploy, run:"
            echo
            echo '```'
            echo "gh workflow run circuit-breaker.yml -f force=true"
            echo '```'
          } > /tmp/circuit-body.md
          node _issue-filing/scripts/lib/file-issue-cli.mjs \
            --title "$BREAKER_ISSUE_TITLE" \
            --label "ci-fix,blocking" \
            --body-file /tmp/circuit-body.md \
            --dedupe-key "circuit-breaker-tripped" \
            --search-label "ci-fix,blocking" \
            --search-text "Circuit breaker tripped"

      # The breaker self-heals the moment a deploy succeeds again, but nothing
      # ever cleared the issue it filed on the way down. #4544 sat open for a
      # day advertising "deploys blocked" while the persisted state had read
      # `closed` since two minutes after the trip — a stale blocker that reads
      # exactly like a real one. Mirrors the close-on-recovery step
      # synthetic-monitoring.yml and dependency-freshness.yml already carry.
      #
      # The condition covers both ways the breaker ends up unblocked: `analyze`
      # ran and found the failure streak broken, or `analyze` was skipped
      # (workflow_dispatch) and the persisted state was already closed —
      # including a `force=true` reset, where clearing the issue is the point.
      - name: Close the trip issue once deploys recover
        if: steps.analyze.outputs.blocked == 'false' || steps.check.outputs.blocked == 'false'
        run: |
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label blocking \
            --json number,title \
            --jq "[.[] | select(.title == \"$BREAKER_ISSUE_TITLE\")] | .[0].number // empty")

          if [ -z "$NUMBER" ]; then
            echo "Breaker is closed and there is no open trip issue to close."
            exit 0
          fi

          echo "Breaker recovered — closing #$NUMBER."
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --comment "Auto-closed: the deploy circuit breaker returned to \`closed\` at $(date -u +%Y-%m-%dT%H:%M:%SZ). Deploys are no longer blocked."

  block-deploy:
    needs: [circuit-breaker]
    if: needs.circuit-breaker.outputs.blocked == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Block deploy
        run: |
          echo "::warning::Deploy blocked by circuit breaker. Run 'gh workflow run circuit-breaker.yml -f force=true' to override."
          exit 1
