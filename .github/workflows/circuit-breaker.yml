name: Circuit Breaker

on:
  workflow_run:
    workflows: ["Deploy Services", "Deploy Static"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      force:
        description: "Force deploy (reset circuit breaker)"
        required: false
        default: "false"
        type: boolean

permissions: {}

jobs:
  circuit-breaker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      blocked: ${{ steps.analyze.outputs.blocked || steps.check.outputs.blocked }}
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_FILE: .github/circuit-breaker-state
      # Shared by the file step and the close step below — a title that
      # drifts between them silently disables close-on-recovery.
      BREAKER_ISSUE_TITLE: "Circuit breaker tripped - deploys blocked"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          sparse-checkout: |
            .github/circuit-breaker-state
          sparse-checkout-cone-mode: false
          ref: circuit-breaker-state
          token: ${{ github.token }}

      - name: Configure GitHub CLI
        run: gh config set prompt disabled

      - name: Read current state
        id: read
        run: |
          if [ -f "$STATE_FILE" ]; then
            STATE=$(jq -r '.state // "closed"' "$STATE_FILE" 2>/dev/null || echo "closed")
          else
            STATE="closed"
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "Current state: $STATE"

      - name: Check circuit breaker state
        id: check
        env:
          FORCE: ${{ github.event.inputs.force }}
          CURRENT_STATE: ${{ steps.read.outputs.state }}
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [ "$FORCE" = "true" ]; then
            echo "Force flag set - resetting circuit breaker"
            printf '{"state":"closed","updatedAt":"%s"}\n' "$NOW" > "$STATE_FILE"
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            echo "new_state=closed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$CURRENT_STATE" = "open" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi
          echo "new_state=$CURRENT_STATE" >> "$GITHUB_OUTPUT"

      - name: Analyze deploy results
        id: analyze
        if: github.event.workflow_run.conclusion != ''
        run: |
          # Get recent deploy workflow runs (skip the current one)
          RUNS=$(gh run list --workflow "Deploy Services" --limit 5 --json conclusion --jq '.[].conclusion')

          FAIL_COUNT=0
          for RUN in $RUNS; do
            if [ "$RUN" = "failure" ] || [ "$RUN" = "timed_out" ]; then
              FAIL_COUNT=$((FAIL_COUNT + 1))
            else
              break
            fi
          done

          echo "Recent consecutive failures: $FAIL_COUNT"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Update state based on failure count
          if [ "$FAIL_COUNT" -ge 2 ]; then
            printf '{"state":"open","updatedAt":"%s"}\n' "$NOW" > "$STATE_FILE"
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "new_state=open" >> "$GITHUB_OUTPUT"
          else
            printf '{"state":"closed","updatedAt":"%s"}\n' "$NOW" > "$STATE_FILE"
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            echo "new_state=closed" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist state to git
        run: |
          if git diff --quiet "$STATE_FILE"; then
            echo "No state change — skipping commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATE_FILE"
          git commit -m "ci(circuit-breaker): persist state [skip ci]"
          git push origin HEAD:circuit-breaker-state

      # The main checkout above is a sparse, non-cone checkout pinned to the
      # orphaned `circuit-breaker-state` ref (state-persistence only — it
      # never merges from main, so it can't be relied on to carry an
      # up-to-date scripts/lib). Fetch the issue-filing CLI separately, into
      # its own path, from the ref that actually triggered this run.
      - name: Checkout issue-filing module
        if: steps.analyze.outputs.blocked == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          sparse-checkout: |
            scripts/lib/file-issue-cli.mjs
            scripts/lib/issue-filing.mjs
          sparse-checkout-cone-mode: false
          path: _issue-filing

      - name: Create issue on circuit trip (dedup)
        if: steps.analyze.outputs.blocked == 'true'
        run: |
          {
            echo "The deploy circuit breaker has tripped after 2+ consecutive failures."
            echo
            echo "Deployments are blocked until manually approved."
            echo
            echo "To force a deploy, run:"
            echo
            echo '```'
            echo "gh workflow run circuit-breaker.yml -f force=true"
            echo '```'
          } > /tmp/circuit-body.md
          node _issue-filing/scripts/lib/file-issue-cli.mjs \
            --title "$BREAKER_ISSUE_TITLE" \
            --label "ci-fix,blocking" \
            --body-file /tmp/circuit-body.md \
            --dedupe-key "circuit-breaker-tripped" \
            --search-label "ci-fix,blocking" \
            --search-text "Circuit breaker tripped"

      # The breaker self-heals the moment a deploy succeeds again, but nothing
      # ever cleared the issue it filed on the way down. #4544 sat open for a
      # day advertising "deploys blocked" while the persisted state had read
      # `closed` since two minutes after the trip — a stale blocker that reads
      # exactly like a real one. Mirrors the close-on-recovery step
      # synthetic-monitoring.yml and dependency-freshness.yml already carry.
      #
      # The condition covers both ways the breaker ends up unblocked: `analyze`
      # ran and found the failure streak broken, or `analyze` was skipped
      # (workflow_dispatch) and the persisted state was already closed —
      # including a `force=true` reset, where clearing the issue is the point.
      - name: Close the trip issue once deploys recover
        if: steps.analyze.outputs.blocked == 'false' || steps.check.outputs.blocked == 'false'
        run: |
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label blocking \
            --json number,title \
            --jq "[.[] | select(.title == \"$BREAKER_ISSUE_TITLE\")] | .[0].number // empty")

          if [ -z "$NUMBER" ]; then
            echo "Breaker is closed and there is no open trip issue to close."
            exit 0
          fi

          echo "Breaker recovered — closing #$NUMBER."
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --comment "Auto-closed: the deploy circuit breaker returned to \`closed\` at $(date -u +%Y-%m-%dT%H:%M:%SZ). Deploys are no longer blocked."

  block-deploy:
    needs: [circuit-breaker]
    if: needs.circuit-breaker.outputs.blocked == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Block deploy
        run: |
          echo "::warning::Deploy blocked by circuit breaker. Run 'gh workflow run circuit-breaker.yml -f force=true' to override."
          exit 1
