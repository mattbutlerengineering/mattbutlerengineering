name: E2E Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/hospitality/**"
      - "apps/marketing/**"
      - "packages/rialto/**"
      - "services/reservations/**"
      - "services/users/**"
      - "packages/database/**"
      - ".github/workflows/e2e.yml"
      # The hospitality job's own helper scripts. Without these, a PR editing
      # e.g. the auth preflight — a hard gate that fails the whole suite —
      # gets zero E2E validation, and the breakage lands on the NEXT
      # unrelated hospitality PR instead (the class
      # scripts/check-workflow-paths-coverage.mjs exists to catch).
      - "scripts/e2e-auth-preflight.mjs"
      - "scripts/e2e-failure-rate.mjs"
      - "scripts/check-endpoint.mjs"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Gates hospitality-e2e / marketing-e2e so a change scoped to one app
  # doesn't burn CI minutes running the other app's suite (issue #3886).
  # Both jobs still run on workflow_dispatch (manual trigger has no base
  # ref to diff against, so "Set outputs" below forces both true).
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hospitality: ${{ steps.result.outputs.hospitality }}
      marketing: ${{ steps.result.outputs.marketing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            hospitality:
              - 'apps/hospitality/**'
              - 'packages/rialto/**'
              - 'services/reservations/**'
              - 'services/users/**'
              - 'packages/database/**'
              - '.github/workflows/e2e.yml'
              # Keep in step with the trigger paths above: all three helper
              # scripts run inside the hospitality job, so a change to them
              # must not only start the workflow but also un-skip this suite.
              - 'scripts/e2e-auth-preflight.mjs'
              - 'scripts/e2e-failure-rate.mjs'
              - 'scripts/check-endpoint.mjs'
            marketing:
              - 'apps/marketing/**'
              - 'packages/rialto/**'
              - '.github/workflows/e2e.yml'

      - name: Set outputs
        id: result
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "hospitality=true" >> "$GITHUB_OUTPUT"
            echo "marketing=true" >> "$GITHUB_OUTPUT"
          else
            echo "hospitality=${{ steps.filter.outputs.hospitality }}" >> "$GITHUB_OUTPUT"
            echo "marketing=${{ steps.filter.outputs.marketing }}" >> "$GITHUB_OUTPUT"
          fi

  hospitality-e2e:
    name: Hospitality E2E
    needs: changes
    if: needs.changes.outputs.hospitality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # See docs/runbooks/e2e-recovery.md for environment troubleshooting steps
    # Postgres backs the reservations + users APIs the hospitality app proxies to.
    # Without a live backend, the Vite dev-server proxy returns ECONNREFUSED for
    # every /api/v1/* request and the SPA never finishes booting (see issue #2123).
    # Redis backs the reservations service's notification job queue (issue #3309).
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      # Redis backs the reservations service's BullMQ job scheduler + worker
      # (booking/day-of reminders, waitlist expiry — see ADR-019 / issue #3078).
      # The worker opens its Redis consumer at onReady, so without this
      # container every reservation write that schedules a notification fails
      # and ioredis retries :6379 forever, flooding the event loop (issue #3309).
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        run: npm install -g pnpm@9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rialto (styles export requires dist/)
        run: pnpm build --filter @mattbutlerengineering/rialto

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # Apply migrations so the services boot against a real, up-to-date schema.
      - name: Apply migrations (users)
        run: pnpm --filter @mbe/users-service db:migrate:deploy

      - name: Apply migrations (reservations)
        run: pnpm --filter @mbe/reservations-service db:migrate:deploy

      # The `dev` script loads config via `tsx watch --env-file=.env`, so each
      # service needs a .env on disk. NODE_ENV stays unset (development), which
      # keeps AUTH_AUTHORITY/AUTH_AUDIENCE optional — the services boot without
      # real Auth0 config. DB liveness is what the readiness gate below verifies.
      - name: Write service env files
        run: |
          cat > services/users/.env <<EOF
          DATABASE_URL=${DATABASE_URL}
          PORT=3001
          HOST=0.0.0.0
          LOG_LEVEL=warn
          CORS_ORIGINS=http://localhost:3002
          EOF
          cat > services/reservations/.env <<EOF
          DATABASE_URL=${DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          PORT=3004
          HOST=0.0.0.0
          LOG_LEVEL=warn
          CORS_ORIGINS=http://localhost:3002
          EOF

      - name: Start backend services
        run: |
          pnpm --filter @mbe/users-service dev > /tmp/users-api.log 2>&1 &
          pnpm --filter @mbe/reservations-service dev > /tmp/reservations-api.log 2>&1 &

      # Verify Redis answers a real PING before gating on the backend: the
      # reservations job worker opens its BullMQ consumer at onReady, and a
      # missing Redis degrades into an unbounded ioredis reconnect loop instead
      # of a crash (issue #3309). Bounded retry so a broken container fails
      # fast with a one-line cause instead of a 49% test-failure smear.
      - name: Wait for Redis
        run: |
          for i in $(seq 1 30); do
            reply=$(docker exec ${{ job.services.redis.id }} redis-cli ping 2>/dev/null || true)
            if [ "$reply" = "PONG" ]; then
              echo "redis healthy (PING -> PONG)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::redis never answered PING on :6379 (last reply: ${reply:-none})"
          exit 1

      # Gate on the DB-backed health endpoints (NOT /health, which is liveness
      # only). A 200 here means the process is listening AND Prisma can reach
      # Postgres — the real readiness the Vite proxy needs before Playwright runs.
      - name: Wait for backend health
        run: |
          wait_for_health() {
            name="$1"
            url="$2"
            for i in $(seq 1 60); do
              # `|| true` keeps the loop alive under `set -e` when curl exits
              # non-zero (e.g. connection refused while the service is booting).
              http_code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
              if [ "$http_code" = "200" ]; then
                echo "$name healthy ($url)"
                return 0
              fi
              sleep 2
            done
            echo "::error::$name never became healthy ($url, last code: $http_code)"
            return 1
          }
          wait_for_health "users-api" "http://localhost:3001/api/v1/users/health" || {
            echo "----- users-api log -----"; cat /tmp/users-api.log || true; exit 1;
          }
          wait_for_health "reservations-api" "http://localhost:3004/api/v1/reservations/health" || {
            echo "----- reservations-api log -----"; cat /tmp/reservations-api.log || true; exit 1;
          }

      # Confirm the E2E seed user can obtain an Auth0 token before launching the
      # full suite. Exits non-zero with "E2E auth preflight failed: <reason>" so
      # auth/seed drift surfaces as a one-line cause instead of ~25 test fails.
      # Distinguishes: (a) missing env vars, (b) auth rejected, (c) network error.
      - name: Auth0 seed-user preflight
        id: auth-preflight
        run: node scripts/e2e-auth-preflight.mjs
        env:
          E2E_AUTH0_DOMAIN: ${{ secrets.E2E_AUTH0_DOMAIN }}
          E2E_AUTH0_CLIENT_ID: ${{ secrets.E2E_AUTH0_CLIENT_ID }}
          E2E_AUTH0_AUDIENCE: ${{ secrets.E2E_AUTH0_AUDIENCE }}
          E2E_AUTH_EMAIL: ${{ secrets.E2E_AUTH_EMAIL }}
          E2E_AUTH_PASSWORD: ${{ secrets.E2E_AUTH_PASSWORD }}

      - name: Run E2E tests
        run: pnpm --dir apps/hospitality test:e2e
        env:
          VITE_AUTH_AUTHORITY: https://${{ secrets.E2E_AUTH0_DOMAIN }}
          VITE_AUTH_CLIENT_ID: ${{ secrets.E2E_AUTH0_CLIENT_ID }}
          VITE_AUTH_AUDIENCE: ${{ secrets.E2E_AUTH0_AUDIENCE }}
          VITE_AUTH_REDIRECT_URI: http://localhost:3002/hospitality/callback
          VITE_API_URL: http://localhost:3002
          E2E_AUTH0_DOMAIN: ${{ secrets.E2E_AUTH0_DOMAIN }}
          E2E_AUTH0_CLIENT_ID: ${{ secrets.E2E_AUTH0_CLIENT_ID }}
          E2E_AUTH0_AUDIENCE: ${{ secrets.E2E_AUTH0_AUDIENCE }}
          E2E_AUTH_EMAIL: ${{ secrets.E2E_AUTH_EMAIL }}
          E2E_AUTH_PASSWORD: ${{ secrets.E2E_AUTH_PASSWORD }}

      # On any E2E failure, write a structured summary to $GITHUB_STEP_SUMMARY so
      # one glance classifies the failure mode: backend boot failure, auth/seed
      # drift, or test regression.
      - name: Write E2E failure summary
        if: failure()
        run: |
          # Backend health re-probe (quick liveness check). Uses
          # scripts/check-endpoint.mjs (#3854) so a connection failure
          # reports httpCode 0, not a doubled "000000" string that numeric
          # guards below would silently misparse.
          users_code=$(node scripts/check-endpoint.mjs users-health http://localhost:3001/api/v1/users/health --timeout 5000 | jq -r '.httpCode')
          res_code=$(node scripts/check-endpoint.mjs reservations-health http://localhost:3004/api/v1/reservations/health --timeout 5000 | jq -r '.httpCode')
          [ "$users_code" = "200" ] && users_status="healthy" || users_status="unhealthy (HTTP $users_code)"
          [ "$res_code" = "200" ] && res_status="healthy" || res_status="unhealthy (HTTP $res_code)"

          # Pass/fail counts from Playwright JSON reporter
          RESULTS="apps/hospitality/playwright-results.json"
          if [ -f "$RESULTS" ]; then
            passed=$(node -e "const j=JSON.parse(require('fs').readFileSync('$RESULTS')); process.stdout.write(String(j.stats?.expected??0))")
            failed=$(node -e "const j=JSON.parse(require('fs').readFileSync('$RESULTS')); process.stdout.write(String(j.stats?.unexpected??0))")
          else
            passed="N/A"
            failed="N/A"
          fi

          {
            echo "## E2E Failure Diagnostic Summary"
            echo ""
            echo "| Component | Status |"
            echo "|-----------|--------|"
            echo "| users-api | $users_status |"
            echo "| reservations-api | $res_status |"
            echo "| Auth0 preflight | ${{ steps.auth-preflight.outcome }} |"
            echo "| Tests passed | $passed |"
            echo "| Tests failed | $failed |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump backend logs on failure
        if: failure()
        run: |
          echo "----- users-api log -----"; cat /tmp/users-api.log || true
          echo "----- reservations-api log -----"; cat /tmp/reservations-api.log || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results
          path: |
            apps/hospitality/e2e/test-results/
            apps/hospitality/playwright-report/
          retention-days: 7

      # ── Environment diagnostics (runs on failure, gated by failure rate) ──────
      #
      # When a high fraction of tests fail (>E2E_FAILURE_THRESHOLD %, default 20%)
      # the most likely cause is an environment problem, not a code regression:
      #   • Backend service failed to start (boot error → all tests fail)
      #   • Auth0 seed user missing or client misconfigured (M2M instead of SPA)
      #
      # This step computes the failure rate from the Playwright JSON reporter
      # output (apps/hospitality/playwright-results.json) and sets the
      # `threshold_exceeded` output so downstream steps can gate on it.
      # E2E_FAILURE_THRESHOLD is configurable via env; default is 20%.
      - name: Compute E2E failure rate
        id: failure-rate
        if: always()
        run: node scripts/e2e-failure-rate.mjs apps/hospitality/playwright-results.json
        env:
          E2E_FAILURE_THRESHOLD: "20"

      # Collects three diagnostic captures when threshold is exceeded:
      #   1. Reservations + users service startup logs (boot errors)
      #   2. Auth0 seed-user verify — confirms E2E_AUTH0_CLIENT_ID is a SPA/RWA
      #      (M2M apps return access_denied for ROPC — the known gotcha in #2719).
      #      Read-only: no account creation, no credential values in logs.
      # Fixture/setup init logs live in the e2e-test-results artifact (playwright
      # captures the auth.setup project output in its HTML report).
      - name: Gather E2E environment diagnostics
        id: gather-diagnostics
        if: failure() && steps.failure-rate.outputs.threshold_exceeded == 'true'
        run: |
          DIAG_DIR=/tmp/e2e-diagnostics
          mkdir -p "$DIAG_DIR"

          # 1. Service startup logs
          cp /tmp/users-api.log "$DIAG_DIR/users-api.log" 2>/dev/null \
            || echo "(users-api log not found)" > "$DIAG_DIR/users-api.log"
          cp /tmp/reservations-api.log "$DIAG_DIR/reservations-api.log" 2>/dev/null \
            || echo "(reservations-api log not found)" > "$DIAG_DIR/reservations-api.log"

          # 2. Auth0 seed-user verification (read-only ROPC check)
          # Secret values are masked by GitHub Actions; only status is written to disk.
          if [ -z "${E2E_AUTH0_DOMAIN}" ] || [ -z "${E2E_AUTH0_CLIENT_ID}" ]; then
            echo "skipped: E2E_AUTH0_DOMAIN or E2E_AUTH0_CLIENT_ID secret unset" \
              > "$DIAG_DIR/auth0-verify.txt"
          else
            AUTH_RESPONSE_FILE="$DIAG_DIR/auth0-response.json"
            http_code=$(curl -s \
              -o "$AUTH_RESPONSE_FILE" \
              -w "%{http_code}" \
              -X POST "https://${E2E_AUTH0_DOMAIN}/oauth/token" \
              -H "Content-Type: application/json" \
              -d "{
                \"grant_type\": \"http://auth0.com/oauth/grant-type/password-realm\",
                \"username\": \"${E2E_AUTH_EMAIL}\",
                \"password\": \"${E2E_AUTH_PASSWORD}\",
                \"audience\": \"${E2E_AUTH0_AUDIENCE}\",
                \"client_id\": \"${E2E_AUTH0_CLIENT_ID}\",
                \"scope\": \"openid profile email\",
                \"realm\": \"Username-Password-Authentication\"
              }" || true)
            if [ "$http_code" = "200" ]; then
              echo "PRESENT — seed user authenticated successfully (HTTP 200)" \
                > "$DIAG_DIR/auth0-verify.txt"
            else
              # Extract error code/description only (no credential values written)
              auth_error=$(jq -r '.error // "unknown"' "$AUTH_RESPONSE_FILE" 2>/dev/null || echo "parse-error")
              auth_desc=$(jq -r '.error_description // ""' "$AUTH_RESPONSE_FILE" 2>/dev/null || echo "")
              echo "ABSENT or UNREACHABLE — HTTP ${http_code}: ${auth_error} — ${auth_desc}" \
                > "$DIAG_DIR/auth0-verify.txt"
            fi
            # Never upload raw Auth0 response (may contain partial token fragments)
            rm -f "$AUTH_RESPONSE_FILE"
          fi
        env:
          E2E_AUTH0_DOMAIN: ${{ secrets.E2E_AUTH0_DOMAIN }}
          E2E_AUTH0_CLIENT_ID: ${{ secrets.E2E_AUTH0_CLIENT_ID }}
          E2E_AUTH0_AUDIENCE: ${{ secrets.E2E_AUTH0_AUDIENCE }}
          E2E_AUTH_EMAIL: ${{ secrets.E2E_AUTH_EMAIL }}
          E2E_AUTH_PASSWORD: ${{ secrets.E2E_AUTH_PASSWORD }}

      - name: Upload E2E environment diagnostics
        if: steps.gather-diagnostics.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics
          path: /tmp/e2e-diagnostics/
          retention-days: 7

  # Marketing is a static Vite site with no backend proxy — no Postgres,
  # Redis, migrations, or Auth0 preflight needed. Playwright serves the
  # production build via `vite preview` (see apps/marketing/playwright.config.ts),
  # not the dev server, so this exercises the same static output that ships.
  # Advisory, not required: matches the Hospitality E2E precedent (#3886) —
  # a brand-new suite triaged for the first time in CI needs a settling
  # period before it can gate merges.
  marketing-e2e:
    name: Marketing E2E
    needs: changes
    if: needs.changes.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        run: npm install -g pnpm@9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rialto (styles export requires dist/)
        run: pnpm build --filter @mattbutlerengineering/rialto

      - name: Build marketing
        run: pnpm --dir apps/marketing build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --dir apps/marketing test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketing-e2e-test-results
          path: |
            apps/marketing/e2e/test-results/
            apps/marketing/playwright-report/
          retention-days: 7
