name: Deploy Storybook to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "packages/rialto/**"
      - "docs/assembly-line/**"
      - ".github/workflows/storybook.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/rialto/**"
      - "docs/assembly-line/**"
      - ".github/workflows/storybook.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One workflow-level block, two behaviours (#10204):
#   - A PR run only builds (deploy is gated off below). It gets its own
#     `pages-pr-<number>` group and cancels its superseded build, so it can
#     never cancel or displace a deploying run, nor another PR's build.
#   - Every run that deploys (push to main, workflow_dispatch) shares GitHub's
#     documented `pages` group and is never cancelled in progress, so deploys
#     serialize and none is cut off mid-flight. A newer queued run still
#     replaces an older PENDING one; that is wanted, the newer build contains it.
# Workflow-level, not on the deploy job: serializing the whole run keeps deploys
# in merge order. With only the deploy job serialized, an older run whose build
# finished last would publish over a newer one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm turbo build-storybook --filter=@mattbutlerengineering/rialto

      - name: Add the assembly line page
        run: |
          mkdir -p packages/rialto/storybook-static/assembly-line
          cp docs/assembly-line/index.html packages/rialto/storybook-static/assembly-line/index.html

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/rialto/storybook-static

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
