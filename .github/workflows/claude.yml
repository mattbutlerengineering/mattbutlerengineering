name: claude

# AI-assisted workflow trigger: dispatches an agent in response to
# @claude mentions in issues, PRs, and review comments. Mirrors the
# pattern in kubestellar/console (the canonical ACMM reference repo).
#
# The runtime equivalent is `mbe agent run "<prompt>"` invoked locally
# or via the mbe-issue-worker RemoteTrigger.
#
# The agent run needs ANTHROPIC_API_KEY, and CI is keyless by design (#3585).
# A `preflight` job decides authorization and credential, and the `dispatch`
# job is gated on its outputs, so a run that cannot happen reports SKIPPED
# rather than a success (same pattern as docs-audit.yml, #5458).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # Deciding "not a collaborator" inside a step meant `exit 0` ended only that
  # step, and every later step (acknowledge, agent run, report) still ran. And
  # with no credential gate at all, an authorized mention got "Working on it"
  # followed by a bare "failure". Deciding both in JOB outputs makes the
  # dispatch job report SKIPPED instead. Whether CI should ever hold a key is
  # #3585's call; this job only stops the absence from rendering as a success.
  preflight:
    name: Preflight (authorized, and is the agent runnable?)
    # Run only when the comment body contains an @claude mention.
    # No untrusted text reaches the shell — `contains()` is a GH
    # expression, evaluated by Actions, not by bash.
    if: |
      (github.event_name == 'issue_comment'           && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review'         && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
      has_key: ${{ steps.check.outputs.has_key }}
    env:
      # Untrusted comment author captured via env var only.
      COMMENT_AUTHOR: ${{ github.event.comment.user.login || github.event.review.user.login }}
      ISSUE_OR_PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify the author is authorized
        id: auth
        run: |
          set -euo pipefail
          # Only repository collaborators can trigger an agent.
          role=$(gh api "repos/${{ github.repository }}/collaborators/$COMMENT_AUTHOR/permission" --jq '.permission' 2>/dev/null || echo "none")
          case "$role" in
            admin|maintain|write)
              echo "Authorized ($role)"
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Author $COMMENT_AUTHOR not a collaborator (role: $role); ignoring."
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Check for an agent credential
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "Agent credential present — the agent run will dispatch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Agent run skipped"
              echo
              echo "\`ANTHROPIC_API_KEY\` is not configured, so the \`@claude\` agent run"
              echo "did not dispatch. CI is keyless by design; agent runs happen locally."
              echo "Tracked in #3585."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Answer the collaborator who typed @claude, so a skip is not silence.
      # Never for a non-collaborator: that would give any commenter a bot reply.
      - name: Explain the skip
        if: steps.auth.outputs.authorized == 'true' && steps.check.outputs.has_key != 'true'
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_OR_PR_NUMBER" --body "Skipped: no agent credential in CI (#3585). Run \`mbe agent run --adapter claude-cli\` locally instead. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  dispatch:
    needs: preflight
    # Skipped, not silently passed, for a non-collaborator or a missing
    # credential — see the preflight job's comment.
    if: needs.preflight.outputs.authorized == 'true' && needs.preflight.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Untrusted comment text captured via env vars only.
      COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body }}
      ISSUE_OR_PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      EVENT_NAME: ${{ github.event_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `mbe` is `tools/cli/dist/index.js` — the workspace bin is never linked
      # into node_modules/.bin, so a `pnpm exec` of it cannot resolve. Build it.
      - name: Build CLI
        run: pnpm build --filter @mbe/cli...

      - name: Extract task from comment
        run: |
          printf '%s' "$COMMENT_BODY" | sed -n 's/.*@claude[[:space:]]*//p' | head -50 > /tmp/agent-task.txt
          if [ ! -s /tmp/agent-task.txt ]; then
            printf '%s' "$COMMENT_BODY" > /tmp/agent-task.txt
          fi

      - name: Acknowledge
        run: |
          gh issue comment "$ISSUE_OR_PR_NUMBER" --body "Working on it. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Run agent
        id: agent
        run: |
          set -euo pipefail
          if node tools/cli/dist/index.js agent run "$(cat /tmp/agent-task.txt)" --max-budget 1.50 --adapter auto; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Report outcome
        if: always()
        env:
          OUTCOME: ${{ steps.agent.outputs.outcome || 'cancelled' }}
        run: |
          gh issue comment "$ISSUE_OR_PR_NUMBER" --body "Agent run finished: $OUTCOME. See run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
