name: Mutation Testing

# Baseline: 98.89% mutation score (services/users routes + services) as of
# 2026-08-02 — see the `thresholds` comment in stryker.config.mjs for the
# full breakdown and rationale. The 80% threshold below is comfortably met.
on:
  # Weekly schedule on Monday morning (adjusted to avoid common CI peaks)
  schedule:
    - cron: "23 9 * * 1" # Monday 9:23 AM UTC
  # Manual triggering via GitHub UI or API. pr_number is optional: set it to
  # also post the results as a PR comment (e.g. `gh workflow run
  # mutation-testing.yml -f pr_number=1234`); omit it to just run and write
  # the job summary.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to comment mutation results on (optional)"
        required: false
        type: string

concurrency:
  group: mutation-testing
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Mutation Testing — periodic validation of test quality
  #
  # Single job on purpose. This used to be `prepare` → artifact → `mutation-test`,
  # shipping ~1.6GB of node_modules between two runners. That hand-off — not the
  # mutation run — is the only thing that has ever made this workflow red:
  # first as `JavaScript heap out of memory` while zipping (fixed in #3687 by
  # raising the upload action's heap), then, once the zip could finish, as a
  # flat 30-minute `Prepare` timeout on 2026-08-10 (10:37:28 → 11:07:31) that
  # skipped `Run Mutation Tests` entirely via `needs:`. Both failure modes are
  # properties of moving the archive, so the archive is gone: install and
  # generate happen in the same job that consumes them, warmed by the same
  # caches the two-job version already had. Stryker's scope is services/users
  # (see stryker.config.mjs), so a whole-workspace artifact was never the
  # cheaper path anyway.
  # ──────────────────────────────────────────────────────────────────────────
  mutation-test:
    name: Run Mutation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        # Unconditional, and deliberately not guarded by a `node_modules` cache.
        # The two-job version cached only the ROOT node_modules and skipped
        # install on a hit — which leaves every `services/*/node_modules` and
        # `packages/*/node_modules` absent, since pnpm links them per package.
        # That was survivable only because the artifact carried the per-package
        # trees along; with the artifact gone the cache would silently hand
        # Stryker a workspace missing services/users' own deps. setup-node's
        # `cache: pnpm` already caches the pnpm store, so a warm install is
        # cheap without the correctness hazard.
        run: pnpm install --frozen-lockfile

      - name: Cache Prisma clients
        id: cache-prisma
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            services/users/src/generated
            services/reservations/src/generated
            services/agent/src/generated
          key: prisma-clients-${{ hashFiles('services/users/prisma/schema.prisma', 'services/reservations/prisma/schema.prisma', 'services/agent/prisma/schema.prisma') }}

      - name: Generate Prisma clients
        if: steps.cache-prisma.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @mbe/users-service db:generate
          pnpm --filter @mbe/reservations-service db:generate
          pnpm --filter @mbe/agent-service db:generate

      - name: Run mutation tests
        run: pnpm test:mutations

      - name: Upload mutation test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30

      - name: Compute mutation score
        id: score
        if: always()
        run: node scripts/print-mutation-score.mjs reports/mutation/mutation.json >> "$GITHUB_OUTPUT"

      - name: Write mutation score to job summary
        if: always()
        run: node scripts/print-mutation-summary.mjs reports/mutation/mutation.json "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment mutation score on PR
        # workflow_dispatch carries no implicit PR context (this workflow has
        # no pull_request trigger — mutation testing is too expensive to run
        # per-commit, see stryker.config.mjs), so the condition is driven by
        # an explicit pr_number input rather than context.issue.number, which
        # is never set here.
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MUTATION_AVAILABLE: ${{ steps.score.outputs.available }}
          MUTATION_SCORE: ${{ steps.score.outputs.score }}
          MUTATION_THRESHOLD: ${{ steps.score.outputs.threshold }}
          MUTATION_PASSES: ${{ steps.score.outputs.passes }}
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const available = process.env.MUTATION_AVAILABLE === 'true';
            const score = Number(process.env.MUTATION_SCORE);
            const threshold = Number(process.env.MUTATION_THRESHOLD);
            const passes = process.env.MUTATION_PASSES === 'true';
            const prNumber = Number(process.env.PR_NUMBER);
            const artifactUrl = `${github.server_url}/${github.repository}/actions/runs/${github.run_id}`;

            const comment = available
              ? `## Mutation Testing Results 🧬

            **Mutation Score:** ${score.toFixed(2)}%
            **Target:** > ${threshold}%
            **Status:** ${passes ? '✅ PASS' : '⚠️ BELOW TARGET'}

            Full report available in [Artifacts](${artifactUrl})`
              : `## Mutation Testing Results 🧬

            ❌ No report was produced by this run.

            Full report available in [Artifacts](${artifactUrl})`;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if mutation score below threshold
        run: |
          if [ "${{ steps.score.outputs.available }}" != "true" ]; then
            echo "❌ Mutation testing failed to produce report"
            exit 1
          fi
          echo "Mutation Score: ${{ steps.score.outputs.score }}%"
          if [ "${{ steps.score.outputs.passes }}" != "true" ]; then
            echo "❌ Mutation score ${{ steps.score.outputs.score }}% is below target of ${{ steps.score.outputs.threshold }}%"
            exit 1
          fi
          echo "✅ Mutation score ${{ steps.score.outputs.score }}% meets target"

      - name: File or update tracking issue on scheduled mutation-testing failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MUTATION_SCORE: ${{ steps.score.outputs.score }}
          MUTATION_THRESHOLD: ${{ steps.score.outputs.threshold }}
        run: |
          today=$(date -u +%Y-%m-%d)
          # Stable, date-less title so this is a single de-duplicated tracking
          # issue that gets a comment on every failing week instead of a new
          # issue per week — the pattern learning-loop uses for sensor
          # findings (search open issues, skip/update on match).
          title="Mutation testing below target"

          printf '%s\n' \
            "## ${title}" \
            "" \
            "The scheduled mutation-testing workflow ran on ${today} and the score" \
            "is below the ${MUTATION_THRESHOLD}% target (or the run produced no report)." \
            "" \
            "**Score:** ${MUTATION_SCORE}%" \
            "**Run:** ${RUN_URL} (see the job summary for the top surviving mutants)" \
            "" \
            "### Next steps" \
            "1. Open the run's job summary and the mutation-report artifact" \
            "2. Identify weakly-tested files from the mutation report" \
            "3. Add tests to kill surviving mutants" \
            "" \
            "This issue is de-duplicated by title — future failing scheduled" \
            "runs will comment here instead of filing a new issue." \
            > /tmp/mutation-failure-body.md

          RESULT=$(node scripts/lib/file-issue-cli.mjs \
            --title "$title" \
            --body-file /tmp/mutation-failure-body.md \
            --label ci-fix \
            --label ready \
            --dedupe-key "mutation-testing-below-target" \
            --search-label ci-fix \
            --search-text "$title")
          echo "$RESULT"

          if [ "$(echo "$RESULT" | jq -r '.action')" != "create" ]; then
            ISSUE_NUM=$(echo "$RESULT" | jq -r '.issueNumber')
            gh issue comment "$ISSUE_NUM" --body "Still below target as of ${today}: score ${MUTATION_SCORE}% (threshold ${MUTATION_THRESHOLD}%). Run: ${RUN_URL}"
            echo "Updated existing issue #$ISSUE_NUM."
          fi
