name: Mutation Testing

# Baseline: 98.89% mutation score (services/users routes + services) as of
# 2026-08-02 — see the `thresholds` comment in stryker.config.mjs for the
# full breakdown and rationale. The 80% threshold below is comfortably met.
#
# A baseline only means something if the harness ran. On 2026-09-21 this
# workflow reported a 0% score from a run that executed zero tests per mutant
# (#5614) — so it now distinguishes "the suite scored badly" from "the suite
# was never measured" and fails with the right one. See
# scripts/classify-mutation-run.mjs.
on:
  # Weekly schedule on Monday morning (adjusted to avoid common CI peaks)
  schedule:
    - cron: "23 9 * * 1" # Monday 9:23 AM UTC
  # Manual triggering via GitHub UI or API. pr_number is optional: set it to
  # also post the results as a PR comment (e.g. `gh workflow run
  # mutation-testing.yml -f pr_number=1234`); omit it to just run and write
  # the job summary.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to comment mutation results on (optional)"
        required: false
        type: string

concurrency:
  group: mutation-testing
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Mutation Testing — periodic validation of test quality
  #
  # Single job on purpose. This used to be `prepare` → artifact → `mutation-test`,
  # shipping ~1.6GB of node_modules between two runners. That hand-off — not the
  # mutation run — is the only thing that has ever made this workflow red:
  # first as `JavaScript heap out of memory` while zipping (fixed in #3687 by
  # raising the upload action's heap), then, once the zip could finish, as a
  # flat 30-minute `Prepare` timeout on 2026-08-10 (10:37:28 → 11:07:31) that
  # skipped `Run Mutation Tests` entirely via `needs:`. Both failure modes are
  # properties of moving the archive, so the archive is gone: install and
  # generate happen in the same job that consumes them, warmed by the same
  # caches the two-job version already had. Stryker's scope is services/users
  # (see stryker.config.mjs), so a whole-workspace artifact was never the
  # cheaper path anyway.
  # ──────────────────────────────────────────────────────────────────────────
  mutation-test:
    name: Run Mutation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        # Unconditional, and deliberately not guarded by a `node_modules` cache.
        # The two-job version cached only the ROOT node_modules and skipped
        # install on a hit — which leaves every `services/*/node_modules` and
        # `packages/*/node_modules` absent, since pnpm links them per package.
        # That was survivable only because the artifact carried the per-package
        # trees along; with the artifact gone the cache would silently hand
        # Stryker a workspace missing services/users' own deps. setup-node's
        # `cache: pnpm` already caches the pnpm store, so a warm install is
        # cheap without the correctness hazard.
        run: pnpm install --frozen-lockfile

      - name: Cache Prisma clients
        id: cache-prisma
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            services/users/src/generated
            services/reservations/src/generated
            services/agent/src/generated
          key: prisma-clients-${{ hashFiles('services/users/prisma/schema.prisma', 'services/reservations/prisma/schema.prisma', 'services/agent/prisma/schema.prisma') }}

      - name: Generate Prisma clients
        if: steps.cache-prisma.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @mbe/users-service db:generate
          pnpm --filter @mbe/reservations-service db:generate
          pnpm --filter @mbe/agent-service db:generate

      - name: Build workspace dependencies
        # `pnpm install` LINKS workspace packages; it does not compile them.
        # services/users depends on eight of them and @mbe/types' exports
        # resolve to ./dist/*, so without this Stryker's dry run dies before
        # mutating anything:
        #   ERROR DryRunExecutor One or more tests failed in the initial test run:
        #     Failed to resolve entry for package "@mbe/types".
        # The two-job version was missing this too — it just never got far
        # enough to notice, because `Prepare` failed on every run and
        # `needs:` skipped this job entirely (#4289, run 31991031612).
        # `...` builds the service's transitive deps only, not the whole
        # workspace, so an unrelated package's TS error can't red this job —
        # the same scoping the Architecture Audit job uses.
        run: pnpm build --filter @mbe/users-service...

      - name: Run mutation tests
        run: pnpm test:mutations

      - name: Upload mutation test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30

      - name: Compute mutation score
        id: score
        if: always()
        run: node scripts/print-mutation-score.mjs reports/mutation/mutation.json >> "$GITHUB_OUTPUT"

      - name: Write mutation score to job summary
        if: always()
        run: node scripts/print-mutation-summary.mjs reports/mutation/mutation.json "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment mutation score on PR
        # workflow_dispatch carries no implicit PR context (this workflow has
        # no pull_request trigger — mutation testing is too expensive to run
        # per-commit, see stryker.config.mjs), so the condition is driven by
        # an explicit pr_number input rather than context.issue.number, which
        # is never set here.
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MUTATION_AVAILABLE: ${{ steps.score.outputs.available }}
          MUTATION_STATE: ${{ steps.score.outputs.state }}
          MUTATION_SCORE: ${{ steps.score.outputs.score }}
          MUTATION_THRESHOLD: ${{ steps.score.outputs.threshold }}
          MUTATION_PASSES: ${{ steps.score.outputs.passes }}
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const available = process.env.MUTATION_AVAILABLE === 'true';
            const state = process.env.MUTATION_STATE;
            const score = Number(process.env.MUTATION_SCORE);
            const threshold = Number(process.env.MUTATION_THRESHOLD);
            const passes = process.env.MUTATION_PASSES === 'true';
            const prNumber = Number(process.env.PR_NUMBER);
            const artifactUrl = `${github.server_url}/${github.repository}/actions/runs/${github.run_id}`;

            // `harness-broken` is deliberately NOT folded into the "no report"
            // branch: a report WAS produced, it just measured nothing (#5614).
            const failureNote = state === 'harness-broken'
              ? '❌ The harness ran no tests (every mutant reported `testsCompleted: 0`) — **no score was measured**. This is not a 0%.'
              : '❌ No report was produced by this run.';

            const comment = available
              ? `## Mutation Testing Results 🧬

            **Mutation Score:** ${score.toFixed(2)}%
            **Target:** > ${threshold}%
            **Status:** ${passes ? '✅ PASS' : '⚠️ BELOW TARGET'}

            Full report available in [Artifacts](${artifactUrl})`
              : `## Mutation Testing Results 🧬

            ${failureNote}

            Full report available in [Artifacts](${artifactUrl})`;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      # Fails on three distinct states, and says which — a broken harness must
      # never be reported as a low score (#5614). `set -o pipefail` because this
      # step's exit code IS the gate (see .claude/rules/gotchas.md § CI).
      - name: Fail if the mutation run did not pass
        env:
          MUTATION_STATE: ${{ steps.score.outputs.state }}
          MUTATION_SCORE: ${{ steps.score.outputs.score }}
          MUTATION_THRESHOLD: ${{ steps.score.outputs.threshold }}
          MUTATION_PASSES: ${{ steps.score.outputs.passes }}
        run: |
          set -o pipefail
          case "$MUTATION_STATE" in
            scored) ;;
            harness-broken)
              echo "❌ The mutation harness ran no tests — the suite was NOT measured."
              echo "   Every gradeable mutant reported testsCompleted: 0, so nothing could be killed."
              echo "   This is NOT a 0% score. Fix the test runner; do not add tests for this report."
              exit 1
              ;;
            *)
              echo "❌ Mutation testing produced no usable report (state: ${MUTATION_STATE})"
              exit 1
              ;;
          esac
          echo "Mutation Score: ${MUTATION_SCORE}%"
          if [ "$MUTATION_PASSES" != "true" ]; then
            echo "❌ Mutation score ${MUTATION_SCORE}% is below target of ${MUTATION_THRESHOLD}%"
            exit 1
          fi
          echo "✅ Mutation score ${MUTATION_SCORE}% meets target"

      - name: File or update tracking issue on scheduled mutation-testing failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MUTATION_STATE: ${{ steps.score.outputs.state }}
          MUTATION_SCORE: ${{ steps.score.outputs.score }}
          MUTATION_THRESHOLD: ${{ steps.score.outputs.threshold }}
        run: |
          set -o pipefail
          # Title, body, dedupe key and recurrence comment are all state-driven
          # (scripts/format-mutation-issue.mjs, unit-tested). This block used to
          # be an inline printf that interpolated one ${MUTATION_SCORE} for every
          # failure mode, so a harness that ran zero tests filed "Mutation testing
          # below target / **Score:** 0% / Add tests to kill surviving mutants"
          # (#5614) — wrong, and expensive to act on. Each state now gets its own
          # title AND its own dedupe key, so a broken harness can never be folded
          # into the genuine below-target issue.
          #
          # Each title is still stable and date-less, so it remains a single
          # de-duplicated tracking issue that gets a comment on every failing
          # week instead of a new issue per week — the pattern learning-loop uses
          # for sensor findings (search open issues, skip/update on match).
          ISSUE=$(node scripts/print-mutation-issue.mjs \
            --state "$MUTATION_STATE" \
            --score "$MUTATION_SCORE" \
            --threshold "$MUTATION_THRESHOLD" \
            --run-url "$RUN_URL" \
            --today "$(date -u +%Y-%m-%d)")

          title=$(printf '%s' "$ISSUE" | jq -r '.title')
          printf '%s' "$ISSUE" | jq -r '.body' > /tmp/mutation-failure-body.md

          RESULT=$(node scripts/lib/file-issue-cli.mjs \
            --title "$title" \
            --body-file /tmp/mutation-failure-body.md \
            --label ci-fix \
            --label ready \
            --dedupe-key "$(printf '%s' "$ISSUE" | jq -r '.dedupeKey')" \
            --search-label ci-fix \
            --search-text "$title")
          echo "$RESULT"

          if [ "$(printf '%s' "$RESULT" | jq -r '.action')" != "create" ]; then
            ISSUE_NUM=$(printf '%s' "$RESULT" | jq -r '.issueNumber')
            gh issue comment "$ISSUE_NUM" --body "$(printf '%s' "$ISSUE" | jq -r '.comment')"
            echo "Updated existing issue #$ISSUE_NUM."
          fi
