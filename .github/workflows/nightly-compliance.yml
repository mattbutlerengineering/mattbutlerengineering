name: nightly-compliance

# Nightly drift detection: re-runs the gating scripts and the ACMM audit
# against main, reports any drift, and files a meta-improvement issue if
# something the agents would normally catch has slipped through.
#
# Mirrors the policy of the daily `mbe-acmm-audit` and weekly
# `mbe-deep-audit` RemoteTriggers, but as a workflow so the policy is in
# source. The workflow is the policy; the RemoteTrigger is the runtime.
#
# This workflow runs on its cron schedule alongside the claude.ai
# RemoteTriggers. Both exist intentionally: the workflow is the policy
# in source control; the RemoteTrigger is the runtime backup.

on:
  schedule:
    # 09:00 UTC daily (~02:00 PT in standard time, ~01:00 PT during DST).
    # Staggered from the manual mbe-acmm-audit (17:00 UTC).
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      file_issue:
        description: File a meta-improvement issue if drift is detected
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-compliance
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test
        id: build
        continue-on-error: true
        run: |
          {
            echo '## Lint, typecheck, test'
            echo
            for cmd in lint typecheck test; do
              # `pnpm "$cmd"` must be the condition of an `if`, never a bare
              # statement followed by `cmd_status=$?` — the default GH Actions
              # shell is `bash -e {0}` (no pipefail), so a bare non-zero exit
              # aborts the whole step right there and `cmd_status=$?` never
              # runs. That silently deleted the FAILED branch for months: the
              # loop always died mid-`test`, so no `✗` was ever written and
              # drift detection below never fired. See the `if`-guarded form
              # already used correctly in "Run gating scripts" below.
              if pnpm "$cmd" > "/tmp/$cmd.out" 2>&1; then
                echo "- ✓ \`pnpm $cmd\` passed"
              else
                echo "- ✗ \`pnpm $cmd\` FAILED"
                echo
                echo '  ```'
                tail -10 "/tmp/$cmd.out" | sed 's/^/  /'
                echo '  ```'
              fi
              echo
            done
          } >> /tmp/report.md

      - name: Run gating scripts
        id: gates
        continue-on-error: true
        run: |
          {
            echo '## Gating scripts'
            echo
            # scripts/check-* is a mix of .js and .mjs — the glob below scans
            # both. It used to scan `.js` only, which silently never ran the
            # 14 `.mjs` gating scripts (including check-ai-antipatterns and
            # check-orphaned-tests) for the workflow's whole 100-day life.
            #
            # Any script excluded from the nightly loop must be named here,
            # explicitly, with a one-line reason — never left out by quietly
            # narrowing the glob. That silent-narrowing shape is exactly the
            # bug this comment exists to prevent from recurring.
            excluded=(
              "check-endpoint" # library CLI: needs <name> <url> args; no bare invocation to run nightly
              "check-dep-sync" # shells to `npx depcheck` per workspace package (30+); unpinned + network-dependent + minutes long, not nightly-budget-appropriate
            )
            for script in scripts/check-*.js scripts/check-*.mjs; do
              name=$(basename "$script")
              name="${name%.js}"
              name="${name%.mjs}"
              skip=false
              for ex in "${excluded[@]}"; do
                [ "$name" = "$ex" ] && skip=true
              done
              [ "$skip" = true ] && continue
              if node "$script" > "/tmp/$name.out" 2>&1; then
                echo "- ✓ \`$name\` passed"
              else
                echo "- ✗ \`$name\` FAILED"
                echo
                echo '  ```'
                sed 's/^/  /' "/tmp/$name.out" | head -20
                echo '  ```'
              fi
            done
          } >> /tmp/report.md

      - name: Run ACMM audit
        id: acmm
        continue-on-error: true
        run: |
          # audit.js always exits 0 by design (it's diagnostic, not gating —
          # see its own header comment) — capturing its exit status here is
          # about a real crash (thrown error, missing file), not the maturity
          # level. The behavioral-gate ✗/✓ lines it prints are the actual
          # drift signal `Detect drift` below keys on; piping straight into
          # `head -25` (no pipefail) both hid a non-zero exit and, measured
          # against a real run, truncated the output before those lines ever
          # printed — the report always ended at the "Behavioral gates
          # (strict):" header with the verdict itself cut off. `head -100`
          # comfortably covers a real run (47 lines) while still bounding a
          # runaway crash dump.
          if node plugins/acmm/scripts/audit.js > /tmp/acmm.out 2>&1; then
            acmm_mark="✓ \`acmm audit\` ran to completion"
          else
            acmm_mark="✗ \`acmm audit\` FAILED (non-zero exit)"
          fi
          {
            echo '## ACMM audit'
            echo
            echo '```'
            head -100 /tmp/acmm.out
            echo '```'
            echo
            echo "- $acmm_mark"
          } >> /tmp/report.md

      - name: Detect drift
        id: drift
        run: |
          if grep -q '✗' /tmp/report.md; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "Drift detected — see report."
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No drift detected."
          fi
          {
            echo '## Summary'
            echo
            # No `|| echo 0` fallback: `grep -c` always prints a valid count
            # (0 or more) to stdout even when it exits 1 on zero matches — the
            # common case for a clean run. The `|| echo 0` used to fire on
            # every zero-match count, printing a second "0" on its own line
            # and splitting this summary across two lines ("Drift: 0" then
            # "0 failures, N passes" on the next).
            echo "Drift: $(grep -c '✗' /tmp/report.md) failures, $(grep -c '✓' /tmp/report.md) passes"
          } >> /tmp/report.md

      - name: Upload report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-compliance-report
          path: /tmp/report.md

      - name: File meta-improvement issue if drift detected
        if: steps.drift.outputs.drift == 'true' && (github.event_name == 'schedule' || inputs.file_issue == true)
        env:
          REPORT_PATH: /tmp/report.md
        run: |
          today=$(date -u +%Y-%m-%d)
          title="[nightly-compliance ${today}] Drift detected"
          # --body-file passes report content directly; no shell interpolation of untrusted text.
          node scripts/lib/file-issue-cli.mjs \
            --title "$title" \
            --body-file "$REPORT_PATH" \
            --label meta-improvement \
            --label ready \
            --dedupe-key "nightly-compliance-drift-${today}" \
            --search-label meta-improvement \
            --search-text "$title"

      - name: File issue on scan failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          today=$(date -u +%Y-%m-%d)
          title="Nightly compliance scan failed [${today}]"

          printf '%s\n' \
            "## Nightly compliance scan failed" \
            "" \
            "The nightly compliance workflow failed on ${today}." \
            "This indicates an infrastructure or configuration problem" \
            "(not a drift detection — those are filed separately)." \
            "" \
            "**Run:** ${RUN_URL}" \
            "" \
            "### Next steps" \
            "1. Check the [workflow run](${RUN_URL}) for error details" \
            "2. The \`ci-fix\` label will trigger \`mbe-issue-worker\` to attempt an auto-fix" \
            "3. If the auto-fix fails, manual intervention is required" \
            > /tmp/failure-body.md

          node scripts/lib/file-issue-cli.mjs \
            --title "$title" \
            --body-file /tmp/failure-body.md \
            --label ci-fix \
            --label audit \
            --dedupe-key "nightly-compliance-scan-failed-${today}" \
            --search-label ci-fix \
            --search-text "$title"
