name: nightly-compliance

# Nightly drift detection: re-runs the gating scripts and the ACMM audit
# against main, reports any drift, and files a meta-improvement issue if
# something the agents would normally catch has slipped through.
#
# Mirrors the policy of the daily `mbe-acmm-audit` and weekly
# `mbe-deep-audit` RemoteTriggers, but as a workflow so the policy is in
# source. The workflow is the policy; the RemoteTrigger is the runtime.
#
# This workflow runs on its cron schedule alongside the claude.ai
# RemoteTriggers. Both exist intentionally: the workflow is the policy
# in source control; the RemoteTrigger is the runtime backup.

on:
  schedule:
    # 09:00 UTC daily (~02:00 PT in standard time, ~01:00 PT during DST).
    # Staggered from the manual mbe-acmm-audit (17:00 UTC).
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      file_issue:
        description: File a meta-improvement issue if drift is detected
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-compliance
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4/v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test
        id: build
        continue-on-error: true
        run: |
          {
            echo '## Lint, typecheck, test'
            echo
            for cmd in lint typecheck test; do
              pnpm "$cmd" > "/tmp/$cmd.out" 2>&1
              cmd_status=$?
              if [ "$cmd_status" -eq 0 ]; then
                echo "- ✓ \`pnpm $cmd\` passed"
              else
                echo "- ✗ \`pnpm $cmd\` FAILED"
                echo
                echo '  ```'
                tail -10 "/tmp/$cmd.out" | sed 's/^/  /'
                echo '  ```'
              fi
              echo
            done
          } >> /tmp/report.md

      - name: Run gating scripts
        id: gates
        continue-on-error: true
        run: |
          {
            echo '## Gating scripts'
            echo
              for script in scripts/check-*.js; do
              name=$(basename "$script" .js)
              if node "$script" > "/tmp/$name.out" 2>&1; then
                echo "- ✓ \`$name\` passed"
              else
                echo "- ✗ \`$name\` FAILED"
                echo
                echo '  ```'
                sed 's/^/  /' "/tmp/$name.out" | head -20
                echo '  ```'
              fi
            done
          } >> /tmp/report.md

      - name: Run ACMM audit
        id: acmm
        continue-on-error: true
        run: |
          {
            echo '## ACMM audit'
            echo
            echo '```'
             node plugins/acmm/scripts/audit.js 2>&1 | head -25
            echo '```'
          } >> /tmp/report.md

      - name: Detect drift
        id: drift
        run: |
          if grep -q '✗' /tmp/report.md; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "Drift detected — see report."
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No drift detected."
          fi
          {
            echo '## Summary'
            echo
            echo "Drift: $(grep -c '✗' /tmp/report.md || echo 0) failures, $(grep -c '✓' /tmp/report.md || echo 0) passes"
          } >> /tmp/report.md

      - name: Upload report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-compliance-report
          path: /tmp/report.md

      - name: File meta-improvement issue if drift detected
        if: steps.drift.outputs.drift == 'true' && (github.event_name == 'schedule' || inputs.file_issue == true)
        env:
          REPORT_PATH: /tmp/report.md
        run: |
          today=$(date -u +%Y-%m-%d)
          title="[nightly-compliance ${today}] Drift detected"
          existing=$(gh issue list --state open --label meta-improvement --search "$title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing already open for today; skipping."
            exit 0
          fi
          # --body-file passes report content directly; no shell interpolation of untrusted text.
          gh issue create \
            --title "$title" \
            --body-file "$REPORT_PATH" \
            --label meta-improvement \
            --label ready

      - name: File issue on scan failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          today=$(date -u +%Y-%m-%d)
          title="Nightly compliance scan failed [${today}]"

          # Dedup: skip if an open issue with the same title already exists.
          existing=$(gh issue list --state open --label ci-fix --search "$title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing already open for today; skipping."
            exit 0
          fi

          printf '%s\n' \
            "## Nightly compliance scan failed" \
            "" \
            "The nightly compliance workflow failed on ${today}." \
            "This indicates an infrastructure or configuration problem" \
            "(not a drift detection — those are filed separately)." \
            "" \
            "**Run:** ${RUN_URL}" \
            "" \
            "### Next steps" \
            "1. Check the [workflow run](${RUN_URL}) for error details" \
            "2. The \`ci-fix\` label will trigger \`mbe-issue-worker\` to attempt an auto-fix" \
            "3. If the auto-fix fails, manual intervention is required" \
            > /tmp/failure-body.md

          gh issue create \
            --title "$title" \
            --body-file /tmp/failure-body.md \
            --label ci-fix \
            --label audit
