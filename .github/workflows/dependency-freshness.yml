name: Dependency Freshness

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-outdated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check outdated
        id: check
        run: |
          OUTPUT=$(pnpm outdated --json 2>/dev/null || echo "{}")
          echo "outdated=$OUTPUT" >> "$GITHUB_OUTPUT"
          
          # Count outdated
          COUNT=$(echo "$OUTPUT" | jq 'if type == "object" then keys | length else 0 end')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Create issue
        if: steps.check.outputs.count != '0'
        env:
          OUTDATED_JSON: ${{ steps.check.outputs.outdated }}
        run: |
          DATE=$(date "+%B %Y")
          {
            echo "## Outdated Dependencies ($DATE)"
            echo
            echo "The following dependencies have updates available:"
            echo
            echo '```'
            echo "$OUTDATED_JSON"
            echo '```'
            echo
            echo "Consider updating these dependencies to stay current."
          } > /tmp/freshness-body.md
          gh issue create \
            --title "Dependency freshness: $DATE" \
            --body-file /tmp/freshness-body.md \
            --label "dependencies"

      - name: Update existing issue
        if: steps.check.outputs.count == '0'
        run: |
          DATE=$(date "+%B %Y")
          gh issue close "Dependency freshness: $DATE" 2>/dev/null || true
