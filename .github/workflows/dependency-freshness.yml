name: Dependency Freshness

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  check-outdated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check outdated
        id: outdated
        run: |
          OUTPUT=$(pnpm outdated --json 2>/dev/null || echo "{}")
          echo "outdated=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Check if outdated exists
        id: has-outdated
        run: |
          OUTPUT="${{ steps.outdated.outputs.outdated }}"
          if [ "$OUTPUT" = "{}" ] || [ -z "$OUTPUT" ]; then
            echo "has_outdated=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_outdated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create issue
        if: steps.has-outdated.outputs.has_outdated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.outdated.outputs.outdated }}`;
            const outdated = JSON.parse(output);
            const month = new Date().toLocaleString('default', { month: 'long' });
            const year = new Date().getFullYear();
            const title = `Dependency freshness: ${month} ${year}`;
            
            const body = `## Outdated Dependencies\n\nThe following dependencies have newer versions available:\n\n| Package | Current | Wanted | Latest |\n|---------|---------|--------|--------|\n` +
              Object.entries(outdated).map(([pkg, info]) => 
                `| \`${pkg}\` | ${info.current} | ${info.wanted} | ${info.latest} |`
              ).join('\n') + `\n\nPlease review and update as needed.`;

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'dependencies',
              state: 'open'
            });
            
            const existingIssue = existing.find(issue => issue.title === title);
            
            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['dependencies']
              });
            } else {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
            }

      - name: No outdated
        if: steps.has-outdated.outputs.has_outdated == 'false'
        run: echo "No outdated dependencies found"
