name: Dependency Freshness

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-outdated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check outdated
        id: check
        run: |
          OUTPUT=$(pnpm outdated --json 2>/dev/null || echo "{}")
          echo "outdated=$OUTPUT" >> "$GITHUB_OUTPUT"

          # Count outdated
          COUNT=$(echo "$OUTPUT" | jq 'if type == "object" then keys | length else 0 end')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Create issue
        if: steps.check.outputs.count != '0'
        env:
          OUTDATED_JSON: ${{ steps.check.outputs.outdated }}
        run: |
          DATE=$(date "+%B %Y")
          {
            echo "## Outdated Dependencies ($DATE)"
            echo
            echo "The following dependencies have updates available:"
            echo
            echo '```'
            echo "$OUTDATED_JSON"
            echo '```'
            echo
            echo "Consider updating these dependencies to stay current."
          } > /tmp/freshness-body.md
          node scripts/lib/file-issue-cli.mjs \
            --title "Dependency freshness: $DATE" \
            --body-file /tmp/freshness-body.md \
            --label "dependencies" \
            --dedupe-key "dependency-freshness-$DATE" \
            --search-label "dependencies" \
            --search-state all \
            --contains "$DATE"

      - name: Update existing issue
        if: steps.check.outputs.count == '0'
        run: |
          DATE=$(date "+%B %Y")
          gh issue close "Dependency freshness: $DATE" 2>/dev/null || true
