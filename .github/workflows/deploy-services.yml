name: Deploy Services

on:
  push:
    branches: [main]
    paths:
      - "services/users/**"
      - "services/reservations/**"
      - "services/agent/**"
      - "packages/types/**"
      - "packages/auth/**"
      - "packages/agent-core/**"
      - "packages/observability/**"

concurrency:
  group: deploy-services-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  # Check circuit breaker before deploying
  circuit-check:
    name: Circuit Breaker Check
    runs-on: ubuntu-latest
    outputs:
      blocked: ${{ steps.check.outputs.blocked }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4/v5
        with:
          sparse-checkout: |
            .github/circuit-breaker-state
          sparse-checkout-cone-mode: false
          ref: circuit-breaker-state

      - name: Check state
        id: check
        run: |
          if [ -f ".github/circuit-breaker-state" ]; then
            STATE=$(jq -r '.state // "closed"' .github/circuit-breaker-state 2>/dev/null || echo "closed")
          else
            STATE="closed"
          fi

          echo "Circuit state: $STATE"
          if [ "$STATE" = "open" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Circuit breaker is open - deploys blocked"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

  # Wait for CI to pass before deploying
  ci-gate:
    name: Wait for CI
    needs: [circuit-check]
    if: needs.circuit-check.outputs.blocked != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@96d9100b431964d10e0136aff8b9ccb92470505e # v1.8.0
        with:
          ref: ${{ github.sha }}
          check-name: "Build"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          # CI's Build job is gated behind Prepare/Detect Changes and can take
          # >60s to appear on the merge commit; the 60s default discovery
          # timeout caused 5 straight "check was never run" deploy failures
          checks-discovery-timeout: 600

  blocked:
    needs: [circuit-check]
    if: needs.circuit-check.outputs.blocked == 'true'
    name: Deploy Blocked
    runs-on: ubuntu-latest
    steps:
      - name: Notify blocked
        run: |
          echo "::warning::Deploy blocked by circuit breaker"
          echo "Run 'gh workflow run circuit-breaker.yml -f force=true' to override"

  deploy:
    name: Deploy API Services
    needs: [ci-gate]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Inject deploy metadata into app spec
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_PR_NUMBER: ${{ github.event.number }}
          DEPLOY_AUTHOR: ${{ github.actor }}
        run: |
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | grep mattbutlerengineering-api | awk '{print $1}')
          if [ -z "$APP_ID" ]; then
            echo "::error::Could not find mattbutlerengineering-api app"
            exit 1
          fi

          # Fetch current spec
          doctl apps spec get "$APP_ID" > /tmp/spec.yaml

          # Upsert DEPLOY_SHA, DEPLOY_PR_NUMBER, DEPLOY_AUTHOR into each service's envs
          for SVC in users-api reservations-api agent-api; do
            yq -i "(.services[] | select(.name == \"$SVC\").envs) |=
              (map(select(.key != \"DEPLOY_SHA\" and .key != \"DEPLOY_PR_NUMBER\" and .key != \"DEPLOY_AUTHOR\")) +
              [{\"key\":\"DEPLOY_SHA\",\"value\":\"${DEPLOY_SHA}\"},
               {\"key\":\"DEPLOY_PR_NUMBER\",\"value\":\"${DEPLOY_PR_NUMBER}\"},
               {\"key\":\"DEPLOY_AUTHOR\",\"value\":\"${DEPLOY_AUTHOR}\"}])" /tmp/spec.yaml
          done

          echo "Updating app spec with deploy metadata"
          doctl apps update "$APP_ID" --spec /tmp/spec.yaml

      - name: Trigger deployment
        run: |
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | grep mattbutlerengineering-api | awk '{print $1}')
          if [ -z "$APP_ID" ]; then
            echo "::error::Could not find mattbutlerengineering-api app"
            exit 1
          fi
          echo "Triggering deployment for app $APP_ID"
          # Retry to absorb transient DO build failures (BuildRateLimit from concurrent
          # builds / the doctl+Pulumi dual-deploy race). create-deployment is safe to
          # re-issue: each call starts a fresh deployment and the latest one wins.
          for attempt in 1 2 3; do
            if doctl apps create-deployment "$APP_ID" --wait; then
              echo "Deployment succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Deployment attempt $attempt failed (likely transient DO BuildRateLimit); retrying after backoff"
              sleep $((attempt * 60))
            fi
          done
          echo "::error::Deployment failed after 3 attempts"
          exit 1

  verify:
    name: Post-Deploy Verification
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify users API health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://api.mattbutlerengineering.com/health)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Users API health check returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "Users API health OK (HTTP $STATUS)"

      - name: Verify reservations API health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://api.mattbutlerengineering.com/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Reservations API health check returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "Reservations API health OK (HTTP $STATUS)"

  report-health:
    name: Report Deploy Health
    needs: [deploy, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4/v5
      - uses: ./.github/actions/report-deploy-health
        with:
          kv-key: deploy/services
          deploy-result: ${{ needs.deploy.result }}
          verify-result: ${{ needs.verify.result }}
          cf-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cf-api-token: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          kv-namespace-id: ${{ secrets.HEALTH_KV_NAMESPACE_ID }}
