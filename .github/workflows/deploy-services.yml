name: Deploy Services

on:
  push:
    branches: [main]
    paths:
      - "services/users/**"
      - "services/reservations/**"
      - "services/agent/**"
      - "packages/types/**"
      - "packages/auth/**"
      - "packages/agent-core/**"
      - "packages/observability/**"
  # Lets a stuck deploy (e.g. exhausted retries from a transient DO
  # BuildRateLimit — see the "Trigger deployment" retry loop below) be
  # re-run without an unrelated code push. The deploys-unhealthy runbook
  # (docs/runbooks/deploys-unhealthy.md) explicitly prescribes "trigger a
  # manual redeploy" as a recovery step; this workflow had no way to do
  # that (unlike the sibling pulumi-up.yml, which already has this).
  workflow_dispatch:

concurrency:
  group: deploy-services-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  # Check circuit breaker before deploying
  circuit-check:
    name: Circuit Breaker Check
    runs-on: ubuntu-latest
    outputs:
      blocked: ${{ steps.check.outputs.blocked }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          sparse-checkout: |
            .github/circuit-breaker-state
          sparse-checkout-cone-mode: false
          ref: circuit-breaker-state

      - name: Check state
        id: check
        run: |
          if [ -f ".github/circuit-breaker-state" ]; then
            STATE=$(jq -r '.state // "closed"' .github/circuit-breaker-state 2>/dev/null || echo "closed")
          else
            STATE="closed"
          fi

          echo "Circuit state: $STATE"
          if [ "$STATE" = "open" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Circuit breaker is open - deploys blocked"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

  # Wait for CI to pass before deploying
  ci-gate:
    name: Wait for CI
    needs: [circuit-check]
    if: needs.circuit-check.outputs.blocked != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      statuses: read
      actions: write # `gh run rerun` in the recovery step below
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      # A CI run that is still QUEUED on `main` gets cancelled when a later
      # push queues behind an already-running one — ci.yml's
      # `cancel-in-progress: false` protects an in-progress run, not a
      # pending one. `Build` then never appears, the wait below burns its
      # full 30-minute discovery timeout, and the commit never deploys:
      # three of the last three `Wait for CI` failures, one of them a
      # 46-package production-dependency bump that never reached the
      # running services. Re-run CI on this exact commit before waiting.
      # See scripts/deploy-ci-precondition.mjs for the measurements.
      - name: Recover a cancelled CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs=$(gh run list --commit "$GITHUB_SHA" --workflow ci.yml \
            --limit 10 --json databaseId,status,conclusion)
          verdict=$(node scripts/deploy-ci-precondition.mjs "$runs")
          echo "CI precondition for $GITHUB_SHA: $verdict"
          if [ "$(echo "$verdict" | jq -r .rerun)" = "true" ]; then
            gh run rerun "$(echo "$verdict" | jq -r .runId)"
            echo "Re-ran the cancelled CI run; the wait step can now resolve."
          fi

      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.sha }}
          check-name: "Build"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          # CI's Build job is gated behind Prepare/Detect Changes and can take
          # >60s to appear on the merge commit; the 60s default discovery
          # timeout caused 5 straight "check was never run" deploy failures.
          # 600s also proved insufficient under whole-account runner-queue
          # congestion (2026-07-05 and 2026-07-09: CI's first job started
          # ~10 min after push, Build appeared ~13 min in), so allow 30 min.
          checks-discovery-timeout: 1800

  blocked:
    needs: [circuit-check]
    if: needs.circuit-check.outputs.blocked == 'true'
    name: Deploy Blocked
    runs-on: ubuntu-latest
    steps:
      - name: Notify blocked
        run: |
          echo "::warning::Deploy blocked by circuit breaker"
          echo "Run 'gh workflow run circuit-breaker.yml -f force=true' to override"

  deploy:
    name: Deploy API Services
    needs: [ci-gate]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Inject deploy metadata into app spec
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_PR_NUMBER: ${{ github.event.number }}
          DEPLOY_AUTHOR: ${{ github.actor }}
          MANAGE_TOKEN_SECRET: ${{ secrets.MANAGE_TOKEN_SECRET }}
          UNSUBSCRIBE_TOKEN_SECRET: ${{ secrets.UNSUBSCRIBE_TOKEN_SECRET }}
        run: |
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | grep mattbutlerengineering-api | awk '{print $1}')
          if [ -z "$APP_ID" ]; then
            echo "::error::Could not find mattbutlerengineering-api app"
            exit 1
          fi

          # Fetch current spec
          doctl apps spec get "$APP_ID" > /tmp/spec.yaml

          # Upsert DEPLOY_SHA, DEPLOY_PR_NUMBER, DEPLOY_AUTHOR into each service's envs
          for SVC in users-api reservations-api agent-api; do
            yq -i "(.services[] | select(.name == \"$SVC\").envs) |=
              (map(select(.key != \"DEPLOY_SHA\" and .key != \"DEPLOY_PR_NUMBER\" and .key != \"DEPLOY_AUTHOR\")) +
              [{\"key\":\"DEPLOY_SHA\",\"value\":\"${DEPLOY_SHA}\"},
               {\"key\":\"DEPLOY_PR_NUMBER\",\"value\":\"${DEPLOY_PR_NUMBER}\"},
               {\"key\":\"DEPLOY_AUTHOR\",\"value\":\"${DEPLOY_AUTHOR}\"}])" /tmp/spec.yaml
          done

          # Upsert MANAGE_TOKEN_SECRET into reservations-api — required for startup in production.
          # This bridges the gap while ignoreChanges: ["spec"] prevents Pulumi from pushing env changes.
          if [ -n "${MANAGE_TOKEN_SECRET}" ]; then
            yq -i "(.services[] | select(.name == \"reservations-api\").envs) |=
              (map(select(.key != \"MANAGE_TOKEN_SECRET\")) +
              [{\"key\":\"MANAGE_TOKEN_SECRET\",\"value\":\"${MANAGE_TOKEN_SECRET}\",\"type\":\"SECRET\"}])" /tmp/spec.yaml
          fi

          # Upsert UNSUBSCRIBE_TOKEN_SECRET into reservations-api — required for startup in production.
          # This bridges the gap while ignoreChanges: ["spec"] prevents Pulumi from pushing env changes.
          if [ -n "${UNSUBSCRIBE_TOKEN_SECRET}" ]; then
            yq -i "(.services[] | select(.name == \"reservations-api\").envs) |=
              (map(select(.key != \"UNSUBSCRIBE_TOKEN_SECRET\")) +
              [{\"key\":\"UNSUBSCRIBE_TOKEN_SECRET\",\"value\":\"${UNSUBSCRIBE_TOKEN_SECRET}\",\"type\":\"SECRET\"}])" /tmp/spec.yaml
          fi

          echo "Updating app spec with deploy metadata"
          doctl apps update "$APP_ID" --spec /tmp/spec.yaml

      - name: Trigger deployment
        run: |
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | grep mattbutlerengineering-api | awk '{print $1}')
          if [ -z "$APP_ID" ]; then
            echo "::error::Could not find mattbutlerengineering-api app"
            exit 1
          fi
          echo "Triggering deployment for app $APP_ID"
          # Retry to absorb transient DO failures (e.g. BuildRateLimit from concurrent
          # builds / the doctl+Pulumi dual-deploy race) — create-deployment is safe to
          # re-issue: each call starts a fresh deployment and the latest one wins.
          #
          # 5 attempts / up to 4 min backoff (was 3 attempts / up to 2 min): a genuinely
          # transient failure needs room for DO's build queue to drain around a
          # concurrent Pulumi run; a deterministic failure (e.g. a crashing container)
          # will exhaust these attempts too, so the warning below reports doctl's own
          # output rather than guessing the cause — see #4069's discussion of #4040,
          # where a prior version of this line hardcoded "likely transient DO
          # BuildRateLimit" on every failed attempt regardless of the real error,
          # which sent that incident's diagnosis in the wrong direction.
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            # Assignment inside an `if` condition, NOT bare: GitHub runs this
            # step as `bash -e`, where a bare `DEPLOY_OUTPUT=$(doctl ...)` is a
            # simple command that aborts the whole step the moment doctl exits
            # non-zero. Written that way, the loop below never reached attempt
            # 2, and neither the `echo "$DEPLOY_OUTPUT"` nor the ::warning:: /
            # ::error:: lines ever ran — every failed deploy logged a bare
            # `exit code 1` with no doctl output at all, which is what made
            # #4040 take #4064 and #4069 to diagnose. Guarded by
            # scripts/__tests__/workflow-set-e-assignment.test.mjs.
            if DEPLOY_OUTPUT=$(doctl apps create-deployment "$APP_ID" --wait 2>&1); then
              DEPLOY_STATUS=0
            else
              DEPLOY_STATUS=$?
            fi
            echo "$DEPLOY_OUTPUT"
            if [ "$DEPLOY_STATUS" -eq 0 ]; then
              echo "Deployment succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning::Deployment attempt $attempt failed; retrying after backoff. doctl output: $(echo "$DEPLOY_OUTPUT" | tail -5 | tr '\n' ' ')"
              sleep $((attempt * 60 < 240 ? attempt * 60 : 240))
            else
              echo "::error::Deployment failed after $MAX_ATTEMPTS attempts. Last doctl output: $(echo "$DEPLOY_OUTPUT" | tail -10 | tr '\n' ' ')"
            fi
          done
          exit 1

  verify:
    name: Post-Deploy Verification
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify users API health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://api.mattbutlerengineering.com/health)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Users API health check returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "Users API health OK (HTTP $STATUS)"

      - name: Verify reservations API health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://api.mattbutlerengineering.com/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Reservations API health check returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "Reservations API health OK (HTTP $STATUS)"

  report-health:
    name: Report Deploy Health
    needs: [deploy, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
      - uses: ./.github/actions/report-deploy-health
        with:
          kv-key: deploy/services
          deploy-result: ${{ needs.deploy.result }}
          verify-result: ${{ needs.verify.result }}
          cf-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cf-api-token: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          kv-namespace-id: ${{ secrets.HEALTH_KV_NAMESPACE_ID }}
