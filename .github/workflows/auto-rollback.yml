name: Auto-Rollback on Agent Regression

on:
  schedule:
    # Weekly drill every Monday at 10:17 UTC — keeps ACMM active detection green
    # without requiring a real regression or manual workflow_dispatch
    - cron: "17 10 * * 1"
  workflow_dispatch:
    inputs:
      drill:
        description: "Run as a dry-run drill (simulates rollback without reverting commits)"
        type: boolean
        default: false
  workflow_run:
    workflows: ["Post-Deploy Check"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  rollback-drill:
    name: Rollback Drill (dry-run)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.drill == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 10

      - name: Configure git identity
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Identify latest agent commit to simulate rollback
        id: find-agent-commit
        run: |
          # Find the most recent commit with Claude co-authorship (agent commit signal)
          AGENT_SHA=""
          for sha in $(git log --format='%H' -20); do
            msg=$(git log -1 --format='%B' "$sha")
            if echo "$msg" | grep -qi 'Co-Authored-By:.*Claude'; then
              AGENT_SHA="$sha"
              break
            fi
          done

          if [ -z "$AGENT_SHA" ]; then
            # Fall back to HEAD if no agent commit found in recent history
            AGENT_SHA=$(git rev-parse HEAD)
            echo "No agent commit found in last 20 commits; using HEAD as drill target"
          fi

          SHORT_SHA="${AGENT_SHA:0:7}"
          AUTHOR=$(git log -1 --format='%an' "$AGENT_SHA")
          SUBJECT=$(git log -1 --format='%s' "$AGENT_SHA")

          echo "agent_sha=$AGENT_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"

          echo "=== DRILL: Target commit ==="
          echo "  SHA:     $AGENT_SHA"
          echo "  Author:  $AUTHOR"
          echo "  Subject: $SUBJECT"

      - name: Simulate revert on temporary drill branch
        id: drill-revert
        env:
          AGENT_SHA: ${{ steps.find-agent-commit.outputs.agent_sha }}
          SHORT_SHA: ${{ steps.find-agent-commit.outputs.short_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRILL_BRANCH="drill/rollback-${SHORT_SHA}-$(date +%s)"
          echo "drill_branch=$DRILL_BRANCH" >> "$GITHUB_OUTPUT"

          echo "=== DRILL: Creating temporary branch '$DRILL_BRANCH' ==="
          git checkout -b "$DRILL_BRANCH"

          echo "=== DRILL: Attempting dry-run revert of $AGENT_SHA ==="
          # Use --no-commit so we can inspect without actually committing
          if git revert --no-commit "$AGENT_SHA" 2>/dev/null; then
            echo "revert_clean=true" >> "$GITHUB_OUTPUT"
            echo "=== DRILL: Revert would apply cleanly — no conflicts ==="
            # Reset the working tree (don't commit in drill mode)
            git checkout .
            git clean -fd
          else
            echo "revert_clean=false" >> "$GITHUB_OUTPUT"
            echo "=== DRILL: Revert would have conflicts — manual intervention would be needed ==="
            git revert --abort 2>/dev/null || git checkout .
            git clean -fd
          fi

          echo "=== DRILL: Pushing drill branch for build verification ==="
          git push origin "$DRILL_BRANCH"

      - name: Verify drill branch is operational
        env:
          DRILL_BRANCH: ${{ steps.drill-revert.outputs.drill_branch }}
          REVERT_CLEAN: ${{ steps.drill-revert.outputs.revert_clean }}
        run: |
          echo "=== DRILL: Branch '$DRILL_BRANCH' pushed successfully ==="
          echo "=== DRILL: In a real rollback, CI would run on this branch ==="
          echo "=== DRILL: Revert was clean: $REVERT_CLEAN ==="

      - name: Clean up drill branch
        if: always()
        env:
          DRILL_BRANCH: ${{ steps.drill-revert.outputs.drill_branch }}
        run: |
          if [ -n "$DRILL_BRANCH" ]; then
            echo "=== DRILL: Deleting temporary branch '$DRILL_BRANCH' ==="
            git push origin --delete "$DRILL_BRANCH" || echo "Branch already deleted or never created"
          fi

      - name: Report drill results
        env:
          SHORT_SHA: ${{ steps.find-agent-commit.outputs.short_sha }}
          AUTHOR: ${{ steps.find-agent-commit.outputs.author }}
          SUBJECT: ${{ steps.find-agent-commit.outputs.subject }}
          REVERT_CLEAN: ${{ steps.drill-revert.outputs.revert_clean }}
        run: |
          echo "============================================"
          echo "  DRILL PASSED: Auto-rollback drill complete"
          echo "============================================"
          echo ""
          echo "  Simulated rollback of: ${SHORT_SHA} (${AUTHOR})"
          echo "  Subject: ${SUBJECT}"
          echo "  Clean revert: ${REVERT_CLEAN}"
          echo ""
          echo "  The auto-rollback mechanism is verified operational."
          echo "  A real regression would trigger a revert PR automatically."
          echo "============================================"

  check-and-rollback:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 10

      - name: Identify agent commits
        id: agent-check
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTHOR=$(git log -1 --format='%an' "$HEAD_SHA" 2>/dev/null || echo "unknown")
          MESSAGE=$(git log -1 --format='%B' "$HEAD_SHA" 2>/dev/null || echo "")
          BRANCH=$(git log -1 --format='%D' "$HEAD_SHA" 2>/dev/null || echo "")

          IS_AGENT="false"

          # Check branch name patterns (worktree agents, agent branches)
          if echo "$BRANCH" | grep -qE '(agent-|worktree-agent-|fix/agent-|feat/agent-)'; then
            IS_AGENT="true"
          fi

          # Check for Co-Authored-By: Claude in commit message (most reliable signal)
          if echo "$MESSAGE" | grep -qi 'Co-Authored-By:.*Claude'; then
            IS_AGENT="true"
          fi

          # Check for has-pr label on the merge commit's PR; also check no-auto-rollback opt-out
          NO_ROLLBACK="false"
          PR_NUM=$(echo "$MESSAGE" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
          if [ -n "$PR_NUM" ]; then
            LABELS=$(gh pr view "$PR_NUM" --json labels --jq '.labels[].name' 2>/dev/null || echo "")
            if echo "$LABELS" | grep -q 'has-pr'; then
              IS_AGENT="true"
            fi
            # Opt-out: PR was labelled no-auto-rollback before merge
            if echo "$LABELS" | grep -q 'no-auto-rollback'; then
              NO_ROLLBACK="true"
            fi
          fi

          echo "is_agent=$IS_AGENT" >> "$GITHUB_OUTPUT"
          echo "no_rollback=$NO_ROLLBACK" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

      - name: Create revert PR
        if: steps.agent-check.outputs.is_agent == 'true' && steps.agent-check.outputs.no_rollback != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ steps.agent-check.outputs.commit_sha }}
          COMMIT_AUTHOR: ${{ steps.agent-check.outputs.author }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"

          REVERT_BRANCH="revert/agent-${SHORT_SHA}"
          git checkout -b "$REVERT_BRANCH"

          if git revert --no-edit "$COMMIT_SHA"; then
            git push origin "$REVERT_BRANCH"

            gh pr create \
              --title "revert: auto-rollback agent commit ${SHORT_SHA}" \
              --body "## Auto-Rollback

          Post-deploy smoke tests failed after agent commit \`${COMMIT_SHA}\`.

          This revert PR was created automatically by the auto-rollback workflow.

          **Original author:** ${COMMIT_AUTHOR}
          **Failure:** Post-Deploy Check workflow failed

          ### Next Steps
          1. Review this revert PR
          2. Merge to restore stability
          3. Investigate the original change
          4. File a new issue if the original intent was valid" \
              --label "agent-regression"

            echo "Revert PR created for agent commit ${SHORT_SHA}"
          else
            echo "Could not cleanly revert ${SHORT_SHA} — manual intervention needed"
            gh issue create \
              --title "Manual rollback needed: agent commit ${SHORT_SHA} caused regression" \
              --body "Post-deploy checks failed after agent commit \`${COMMIT_SHA}\` but automatic revert failed (merge conflict). Manual intervention required." \
              --label "agent-regression,urgent"
          fi

      - name: Skip non-agent or opted-out failures
        if: steps.agent-check.outputs.is_agent != 'true' || steps.agent-check.outputs.no_rollback == 'true'
        env:
          COMMIT_SHA: ${{ steps.agent-check.outputs.commit_sha }}
          COMMIT_AUTHOR: ${{ steps.agent-check.outputs.author }}
          NO_ROLLBACK: ${{ steps.agent-check.outputs.no_rollback }}
        run: |
          if [ "$NO_ROLLBACK" = "true" ]; then
            echo "PR was labelled no-auto-rollback — skipping auto-rollback"
          else
            echo "Post-deploy failure was not from an agent commit — skipping auto-rollback"
          fi
          echo "Commit: ${COMMIT_SHA}"
          echo "Author: ${COMMIT_AUTHOR}"

      - name: File issue on rollback failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          today=$(date -u +%Y-%m-%d)
          title="[URGENT] Auto-rollback failed [${today}]"

          # Dedup: skip if an open issue with the same title already exists.
          existing=$(gh issue list --state open --label ci-fix --search "$title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Issue #$existing already open for today; skipping."
            exit 0
          fi

          printf '%s\n' \
            "## Auto-rollback workflow failed" \
            "" \
            "The auto-rollback workflow failed on ${today}." \
            "This means a post-deploy regression was detected but the" \
            "automatic revert could not be completed (merge conflict," \
            "branch deletion failure, or other infrastructure issue)." \
            "" \
            "**Commit:** \`${HEAD_SHA}\`" \
            "**Run:** ${RUN_URL}" \
            "" \
            "### Next steps" \
            "1. Check the [workflow run](${RUN_URL}) for error details" \
            "2. Manually revert the offending commit if needed" \
            "3. The \`ci-fix\` label will trigger \`mbe-issue-worker\` to attempt an auto-fix" \
            > /tmp/rollback-failure-body.md

          gh issue create \
            --title "$title" \
            --body-file /tmp/rollback-failure-body.md \
            --label ci-fix \
            --label audit
