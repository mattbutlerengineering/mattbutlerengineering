name: Rialto Web E2E

# Two independent Playwright suites for apps/rialto-web/e2e/, kept in
# separate jobs so a visual-baseline diff and a functional regression stay
# distinguishable failures:
#   - visual:     e2e/visual.spec.ts only — screenshot comparison against the
#                 /visual-test harness page. Baselines are Linux-CI-runner-
#                 specific (see .claude/rules/gotchas.md). Its
#                 rialto-web-visual-diffs artifact is unchanged — same name,
#                 same path, same retention — but the invocation is NOT: it
#                 now also emits Playwright's json report (github first, so
#                 today's annotations survive) to a path deliberately outside
#                 test-results/, uploaded separately, so publish-visual-diffs
#                 below can read what changed. The job's own pass/fail verdict
#                 is untouched by both. See docs/features/visual-diffs-in-pr/.
#   - publish-visual-diffs:
#                 pull requests only. Turns a failing visual run into one
#                 sticky PR comment with the diff images inline, and retracts
#                 that comment when a later run passes. Installs nothing,
#                 builds nothing, runs no tests — so it cannot move CI Gate or
#                 the visual verdict.
#   - functional: every other e2e/*.spec.ts — accessibility, navigation,
#                 search, theme, and component-interaction assertions.
#                 Listed explicitly (never a glob), so a newly added spec
#                 either gets wired in here deliberately or fails the
#                 coverage check in apps/rialto-web/e2e/workflow-coverage.
#                 test.ts (part of `pnpm --dir apps/rialto-web test`). See
#                 #3955. demo-nav.spec.ts ships with #3954 — listing it here
#                 ahead of that merge is a no-op (a missing spec path is
#                 silently skipped by playwright) until the file lands, then
#                 it starts running automatically.
#
# The functional job carries one extra pair of steps for e2e/csp.spec.ts:
# a `build` and a second playwright invocation against
# playwright.csp.config.ts, which serves the BUILT dist/ through `vite
# preview` under the real production Content-Security-Policy from
# @mbe/edge-worker. It is a separate step rather than a third job so a CSP
# failure stays distinguishable from a functional one without re-paying
# checkout, install, the rialto build, and the Chromium install (~2-3 min of
# billed runner time per run). It needs its own config because the base
# config's dev server sets no policy at all — running csp.spec.ts there
# would prove nothing, which is why playwright.config.ts testIgnores it.
# See docs/fixes/e2e-behind-edge-csp/.
#
# This is distinct from rialto-visual.yml, which runs the package-local
# Storybook visual suite (packages/rialto/src/test/visual/**).
on:
  push:
    branches: [main]
    paths:
      - "apps/rialto-web/**"
      - "packages/rialto/src/**"
      # The CSP suite's policy comes from infrastructure/worker/csp.js, and the
      # worker is what actually serves this app in production. Without this
      # path, editing a directive there — the change most likely to break the
      # app under CSP, and the cause of both the zero-web-fonts outage and the
      # blocked Sentry envelopes — would not run the guard that exists to
      # catch it.
      - "infrastructure/worker/**"
  pull_request:
    paths:
      - "apps/rialto-web/**"
      - "packages/rialto/src/**"
      # The CSP suite's policy comes from infrastructure/worker/csp.js, and the
      # worker is what actually serves this app in production. Without this
      # path, editing a directive there — the change most likely to break the
      # app under CSP, and the cause of both the zero-web-fonts outage and the
      # blocked Sentry envelopes — would not run the guard that exists to
      # catch it.
      - "infrastructure/worker/**"

permissions:
  contents: read

jobs:
  visual:
    name: Visual Regression (rialto-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build rialto (styles + dist export required by rialto-web)
        run: pnpm build --filter @mattbutlerengineering/rialto
      - name: Install Playwright browsers
        run: pnpm --dir apps/rialto-web exec playwright install --with-deps chromium
      - name: Run visual regression tests
        # Invoke playwright directly (not the root `test:visual` script) so
        # the run is scoped to visual.spec.ts only — the root script's args
        # pass through a literal "--" that playwright doesn't strip, which
        # causes it to fall back to running the whole apps/rialto-web/e2e/
        # directory (functional specs included).
        #
        # `github` stays FIRST in the reporter list so the inline annotations
        # this job produces today are unchanged; `json` is additive. Its
        # output file is deliberately outside e2e/test-results/, because that
        # directory IS the rialto-web-visual-diffs artifact and SC-8 requires
        # that artifact's contents to stay byte-identical.
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/visual-report/report.json
        run: pnpm exec playwright test --reporter=github,json --config apps/rialto-web/playwright.config.ts apps/rialto-web/e2e/visual.spec.ts
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rialto-web-visual-diffs
          path: apps/rialto-web/e2e/test-results/
          retention-days: 14
      - name: Upload the JSON report
        # always(), because the report is most interesting on the run that
        # failed — the default `success()` would skip it exactly then.
        # continue-on-error, because a broken upload of a convenience artifact
        # must not change this job's conclusion (SC-7).
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rialto-web-visual-report
          path: visual-report/report.json
          retention-days: 14
          if-no-files-found: ignore

  publish-visual-diffs:
    name: Publish Visual Diffs
    needs: [visual]
    # always(), so this job sees BOTH outcomes. A failing `visual` publishes
    # the diffs; a passing one retracts a failure comment left standing by an
    # earlier run (SC-5). The default `success()` would skip precisely the
    # case the feature exists for.
    #
    # The push-to-main case is answered here rather than in a step: a push run
    # has no pull request to comment on, so the job never starts at all.
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Additive over the workflow-level `contents: read`, at job level only —
    # the same shape ci.yml's `ci-gate` uses to add `statuses: write`. The
    # `visual` and `functional` jobs keep the read-only token they have today.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Credentials are persisted (this workflow does not set
      # persist-credentials: false), which is what lets the publisher push the
      # diff ref. Note the residual risk recorded in architecture.md: a pull
      # request that edits scripts/ edits what runs under this token. The
      # mitigation is that this job installs nothing, builds nothing and runs
      # no tests, so nothing in the PR's dependency tree executes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Decline on pull requests from forks
        id: fork-check
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          if [ "$HEAD_REPO" = "$THIS_REPO" ]; then
            echo "declined=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A fork's GITHUB_TOKEN is read-only no matter what this job asks
          # for, so the push would 403. Decline visibly instead of failing on
          # something that was predictable before the first API call.
          echo "declined=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Visual diff publisher"
            echo
            echo "- Declined: this pull request's head is \`$HEAD_REPO\`, not \`$THIS_REPO\`."
            echo "  A fork's token cannot be granted \`contents: write\`, so nothing was published."
          } >> "$GITHUB_STEP_SUMMARY"

      # Both downloads tolerate absence. A passing `visual` run uploads no
      # rialto-web-visual-diffs artifact at all, and that is the normal case,
      # not an error — the publisher's clear path needs neither artifact.
      - name: Download the JSON report
        if: steps.fork-check.outputs.declined == 'false'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rialto-web-visual-report
          path: visual-report

      - name: Download the diff images
        if: steps.fork-check.outputs.declined == 'false'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rialto-web-visual-diffs
          path: visual-diffs

      - name: Publish the diffs and upsert the comment
        if: steps.fork-check.outputs.declined == 'false'
        # git has no default timeout; a hung push would otherwise burn this
        # job's entire budget. The step is the push, so the bound goes here.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VISUAL_OUTCOME: ${{ needs.visual.result }}
          REPORT_FILE: ${{ github.workspace }}/visual-report/report.json
          DIFF_ARTIFACT_DIR: ${{ github.workspace }}/visual-diffs
        run: |
          set -o pipefail
          node scripts/publish-visual-diffs.mjs

  functional:
    name: Functional (rialto-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build rialto (styles + dist export required by rialto-web)
        run: pnpm build --filter @mattbutlerengineering/rialto
      - name: Install Playwright browsers
        run: pnpm --dir apps/rialto-web exec playwright install --with-deps chromium
      - name: Run functional e2e tests
        # Explicit spec list — see the header comment above for why this is
        # never a glob.
        run: |
          pnpm exec playwright test --config apps/rialto-web/playwright.config.ts \
            apps/rialto-web/e2e/a11y-pages.spec.ts \
            apps/rialto-web/e2e/interaction.spec.ts \
            apps/rialto-web/e2e/navigation.spec.ts \
            apps/rialto-web/e2e/search.spec.ts \
            apps/rialto-web/e2e/theme.spec.ts \
            apps/rialto-web/e2e/demo-nav.spec.ts \
            apps/rialto-web/e2e/telemetry.spec.ts
      - name: Build rialto-web (the CSP suite runs against built output)
        # vite dev serves a module graph that never ships; a violation
        # introduced by bundling or minification would be invisible there.
        run: pnpm --dir apps/rialto-web build
      - name: Run CSP e2e tests (built output, real edge policy)
        # Explicit full path, never a glob (#3955) — and note the *second*
        # config: playwright.config.ts deliberately testIgnores this spec.
        run: pnpm exec playwright test --config apps/rialto-web/playwright.csp.config.ts apps/rialto-web/e2e/csp.spec.ts
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rialto-web-functional-diffs
          path: apps/rialto-web/e2e/test-results/
          retention-days: 14
