name: E2E Screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/hospitality/**"
  pull_request:
    paths:
      - "apps/hospitality/**"

jobs:
  screenshots:
    name: Capture E2E Screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --dir apps/hospitality exec playwright install --with-deps chromium
      - name: Build hospitality and dependencies
        run: pnpm build --filter @mbe/hospitality...
      - name: Verify E2E secrets
        env:
          E2E_AUTH0_DOMAIN: ${{ secrets.E2E_AUTH0_DOMAIN }}
          E2E_AUTH0_CLIENT_ID: ${{ secrets.E2E_AUTH0_CLIENT_ID }}
          E2E_AUTH0_AUDIENCE: ${{ secrets.E2E_AUTH0_AUDIENCE }}
          E2E_AUTH_EMAIL: ${{ secrets.E2E_AUTH_EMAIL }}
          E2E_AUTH_PASSWORD: ${{ secrets.E2E_AUTH_PASSWORD }}
        run: |
          missing=0
          for var in E2E_AUTH0_DOMAIN E2E_AUTH0_CLIENT_ID E2E_AUTH0_AUDIENCE E2E_AUTH_EMAIL E2E_AUTH_PASSWORD; do
            val=$(eval echo "\$$var")
            if [ -z "$val" ]; then
              echo "::error::$var is empty or not set"
              missing=1
            else
              echo "$var is set (${#val} chars)"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::error::One or more E2E secrets are missing. Check repo Settings > Secrets"
            exit 1
          fi
      - name: Run E2E tests
        env:
          VITE_AUTH_AUTHORITY: https://${{ secrets.E2E_AUTH0_DOMAIN }}
          VITE_AUTH_CLIENT_ID: ${{ secrets.E2E_AUTH0_CLIENT_ID }}
          VITE_AUTH_AUDIENCE: ${{ secrets.E2E_AUTH0_AUDIENCE }}
          VITE_AUTH_REDIRECT_URI: http://localhost:3002/hospitality/callback
          VITE_API_URL: http://localhost:3002
          E2E_AUTH0_DOMAIN: ${{ secrets.E2E_AUTH0_DOMAIN }}
          E2E_AUTH0_CLIENT_ID: ${{ secrets.E2E_AUTH0_CLIENT_ID }}
          E2E_AUTH0_AUDIENCE: ${{ secrets.E2E_AUTH0_AUDIENCE }}
          E2E_AUTH_EMAIL: ${{ secrets.E2E_AUTH_EMAIL }}
          E2E_AUTH_PASSWORD: ${{ secrets.E2E_AUTH_PASSWORD }}
        run: pnpm --dir apps/hospitality test:e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-screenshots
          path: apps/hospitality/e2e/screenshots/
          retention-days: 30
