name: ACMM Regression Detection

# Continuous ACMM maturity regression detection.
#
# Weekly, this refreshes the ACMM report and compares the repo's maturity
# level against the last recorded level in `.claude/acmm/state.json`. If the
# level dropped, it auto-opens an issue (labels `acmm` + `ready`) naming the
# regressed criteria — deduplicated so only one regression issue is open at a
# time. If the level is stable or improved, it bumps the state timestamp.
#
# The comparison/dedup logic lives in `scripts/acmm-regression-check.mjs`
# (unit-tested); this workflow just wires inputs and runs it.

on:
  schedule:
    # Saturday 15:00 UTC = 08:00 PT — fits the documented weekend schedule.
    - cron: "0 15 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Required for the `gh workflow run` dispatch step below — GITHUB_TOKEN
  # needs actions:write to call the workflow-dispatch API.
  actions: write

concurrency:
  group: acmm-regression
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the CLI
        # NOT optional. Two consumers below need @mbe/agent-core's build:
        # (1) the husky pre-commit hook the PR-open step below triggers runs
        # `mbe check-adr --staged`, which imports @mbe/agent-core -- without
        # this build that throws ERR_MODULE_NOT_FOUND and the commit fails
        # (same root cause the Release workflow hit in #3320); (2) the
        # regression script below lazily imports @mbe/gh-client to file an
        # issue when a regression is detected, which needs the same build.
        # The `...` suffix builds both as transitive deps.
        run: pnpm build --filter @mbe/cli...

      - name: Refresh ACMM report
        run: node scripts/generate-acmm-report.mjs

      - name: Detect regression / update state
        run: node scripts/acmm-regression-check.mjs

      - name: Open PR with updated ACMM state
        id: create-pr
        # `main` is protected and requires the CI Gate status check, which a
        # bare `git push` can never produce -- every direct push was rejected
        # (GH006). Route through a PR on an automation branch instead,
        # following the pattern already proven in drift-fix.yml.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # AUTOMATION_PAT (#3684): a commit pushed with the default
          # GITHUB_TOKEN is attributed to github-actions[bot], which forces
          # every pull_request-triggered check on the resulting PR (CI, Auto
          # Review, ADR check, ...) into `action_required` -- needing a human
          # to manually approve the run before CI Gate can post. Pushing as a
          # real PAT/bot-token identity avoids that gate entirely. Until
          # AUTOMATION_PAT is set as a repo secret, this silently falls back
          # to the broken GITHUB_TOKEN behavior -- see docs/SECRETS.md.
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore(acmm): refresh regression-check state timestamp"
          title: "chore(acmm): refresh regression-check state timestamp"
          body: |
            Automated weekly ACMM regression-check state refresh.

            Generated by `.github/workflows/acmm-regression.yml`.
          branch: automation/acmm-regression
          delete-branch: true
          add-paths: |
            .claude/acmm/state.json
          labels: auto-merge

      - name: Dispatch CI on the automation branch
        # GITHUB_TOKEN-authored pushes/PRs don't trigger other workflows
        # (GitHub's anti-recursion rule), so the pull_request CI run --
        # including the required CI Gate check -- never fires and the PR
        # sits BLOCKED forever. workflow_dispatch is a documented exception:
        # an explicit API call, not a passive event. Only dispatch when a PR
        # actually exists, so a no-regression week stays a silent no-op.
        if: steps.create-pr.outputs.pull-request-number
        run: gh workflow run ci.yml --ref automation/acmm-regression

      - name: Enable auto-merge
        # auto-merge.yml (the workflow that would normally do this) never
        # runs on this PR -- its own pull_request/check_suite triggers park
        # at action_required for the same reason ci.yml's do (#3684), so it
        # never reaches its own `gh pr merge --auto` call. Enable it here
        # instead, but through the same eligibility gate auto-merge.yml
        # consults (scripts/merge-queue-eligibility.mjs, --mode automation +
        # check-author) rather than calling `gh pr merge --auto`
        # unconditionally -- an ungated call would be a permanent bypass of
        # the tier gate hardened after #3787/#3871 (flagged in #3972 review).
        # That gate fails closed when no tier:* label is present, which is
        # true for every automation/* PR today: tier-classifier only
        # triggers on pull_request events, and this PR's commits are
        # GITHUB_TOKEN/AUTOMATION_PAT-authored -- the same anti-recursion gap
        # ci.yml has (#3684). So this step may not actually enable auto-merge
        # until tier-classifier runs reliably on automation PRs; that is the
        # gate's documented, safe-to-fail-closed behavior, not a bug here --
        # a human merges via automation-pr-rescue.yml's stale-PR visibility
        # in the meantime. This also does not guarantee the merge lands even
        # when eligible: if `main` moves ahead of this branch before the
        # dispatched CI run posts green, the scheduled
        # automation-pr-rescue.yml pass brings it back up to date and
        # re-dispatches CI (#3966).
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          LABELS_CSV=$(gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name] | join(",")')
          RESULT=$(node scripts/merge-queue-eligibility.mjs check --labels "$LABELS_CSV" --mode automation)
          echo "$RESULT"
          if [ "$(echo "$RESULT" | jq -r '.eligible')" != "true" ]; then
            echo "::notice::Auto-merge not enabled for PR #$PR_NUMBER: $(echo "$RESULT" | jq -r '.reason')"
            exit 0
          fi

          AUTHOR=$(gh pr view "$PR_NUMBER" --json author -q '.author.login')
          AUTHOR_RESULT=$(node scripts/merge-queue-eligibility.mjs check-author --login "$AUTHOR")
          echo "$AUTHOR_RESULT"
          if [ "$(echo "$AUTHOR_RESULT" | jq -r '.trusted')" != "true" ]; then
            echo "::notice::Auto-merge not enabled for PR #$PR_NUMBER: author '$AUTHOR' not in TRUSTED_AUTOMATION_AUTHORS"
            exit 0
          fi

          echo "Enabling auto-merge for PR #$PR_NUMBER (squash)"
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
