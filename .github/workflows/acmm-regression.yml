name: ACMM Regression Detection

# The single canonical daily ACMM scoring run (#5854).
#
# Runs the full audit (`plugins/acmm/scripts/audit.js --apply --badge`) once
# a day on a GitHub Actions runner, which has `gh` available -- unlike the
# `mbe-morning` cloud routine that used to be the only thing running this
# audit, whose read-only, no-`gh` environment left every `active` (liveness)
# criterion permanently `unverifiable`. This folds in what `auto-issue.yml`
# used to do (the `--apply` gap-filing pass) rather than duplicating its own
# automation-PR chain, since this workflow's chain (AUTOMATION_PAT, CI
# dispatch, tier-classifier dispatch, run approval, tier-label wait, gated
# auto-merge) was already tested and `scripts/__tests__` reference its branch
# name.
#
# Compares the level committed at `HEAD` *before* this run's audit
# overwrites `.claude/acmm/state.json` against the freshly computed level --
# never `currentLevel` against its own `history[-1]`, which come from the
# same computation and can never disagree. If the level dropped, it
# auto-opens an issue (labels `acmm` + `ready`) naming the regressed
# criteria -- deduplicated so only one regression issue is open at a time.
# An audit that could not measure this run (gh unavailable, an unverifiable
# gate) reports `unmeasurable`, never a regression.
#
# The comparison/dedup logic lives in `scripts/acmm-regression-check.mjs`
# (unit-tested); this workflow just wires inputs and runs it. Once the
# audit's write-on-change policy lands (#5852), a day with no detected
# change produces no diff and therefore no PR.

on:
  schedule:
    # 04:00 UTC daily -- the old auto-issue.yml slot, now folded in here.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Required for the `gh workflow run` dispatch step below — GITHUB_TOKEN
  # needs actions:write to call the workflow-dispatch API.
  actions: write

concurrency:
  group: acmm-regression
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          # Full history, not the default shallow clone. audit.js's
          # pr-outcomes.js runs `git log --since=... --grep='^Revert '`
          # locally to measure the revert rate -- a fetch-depth: 1 checkout
          # has exactly one commit in its local history, so that git log
          # can only ever return zero matches regardless of what actually
          # happened. It also affects short-SHA -> PR resolution for
          # auto-rollback reverts elsewhere in the same measurement.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the CLI
        # NOT optional. Two consumers below need @mbe/agent-core's build:
        # (1) the husky pre-commit hook the PR-open step below triggers runs
        # `mbe check-adr --staged`, which imports @mbe/agent-core -- without
        # this build that throws ERR_MODULE_NOT_FOUND and the commit fails
        # (same root cause the Release workflow hit in #3320); (2) the
        # regression script below lazily imports @mbe/gh-client to file an
        # issue when a regression is detected, which needs the same build.
        # The `...` suffix builds both as transitive deps.
        run: pnpm build --filter @mbe/cli...

      - name: Compute today's date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Snapshot committed ACMM level
        id: snapshot
        # Read BEFORE the audit below overwrites state.json, so this and the
        # freshly computed level are two independent readings -- comparing
        # `currentLevel` to its own `history[-1]` (the pre-#5854 approach)
        # could never disagree, since both come from the same computation.
        run: |
          set -o pipefail
          LEVEL=$(git show HEAD:.claude/acmm/state.json | jq -r '.currentLevel // empty')
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

      - name: Merge issuesCreated from a stale daily-audit branch
        # A prior day's automation/acmm-regression PR may still be open (its
        # ledger only reaches `main` when that PR merges). Without this,
        # audit.js --apply below reads a ledger missing that PR's entries and
        # can refile an issue it already filed. `git ls-remote` is a plain
        # remote query (no local fetch needed to check existence).
        run: |
          set -o pipefail
          if git ls-remote --exit-code --heads origin automation/acmm-regression > /dev/null 2>&1; then
            git fetch origin automation/acmm-regression
            git show FETCH_HEAD:.claude/acmm/state.json > /tmp/branch-acmm-state.json
            node scripts/acmm-merge-issues-created.mjs --branch-state-file /tmp/branch-acmm-state.json
            echo "Merged issuesCreated from the still-open automation/acmm-regression branch."
          else
            echo "No open automation/acmm-regression branch -- nothing to merge."
          fi

      - name: Run ACMM audit
        # Moves the issue-filing pass over from the retired auto-issue.yml.
        # --badge rewrites the README scorecard badge; --label ready tags
        # filed issues the same way auto-issue.yml did so implement-queue
        # keeps picking them up.
        run: node plugins/acmm/scripts/audit.js --apply --badge --label ready

      - name: Detect regression
        run: node scripts/acmm-regression-check.mjs --previous-level "${{ steps.snapshot.outputs.level }}"

      - name: Refresh ACMM report
        run: node scripts/generate-acmm-report.mjs

      - name: Open PR with updated ACMM state
        id: create-pr
        # `main` is protected and requires the CI Gate status check, which a
        # bare `git push` can never produce -- every direct push was rejected
        # (GH006). Route through a PR on an automation branch instead,
        # following the pattern already proven in drift-fix.yml.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # AUTOMATION_PAT (#3684): a commit pushed with the default
          # GITHUB_TOKEN is attributed to github-actions[bot], which forces
          # every pull_request-triggered check on the resulting PR (CI, Auto
          # Review, ADR check, ...) into `action_required` -- needing a human
          # to manually approve the run before CI Gate can post. Pushing as a
          # real PAT/bot-token identity avoids that gate entirely. Until
          # AUTOMATION_PAT is set as a repo secret, this silently falls back
          # to the broken GITHUB_TOKEN behavior -- see docs/SECRETS.md.
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore(acmm): daily audit ${{ steps.date.outputs.today }}"
          title: "chore(acmm): daily audit ${{ steps.date.outputs.today }}"
          body: |
            Automated daily ACMM audit.

            Generated by `.github/workflows/acmm-regression.yml`.
          branch: automation/acmm-regression
          delete-branch: true
          add-paths: |
            .claude/acmm/state.json
            README.md
            apps/marketing/public/acmm-report.json
          labels: auto-merge

      - name: Dispatch CI on the automation branch
        # GITHUB_TOKEN-authored pushes/PRs don't trigger other workflows
        # (GitHub's anti-recursion rule), so the pull_request CI run --
        # including the required CI Gate check -- never fires and the PR
        # sits BLOCKED forever. workflow_dispatch is a documented exception:
        # an explicit API call, not a passive event. Only dispatch when a PR
        # actually exists, so a no-change day stays a silent no-op.
        if: steps.create-pr.outputs.pull-request-number
        run: gh workflow run ci.yml --ref automation/acmm-regression

      - name: Dispatch tier-classifier on the automation branch
        # tier-classifier.yml only triggers on `pull_request`, and this PR's
        # commits are GITHUB_TOKEN/AUTOMATION_PAT-authored -- the same
        # anti-recursion gap ci.yml has (#3684) -- so it never reliably lands
        # a tier:* label on its own, and the Enable auto-merge step below
        # fails closed without one (#4070). tier-classifier.yml now accepts
        # the same workflow_dispatch escape hatch ci.yml already does.
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh workflow run tier-classifier.yml --ref automation/acmm-regression -f pr="$PR_NUMBER"

      - name: Approve pending automation workflow runs
        # #3684/#3982: the dispatch step above produces a workflow_dispatch
        # CI run, but that is a DIFFERENT run than the PR's own required
        # pull_request CI Gate check (gotcha #3969's gate-missing state) --
        # a green dispatch run does not make CI Gate appear on this PR.
        # Every pull_request-triggered run on this PR (CI, tier-classifier,
        # Auto Review, ADR check, ...) instead parks at action_required
        # because the commit is pushed via GITHUB_TOKEN/AUTOMATION_PAT, not
        # a full collaborator identity. Nothing else in the chain unblocks
        # them: tier-classifier never lands a tier:* label, so the Enable
        # auto-merge step below fails closed forever without this step.
        # Scoped to automation/* branches with the auto-merge label from the
        # one trusted automation author (scripts/approve-automation-runs.mjs)
        # -- never a blanket approval of arbitrary pending runs.
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: node scripts/approve-automation-runs.mjs approve --pr "$PR_NUMBER"

      - name: Wait for tier-classifier label
        # workflow_dispatch above is fire-and-forget -- the call returns once
        # GitHub accepts it, not once the dispatched run (and its tier:*
        # label write) finishes. Without waiting, Enable auto-merge below
        # would read labels before the label lands and fail closed every
        # time, defeating the dispatch (#4070).
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: node scripts/wait-for-tier-label.mjs --pr "$PR_NUMBER"

      - name: Enable auto-merge
        # auto-merge.yml (the workflow that would normally do this) never
        # runs on this PR -- its own pull_request/check_suite triggers park
        # at action_required for the same reason ci.yml's do (#3684), so it
        # never reaches its own `gh pr merge --auto` call. Enable it here
        # instead, but through the same combined eligibility gate
        # auto-merge.yml consults (scripts/merge-queue-eligibility.mjs
        # check-merge, which routes through isAutomationMergeAllowed -- tier
        # gate + trusted-author check in a single call, #5016) rather than
        # calling `gh pr merge --auto` unconditionally -- an ungated call
        # would be a permanent bypass of the tier gate hardened after
        # #3787/#3871 (flagged in #3972 review). That gate fails closed when
        # no tier:* label is present. The "Wait for tier-classifier label"
        # step above already dispatched tier-classifier.yml and waited for
        # it to land the label (#4070), so that no longer stalls this step
        # on automation/* PRs. It can still legitimately skip -- e.g. the
        # author check fails, or the label lands as a blocking tier
        # (tier:standard/sensitive/critical) -- that is the gate's
        # documented, safe-to-fail-closed behavior, not a bug here -- a
        # human merges via automation-pr-rescue.yml's stale-PR visibility in
        # the meantime. This also does not guarantee the merge lands even
        # when eligible: if `main` moves ahead of this branch before the
        # dispatched CI run posts green, the scheduled
        # automation-pr-rescue.yml pass brings it back up to date and
        # re-dispatches CI (#3966).
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          LABELS_CSV=$(gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name] | join(",")')
          AUTHOR=$(gh pr view "$PR_NUMBER" --json author -q '.author.login')
          RESULT=$(node scripts/merge-queue-eligibility.mjs check-merge --labels "$LABELS_CSV" --login "$AUTHOR")
          echo "$RESULT"
          if [ "$(echo "$RESULT" | jq -r '.eligible')" != "true" ]; then
            echo "::notice::Auto-merge not enabled for PR #$PR_NUMBER: $(echo "$RESULT" | jq -r '.reason')"
            exit 0
          fi

          echo "Enabling auto-merge for PR #$PR_NUMBER (squash)"
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
