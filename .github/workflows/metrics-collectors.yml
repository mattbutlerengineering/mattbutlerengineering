name: Metrics Collectors

# Runs the review-burden metrics collector, which had no home (#5528,
# tracking #5532).
#
# `scripts/acmm/review-burden-metrics.js` shells out to the `gh` CLI, which
# does not exist in a Claude Code Remote cloud session at all
# (.claude/rules/gotchas.md § Claude Code Remote) — the only place it used to
# be invoked from. So it could never run its only data source, and the
# failure was invisible: review-burden.json sat at one entry from
# 2026-06-14.
#
# GitHub Actions runners have `gh` preinstalled. Structure follows the proven
# `production-feedback.yml`: collect, open a PR with the results (a bare
# `git push` to protected `main` is rejected with GH006), dispatch CI on the
# automation branch, then route auto-merge through the same eligibility gate
# every other automation PR uses.
#
# See docs/fixes/silent-metrics-collectors/design.md for the original
# root-cause write-up (from when this workflow also ran a booking-funnel
# domain-metrics collector). That collector was retired in #5561: it needed
# a production venue id and auth token nobody would provision, so it never
# produced a row and never could without a human-supplied credential.

on:
  schedule:
    # Daily at 11:29 UTC. Off-minute and off-hour to avoid the runner
    # congestion of the on-the-hour scheduled fleet.
    - cron: "29 11 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Required by the `gh workflow run` dispatch steps below — GITHUB_TOKEN
  # needs actions:write to call the workflow-dispatch API.
  actions: write

jobs:
  collect:
    name: Collect review-burden metrics
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      # Workspace install + gh-client build: the queueEfficiency and
      # ai-issue-feedback collectors below import @mbe/gh-client, whose `node`
      # export points at ./dist (scripts/check-workflow-deps.mjs).
      - uses: ./.github/actions/setup-workspace

      - name: Build gh-client
        run: pnpm build --filter @mbe/gh-client...

      - name: Collect review-burden metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          node scripts/acmm/review-burden-metrics.js --days 7 | tee -a "$GITHUB_STEP_SUMMARY"

      # #6466: these two collectors used to run only inside Claude Code cloud
      # routines, whose session token api.github.com refuses
      # (`credential_rejected`) and which cannot use GraphQL — so their files
      # went stale. This job has a working GITHUB_TOKEN. `continue-on-error`
      # because a failed collector must not skip the PR flow below; the
      # freshness self-check right after reports it as a deduped issue.
      - name: Collect queueEfficiency sensor row
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/record-queue-efficiency.mjs

      # Weekly SDLC-speed sensor (#6654): PR open->merge by author class and
      # ci.yml wall time, appended to process-metrics.jsonl for mbe-weekly-retro.
      # The workflow is daily; gate to Mondays (UTC) or a manual dispatch so the
      # series stays one row a week. Needs `gh` + API access, which only this
      # runner has (not a Claude Code Remote session). Staleness is watched by
      # the `sdlcSpeed` entry in scripts/metrics-freshness.mjs. The row also
      # stores `proposals` (regression issues to file), so the retro has them
      # where the script cannot run. `mainStrict` is null here by design: reading
      # branch protection needs Administration:read, which GITHUB_TOKEN cannot
      # hold, so the row says `mainStrictSource: "unavailable"` — the retro must
      # re-measure with an admin token (scripts/main-strictness.mjs).
      - name: Collect SDLC speed sensor row
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "Not Monday and not a manual dispatch; skipping the weekly sdlcSpeed row."
            exit 0
          fi
          node scripts/collect-sdlc-speed.mjs --days 7 --record | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Collect AI issue feedback
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect-ai-issue-feedback.mjs

      # The self-check (#5529). Runs against the working tree right after
      # collection, so its verdict describes THIS run's output rather than
      # whatever was last merged.
      #
      # It deliberately does not fail the job. The job is working correctly
      # when the data is dead — the data is what is dead — and a red
      # scheduled workflow would be read (by humans and by
      # scheduled-workflow-health.yml alike) as "the workflow is broken".
      # The verdict instead becomes a deduped issue, which is a durable
      # signal that survives the run's log retention.
      - name: Metrics freshness self-check
        id: freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail

          # Explicit capture, never a swallowed exit code: the verdict IS
          # the exit code, and it has to survive to the branch below. The
          # if/else shape is load-bearing — a bare `cmd; verdict=$?` would
          # abort the step under `bash -e` before the read could happen, and
          # scripts/__tests__/workflow-set-e-assignment.test.mjs fails any
          # workflow that reads `$?` after a non-exempt command.
          if node scripts/metrics-freshness.mjs --json > /tmp/freshness.json; then
            verdict=0
          else
            verdict=$?
          fi

          jq -r '.lines[]' /tmp/freshness.json > /tmp/freshness.txt

          {
            echo "### Metrics freshness"
            echo
            echo '```'
            cat /tmp/freshness.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$verdict" -eq 0 ]; then
            echo "All watched metrics are fresh."
            exit 0
          fi

          # Only one class of finding remains since domain-metrics — the one
          # metric that could be human-blocked on an unset credential — was
          # retired (#5561). `metrics-freshness.mjs`'s `unconfigured`/`blocked`
          # classification is still generic infrastructure for any future
          # metric with a real credential prerequisite; it just has nothing to
          # classify that way right now, so `.blocked` is always empty here.
          FAILURE_COUNT=$(jq '.failures | length' /tmp/freshness.json)
          echo "failures=$FAILURE_COUNT"

          # ── Actionable: a collector that should be producing, is not ──
          if [ "$FAILURE_COUNT" -gt 0 ]; then
            {
              echo "## A metrics collector is producing nothing"
              echo
              echo "\`.github/workflows/metrics-collectors.yml\` ran, and the freshness"
              echo "self-check (\`node scripts/metrics-freshness.mjs\`) reports these as"
              echo "genuinely broken — each one's prerequisites are satisfied, so an empty"
              echo "or stale result is a defect, not a missing credential:"
              echo
              echo '```'
              jq -r '.failures[] | "  \(.label // .metric): \(.state); written by \(.producer)"' /tmp/freshness.json
              echo '```'
              echo
              echo "### Most likely causes"
              echo
              echo "1. **\`review-burden\` stale** — the collector or its \`gh pr list\` call failed."
              echo "2. **\`queueEfficiency\` stale/unhealthy** — only \`available: false\` rows are landing;"
              echo "   read the \`reason\`/\`error\` on the latest \`metrics/process-metrics.jsonl\` row."
              echo "   \`credential_rejected\` means the session token is refused by api.github.com."
              echo "   Same for \`sdlcSpeed\` (weekly, Mondays): no healthy row for 14 days."
              echo "3. **\`ai-issue-feedback\` unhealthy** — \`metrics/ai-issue-feedback.json\` holds only"
              echo "   an \`error\` object; the collector's GitHub query is failing."
              echo "4. **\`undated\`/\`unreadable\`** — the file exists but its timestamp field"
              echo "   moved, or the payload no longer parses."
              echo
              echo "Thresholds and states live in \`scripts/metrics-freshness.mjs\`"
              echo "(\`FRESHNESS_POLICY\`). Background: \`docs/fixes/silent-metrics-collectors/design.md\`."
              echo
              echo "---"
              echo "*Auto-created by the metrics-collectors workflow*"
            } > /tmp/freshness-issue.md

            # Deliberately NOT labeled `ready`: diagnosing a dead collector
            # needs judgement about production access, not a queue pickup.
            node scripts/lib/file-issue-cli.mjs \
              --title "Metrics collection is stale or empty" \
              --label "ci-fix" \
              --body-file /tmp/freshness-issue.md \
              --dedupe-key "metrics-collection-stale" \
              --search-label "ci-fix" \
              --contains "Metrics collection is stale"
          fi

      # The agent-spend paired-growth check (#4618). Same reporting contract as
      # the freshness self-check above — a verdict becomes a deduped issue,
      # never a red workflow. `uninstrumented` (no writer in CI) passes by
      # design since #3585 chose local-only recording via `--adapter
      # claude-cli` (#5627), so only `stalled`/`undeterminable` file here.
      - name: Agent-spend telemetry self-check
        id: spend-telemetry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail

          # Same if/else capture as the freshness step: the verdict IS the exit
          # code and has to survive to the branch below, and a bare
          # `cmd; verdict=$?` would abort the step under `bash -e` before the
          # read (scripts/__tests__/workflow-set-e-assignment.test.mjs).
          if node scripts/agent-spend-telemetry.mjs --json > /tmp/spend-telemetry.json; then
            verdict=0
          else
            verdict=$?
          fi

          jq -r '.line' /tmp/spend-telemetry.json > /tmp/spend-telemetry.txt

          {
            echo "### Agent-spend telemetry"
            echo
            echo '```'
            cat /tmp/spend-telemetry.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$verdict" -eq 0 ]; then
            echo "Spend telemetry tracks queue telemetry."
            exit 0
          fi

          {
            echo "## Agent spend telemetry stopped recording"
            echo
            echo "\`.claude/agent-spend/sessions.jsonl\` and \`metrics/queue-telemetry.jsonl\`"
            echo "describe the same agent work from opposite ends, so they should gain rows"
            echo "together. \`node scripts/agent-spend-telemetry.mjs\` reports:"
            echo
            echo '```'
            cat /tmp/spend-telemetry.txt
            echo '```'
            echo
            echo "### Reading the verdict"
            echo
            echo "- **\`stalled\`** — a writer could have run and recorded nothing. This IS a"
            echo "  regression in the spend path. Start at \`recordSpend\`'s two call sites"
            echo "  (\`packages/agent-core/src/session-runner.ts\`,"
            echo "  \`packages/agent-core/src/adapters/run-cli-adapter-session.ts\`) and at"
            echo "  the \`catch {}\` each one wraps the call in."
            echo "- **\`undeterminable\`** — a file is missing, unreadable, holds a non-array"
            echo "  payload, or holds rows nothing can date. The check fails closed here by"
            echo "  design; an absence it cannot explain is never reported as health."
            echo
            echo "States live in \`scripts/agent-spend-telemetry.mjs\` (\`PASSING_STATES\`,"
            echo "\`classifySpendTelemetry\`). Background: #4618."
            echo
            echo "---"
            echo "*Auto-created by the metrics-collectors workflow*"
          } > /tmp/spend-telemetry-issue.md

          # Deliberately NOT labeled `ready`: diagnosing why a reachable
          # writer recorded nothing needs judgement about the agent runtime,
          # not a queue pickup.
          node scripts/lib/file-issue-cli.mjs \
            --title "Agent spend telemetry stopped recording" \
            --label "ci-fix" \
            --body-file /tmp/spend-telemetry-issue.md \
            --dedupe-key "agent-spend-telemetry-broken" \
            --search-label "ci-fix" \
            --contains "Agent spend telemetry stopped"

      # Scheduled backstop for metrics/queue-telemetry.jsonl (#5921): in-session
      # rows are only persisted when a session follows SKILL.md Phase 4, so days
      # with no session leave gaps. Derives pending rows for merged agent PRs
      # the file does not already cover; reconcile fills outcomes later.
      - name: Collect queue telemetry from merged agent PRs
        # A gh 5xx / rate limit here must not skip the review-burden PR flow.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          node scripts/collect-queue-telemetry-from-github.mjs --days 7 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Open PR with collected metrics
        id: create-pr
        # `main` is protected and requires the CI Gate status check, which a
        # bare `git push` can never produce — every direct push is rejected
        # (GH006). Route through a PR on an automation branch instead,
        # following production-feedback.yml / drift-fix.yml.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        env:
          # The action commits inside the runner, firing the husky
          # pre-commit hook; check-adr needs @mbe/agent-core built, which
          # this job deliberately does not do for a metrics-data commit.
          HUSKY: "0"
        with:
          # See docs/SECRETS.md — without AUTOMATION_PAT this falls back to
          # GITHUB_TOKEN, whose pushes park every pull_request check at
          # action_required (#3684).
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore: record review-burden metrics"
          title: "chore: record review-burden metrics"
          body: |
            Automated metrics collection.

            Generated by `.github/workflows/metrics-collectors.yml` (#5528).
          branch: automation/metrics-collectors
          delete-branch: true
          add-paths: |
            metrics/review-burden.json
            metrics/queue-telemetry.jsonl
            metrics/process-metrics.jsonl
            metrics/ai-issue-feedback.json
          labels: auto-merge

      - name: Dispatch CI on the automation branch
        # GITHUB_TOKEN-authored pushes/PRs don't trigger other workflows
        # (GitHub's anti-recursion rule), so the pull_request CI run —
        # including the required CI Gate check — never fires and the PR
        # sits BLOCKED forever. workflow_dispatch is the documented
        # exception: an explicit API call, not a passive event.
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref automation/metrics-collectors

      - name: Dispatch tier-classifier on the automation branch
        # tier-classifier.yml only triggers on `pull_request` and shares the
        # same anti-recursion gap, so it never lands a tier:* label on its
        # own — and the eligibility gate below fails closed without one
        # (#4070).
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh workflow run tier-classifier.yml --ref automation/metrics-collectors -f pr="$PR_NUMBER"

      - name: Approve pending automation workflow runs
        # #3684/#3982: every pull_request-triggered run on this PR parks at
        # action_required because the commit is pushed via
        # GITHUB_TOKEN/AUTOMATION_PAT. Scoped to automation/* branches with
        # the auto-merge label from the one trusted automation author
        # (scripts/approve-automation-runs.mjs) — never a blanket approval.
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: node scripts/approve-automation-runs.mjs approve --pr "$PR_NUMBER"

      - name: Wait for tier-classifier label
        # workflow_dispatch above is fire-and-forget — the call returns once
        # GitHub accepts it, not once the dispatched run's label write
        # finishes. Without waiting, the gate below reads labels too early
        # and fails closed every time (#4070).
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: node scripts/wait-for-tier-label.mjs --pr "$PR_NUMBER"

      - name: Enable auto-merge
        # auto-merge.yml never runs on this PR (its own triggers park at
        # action_required for the same reason ci.yml's do), so enable it
        # here — but through the identical eligibility gate
        # (scripts/merge-queue-eligibility.mjs check-merge) rather than a
        # bare `gh pr merge --auto`, which would be a permanent bypass of
        # the tier gate. A skip here is the gate failing closed, which is
        # its documented safe direction, not a bug.
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          set -o pipefail
          LABELS_CSV=$(gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name] | join(",")')
          AUTHOR=$(gh pr view "$PR_NUMBER" --json author -q '.author.login')
          RESULT=$(node scripts/merge-queue-eligibility.mjs check-merge --labels "$LABELS_CSV" --login "$AUTHOR")
          echo "$RESULT"
          if [ "$(echo "$RESULT" | jq -r '.eligible')" != "true" ]; then
            echo "::notice::Auto-merge not enabled for PR #$PR_NUMBER: $(echo "$RESULT" | jq -r '.reason')"
            exit 0
          fi

          echo "Enabling auto-merge for PR #$PR_NUMBER (squash)"
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
