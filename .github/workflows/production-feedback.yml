name: Production Feedback

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Required for the `gh workflow run` dispatch step below — GITHUB_TOKEN
  # needs actions:write to call the workflow-dispatch API.
  actions: write

jobs:
  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check production endpoints
        id: health
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DATE_KEY=$(date -u +%Y-%m-%d)
          DEGRADED=""
          RESULTS="[]"

          # Probing/classification lives in scripts/check-endpoint.mjs (#3854)
          # -- see its header comment for the two curl bugs it replaces (code
          # doubling on connection failure, stale shared response file).
          check_endpoint() {
            local NAME="$1"
            local URL="$2"
            local RESULT HTTP_CODE LATENCY ENDPOINT_STATUS

            RESULT=$(node scripts/check-endpoint.mjs "$NAME" "$URL")
            HTTP_CODE=$(echo "$RESULT" | jq -r '.httpCode')
            LATENCY=$(echo "$RESULT" | jq -r '.latencyMs')
            ENDPOINT_STATUS=$(echo "$RESULT" | jq -r '.status')

            case "$ENDPOINT_STATUS" in
              unreachable) DEGRADED="${DEGRADED}${NAME} (unreachable), " ;;
              error) DEGRADED="${DEGRADED}${NAME} (HTTP ${HTTP_CODE}), " ;;
              degraded) DEGRADED="${DEGRADED}${NAME} (degraded), " ;;
            esac

            RESULTS=$(echo "$RESULTS" | jq -c \
              --arg name "$NAME" \
              --arg url "$URL" \
              --argjson code "$HTTP_CODE" \
              --argjson latency "$LATENCY" \
              --arg ep_status "$ENDPOINT_STATUS" \
              '. + [{name: $name, url: $url, http_code: $code, latency_ms: $latency, status: $ep_status}]')

            echo "${NAME}: HTTP ${HTTP_CODE}, ${LATENCY}ms, ${ENDPOINT_STATUS}"
          }

          check_endpoint "users-health" "https://api.mattbutlerengineering.com/api/v1/users/health"
          check_endpoint "marketing-site" "https://mattbutlerengineering.com"
          check_endpoint "hospitality-site" "https://mattbutlerengineering.com/hospitality/"
          check_endpoint "rialto-storybook" "https://mattbutlerengineering.github.io/mattbutlerengineering/"

          echo "results<<RESULTS_EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULTS" | jq '.' >> "$GITHUB_OUTPUT"
          echo "RESULTS_EOF" >> "$GITHUB_OUTPUT"

          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "date_key=$DATE_KEY" >> "$GITHUB_OUTPUT"

          DEGRADED=$(echo "$DEGRADED" | sed 's/, $//')
          echo "degraded=$DEGRADED" >> "$GITHUB_OUTPUT"

          # Write step summary
          {
            echo "### Production Health Check: ${TIMESTAMP}"
            echo
            echo "| Endpoint | HTTP | Latency | Status |"
            echo "|----------|------|---------|--------|"
            echo "$RESULTS" | jq -r '.[] | "| \(.name) | \(.http_code) | \(.latency_ms)ms | \(.status) |"'
            echo
            if [ -n "$DEGRADED" ]; then
              echo "**Degraded:** ${DEGRADED}"
            else
              echo "All endpoints healthy."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append metrics to log
        env:
          TIMESTAMP: ${{ steps.health.outputs.timestamp }}
          DATE_KEY: ${{ steps.health.outputs.date_key }}
          RESULTS: ${{ steps.health.outputs.results }}
        run: |
          METRICS_DIR="metrics/production-health"
          mkdir -p "$METRICS_DIR"
          METRICS_FILE="${METRICS_DIR}/${DATE_KEY}.jsonl"

          ENTRY=$(jq -nc \
            --arg ts "$TIMESTAMP" \
            --argjson endpoints "$RESULTS" \
            '{timestamp: $ts, endpoints: $endpoints}')

          echo "$ENTRY" >> "$METRICS_FILE"

      - name: Open PR with production health metrics
        id: create-pr
        # `main` is protected and requires the CI Gate status check, which a
        # bare `git push` can never produce -- every direct push was rejected
        # (GH006) and silently swallowed by `|| echo`. Route through a PR on
        # an automation branch instead, following the pattern already proven
        # in drift-fix.yml / pr-metrics.yml.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        env:
          # The action commits inside the runner, firing the husky
          # pre-commit hook; check-adr needs @mbe/agent-core built, which
          # this job doesn't do for a plain metrics-data commit. Bot commits
          # of metrics data are validated by CI on the PR instead.
          HUSKY: "0"
        with:
          # AUTOMATION_PAT (#3684): a commit pushed with the default
          # GITHUB_TOKEN is attributed to github-actions[bot], which forces
          # every pull_request-triggered check on the resulting PR (CI, Auto
          # Review, ADR check, ...) into `action_required` -- needing a human
          # to manually approve the run before CI Gate can post. Pushing as a
          # real PAT/bot-token identity avoids that gate entirely. Until
          # AUTOMATION_PAT is set as a repo secret, this silently falls back
          # to the broken GITHUB_TOKEN behavior -- see docs/SECRETS.md.
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore: record production health metrics (${{ steps.health.outputs.timestamp }})"
          title: "chore: record production health metrics"
          body: |
            Automated production health snapshot.

            Generated by `.github/workflows/production-feedback.yml`.
          branch: automation/production-feedback
          delete-branch: true
          add-paths: |
            metrics/production-health/*.jsonl
          labels: auto-merge

      - name: Dispatch CI on the automation branch
        # GITHUB_TOKEN-authored pushes/PRs don't trigger other workflows
        # (GitHub's anti-recursion rule), so the pull_request CI run --
        # including the required CI Gate check -- never fires and the PR
        # sits BLOCKED forever. workflow_dispatch is a documented exception:
        # an explicit API call, not a passive event.
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref automation/production-feedback

      - name: Enable auto-merge
        # auto-merge.yml (the workflow that would normally do this) never
        # runs on this PR -- its own pull_request/check_suite triggers park
        # at action_required for the same reason ci.yml's do (#3684), so it
        # never reaches its own `gh pr merge --auto` call. Enable it here
        # instead, but through the same eligibility gate auto-merge.yml
        # consults (scripts/merge-queue-eligibility.mjs, --mode automation +
        # check-author) rather than calling `gh pr merge --auto`
        # unconditionally -- an ungated call would be a permanent bypass of
        # the tier gate hardened after #3787/#3871 (flagged in #3972 review).
        # That gate fails closed when no tier:* label is present, which is
        # true for every automation/* PR today: tier-classifier only
        # triggers on pull_request events, and this PR's commits are
        # GITHUB_TOKEN/AUTOMATION_PAT-authored -- the same anti-recursion gap
        # ci.yml has (#3684). So this step may not actually enable auto-merge
        # until tier-classifier runs reliably on automation PRs; that is the
        # gate's documented, safe-to-fail-closed behavior, not a bug here --
        # a human merges via automation-pr-rescue.yml's stale-PR visibility
        # in the meantime. This also does not guarantee the merge lands even
        # when eligible: if `main` moves ahead of this branch before the
        # dispatched CI run posts green, the scheduled
        # automation-pr-rescue.yml pass brings it back up to date and
        # re-dispatches CI (#3966).
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          LABELS_CSV=$(gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name] | join(",")')
          RESULT=$(node scripts/merge-queue-eligibility.mjs check --labels "$LABELS_CSV" --mode automation)
          echo "$RESULT"
          if [ "$(echo "$RESULT" | jq -r '.eligible')" != "true" ]; then
            echo "::notice::Auto-merge not enabled for PR #$PR_NUMBER: $(echo "$RESULT" | jq -r '.reason')"
            exit 0
          fi

          AUTHOR=$(gh pr view "$PR_NUMBER" --json author -q '.author.login')
          AUTHOR_RESULT=$(node scripts/merge-queue-eligibility.mjs check-author --login "$AUTHOR")
          echo "$AUTHOR_RESULT"
          if [ "$(echo "$AUTHOR_RESULT" | jq -r '.trusted')" != "true" ]; then
            echo "::notice::Auto-merge not enabled for PR #$PR_NUMBER: author '$AUTHOR' not in TRUSTED_AUTOMATION_AUTHORS"
            exit 0
          fi

          echo "Enabling auto-merge for PR #$PR_NUMBER (squash)"
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch

      - name: Create issue on degraded health
        if: steps.health.outputs.degraded != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEGRADED: ${{ steps.health.outputs.degraded }}
          TIMESTAMP: ${{ steps.health.outputs.timestamp }}
          RESULTS: ${{ steps.health.outputs.results }}
        run: |
          {
            echo "## Production Health Degraded"
            echo
            echo "**Detected:** ${TIMESTAMP}"
            echo "**Affected:** ${DEGRADED}"
            echo
            echo "### Endpoint Details"
            echo
            echo "| Endpoint | HTTP | Latency | Status |"
            echo "|----------|------|---------|--------|"
            echo "$RESULTS" | jq -r '.[] | "| \(.name) | \(.http_code) | \(.latency_ms)ms | \(.status) |"'
            echo
            echo "### Investigation Steps"
            echo
            echo "1. Check \`curl -s https://api.mattbutlerengineering.com/api/v1/users/health | jq .\`"
            echo "2. Review recent deploys: \`gh run list --workflow deploy-services.yml --limit 5\`"
            echo "3. Check service logs in DigitalOcean dashboard"
            echo "4. Verify DNS resolution and Cloudflare status"
            echo
            echo "---"
            echo "*Auto-created by production-feedback workflow*"
          } > /tmp/health-body.md

          node scripts/lib/file-issue-cli.mjs \
            --title "Production health degraded: ${DEGRADED}" \
            --label "production-health" \
            --label "ci-fix" \
            --label "ready" \
            --body-file /tmp/health-body.md \
            --dedupe-key "production-health-degraded" \
            --search-label "production-health"
