name: Resource Audit

on:
  schedule:
    # Every Saturday at 4:00 AM UTC
    - cron: "0 4 * * 6"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Orphaned Resource Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Build gh-client
        # scripts/resource-audit.mjs imports @mbe/gh-client, whose
        # package.json "exports" resolves to dist/index.js under Node — a
        # bare `node scripts/...` run without this step throws
        # ERR_MODULE_NOT_FOUND (see .claude/rules/gotchas.md § Build).
        run: pnpm build --filter @mbe/gh-client

      - name: Run resource audit
        env:
          # MBE_CLOUDFLARE_API_TOKEN is the canonical CF token secret name
          # every other workflow uses (see docs/SECRETS.md) — this workflow
          # previously referenced a bare CLOUDFLARE_API_TOKEN secret that
          # was never provisioned, failing every scheduled run deterministically.
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/resource-audit.mjs
