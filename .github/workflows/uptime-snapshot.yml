name: Uptime Snapshot

on:
  schedule:
    - cron: "17 0 * * *" # Daily at 00:17 UTC (off-minute to avoid fleet congestion)
  workflow_dispatch: # Manual trigger

permissions: {}

jobs:
  snapshot:
    name: Record Health Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch system health
        id: health
        env:
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
        run: |
          CURL_ARGS=(-sf --max-time 30)
          # Per-service uptime needs the detailed response (Bearer HEALTH_TOKEN);
          # without the secret we record the coarse subsystem-status snapshot.
          if [ -n "${HEALTH_TOKEN:-}" ]; then
            CURL_ARGS+=(-H "Authorization: Bearer ${HEALTH_TOKEN}")
          else
            echo "::warning::HEALTH_TOKEN secret not configured — recording coarse snapshot"
          fi
          RESPONSE=$(curl "${CURL_ARGS[@]}" \
            "https://mattbutlerengineering.com/health/system" || echo '{"status":"error"}')
          echo "response=$RESPONSE" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Write snapshot to KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          KV_NS_ID: ${{ secrets.HEALTH_KV_NAMESPACE_ID }}
          SNAPSHOT_DATE: ${{ steps.health.outputs.date }}
          HEALTH_DATA: ${{ steps.health.outputs.response }}
        run: |
          set -o pipefail
          # kv_write <METHOD> <URL> [curl args...]: a spent free-tier write quota
          # answers HTTP 429 (error 10048, #9234) and must not turn the run red.
          # Prints only the status and Cloudflare errors[], never the token.
          kv_write() {
            local method="$1" url="$2" resp code
            shift 2
            resp="$(mktemp)"
            code="$(curl -s -o "$resp" -w '%{http_code}' -X "$method" "$url" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" "$@")" || code="000"
            echo "Cloudflare KV write: HTTP ${code}"
            case "$code" in
              2??) rm -f "$resp" ;;
              429)
                jq -r '.errors[]? | "  error \(.code): \(.message)"' "$resp" 2>/dev/null || true
                rm -f "$resp"
                echo "::warning::Cloudflare KV write rate/quota limited (HTTP 429); not recorded"
                ;;
              *)
                jq -r '.errors[]? | "  error \(.code): \(.message)"' "$resp" 2>/dev/null || true
                rm -f "$resp"
                return 1
                ;;
            esac
          }

          PAYLOAD=$(jq -nc --arg data "$HEALTH_DATA" --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{snapshot: ($data | fromjson), timestamp: $ts}')

          kv_write PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NS_ID}/values/uptime%2F${SNAPSHOT_DATE}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

          echo "Snapshot step done for ${SNAPSHOT_DATE}"

      - name: Cleanup old snapshots (>90 days)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          KV_NS_ID: ${{ secrets.HEALTH_KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail
          # kv_write <METHOD> <URL> [curl args...]: HTTP 429 (spent KV quota,
          # error 10048, #9234) warns and returns 0; other non-2xx fail.
          kv_write() {
            local method="$1" url="$2" resp code
            shift 2
            resp="$(mktemp)"
            code="$(curl -s -o "$resp" -w '%{http_code}' -X "$method" "$url" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" "$@")" || code="000"
            case "$code" in
              2??) rm -f "$resp" ;;
              429)
                jq -r '.errors[]? | "  error \(.code): \(.message)"' "$resp" 2>/dev/null || true
                rm -f "$resp"
                echo "::warning::Cloudflare KV delete rate/quota limited (HTTP 429); snapshot kept"
                ;;
              *)
                echo "Cloudflare KV ${method}: HTTP ${code}"
                jq -r '.errors[]? | "  error \(.code): \(.message)"' "$resp" 2>/dev/null || true
                rm -f "$resp"
                return 1
                ;;
            esac
          }

          CUTOFF=$(date -u -d "90 days ago" +%Y-%m-%d 2>/dev/null || date -u -v-90d +%Y-%m-%d)

          # pipefail: a failed list request must fail the step, not read as "no keys".
          KEYS=$(curl -sf \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NS_ID}/keys?prefix=uptime%2F&limit=1000" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" | jq -r '.result[].name')

          if [ -z "$KEYS" ]; then
            echo "No snapshots found under uptime/; nothing to clean up"
            exit 0
          fi

          DELETED=0
          for KEY in $KEYS; do
            DATE_PART="${KEY#uptime/}"
            if [[ "$DATE_PART" < "$CUTOFF" ]]; then
              kv_write DELETE \
                "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NS_ID}/values/${KEY}"
              DELETED=$((DELETED + 1))
            fi
          done

          echo "Cleaned up $DELETED snapshots older than $CUTOFF"
