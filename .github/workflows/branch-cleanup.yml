name: Branch Cleanup

# Consolidates what used to be two overlapping workflows (#3624):
# `branch-cleanup.yml` scanned *local* branches (a no-op after checkout) and
# was permanently stuck in dry-run (`github.inputs` isn't a valid Actions
# context). `worktree-cleanup.yml` scanned remote branches correctly but its
# pattern never matched `worktree-agent-*` — the prefix Claude Code worktree
# agents actually create, and the single largest source of disposable
# branches in this repo. One workflow now owns this; decision logic lives in
# scripts/branch-cleanup.mjs (unit-tested), this file is a thin caller.

on:
  schedule:
    - cron: "0 2 * * 0" # Sunday 2am UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run mode (log but don't delete)"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write
  # `gh pr list` (both the open-PR guard and the squash-merge-safe merged
  # check in scripts/branch-cleanup.mjs) needs read access to PRs.
  pull-requests: read

jobs:
  cleanup-branches:
    name: Cleanup merged branches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Build CLI and its dependencies
        run: pnpm build --filter @mbe/cli...

      - name: Delete branches merged into main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scheduled runs always dry-run; workflow_dispatch honors the input
          # (default "true" if the operator leaves it unset).
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.dry_run }}
        run: node scripts/branch-cleanup.mjs
