name: Rialto Visual Regression

on:
  push:
    branches: [main]
    paths:
      - "packages/rialto/src/**"
      - "packages/rialto/.storybook/**"
      - "packages/rialto/playwright.visual.config.ts"
      - "packages/rialto/src/test/visual/**"
      - "packages/rialto/package.json"
      - "pnpm-lock.yaml"
      # Main-derived baselines (fetched on PRs, published on main) and the PR diff comment.
      - "scripts/visual-baselines.mjs"
      - "scripts/publish-visual-diffs.mjs"
      - "scripts/visual-diff-*.mjs"
      - ".github/workflows/rialto-visual.yml"
  pull_request:
    paths:
      - "packages/rialto/src/**"
      - "packages/rialto/.storybook/**"
      - "packages/rialto/playwright.visual.config.ts"
      - "packages/rialto/src/test/visual/**"
      - "packages/rialto/package.json"
      - "pnpm-lock.yaml"
      # Main-derived baselines (fetched on PRs, published on main) and the PR diff comment.
      - "scripts/visual-baselines.mjs"
      - "scripts/publish-visual-diffs.mjs"
      - "scripts/visual-diff-*.mjs"
      - ".github/workflows/rialto-visual.yml"

# A new push to a pull request supersedes its older run (#8723: runners are
# capped at 20 concurrent jobs). Push runs fall back to the unique run id, so
# a run on main is never cancelled and never queues behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    name: Visual Regression (Storybook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --dir packages/rialto exec playwright install --with-deps chromium
      - name: Fetch the main-derived baseline
        # PRs compare against the screenshots main itself produced at the
        # nearest ancestor (scripts/visual-baselines.mjs), not the tracked
        # PNGs. With no published baseline in range, the tracked PNGs stay.
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          git fetch -q --no-tags --depth=50 origin main:refs/remotes/origin/main
          node scripts/visual-baselines.mjs fetch --suite rialto --dir packages/rialto/src/test/visual/__screenshots__
      - name: Run visual regression tests
        # `github` first so the inline annotations stay; `json` feeds the
        # publisher. The report lands outside __screenshots__/, which holds the
        # baselines. On a push to main the run captures instead of comparing:
        # merging the PR was the approval.
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/visual-report/report.json
          UPDATE_FLAG: ${{ github.event_name == 'push' && '--update-snapshots=all' || '' }}
        run: pnpm --dir packages/rialto test:visual --reporter=github,json $UPDATE_FLAG
      - name: Upload the captured baseline
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rialto-visual-baseline
          path: packages/rialto/src/test/visual/__screenshots__/*.png
          retention-days: 3
          if-no-files-found: error
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression-diffs
          path: packages/rialto/src/test/visual/__screenshots__/
          retention-days: 14
      - name: Upload diff images for the PR comment
        # The publisher maps report paths from the `test-results` directory, so
        # that directory is the artifact root.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rialto-visual-diffs
          path: packages/rialto/src/test/visual/__screenshots__/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload the JSON report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rialto-visual-report
          path: visual-report/report.json
          retention-days: 14
          if-no-files-found: ignore

  publish-visual-baseline:
    name: Publish Visual Baseline (rialto)
    needs: [visual]
    # Main pushes only, and only a capture that finished. Writes one new ref,
    # visual-baselines/rialto/<sha>; never overwrites, never --force.
    if: github.event_name == 'push' && needs.visual.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Download the captured baseline
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rialto-visual-baseline
          path: ${{ runner.temp }}/baseline
      - name: Publish the baseline ref
        run: node scripts/visual-baselines.mjs publish --suite rialto --dir "$RUNNER_TEMP/baseline" --sha "$GITHUB_SHA"

  publish-visual-diffs:
    name: Publish Visual Diffs (rialto)
    needs: [visual]
    # always() so a passing run can retract a stale failure comment; a skipped
    # suite has nothing to say.
    if: always() && github.event_name == 'pull_request' && needs.visual.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Decline on pull requests from forks
        id: fork-check
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          if [ "$HEAD_REPO" = "$THIS_REPO" ]; then
            echo "declined=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A fork's GITHUB_TOKEN is read-only, so the push would 403.
          echo "declined=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Visual diff publisher (rialto)"
            echo
            echo "- Declined: this pull request's head is \`$HEAD_REPO\`, not \`$THIS_REPO\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Download the JSON report
        if: steps.fork-check.outputs.declined == 'false'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rialto-visual-report
          path: visual-report
      - name: Download the diff images
        if: steps.fork-check.outputs.declined == 'false'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rialto-visual-diffs
          path: visual-diffs
      - name: Publish the diffs and upsert the comment
        if: steps.fork-check.outputs.declined == 'false'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VISUAL_OUTCOME: ${{ needs.visual.result }}
          REPORT_FILE: ${{ github.workspace }}/visual-report/report.json
          DIFF_ARTIFACT_DIR: ${{ github.workspace }}/visual-diffs
          VISUAL_SUITE: rialto
        run: |
          set -o pipefail
          node scripts/publish-visual-diffs.mjs
