name: Rialto Visual Regression

on:
  push:
    branches: [main]
    paths:
      - "packages/rialto/src/**"
      - "packages/rialto/.storybook/**"
      - "packages/rialto/playwright.visual.config.ts"
      - "packages/rialto/src/test/visual/**"
  pull_request:
    paths:
      - "packages/rialto/src/**"
      - "packages/rialto/.storybook/**"
      - "packages/rialto/playwright.visual.config.ts"
      - "packages/rialto/src/test/visual/**"

permissions:
  contents: read

jobs:
  visual:
    name: Visual Regression (Storybook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --dir packages/rialto exec playwright install --with-deps chromium
      - name: Run visual regression tests
        run: pnpm --dir packages/rialto test:visual
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-diffs
          path: packages/rialto/src/test/visual/__screenshots__/
          retention-days: 14
