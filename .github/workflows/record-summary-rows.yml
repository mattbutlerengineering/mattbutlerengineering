name: Record Summary Rows

# Commits one summary row per weekly Lighthouse / mutation-testing run to
# metrics/lighthouse.jsonl and metrics/mutation-score.jsonl (#7581), and one
# per-surface coverage row per weekly audit sweep to metrics/audit-coverage.jsonl
# (#8419).
#
# The `lighthouse` and `mutationScore` sensors used to read gitignored files
# (.audit-state/inventory.json, reports/mutation/mutation.json) that exist only
# on the runner that produced them, so every scheduled sensor run reported them
# unavailable. The sensors now read the committed rows; this workflow writes
# them. Structure follows metrics-collectors.yml: PR on an automation branch,
# CI dispatched explicitly (GITHUB_TOKEN pushes never trigger it), auto-merge
# routed through the shared eligibility gate.
#
# A run that measured nothing writes no row (scripts/record-summary-row.mjs
# exits 1), so scripts/metrics-freshness.mjs goes red rather than a hollow row
# passing for a measurement.

on:
  workflow_run:
    workflows: ["Lighthouse Score Tracking", "Mutation Testing", "Weekly Audit Sweep"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  # contents: push the summary row to the metrics-data branch.
  contents: write

jobs:
  record:
    name: Record summary row
    # Only scheduled/dispatched runs on the default branch carry a meaningful
    # measurement; a cancelled run produced no report.
    if: github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      # Artifacts come from other (schedule/dispatch) runs and are consumed in
      # this privileged workflow_run job: download them OUTSIDE the checkout
      # (runner.temp, never the workspace) and pass the path explicitly, so a
      # poisoned artifact cannot overwrite repo files. Parsers are strict
      # (regex-validated rows only; CodeQL artifact-poisoning, #8419).
      - name: Download Lighthouse reports
        if: github.event.workflow_run.name == 'Lighthouse Score Tracking'
        id: lh-download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lighthouse-lhr-*
          path: ${{ runner.temp }}/lhr
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download mutation report
        if: github.event.workflow_run.name == 'Mutation Testing'
        id: mut-download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-report
          path: ${{ runner.temp }}/mutation-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download audit sweep results
        if: github.event.workflow_run.name == 'Weekly Audit Sweep'
        id: sweep-download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audit-sweep-results
          path: ${{ runner.temp }}/audit-sweep-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup workspace
        if: github.event.workflow_run.name == 'Weekly Audit Sweep'
        # record-summary-row.mjs imports @mbe/agent-core (the surface registry)
        # for the audit-coverage row; its dist must be built.
        uses: ./.github/actions/setup-workspace

      - name: Build agent-core
        if: github.event.workflow_run.name == 'Weekly Audit Sweep'
        run: pnpm build --filter=@mbe/agent-core

      - name: Check out metrics-data
        # Telemetry lives on the orphan metrics-data branch, not main
        # (scripts/metrics-data.mjs). metrics-store reads and writes it in .metrics-data/.
        run: node scripts/metrics-data.mjs pull

      - name: Append summary row
        env:
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -o pipefail
          if [ "$RUN_NAME" = "Lighthouse Score Tracking" ]; then
            node scripts/record-summary-row.mjs lighthouse "$RUNNER_TEMP/lhr" --commit "$RUN_SHA"
          elif [ "$RUN_NAME" = "Weekly Audit Sweep" ]; then
            node scripts/record-summary-row.mjs audit-coverage "$RUNNER_TEMP/audit-sweep-results/results.tsv" --commit "$RUN_SHA"
          else
            node scripts/record-summary-row.mjs mutation "$RUNNER_TEMP/mutation-report/mutation.json" --commit "$RUN_SHA"
          fi

      - name: Push metrics to metrics-data
        # A direct push: no PR, no CI run (no workflow triggers on this
        # branch), and a rejected push rebases and retries instead of
        # resetting a fixed branch and dropping the earlier row.
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: 'node scripts/metrics-data.mjs push -m "chore(metrics): summary row"'
