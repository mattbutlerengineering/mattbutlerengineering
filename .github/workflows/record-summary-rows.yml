name: Record Summary Rows

# Commits one summary row per weekly Lighthouse / mutation-testing run to
# metrics/lighthouse.jsonl and metrics/mutation-score.jsonl (#7581).
#
# The `lighthouse` and `mutationScore` sensors used to read gitignored files
# (.audit-state/inventory.json, reports/mutation/mutation.json) that exist only
# on the runner that produced them, so every scheduled sensor run reported them
# unavailable. The sensors now read the committed rows; this workflow writes
# them. Structure follows metrics-collectors.yml: PR on an automation branch,
# CI dispatched explicitly (GITHUB_TOKEN pushes never trigger it), auto-merge
# routed through the shared eligibility gate.
#
# A run that measured nothing writes no row (scripts/record-summary-row.mjs
# exits 1), so scripts/metrics-freshness.mjs goes red rather than a hollow row
# passing for a measurement.

on:
  workflow_run:
    workflows: ["Lighthouse Score Tracking", "Mutation Testing"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  record:
    name: Record summary row
    # Only scheduled/dispatched runs on the default branch carry a meaningful
    # measurement; a cancelled run produced no report.
    if: github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - name: Download Lighthouse reports
        if: github.event.workflow_run.name == 'Lighthouse Score Tracking'
        id: lh-download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lighthouse-lhr-*
          path: lhr
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download mutation report
        if: github.event.workflow_run.name == 'Mutation Testing'
        id: mut-download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-report
          path: mutation-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Append summary row
        env:
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -o pipefail
          if [ "$RUN_NAME" = "Lighthouse Score Tracking" ]; then
            node scripts/record-summary-row.mjs lighthouse lhr --commit "$RUN_SHA"
          else
            node scripts/record-summary-row.mjs mutation mutation-report/mutation.json --commit "$RUN_SHA"
          fi

      - name: Open PR with the summary row
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        env:
          HUSKY: "0"
        with:
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore: record lighthouse and mutation summary rows"
          title: "chore: record lighthouse and mutation summary rows"
          body: |
            Automated summary row for the `lighthouse` / `mutationScore` sensors.

            Generated by `.github/workflows/record-summary-rows.yml` (#7581).
          branch: automation/summary-rows
          delete-branch: true
          add-paths: |
            metrics/lighthouse.jsonl
            metrics/mutation-score.jsonl
          labels: auto-merge

      - name: Dispatch CI on the automation branch
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref automation/summary-rows

      - name: Dispatch tier-classifier on the automation branch
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh workflow run tier-classifier.yml --ref automation/summary-rows -f pr="$PR_NUMBER"

      - name: Approve pending automation workflow runs
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: node scripts/approve-automation-runs.mjs approve --pr "$PR_NUMBER"

      - name: Wait for tier-classifier label
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: node scripts/wait-for-tier-label.mjs --pr "$PR_NUMBER"

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          set -o pipefail
          LABELS_CSV=$(gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name] | join(",")')
          AUTHOR=$(gh pr view "$PR_NUMBER" --json author -q '.author.login')
          RESULT=$(node scripts/merge-queue-eligibility.mjs check-merge --labels "$LABELS_CSV" --login "$AUTHOR")
          echo "$RESULT"
          if [ "$(echo "$RESULT" | jq -r '.eligible')" != "true" ]; then
            echo "::notice::Auto-merge not enabled for PR #$PR_NUMBER: $(echo "$RESULT" | jq -r '.reason')"
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
