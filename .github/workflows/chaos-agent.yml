name: Chaos Agent

on:
  schedule:
    - cron: "0 10 * * 1" # Every Monday at 10:00 AM UTC
  workflow_dispatch:
    inputs:
      type:
        description: "Type of bug to inject"
        required: false
        default: "random"
        type: choice
        options:
          - random
          - console-error
          - lighthouse-perf
          - accessibility
          - scout-todo

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  seed-bug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Build gh-client and agent-core
        # scripts/chaos-agent.mjs imports both @mbe/gh-client and
        # @mbe/agent-core (BUG_CATALOG/injectBug). Both packages' exports
        # resolve to dist/index.js under Node — a bare `node scripts/...`
        # run without this step throws ERR_MODULE_NOT_FOUND (see
        # .claude/rules/gotchas.md § Build). The `...` suffix on agent-core
        # also builds its own workspace deps (@mbe/api-client, @mbe/types).
        run: pnpm build --filter @mbe/gh-client --filter @mbe/agent-core...

      - name: Seed Bug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TYPE="${{ github.event.inputs.type || 'random' }}"
          if [ "$TYPE" = "random" ]; then
            node scripts/chaos-agent.mjs --random --push
          else
            node scripts/chaos-agent.mjs --type "$TYPE" --push
          fi
