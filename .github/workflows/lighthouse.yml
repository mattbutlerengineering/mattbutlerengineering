name: Lighthouse Score Tracking

on:
  schedule:
    - cron: "43 6 * * 1" # Weekly Monday 6:43 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        # `base` is the app's Vite `base` path — rialto-web builds with
        # base "/rialto/", so its index.html references assets under /rialto/.
        # LHCI serves the dist at server root, so the dist must be staged under
        # that base subpath or the page 404s its assets and never paints (NO_FCP).
        app:
          - { name: "marketing", pkg: "@mbe/marketing", dir: "marketing", base: "" }
          - { name: "hospitality", pkg: "@mbe/hospitality", dir: "hospitality", base: "" }
          - { name: "rialto", pkg: "@mbe/rialto-web", dir: "rialto-web", base: "rialto" }

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # Use the root turbo `build` (not pnpm's recursive runner) so workspace
        # dependencies build first via turbo's `^build`. rialto-web's `tsc -b`
        # needs @mattbutlerengineering/rialto's dist/*.d.ts, which only exist
        # after rialto is built — `pnpm --filter <app> build` skips that and
        # fails with TS2307. Matches deploy-static.yml.
        run: pnpm build --filter=${{ matrix.app.pkg }}

      - name: Stage dist under app base path
        # LHCI's static server serves the dist at server root. Apps built with a
        # non-root Vite base (rialto-web → /rialto/) reference their assets under
        # that path, so we nest the dist under it; the audited URL then matches
        # the deployed URL and assets resolve (no NO_FCP). Root-base apps
        # (base "") copy straight to lh-dist.
        run: |
          mkdir -p lh-dist/${{ matrix.app.base }}
          cp -r apps/${{ matrix.app.dir }}/dist/. lh-dist/${{ matrix.app.base }}/

      - name: Run Lighthouse
        id: lh
        uses: treosh/lighthouse-ci-action@v12
        with:
          # `staticDistDir` is NOT a valid input for this action (it silently
          # produced "No URLs provided to collect" on every run). Feed the dir
          # through a track-only config via env instead. The action bundles its
          # own isolated deps, avoiding the monorepo's express/path-to-regexp
          # clash that breaks a raw `lhci collect` in this workspace.
          configPath: ./lighthouserc.ci.cjs
          temporaryPublicStorage: true
        env:
          LH_STATIC_DIST_DIR: ./lh-dist

      - name: Extract and store scores
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          KV_NS_ID: ${{ secrets.HEALTH_KV_NAMESPACE_ID }}
          APP_NAME: ${{ matrix.app.name }}
          LH_MANIFEST: ${{ steps.lh.outputs.manifest }}
        run: |
          DATE=$(date -u +%Y-%m-%d)

          PERF=$(echo "$LH_MANIFEST" | jq -r '.[0].summary.performance // 0' | awk '{printf "%.0f", $1 * 100}')
          A11Y=$(echo "$LH_MANIFEST" | jq -r '.[0].summary.accessibility // 0' | awk '{printf "%.0f", $1 * 100}')
          BP=$(echo "$LH_MANIFEST" | jq -r '.[0].summary."best-practices" // 0' | awk '{printf "%.0f", $1 * 100}')
          SEO=$(echo "$LH_MANIFEST" | jq -r '.[0].summary.seo // 0' | awk '{printf "%.0f", $1 * 100}')

          PAYLOAD=$(jq -nc             --arg app "$APP_NAME"             --arg date "$DATE"             --argjson perf "${PERF:-0}"             --argjson a11y "${A11Y:-0}"             --argjson bp "${BP:-0}"             --argjson seo "${SEO:-0}"             '{app: $app, date: $date, performance: $perf, accessibility: $a11y, bestPractices: $bp, seo: $seo}')

          curl -sf -X PUT             "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NS_ID}/values/lighthouse%2F${DATE}-${APP_NAME}"             -H "Authorization: Bearer ${CF_API_TOKEN}"             -H "Content-Type: application/json"             -d "$PAYLOAD"

          echo "Stored: $APP_NAME perf=$PERF a11y=$A11Y bp=$BP seo=$SEO"
