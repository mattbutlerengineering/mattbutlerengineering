name: Routine Liveness

on:
  schedule:
    # Daily at 08:10 UTC — just after Scheduled Workflow Health (08:00), so
    # both fleet-health checks land in the same morning batch. RemoteTriggers
    # have no GitHub Actions presence at all, so scheduled-workflow-health.yml
    # structurally cannot see them (#5552) — this is the sibling check for
    # claude.ai's mbe-* routine chain.
    - cron: "10 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  # scripts/routine-liveness.mjs resolves every `pr-title` signature with
  # `gh pr list --search`, which is a read of pull requests. Without this
  # scope GitHub does not refuse the query — it filters the unreadable
  # results out and answers 200 with an empty list, so all six pr-title
  # routines observe zero artifacts and classify as `dark` (#5603, #5606,
  # #5607, #5609, #5610, #5611). Same mechanism as #5556.
  pull-requests: read

jobs:
  check-routine-liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Build gh-client
        # scripts/routine-liveness.mjs imports @mbe/gh-client, whose
        # package.json "exports" resolves to dist/index.js under Node — a
        # bare `node scripts/...` run without this step throws
        # ERR_MODULE_NOT_FOUND (see .claude/rules/gotchas.md § Build).
        run: pnpm build --filter @mbe/gh-client

      - name: Check routine liveness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/routine-liveness.mjs
