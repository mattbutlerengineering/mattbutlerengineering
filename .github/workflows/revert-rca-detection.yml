name: Revert RCA Detection

on:
  schedule:
    # Run hourly at :07 to avoid conflicts
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  detect:
    name: Detect and Log Reverts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 100

      - name: Detect recent reverts
        id: reverts
        run: |
          # Find revert commits in last 24h
          REVERTS=$(git log --oneline --since="24 hours ago" --grep="^Revert" | wc -l | tr -d ' ')
          echo "count=$REVERTS" >> "$GITHUB_OUTPUT"

          if [ "$REVERTS" -gt 0 ]; then
            echo "revert_list<<REVERT_LIST_EOF" >> "$GITHUB_OUTPUT"
            git log --oneline --since="24 hours ago" --grep="^Revert" >> "$GITHUB_OUTPUT"
            echo "REVERT_LIST_EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse revert PRs
        id: parse
        env:
          REVERTS: ${{ steps.reverts.outputs.revert_list }}
        run: |
          mkdir -p .claude/state

          echo "$REVERTS" | while read -r commit_line; do
            if [ -z "$commit_line" ]; then
              continue
            fi

            # Extract SHA
            SHA=$(echo "$commit_line" | awk '{print $1}')

            # Get full commit message
            MESSAGE=$(git show -s --format=%B "$SHA" || echo "")

            # Try to extract PR number
            PR_NUM=$(echo "$MESSAGE" | grep -oP 'Revert.*#\K[0-9]+' | head -1)

            if [ -n "$PR_NUM" ]; then
              echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"revert_sha\":\"$SHA\",\"pr_number\":$PR_NUM}" >> .claude/state/revert-rca-triggers.jsonl
            fi
          done

      - name: Check for new AI-authored reverts
        if: steps.reverts.outputs.count > 0
        id: ai_reverts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FOUND_AI_REVERTS=false
          mkdir -p .claude/state

          # Read recent revert triggers
          if [ -f .claude/state/revert-rca-triggers.jsonl ]; then
            # Get unique PR numbers from today's triggers
            PRNUMS=$(tail -10 .claude/state/revert-rca-triggers.jsonl 2>/dev/null | grep -oP '"pr_number":\K[0-9]+' | sort -u)

            for PR_NUM in $PRNUMS; do
              # Check if PR body contains AI marker
              PR_BODY=$(gh pr view "$PR_NUM" --json body --jq '.body' 2>/dev/null || echo "")

              if echo "$PR_BODY" | grep -q "Generated by @mbe/agent-core"; then
                echo "Found AI-authored revert: PR #$PR_NUM"
                FOUND_AI_REVERTS=true

                # Check for existing RCA issue
                EXISTING=$(gh issue list \
                  --search "RCA for #$PR_NUM" \
                  --state open \
                  --label "revert-rca" \
                  --json number \
                  --jq "length" 2>/dev/null || echo "0")

                if [ "$EXISTING" -eq 0 ]; then
                  # Create RCA issue
                  TITLE="RCA: PR #$PR_NUM was reverted"
                  BODY="## Revert Details

| Field | Value |
|-------|-------|
| Reverted PR | #$PR_NUM |
| Detected At | $(date -u +%Y-%m-%dT%H:%M:%SZ) |
| Original Author | @mbe/agent-core |

## Original PR Summary

\`\`\`
$(echo "$PR_BODY" | head -200)
\`\`\`

## RCA Checklist

- [ ] Review the revert commit and reason
- [ ] Identify root cause category (logic error, incomplete testing, edge case, unsafe pattern)
- [ ] Check if this is a recurring pattern
- [ ] File follow-up task if needed
- [ ] Update templates or documentation if systemic issue

## Root Cause Categories

- **Logic Error** — Agent misunderstood requirements or made incorrect implementation choice
- **Incomplete Testing** — Test coverage missed an edge case or integration scenario
- **Missing Validation** — Input validation or constraint enforcement was insufficient
- **Unsafe Pattern** — Code violates security or reliability guidelines
- **Environment-Specific** — Issue only manifests in production
- **Transient** — Issue was environmental and revert was unnecessary

---

*Auto-created by revert-rca-detection workflow*"

                  gh issue create \
                    --title "$TITLE" \
                    --label "revert-rca,acmm" \
                    --body "$BODY" || echo "Failed to create RCA issue for #$PR_NUM"
                fi
              fi
            done
          fi

          echo "found_ai_reverts=$FOUND_AI_REVERTS" >> "$GITHUB_OUTPUT"

      - name: Update revert log
        if: steps.reverts.outputs.count > 0
        run: |
          mkdir -p .claude/improvement-loop
          {
            echo "## $(date -u +%Y-%m-%d)"
            echo
            echo "Reverts detected: ${{ steps.reverts.outputs.count }}"
            echo
            echo "${{ steps.reverts.outputs.revert_list }}"
            echo
          } >> .claude/improvement-loop/revert-log.md

      - name: Check revert rate
        if: steps.ai_reverts.outputs.found_ai_reverts == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Count reverts in last 7 days
          REVERT_COUNT=$(git log --since="7 days ago" --grep="^Revert" --oneline | wc -l | tr -d ' ')

          if [ "$REVERT_COUNT" -gt 3 ]; then
            # Create escalation issue
            gh issue create \
              --title "[Meta] Elevated revert rate: $REVERT_COUNT/week" \
              --label "meta-improvement,acmm" \
              --body "## Alert

Detected high revert rate: **${REVERT_COUNT} reverts in the last 7 days** (threshold: 3).

This suggests the autonomous system may be unstable. Investigate patterns from recent RCA issues and consider:

- Improving test coverage and edge case detection
- Tightening validation rules and pre-flight checks
- Reducing agent complexity or ambition level
- Adding circuit breaker if revert rate continues climbing

## Recent Reverts

See recent RCA issues with label \`revert-rca\` for details.

---

*Auto-created by revert-rca-detection workflow*" \
              --state open || echo "Could not create escalation issue (may already exist)"
          fi

      - name: Commit state updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f .claude/state/revert-rca-triggers.jsonl ] || [ -f .claude/improvement-loop/revert-log.md ]; then
            git add .claude/state/ .claude/improvement-loop/ 2>/dev/null || true
            git commit -m "chore: update revert RCA state from detection workflow" --no-verify || true
            git push origin main || true
          fi
