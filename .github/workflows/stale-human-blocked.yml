name: Stale Human-Blocked Issue Detector

# Detects open issues that have been untouched for STALE_THRESHOLD_DAYS+
# (14 by default), independent of which — if any — human-blocker label they
# carry (#4043). The weekly retro's backlog-aging pass finds human-blocked
# work with a fixed label query and misses exactly the issues a filer in a
# hurry mislabeled or under-labeled (#3322: 30 days stale, carried only
# `ci-fix`, invisible to three consecutive retros). This is additive — the
# label-based query in docs/process-retro.md § Pass 2 is unchanged.
#
# Surfacing mechanism: applies `ready-for-human` directly to each qualifying
# issue rather than a digest issue — see scripts/stale-human-blocked.mjs and
# the PR description for the rationale.

on:
  schedule:
    # Weekly, Sunday 15:23 UTC (off-minute to avoid fleet congestion) — ahead
    # of mbe-weekly-retro (Sun 23:00 UTC), so a qualifying issue is already
    # labeled `ready-for-human` by the time the retro's own label query runs.
    - cron: "23 15 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report stale issues without changing labels"
        required: false
        default: "false"
        type: boolean

permissions:
  issues: write
  # The metrics row this run measures has to leave the runner, or it dies with
  # the ephemeral checkout — the whole point of #4274. Persisted through an
  # automation PR (contents/pull-requests), with actions:write for the CI
  # dispatch the GITHUB_TOKEN anti-recursion rule makes necessary (#3684).
  contents: write
  pull-requests: write
  actions: write

jobs:
  detect-stale:
    name: Detect Stale Human-Blocked Issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build gh-client
        # scripts/stale-human-blocked.mjs imports @mbe/gh-client, whose
        # package.json "exports" resolves to dist/index.js under Node — a
        # bare `node scripts/...` run without this step throws
        # ERR_MODULE_NOT_FOUND (see .claude/rules/gotchas.md § Build).
        run: pnpm build --filter @mbe/gh-client

      - name: Find and label stale human-blocked issues
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/stale-human-blocked.mjs --dry-run
          else
            node scripts/stale-human-blocked.mjs
          fi

      - name: Open PR with the measured staleness
        id: create-pr
        # `main` is protected and requires the CI Gate status check, which a
        # bare `git push` can never produce. Route through a PR on an
        # automation branch instead — the pattern proven in pr-metrics.yml /
        # production-feedback.yml. Skipped on a dry run, which writes nothing.
        if: env.DRY_RUN != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        env:
          # The action commits inside the runner, firing the husky pre-commit
          # hook; check-adr needs @mbe/agent-core built, which this job does
          # not do for a plain metrics-data commit. Validated by CI on the PR.
          HUSKY: "0"
        with:
          # AUTOMATION_PAT (#3684): a GITHUB_TOKEN-authored commit is
          # attributed to github-actions[bot], which parks every
          # pull_request-triggered check on the resulting PR at
          # `action_required` — see docs/SECRETS.md.
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore(metrics): record stale human-blocked issues"
          title: "chore(metrics): record stale human-blocked issues"
          body: |
            Staleness measured by `.github/workflows/stale-human-blocked.yml`
            before it applied any `ready-for-human` label.

            Each row carries `last_human_touch_at`, which — unlike `updatedAt`
            — this workflow's own label writes cannot move (#4274).
          branch: automation/stale-human-blocked-metrics
          delete-branch: true
          add-paths: |
            metrics/stale-human-blocked.jsonl
          labels: auto-merge

      - name: Dispatch CI on the automation branch
        # GITHUB_TOKEN-authored pushes/PRs don't trigger other workflows
        # (anti-recursion), so the pull_request CI run — including the
        # required CI Gate check — never fires and the PR sits BLOCKED.
        # workflow_dispatch is the documented exception.
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref automation/stale-human-blocked-metrics

      - name: Dispatch tier-classifier on the automation branch
        # tier-classifier.yml only triggers on `pull_request` and hits the
        # same anti-recursion gap, so it never lands a tier:* label on its
        # own — and the Enable auto-merge step below fails closed without one
        # (#4070).
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh workflow run tier-classifier.yml --ref automation/stale-human-blocked-metrics -f pr="$PR_NUMBER"

      - name: Approve pending automation workflow runs
        # #3684/#3982: every pull_request-triggered run on this PR parks at
        # action_required because the commit is bot-authored. Scoped to
        # automation/* + auto-merge from the one trusted automation author
        # (scripts/approve-automation-runs.mjs) — never a blanket approval.
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: node scripts/approve-automation-runs.mjs approve --pr "$PR_NUMBER"

      - name: Wait for tier-classifier label
        # The dispatch above is fire-and-forget; without waiting, the gate
        # below reads labels before the tier:* label lands and fails closed
        # every time (#4070).
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: node scripts/wait-for-tier-label.mjs --pr "$PR_NUMBER"

      - name: Enable auto-merge
        # Through the same eligibility gate auto-merge.yml consults, not a
        # bare `gh pr merge --auto` — an ungated call would be a permanent
        # bypass of the tier gate (#3972). Failing closed here is the
        # documented safe direction; automation-pr-rescue.yml keeps a
        # not-merged PR visible and up to date (#3966).
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          LABELS_CSV=$(gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name] | join(",")')
          RESULT=$(node scripts/merge-queue-eligibility.mjs check --labels "$LABELS_CSV" --mode automation)
          echo "$RESULT"
          if [ "$(echo "$RESULT" | jq -r '.eligible')" != "true" ]; then
            echo "::notice::Auto-merge not enabled for PR #$PR_NUMBER: $(echo "$RESULT" | jq -r '.reason')"
            exit 0
          fi

          AUTHOR=$(gh pr view "$PR_NUMBER" --json author -q '.author.login')
          AUTHOR_RESULT=$(node scripts/merge-queue-eligibility.mjs check-author --login "$AUTHOR")
          echo "$AUTHOR_RESULT"
          if [ "$(echo "$AUTHOR_RESULT" | jq -r '.trusted')" != "true" ]; then
            echo "::notice::Auto-merge not enabled for PR #$PR_NUMBER: author '$AUTHOR' not in TRUSTED_AUTOMATION_AUTHORS"
            exit 0
          fi

          echo "Enabling auto-merge for PR #$PR_NUMBER (squash)"
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
