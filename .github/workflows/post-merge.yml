name: Post-Merge Reconciliation

on:
  push:
    branches: [main]

concurrency:
  group: post-merge-reconciliation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate Generated Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build --filter @mbe/cli...

      - name: Regenerate all committed artifacts
        # Same entry point as CI and drift-fix: the manifest owns the family
        # list, so this job cannot miss the root llms.txt or any new family.
        run: pnpm regen

      - name: Commit and push if changed
        run: |
          mapfile -t paths < <(node scripts/regen-manifest.mjs --paths)
          git diff --quiet -- "${paths[@]}" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "chore: regenerate generated files [skip ci]"
          git push
