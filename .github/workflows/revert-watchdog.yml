name: Revert Watchdog

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4/v5
        with:
          fetch-depth: 0

      - name: Identify culprit commit
        id: culprit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=${{ github.event.workflow_run.head_sha }}
          echo "culprit_sha=$SHA" >> "$GITHUB_OUTPUT"

          AUTHOR=$(git log -1 --format='%ae' $SHA)
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

          PR_NUMBER=$(gh pr list --search "$SHA" --state merged --json number -q '.[0].number')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check for baseline failure
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.culprit.outputs.culprit_sha }}
        run: |
          PARENT_SHA=$(git rev-parse "${SHA}^")
          echo "parent_sha=$PARENT_SHA" >> "$GITHUB_OUTPUT"

          PARENT_CONCLUSION=$(gh run list --commit "$PARENT_SHA" --workflow "CI" --json conclusion -q '.[0].conclusion' 2>/dev/null || echo "unknown")
          echo "parent_conclusion=$PARENT_CONCLUSION" >> "$GITHUB_OUTPUT"

          if [ "$PARENT_CONCLUSION" = "failure" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Parent commit $PARENT_SHA also failed CI — pre-existing baseline failure, skipping issue/revert."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Parent CI was '$PARENT_CONCLUSION' — this commit may have introduced the failure."
          fi

      - name: Open Broken Main Issue
        if: ${{ steps.baseline.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.culprit.outputs.culprit_sha }}
          PR: ${{ steps.culprit.outputs.pr_number }}
        run: |
          TITLE="🚨 CRITICAL: Broken Main at commit $SHA"
          BODY="The main branch CI is currently FAILING.

          **Culprit:** commit $SHA
          **PR:** #$PR
          **Action Required:** Investigating or revert immediately."

          gh issue create --title "$TITLE" --body "$BODY" --label "priority:critical"

      - name: Propose Revert PR
        if: ${{ steps.culprit.outputs.pr_number != '' && steps.baseline.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.culprit.outputs.culprit_sha }}
          PR: ${{ steps.culprit.outputs.pr_number }}
        run: |
          BRANCH="revert-broken-main-$SHA"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git revert --no-edit HEAD
          git push origin "$BRANCH"

          gh pr create \
            --title "revert: #$PR (fixes broken main)" \
            --body "Automatically proposed revert of #$PR due to CI failure on main." \
            --label "priority:critical" \
            --base main \
            --head "$BRANCH"

      - name: Trigger RCA
        if: ${{ steps.culprit.outputs.pr_number != '' && steps.baseline.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.culprit.outputs.pr_number }}
          SHA: ${{ steps.culprit.outputs.culprit_sha }}
        run: |
          node scripts/revert-rca.mjs --pr "$PR" --revert-sha "$SHA"
