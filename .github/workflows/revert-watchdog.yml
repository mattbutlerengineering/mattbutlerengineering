name: Revert Watchdog

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4/v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Build CLI and its dependencies
        run: pnpm build --filter @mbe/cli...

      - name: Identify culprit commit
        id: culprit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=${{ github.event.workflow_run.head_sha }}
          echo "culprit_sha=$SHA" >> "$GITHUB_OUTPUT"

          AUTHOR=$(git log -1 --format='%ae' $SHA)
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

          PR_NUMBER=$(gh pr list --search "$SHA" --state merged --json number -q '.[0].number')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check for baseline failure
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.culprit.outputs.culprit_sha }}
        run: |
          PARENT_SHA=$(git rev-parse "${SHA}^")
          echo "parent_sha=$PARENT_SHA" >> "$GITHUB_OUTPUT"

          PARENT_CONCLUSION=$(gh run list --commit "$PARENT_SHA" --workflow "CI" --json conclusion -q '.[0].conclusion' 2>/dev/null || echo "unknown")
          echo "parent_conclusion=$PARENT_CONCLUSION" >> "$GITHUB_OUTPUT"

          if [ "$PARENT_CONCLUSION" = "failure" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Parent commit $PARENT_SHA also failed CI — pre-existing baseline failure, skipping issue/revert."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Parent CI was '$PARENT_CONCLUSION' — this commit may have introduced the failure."
          fi

      - name: Open Broken Main Issue
        id: create_issue
        if: ${{ steps.baseline.outputs.skip != 'true' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.culprit.outputs.culprit_sha }}
          PR: ${{ steps.culprit.outputs.pr_number }}
        run: node scripts/revert-watchdog.mjs create-issue --sha "$SHA" --pr "$PR"

      # Backstop: a transient install/build flake in the node path above must
      # not mean "no issue filed" for a real broken-main event. Title format
      # is byte-identical to buildBrokenMainTitle() in revert-watchdog.mjs so
      # selectIssuesToClose()'s regex still matches it for auto-close.
      - name: Fallback - file broken-main issue via gh CLI
        if: ${{ steps.baseline.outputs.skip != 'true' && steps.create_issue.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.culprit.outputs.culprit_sha }}
          PR: ${{ steps.culprit.outputs.pr_number }}
        run: |
          gh issue create \
            --title "🚨 CRITICAL: Broken Main at commit $SHA" \
            --body "The main branch CI is currently FAILING.

          **Culprit:** commit $SHA
          **PR:** #$PR
          **Action Required:** Investigating or revert immediately.

          _(filed by the gh-CLI fallback — the node issue-filer step failed, see job logs)_" \
            --label "ci-fix" \
            --label "ready" \
            --label "priority:critical"

      - name: Propose Revert PR
        if: ${{ steps.culprit.outputs.pr_number != '' && steps.baseline.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.culprit.outputs.culprit_sha }}
          PR: ${{ steps.culprit.outputs.pr_number }}
        run: |
          BRANCH="revert-broken-main-$SHA"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git revert --no-edit HEAD
          git push origin "$BRANCH"

          gh pr create \
            --title "revert: #$PR (fixes broken main)" \
            --body "Automatically proposed revert of #$PR due to CI failure on main." \
            --label "priority:critical" \
            --base main \
            --head "$BRANCH"

      - name: Trigger RCA
        if: ${{ steps.culprit.outputs.pr_number != '' && steps.baseline.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.culprit.outputs.pr_number }}
          SHA: ${{ steps.culprit.outputs.culprit_sha }}
        run: |
          node scripts/revert-rca.mjs --pr "$PR" --revert-sha "$SHA"

  # Auto-close (#2958): when a later main CI run is green, close any open
  # watchdog issue whose culprit commit is now an ancestor of the green
  # run's head — main has recovered.
  on-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4/v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Build CLI and its dependencies
        run: pnpm build --filter @mbe/cli...

      - name: Close recovered broken-main issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/revert-watchdog.mjs close-recovered --sha "$SHA"
