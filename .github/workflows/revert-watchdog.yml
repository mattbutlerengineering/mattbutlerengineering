name: Revert Watchdog

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual escape hatch for the close-stale-reverts job (#3691), mirroring
  # drift-fix.yml's pattern — lets a human/agent run the stale-revert-PR
  # check on demand instead of waiting for the next CI-success event.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Required for the `gh workflow run` dispatch in "Propose Revert PR" below —
  # GITHUB_TOKEN needs actions:write to call the workflow-dispatch API.
  actions: write

jobs:
  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          fetch-depth: 0
          # AUTOMATION_PAT (#3684): the "Propose Revert PR" step below pushes
          # a commit. A commit pushed with the default GITHUB_TOKEN is
          # attributed to github-actions[bot], which forces every
          # pull_request-triggered check on the resulting PR into
          # `action_required` -- needing a human to manually approve the run
          # before CI Gate can post, on the exact PR that unbreaks main.
          # Pushing (and creating the PR) as a real PAT/bot-token identity
          # avoids that gate entirely. Until AUTOMATION_PAT is set as a repo
          # secret, this silently falls back to the broken GITHUB_TOKEN
          # behavior -- see docs/SECRETS.md.
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-workspace

      - name: Build CLI and its dependencies
        run: pnpm build --filter @mbe/cli...

      - name: Identify culprit commit
        id: culprit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=${{ github.event.workflow_run.head_sha }}
          echo "culprit_sha=$SHA" >> "$GITHUB_OUTPUT"

          AUTHOR=$(git log -1 --format='%ae' $SHA)
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

          PR_NUMBER=$(gh pr list --search "$SHA" --state merged --json number -q '.[0].number')
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check for baseline failure
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.culprit.outputs.culprit_sha }}
          PR: ${{ steps.culprit.outputs.pr_number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # Baseline resolution + the revert/issue decision are pure,
          # unit-tested functions in scripts/revert-watchdog.mjs (#3622) — this
          # step is a thin caller. It walks back past cancelled/null/unknown
          # parent conclusions to the nearest conclusive ancestor (capped at
          # 10 commits) instead of assuming an inconclusive parent means
          # "innocent", and downgrades a revert to an issue when the failing
          # job's test paths don't overlap the culprit PR's changed files.
          RESULT=$(node scripts/revert-watchdog.mjs check-baseline --sha "$SHA" --pr "$PR" --run-id "$RUN_ID")
          echo "$RESULT"

          ACTION=$(echo "$RESULT" | jq -r '.action')
          REASON=$(echo "$RESULT" | jq -r '.reason')
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

          if [ "$ACTION" = "skip" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$ACTION" = "issue-and-revert" ]; then
            echo "revert=true" >> "$GITHUB_OUTPUT"
          else
            echo "revert=false" >> "$GITHUB_OUTPUT"
          fi

          echo "::notice::Baseline decision for $SHA: $ACTION ($REASON)"

      - name: Open Broken Main Issue
        id: create_issue
        if: ${{ steps.baseline.outputs.skip != 'true' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.culprit.outputs.culprit_sha }}
          PR: ${{ steps.culprit.outputs.pr_number }}
        run: |
          RESULT=$(node scripts/revert-watchdog.mjs create-issue --sha "$SHA" --pr "$PR")
          echo "$RESULT"
          echo "issue_number=$(echo "$RESULT" | jq -r '.issueNumber')" >> "$GITHUB_OUTPUT"

      # Backstop: a transient install/build flake in the node path above must
      # not mean "no issue filed" for a real broken-main event. Title format
      # is byte-identical to buildBrokenMainTitle() in revert-watchdog.mjs so
      # selectIssuesToClose()'s regex still matches it for auto-close.
      - name: Fallback - file broken-main issue via gh CLI
        id: create_issue_fallback
        if: ${{ steps.baseline.outputs.skip != 'true' && steps.create_issue.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.culprit.outputs.culprit_sha }}
          PR: ${{ steps.culprit.outputs.pr_number }}
        run: |
          URL=$(gh issue create \
            --title "🚨 CRITICAL: Broken Main at commit $SHA" \
            --body "The main branch CI is currently FAILING.

          **Culprit:** commit $SHA
          **PR:** #$PR
          **Action Required:** Investigating or revert immediately.

          _(filed by the gh-CLI fallback — the node issue-filer step failed, see job logs)_" \
            --label "ci-fix" \
            --label "ready" \
            --label "priority:critical")
          echo "$URL"
          echo "issue_number=$(echo "$URL" | grep -oE '[0-9]+$')" >> "$GITHUB_OUTPUT"

      - name: Propose Revert PR
        if: ${{ steps.culprit.outputs.pr_number != '' && steps.baseline.outputs.revert == 'true' }}
        env:
          # AUTOMATION_PAT (#3684): see checkout step above.
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.culprit.outputs.culprit_sha }}
          PR: ${{ steps.culprit.outputs.pr_number }}
          # The broken-main issue this revert is opened for (#3691) — filed by
          # whichever of the two prior steps ran. Its number is embedded in
          # the PR body below so the close-stale-reverts job can later parse
          # it back out and auto-close this PR once that issue closes.
          ISSUE_NUMBER: ${{ steps.create_issue.outputs.issue_number || steps.create_issue_fallback.outputs.issue_number }}
        run: |
          BRANCH="revert-broken-main-$SHA"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git revert --no-edit HEAD
          git push origin "$BRANCH"

          BODY=$(node scripts/revert-watchdog.mjs revert-pr-body --pr "$PR" --issue "$ISSUE_NUMBER")

          gh pr create \
            --title "revert: #$PR (fixes broken main)" \
            --body "$BODY" \
            --label "priority:critical" \
            --base main \
            --head "$BRANCH"

          # A GITHUB_TOKEN-authored PR does not trigger the pull_request event
          # (GitHub's anti-recursion rule), so the required CI Gate check would
          # never report and this revert — the one PR that unbreaks main — would
          # sit permanently BLOCKED. workflow_dispatch is a documented exception.
          gh workflow run ci.yml --ref "$BRANCH"

          # No "Trigger RCA" step here (#3613): seconds after this PR is
          # opened, the RCA trigger script can only ever resolve to
          # "proposed" or "none" (#3590) — it is never merged yet, so
          # invoking it here is a guaranteed no-op that just burns an API
          # call. revert-rca-loop.yml's pull_request:closed(merged) trigger
          # is the sole caller — it fires once the revert PR actually merges.

  # Auto-close (#2958): when a later main CI run is green, close any open
  # watchdog issue whose culprit commit is now an ancestor of the green
  # run's head — main has recovered.
  on-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Build CLI and its dependencies
        run: pnpm build --filter @mbe/cli...

      - name: Close recovered broken-main issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/revert-watchdog.mjs close-recovered --sha "$SHA"

  # Revert PR lifecycle (#3691): a revert PR asserts the repo is broken. When
  # main is fixed forward instead (the common case — 4 opened, 0 merged in
  # the 2026-07-27 → 2026-08-02 window), nothing ever told the revert PR. It
  # sat open as a stale false signal (#3559 for 2.5 days). Runs on the same
  # green-main event as on-success above, plus workflow_dispatch so it can be
  # run on demand rather than only after the next CI success.
  close-stale-reverts:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Build CLI and its dependencies
        run: pnpm build --filter @mbe/cli...

      - name: Close stale revert PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          if [ -z "$SHA" ]; then
            # workflow_dispatch has no workflow_run context — use the
            # checked-out ref's HEAD (main by default).
            SHA=$(git rev-parse HEAD)
          fi
          node scripts/revert-watchdog.mjs close-stale-reverts --sha "$SHA"
