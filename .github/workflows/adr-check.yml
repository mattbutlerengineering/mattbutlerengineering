name: ADR check

# Belt-and-suspenders with the pre-commit hook (`check-adr --staged`) —
# this workflow runs the full-repo variant so commits landed via --no-verify,
# squash-merges, or fork PRs still get audited.
# No untrusted input is used anywhere in this workflow.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-adr:
    name: ADR compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm build --filter @mbe/cli...

      - name: Run ADR compliance check
        run: pnpm --filter @mbe/cli start check-adr
