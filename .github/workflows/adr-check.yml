name: ADR check

# Belt-and-suspenders with the pre-commit hook (`check-adr --staged`) —
# this workflow runs the full-repo variant so commits landed via --no-verify,
# squash-merges, or fork PRs still get audited.
# No untrusted input is used anywhere in this workflow.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request supersedes its older run (#8723: runners are
# capped at 20 concurrent jobs). Push runs fall back to the unique run id, so
# a run on main is never cancelled and never queues behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-adr:
    name: ADR compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm build --filter @mbe/cli...

      - name: Run ADR compliance check
        run: pnpm --filter @mbe/cli start check-adr
