name: Revert RCA Loop

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  rca:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'revert:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-workspace

      # revert-rca.mjs imports @mbe/gh-client, whose exports map sends the
      # `node` condition to ./dist/index.js. `pnpm install` links the package
      # but never builds it, so a bare `node scripts/revert-rca.mjs` throws
      # ERR_MODULE_NOT_FOUND without this step.
      - name: Build gh-client
        run: pnpm build --filter @mbe/gh-client...

      - name: Identify Reverted PR
        id: info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Extract PR number from title e.g. "revert: #123", "Revert '...' (#123)"
          REVERTED_PR=$(echo "$TITLE" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
          if [ -n "$REVERTED_PR" ]; then
            echo "reverted_pr=$REVERTED_PR" >> "$GITHUB_OUTPUT"
          else
            echo "Could not identify reverted PR from title: $TITLE"
            exit 0
          fi

      - name: Trigger RCA
        if: ${{ steps.info.outputs.reverted_pr != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.info.outputs.reverted_pr }}
        run: |
          # revert-rca.mjs independently re-derives the merged revert PR/sha
          # for $PR (#3583) rather than trusting a caller-supplied sha.
          node scripts/revert-rca.mjs --pr "$PR"
