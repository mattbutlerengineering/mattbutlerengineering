name: ACMM Cold Start

# Weekly measurement of cold-start ergonomics: time from `git clone` to a
# green test run. This is what every fresh agent session pays.
#
# ACMM otherwise checks whether `vitest.config.ts` exists; this measures
# whether `pnpm install && pnpm test` actually works on a clean runner
# in a reasonable amount of time.
#
# Output: opens a PR adding a record to `metrics/acmm-cold-start.json`.
# The `acmm-audit` script reads the most recent record and renders a
# "Cold start" section in the scorecard.

on:
  schedule:
    # Sunday 06:00 UTC — outside business hours, low contention
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  # contents: push the measurement to the metrics-data branch.
  contents: write

concurrency:
  group: acmm-cold-start
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # AUTOMATION_PAT (#3684): see checkout step below for why.
      GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (no caches)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          fetch-depth: 1
          # AUTOMATION_PAT (#3684): a commit pushed with the default
          # GITHUB_TOKEN is attributed to github-actions[bot], which forces
          # every pull_request-triggered check on the resulting PR into
          # `action_required` -- needing a human to manually approve the run
          # before CI Gate can post. Pushing (and creating the PR) as a real
          # PAT/bot-token identity avoids that gate entirely. Until
          # AUTOMATION_PAT is set as a repo secret, this silently falls back
          # to the broken GITHUB_TOKEN behavior -- see docs/SECRETS.md.
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      # Note: NO `cache: pnpm` — we want cold-start, not cache-warm.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Time pnpm install
        id: install
        run: |
          start=$(date +%s)
          set +e
          pnpm install --frozen-lockfile
          install_status=$?
          set -e
          end=$(date +%s)
          install_seconds=$((end - start))
          echo "install_seconds=$install_seconds" >> "$GITHUB_OUTPUT"
          echo "install_status=$install_status" >> "$GITHUB_OUTPUT"

      - name: Time pnpm test
        id: test
        if: steps.install.outputs.install_status == '0'
        run: |
          start=$(date +%s)
          set +e
          pnpm test
          test_status=$?
          set -e
          end=$(date +%s)
          test_seconds=$((end - start))
          echo "test_seconds=$test_seconds" >> "$GITHUB_OUTPUT"
          echo "test_status=$test_status" >> "$GITHUB_OUTPUT"

      - name: Report cold-start test failure
        # A record with test_passed: false used to be visible only by opening
        # the JSON file -- surface it where a maintainer actually looks.
        if: steps.test.outputs.test_status != '0'
        env:
          TEST_STATUS: ${{ steps.test.outputs.test_status || '-1' }}
        run: |
          echo "::warning::ACMM cold-start test run failed (exit ${TEST_STATUS}) -- test_passed: false will be recorded in metrics/acmm-cold-start.json"
          echo "### ACMM cold-start: test run FAILED (exit ${TEST_STATUS})" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out metrics-data
        # Telemetry lives on the orphan metrics-data branch, not main
        # (scripts/metrics-data.mjs). metrics-store reads and writes it in .metrics-data/.
        run: node scripts/metrics-data.mjs pull

      - name: Compose record
        env:
          INSTALL_S: ${{ steps.install.outputs.install_seconds }}
          INSTALL_STATUS: ${{ steps.install.outputs.install_status }}
          TEST_S: ${{ steps.test.outputs.test_seconds || '0' }}
          TEST_STATUS: ${{ steps.test.outputs.test_status || '-1' }}
        run: |
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export TS
          node -e '
            const fs = require("node:fs");
            const path = ".metrics-data/acmm-cold-start.json";
            const installS = Number(process.env.INSTALL_S || 0);
            const testS = Number(process.env.TEST_S || 0);
            const record = {
              ts: process.env.TS,
              install_seconds: installS,
              test_seconds: testS,
              total_seconds: installS + testS,
              test_passed: process.env.TEST_STATUS === "0",
              install_passed: process.env.INSTALL_STATUS === "0",
              commit: process.env.GITHUB_SHA,
            };
            let history = [];
            if (fs.existsSync(path)) {
              try { history = JSON.parse(fs.readFileSync(path, "utf8")); }
              catch { history = []; }
            }
            if (!Array.isArray(history)) history = [];
            history.push(record);
            history = history.slice(-26);
            fs.writeFileSync(path, JSON.stringify(history, null, 2) + "\n");
            console.log("Wrote", path, "with", history.length, "records (latest:", JSON.stringify(record), ")");
          '

      - name: Push metrics to metrics-data
        # A direct push: no PR, no CI run (no workflow triggers on this
        # branch), and a rejected push rebases and retries instead of
        # resetting a fixed branch and dropping the earlier row.
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: 'node scripts/metrics-data.mjs push -m "chore(metrics): acmm cold-start"'
