name: Secret Rotation Reminder

on:
  schedule:
    # Runs the 1st of every month at 09:00 UTC.
    #
    # This used to be "0 9 1-7 * 1" ("first Monday"), but cron's day-of-month
    # and day-of-week fields are OR'd, not AND'd — that expression fired on
    # every day 1-7 of the month AND every Monday, ~11 times/month instead of
    # once. "First Monday" isn't expressible in standard cron for the same
    # reason, so this uses the 1st of the month instead — the same tradeoff
    # already made for `mbe-monthly-meta-audit` (see docs/scheduled-tasks.md).
    - cron: "0 9 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Build gh-client
        run: pnpm build --filter @mbe/gh-client

      - name: Check secret rotation and create reminder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/secret-rotation-reminder.mjs
