name: Secret Rotation Reminder

on:
  schedule:
    # First Monday of every month at 09:00 UTC
    - cron: "0 9 1-7 * 1"
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  check-rotation:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Calculate due secrets
        id: check
        run: |
          # Current month (1-12) and quarter
          MONTH=$(date +%-m)
          QUARTER=$(( (MONTH - 1) / 3 + 1 ))

          QUARTERLY_SECRETS=""
          SEMI_ANNUAL_SECRETS=""

          # Quarterly secrets are due in Jan (Q1), Apr (Q2), Jul (Q3), Oct (Q4)
          QUARTERLY_MONTHS="1 4 7 10"
          for m in $QUARTERLY_MONTHS; do
            if [ "$MONTH" -eq "$m" ]; then
              QUARTERLY_SECRETS=$(cat <<'SECRETS'
          - [ ] `DIGITALOCEAN_TOKEN` — DigitalOcean API token
          - [ ] `MBE_CLOUDFLARE_API_TOKEN` — Cloudflare API token
          - [ ] `DATABASE_URL` — PostgreSQL connection string
          - [ ] `R2_ACCESS_KEY_ID` — Cloudflare R2 access key
          - [ ] `R2_SECRET_ACCESS_KEY` — Cloudflare R2 secret key
          SECRETS
              )
              break
            fi
          done

          # Semi-annual secrets are due in Jan (H1) and Jul (H2)
          if [ "$MONTH" -eq 1 ] || [ "$MONTH" -eq 7 ]; then
            SEMI_ANNUAL_SECRETS=$(cat <<'SECRETS'
          - [ ] `PULUMI_CONFIG_PASSPHRASE` — Pulumi stack encryption passphrase
          - [ ] `AUTH0_CLIENT_SECRET` — Auth0 M2M client secret
          - [ ] `LANGFUSE_SECRET_KEY` — Langfuse observability API secret
          - [ ] `GITLEAKS_LICENSE` — Gitleaks license key
          - [ ] `TURBO_TOKEN` — Turborepo remote cache token
          SECRETS
            )
          fi

          if [ -z "$QUARTERLY_SECRETS" ] && [ -z "$SEMI_ANNUAL_SECRETS" ]; then
            echo "no_secrets_due=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_secrets_due=false" >> "$GITHUB_OUTPUT"

            BODY="## Secret Rotation Reminder\n\n"
            BODY+="The following secrets are due for rotation this month.\n"
            BODY+="See [docs/SECRETS.md](../blob/main/docs/SECRETS.md) for rotation runbooks.\n\n"

            if [ -n "$QUARTERLY_SECRETS" ]; then
              BODY+="### Quarterly Rotation (Q${QUARTER})\n\n${QUARTERLY_SECRETS}\n\n"
            fi

            if [ -n "$SEMI_ANNUAL_SECRETS" ]; then
              HALF=$(( (MONTH - 1) / 6 + 1 ))
              BODY+="### Semi-Annual Rotation (H${HALF})\n\n${SEMI_ANNUAL_SECRETS}\n\n"
            fi

            # Write body to file to preserve newlines
            echo -e "$BODY" > /tmp/issue-body.md
          fi

      - name: Create rotation issue
        if: steps.check.outputs.no_secrets_due == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MONTH_NAME=$(date +%B)
          YEAR=$(date +%Y)

          gh issue create \
            --repo "$GH_REPO" \
            --title "chore: rotate secrets due ${MONTH_NAME} ${YEAR}" \
            --body-file /tmp/issue-body.md \
            --label "chore,security"
