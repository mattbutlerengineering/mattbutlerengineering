name: Deploy Static Sites

on:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - "apps/hospitality/**"
      - "apps/rialto-web/**"
      - "packages/rialto/**"
      - "packages/rialto-catalog/**"
      - "packages/auth/**"
  workflow_dispatch:

concurrency:
  group: deploy-static-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  circuit-check:
    name: Circuit Breaker Check
    runs-on: ubuntu-latest
    outputs:
      blocked: ${{ steps.check.outputs.blocked }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4/v5
        with:
          sparse-checkout: |
            .github/circuit-breaker-state
          sparse-checkout-cone-mode: false
          ref: circuit-breaker-state

      - name: Check state
        id: check
        run: |
          if [ -f ".github/circuit-breaker-state" ]; then
            STATE=$(jq -r '.state // "closed"' .github/circuit-breaker-state 2>/dev/null || echo "closed")
          else
            STATE="closed"
          fi

          echo "Circuit state: $STATE"
          if [ "$STATE" = "open" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

  detect-changes:
    name: Detect Changes
    needs: [circuit-check]
    if: needs.circuit-check.outputs.blocked != 'true'
    runs-on: ubuntu-latest
    outputs:
      marketing: ${{ steps.result.outputs.marketing }}
      hospitality: ${{ steps.result.outputs.hospitality }}
      rialto-web: ${{ steps.result.outputs.rialto-web }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4/v5
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            marketing:
              - 'apps/marketing/**'
              - 'packages/rialto/**'
            hospitality:
              - 'apps/hospitality/**'
              - 'packages/rialto/**'
              - 'packages/auth/**'
            rialto-web:
              - 'apps/rialto-web/**'
              - 'packages/rialto/**'
      - name: Set outputs
        id: result
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "marketing=true" >> "$GITHUB_OUTPUT"
            echo "hospitality=true" >> "$GITHUB_OUTPUT"
            echo "rialto-web=true" >> "$GITHUB_OUTPUT"
          else
            echo "marketing=${{ steps.filter.outputs.marketing }}" >> "$GITHUB_OUTPUT"
            echo "hospitality=${{ steps.filter.outputs.hospitality }}" >> "$GITHUB_OUTPUT"
            echo "rialto-web=${{ steps.filter.outputs.rialto-web }}" >> "$GITHUB_OUTPUT"
          fi

  blocked:
    needs: [circuit-check]
    if: needs.circuit-check.outputs.blocked == 'true'
    name: Deploy Blocked
    runs-on: ubuntu-latest
    steps:
      - name: Notify blocked
        run: |
          echo "::warning::Deploy blocked by circuit breaker"

  deploy-marketing:
    name: Deploy Marketing
    needs: detect-changes
    if: needs.detect-changes.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build --filter=@mbe/marketing
        env:
          VITE_BUILD_ID: ${{ github.sha }}

      - name: Deploy to Workers Static Assets
        run: npx wrangler@3 deploy --config apps/marketing/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-hospitality:
    name: Deploy Hospitality
    needs: detect-changes
    if: needs.detect-changes.outputs.hospitality == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build hospitality
        run: pnpm build --filter=@mbe/hospitality
        env:
          VITE_AUTH_AUTHORITY: https://dev-ytbgmz5ls3wh4xdx.us.auth0.com
          VITE_AUTH_CLIENT_ID: ${{ secrets.AUTH0_HOSPITALITY_CLIENT_ID }}
          VITE_AUTH_AUDIENCE: https://api.mattbutlerengineering.com
          VITE_AUTH_REDIRECT_URI: https://mattbutlerengineering.com/hospitality/callback
          VITE_API_URL: https://mattbutlerengineering.com
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Deploy to Workers Static Assets
        run: npx wrangler@3 deploy --config apps/hospitality/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-rialto-web:
    name: Deploy Rialto Web
    needs: detect-changes
    if: needs.detect-changes.outputs.rialto-web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build --filter=@mbe/rialto-web

      - name: Deploy to Workers Static Assets
        run: npx wrangler@3 deploy --config apps/rialto-web/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  verify:
    name: Post-Deploy Verification
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-marketing, deploy-hospitality, deploy-rialto-web]
    if: |
      always() &&
      (needs.deploy-marketing.result == 'success' ||
       needs.deploy-hospitality.result == 'success' ||
       needs.deploy-rialto-web.result == 'success')
    steps:
      - name: Verify marketing site
        if: needs.detect-changes.outputs.marketing == 'true'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://mattbutlerengineering.com/)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Marketing site returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "Marketing site OK (HTTP $STATUS)"

      - name: Verify hospitality app
        if: needs.detect-changes.outputs.hospitality == 'true'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://mattbutlerengineering.com/hospitality/)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Hospitality app returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "Hospitality app OK (HTTP $STATUS)"

      - name: Verify rialto web
        if: needs.detect-changes.outputs.rialto-web == 'true'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://mattbutlerengineering.com/rialto/)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Rialto web returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "Rialto web OK (HTTP $STATUS)"

  rollback:
    name: Rollback Failed Deploys
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-marketing, deploy-hospitality, deploy-rialto-web, verify]
    if: failure() && needs.verify.result == 'failure'
    steps:
      - name: Rollback marketing
        if: needs.detect-changes.outputs.marketing == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::warning::Rolling back mattbutlerengineering-marketing"
          npx wrangler@3 rollback --name mattbutlerengineering-marketing --message "Auto-rollback: post-deploy verification failed"

      - name: Rollback hospitality
        if: needs.detect-changes.outputs.hospitality == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::warning::Rolling back mattbutlerengineering-hospitality"
          npx wrangler@3 rollback --name mattbutlerengineering-hospitality --message "Auto-rollback: post-deploy verification failed"

      - name: Rollback rialto-web
        if: needs.detect-changes.outputs.rialto-web == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::warning::Rolling back mattbutlerengineering-rialto-web"
          npx wrangler@3 rollback --name mattbutlerengineering-rialto-web --message "Auto-rollback: post-deploy verification failed"

      - name: Re-verify after rollback
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://mattbutlerengineering.com/health/system")
          HEALTH=$(curl -s --max-time 15 "https://mattbutlerengineering.com/health/system" | jq -r '.subsystems.static_sites.status')
          echo "Post-rollback: HTTP $STATUS, static_sites=$HEALTH"
          if [ "$HEALTH" != "healthy" ]; then
            echo "::error::Static sites still unhealthy after rollback — manual intervention required"
            exit 1
          fi
          echo "Rollback successful — static sites healthy"

  report-health:
    name: Report Deploy Health
    needs:
      [detect-changes, deploy-marketing, deploy-hospitality, deploy-rialto-web, verify, rollback]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4/v5

      # Collapse the three per-app results into a single deploy-result for
      # the shared action. If all three were skipped (no apps changed or
      # circuit-blocked), emit "skipped" so the action preserves the previous
      # KV state unchanged.
      - name: Derive deploy result
        id: derive
        env:
          MARKETING_RESULT: ${{ needs.deploy-marketing.result }}
          HOSPITALITY_RESULT: ${{ needs.deploy-hospitality.result }}
          RIALTO_RESULT: ${{ needs.deploy-rialto-web.result }}
          MARKETING_DEPLOYED: ${{ needs.detect-changes.outputs.marketing }}
          HOSPITALITY_DEPLOYED: ${{ needs.detect-changes.outputs.hospitality }}
          RIALTO_DEPLOYED: ${{ needs.detect-changes.outputs.rialto-web }}
        run: |
          if [ "$MARKETING_RESULT" = "skipped" ] && [ "$HOSPITALITY_RESULT" = "skipped" ] && [ "$RIALTO_RESULT" = "skipped" ]; then
            echo "deploy_result=skipped" >> "$GITHUB_OUTPUT"
          elif [ "$MARKETING_RESULT" = "failure" ] || [ "$HOSPITALITY_RESULT" = "failure" ] || [ "$RIALTO_RESULT" = "failure" ]; then
            echo "deploy_result=failure" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_result=success" >> "$GITHUB_OUTPUT"
          fi
          # Build apps_deployed JSON for the action
          APPS=$(jq -n \
            --arg marketing "$MARKETING_DEPLOYED" \
            --arg hospitality "$HOSPITALITY_DEPLOYED" \
            --arg rialto "$RIALTO_DEPLOYED" \
            '{marketing: $marketing, hospitality: $hospitality, rialto: $rialto}')
          echo "apps_deployed=$APPS" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/report-deploy-health
        with:
          kv-key: deploy/static
          deploy-result: ${{ steps.derive.outputs.deploy_result }}
          verify-result: ${{ needs.verify.result }}
          rollback-result: ${{ needs.rollback.result }}
          apps-deployed: ${{ steps.derive.outputs.apps_deployed }}
          cf-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cf-api-token: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          kv-namespace-id: ${{ secrets.HEALTH_KV_NAMESPACE_ID }}
