name: Deploy Static Sites

on:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - "apps/hospitality/**"
      - "apps/rialto-web/**"
      - "packages/rialto/**"
      - "packages/rialto-catalog/**"
      - "packages/auth/**"
  workflow_dispatch:

concurrency:
  group: deploy-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      marketing: ${{ steps.result.outputs.marketing }}
      hospitality: ${{ steps.result.outputs.hospitality }}
      rialto-web: ${{ steps.result.outputs.rialto-web }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            marketing:
              - 'apps/marketing/**'
              - 'packages/rialto/**'
            hospitality:
              - 'apps/hospitality/**'
              - 'packages/rialto/**'
              - 'packages/auth/**'
            rialto-web:
              - 'apps/rialto-web/**'
              - 'packages/rialto/**'
      - name: Set outputs
        id: result
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "marketing=true" >> "$GITHUB_OUTPUT"
            echo "hospitality=true" >> "$GITHUB_OUTPUT"
            echo "rialto-web=true" >> "$GITHUB_OUTPUT"
          else
            echo "marketing=${{ steps.filter.outputs.marketing }}" >> "$GITHUB_OUTPUT"
            echo "hospitality=${{ steps.filter.outputs.hospitality }}" >> "$GITHUB_OUTPUT"
            echo "rialto-web=${{ steps.filter.outputs.rialto-web }}" >> "$GITHUB_OUTPUT"
          fi

  # ── Canary: Marketing ──────────────────────────────────────────────────────
  canary-marketing:
    name: Canary Deploy — Marketing
    needs: detect-changes
    if: needs.detect-changes.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.verify.outputs.passed }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build --filter=@mbe/marketing

      - name: Deploy to Canary Worker
        run: npx wrangler@3 deploy --config apps/marketing/wrangler.canary.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify canary
        id: verify
        run: |
          # Give the Worker a moment to propagate
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            https://mattbutlerengineering.com/canary/marketing/)
          echo "Canary HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Marketing canary returned HTTP $STATUS — skipping promotion"
          fi

      - name: Report canary failure
        if: steps.verify.outputs.passed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Canary deploy failed: marketing (${{ github.sha }})",
              body: [
                "## Canary Verification Failed",
                "",
                "The marketing canary deploy did not pass health checks and was **not promoted to production**.",
                "",
                "| Field | Value |",
                "|-------|-------|",
                `| Commit | ${{ github.sha }} |`,
                `| Run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |`,
                `| Canary URL | https://mattbutlerengineering.com/canary/marketing/ |`,
                "",
                "The previous production version remains live. Investigate the commit above before re-deploying.",
              ].join("\n"),
              labels: ["ci-fix"],
            });

  promote-marketing:
    name: Promote Marketing to Production
    needs: [detect-changes, canary-marketing]
    if: needs.detect-changes.outputs.marketing == 'true' && needs.canary-marketing.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build --filter=@mbe/marketing

      - name: Promote to Production Worker
        run: npx wrangler@3 deploy --config apps/marketing/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Canary: Hospitality ────────────────────────────────────────────────────
  canary-hospitality:
    name: Canary Deploy — Hospitality
    needs: detect-changes
    if: needs.detect-changes.outputs.hospitality == 'true'
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.verify.outputs.passed }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build hospitality
        run: pnpm build --filter=@mbe/hospitality
        env:
          VITE_AUTH_AUTHORITY: https://dev-ytbgmz5ls3wh4xdx.us.auth0.com
          VITE_AUTH_CLIENT_ID: ${{ secrets.AUTH0_HOSPITALITY_CLIENT_ID }}
          VITE_AUTH_AUDIENCE: https://api.mattbutlerengineering.com
          VITE_AUTH_REDIRECT_URI: https://mattbutlerengineering.com/hospitality/callback
          VITE_API_URL: https://mattbutlerengineering.com

      - name: Deploy to Canary Worker
        run: npx wrangler@3 deploy --config apps/hospitality/wrangler.canary.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify canary
        id: verify
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            https://mattbutlerengineering.com/canary/hospitality/)
          echo "Canary HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Hospitality canary returned HTTP $STATUS — skipping promotion"
          fi

      - name: Report canary failure
        if: steps.verify.outputs.passed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Canary deploy failed: hospitality (${{ github.sha }})",
              body: [
                "## Canary Verification Failed",
                "",
                "The hospitality canary deploy did not pass health checks and was **not promoted to production**.",
                "",
                "| Field | Value |",
                "|-------|-------|",
                `| Commit | ${{ github.sha }} |`,
                `| Run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |`,
                `| Canary URL | https://mattbutlerengineering.com/canary/hospitality/ |`,
                "",
                "The previous production version remains live. Investigate the commit above before re-deploying.",
              ].join("\n"),
              labels: ["ci-fix"],
            });

  promote-hospitality:
    name: Promote Hospitality to Production
    needs: [detect-changes, canary-hospitality]
    if: needs.detect-changes.outputs.hospitality == 'true' && needs.canary-hospitality.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build hospitality
        run: pnpm build --filter=@mbe/hospitality
        env:
          VITE_AUTH_AUTHORITY: https://dev-ytbgmz5ls3wh4xdx.us.auth0.com
          VITE_AUTH_CLIENT_ID: ${{ secrets.AUTH0_HOSPITALITY_CLIENT_ID }}
          VITE_AUTH_AUDIENCE: https://api.mattbutlerengineering.com
          VITE_AUTH_REDIRECT_URI: https://mattbutlerengineering.com/hospitality/callback
          VITE_API_URL: https://mattbutlerengineering.com

      - name: Promote to Production Worker
        run: npx wrangler@3 deploy --config apps/hospitality/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Canary: Rialto Web ─────────────────────────────────────────────────────
  canary-rialto-web:
    name: Canary Deploy — Rialto Web
    needs: detect-changes
    if: needs.detect-changes.outputs.rialto-web == 'true'
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.verify.outputs.passed }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build --filter=@mbe/rialto-web

      - name: Deploy to Canary Worker
        run: npx wrangler@3 deploy --config apps/rialto-web/wrangler.canary.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify canary
        id: verify
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            https://mattbutlerengineering.com/canary/rialto/)
          echo "Canary HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Rialto web canary returned HTTP $STATUS — skipping promotion"
          fi

      - name: Report canary failure
        if: steps.verify.outputs.passed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Canary deploy failed: rialto-web (${{ github.sha }})",
              body: [
                "## Canary Verification Failed",
                "",
                "The rialto-web canary deploy did not pass health checks and was **not promoted to production**.",
                "",
                "| Field | Value |",
                "|-------|-------|",
                `| Commit | ${{ github.sha }} |`,
                `| Run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |`,
                `| Canary URL | https://mattbutlerengineering.com/canary/rialto/ |`,
                "",
                "The previous production version remains live. Investigate the commit above before re-deploying.",
              ].join("\n"),
              labels: ["ci-fix"],
            });

  promote-rialto-web:
    name: Promote Rialto Web to Production
    needs: [detect-changes, canary-rialto-web]
    if: needs.detect-changes.outputs.rialto-web == 'true' && needs.canary-rialto-web.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build --filter=@mbe/rialto-web

      - name: Promote to Production Worker
        run: npx wrangler@3 deploy --config apps/rialto-web/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── Post-Deploy Verification ───────────────────────────────────────────────
  verify:
    name: Post-Deploy Verification
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - promote-marketing
      - promote-hospitality
      - promote-rialto-web
    if: |
      always() &&
      (needs.promote-marketing.result == 'success' ||
       needs.promote-hospitality.result == 'success' ||
       needs.promote-rialto-web.result == 'success')
    steps:
      - name: Verify marketing site
        if: needs.detect-changes.outputs.marketing == 'true' && needs.promote-marketing.result == 'success'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://mattbutlerengineering.com/)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Marketing site returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "Marketing site OK (HTTP $STATUS)"

      - name: Verify hospitality app
        if: needs.detect-changes.outputs.hospitality == 'true' && needs.promote-hospitality.result == 'success'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://mattbutlerengineering.com/hospitality/)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Hospitality app returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "Hospitality app OK (HTTP $STATUS)"

      - name: Verify rialto web
        if: needs.detect-changes.outputs.rialto-web == 'true' && needs.promote-rialto-web.result == 'success'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://mattbutlerengineering.com/rialto/)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Rialto web returned HTTP $STATUS (expected 200)"
            exit 1
          fi
          echo "Rialto web OK (HTTP $STATUS)"
