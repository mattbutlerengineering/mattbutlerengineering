name: PR Acceptance Metrics

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Generate PR metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-metrics.mjs
      - name: Generate dashboard metrics
        run: node scripts/generate-metrics-json.mjs
      - name: Open PR with updated metrics
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: update PR acceptance metrics"
          title: "chore: update PR acceptance metrics"
          body: |
            Automated weekly PR acceptance metrics update.

            Generated by `.github/workflows/pr-metrics.yml`.
          branch: automation/pr-acceptance-metrics
          delete-branch: true
          add-paths: |
            metrics/pr-acceptance.json
            apps/marketing/public/metrics.json
          labels: auto-merge
