name: PR Acceptance Metrics

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write
  # Required for the `gh workflow run` dispatch step below — GITHUB_TOKEN
  # needs actions:write to call the workflow-dispatch API.
  actions: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter @mbe/gh-client...
      - name: Generate PR metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-metrics.mjs
      - name: Generate dashboard metrics
        run: node scripts/generate-metrics-json.mjs
      - name: Open PR with updated metrics
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        env:
          # The action commits inside the runner, which fires the husky pre-commit
          # hook; check-adr needs @mbe/agent-core built, which this job doesn't do.
          # Bot commits of generated artifacts are validated by CI on the PR instead.
          HUSKY: "0"
        with:
          # AUTOMATION_PAT (#3684): a commit pushed with the default
          # GITHUB_TOKEN is attributed to github-actions[bot], which forces
          # every pull_request-triggered check on the resulting PR (CI, Auto
          # Review, ADR check, ...) into `action_required` -- needing a human
          # to manually approve the run before CI Gate can post. Pushing as a
          # real PAT/bot-token identity avoids that gate entirely. Until
          # AUTOMATION_PAT is set as a repo secret, this silently falls back
          # to the broken GITHUB_TOKEN behavior -- see docs/SECRETS.md.
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore: update PR acceptance metrics"
          title: "chore: update PR acceptance metrics"
          body: |
            Automated weekly PR acceptance metrics update.

            Generated by `.github/workflows/pr-metrics.yml`.
          branch: automation/pr-acceptance-metrics
          delete-branch: true
          add-paths: |
            metrics/pr-acceptance.json
            apps/marketing/public/metrics.json
          labels: auto-merge
      - name: Dispatch CI on the automation branch
        # GITHUB_TOKEN-authored pushes/PRs don't trigger other workflows
        # (GitHub's anti-recursion rule), so the pull_request CI run —
        # including the required CI Gate check — never fires and the PR sits
        # BLOCKED. workflow_dispatch is a documented exception: an explicit
        # API call, not a passive event, so it's allowed to trigger ci.yml.
        # Only dispatch when a PR actually exists (skips no-op runs where
        # metrics didn't change).
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref automation/pr-acceptance-metrics
      - name: Enable auto-merge
        # auto-merge.yml (the workflow that would normally do this) never
        # runs on this PR -- its own pull_request/check_suite triggers park
        # at action_required for the same reason ci.yml's do (#3684), so it
        # never reaches its own `gh pr merge --auto` call. Enable it directly
        # here instead. This alone does not guarantee the merge lands: if
        # `main` moves ahead of this branch before the dispatched CI run
        # posts green, the scheduled automation-pr-rescue.yml pass brings it
        # back up to date and re-dispatches CI (#3966).
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash --delete-branch
