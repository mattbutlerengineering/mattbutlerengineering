name: PR Acceptance Metrics

# Telemetry only: this workflow writes to the metrics-data branch and never
# opens a PR. It used to regenerate apps/marketing/public/metrics.json on its
# own weekly branch from a stale state.json, which conflicted with the daily
# acmm-regression PR and dropped a /metrics history row (#9544, #9669).
# acmm-regression.yml is the sole writer of metrics.json.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  id-token: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --filter @mbe/gh-client...
      - name: Check out metrics-data
        # Telemetry lives on the orphan metrics-data branch, not main
        # (scripts/metrics-data.mjs). metrics-store reads and writes it in .metrics-data/.
        run: node scripts/metrics-data.mjs pull

      - name: Generate PR metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pr-metrics.mjs
      - name: Push metrics to metrics-data
        # A direct push: no PR, no CI run (no workflow triggers on this
        # branch), and a rejected push rebases and retries instead of
        # resetting a fixed branch and dropping the earlier row.
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: 'node scripts/metrics-data.mjs push -m "chore(metrics): pr acceptance"'
