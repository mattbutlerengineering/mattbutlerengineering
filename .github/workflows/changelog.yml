name: Generate Changelog

on:
  schedule:
    # 1st of each month at 9:07am UTC
    - cron: "7 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Required for the `gh workflow run` dispatch after the PR is created.
  actions: write

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          fetch-depth: 0
          # AUTOMATION_PAT (#3684): a commit pushed with the default
          # GITHUB_TOKEN is attributed to github-actions[bot], which forces
          # every pull_request-triggered check on the resulting PR into
          # `action_required` -- needing a human to manually approve the run
          # before CI Gate can post. Pushing (and creating the PR) as a real
          # PAT/bot-token identity avoids that gate entirely. Until
          # AUTOMATION_PAT is set as a repo secret, this silently falls back
          # to the broken GITHUB_TOKEN behavior -- see docs/SECRETS.md.
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install changelogen
        run: pnpm add -g changelogen

      - name: Generate changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail

          # No --from walks back to the nearest reachable tag --
          # packages/rialto's last release, 2200+ commits back here -- past
          # Node's 1 MB default child_process maxBuffer, which throws a bare
          # ENOBUFS before changelogen ever writes CHANGELOG.md. This is a
          # monthly job, so bound the range to the preceding calendar month.
          FROM_REF=$(git rev-list -1 --before="$(date -u -d '1 month ago' +%Y-%m-01)" HEAD)
          if [ -z "$FROM_REF" ]; then
            echo "No commit found before the 1-month boundary; nothing to summarize."
            exit 0
          fi

          # A month-bound is not a permanent fix -- one month's log is
          # already 758,785 bytes across 701 commits as of 2026-08, and this
          # repo's commit volume will cross the 1 MB maxBuffer again within a
          # few months. Fail loud and diagnosable here instead of letting
          # changelogen's internal git-log shell-out die with a bare,
          # undiagnosable ENOBUFS like it has every month since 2026-07.
          LOG_BYTES=$(git log "${FROM_REF}..HEAD" --format='%H%n%B' | wc -c)
          MAX_SAFE_BYTES=900000
          if [ "$LOG_BYTES" -gt "$MAX_SAFE_BYTES" ]; then
            echo "::error::Commit log for ${FROM_REF}..HEAD is ${LOG_BYTES} bytes, over the ${MAX_SAFE_BYTES}-byte safety margin below Node's 1 MB child_process maxBuffer that broke this job with a bare ENOBUFS from 2026-07 onward. Narrow the range (e.g. two weeks instead of a month) rather than widening it."
            exit 1
          fi

          changelogen --output CHANGELOG.md --from "$FROM_REF"

      - name: Create PR with changelog
        env:
          # AUTOMATION_PAT (#3684): see checkout step above.
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          MONTH_LABEL: ${{ github.event_name == 'schedule' && 'monthly' || 'manual' }}
        run: |
          set -o pipefail

          # `git diff --quiet CHANGELOG.md` ignores untracked files -- and
          # there is no root CHANGELOG.md in this repo, so changelogen always
          # creates a brand-new, untracked one. That made this check take the
          # "no changes" branch on every single run since this workflow was
          # added. `git status --porcelain` reports untracked (`??`) and
          # modified-tracked files alike, so it catches both cases.
          if [ -z "$(git status --porcelain -- CHANGELOG.md)" ]; then
            echo "No changelog changes detected"
            exit 0
          fi

          BRANCH="chore/changelog-$(date +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "docs: update changelog (${MONTH_LABEL})"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "docs: update changelog ($(date +%B\ %Y))" \
            --body "Auto-generated changelog from conventional commits.

          Triggered: ${MONTH_LABEL}" \
            --label "docs"

          # GITHUB_TOKEN-authored PRs don't trigger the pull_request event, so
          # the required CI Gate check never reports without an explicit dispatch.
          gh workflow run ci.yml --ref "$BRANCH"
