name: Merge Queue

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, opened, reopened]
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes fallback
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Note: Do NOT add `gh auth login --with-token` here. The gh CLI
      # auto-picks GITHUB_TOKEN from env and exits 1 when --with-token
      # is invoked while the env var is set ("The value of the
      # GITHUB_TOKEN environment variable is being used for
      # authentication."). The step below relies on env-based auth.

      - name: Enable auto-merge for verified agent PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # If triggered by a PR event, target that PR specifically.
          # If scheduled or dispatch, scan all open PRs with 'has-pr'.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR_NUMBERS="$EVENT_PR_NUMBER"
          else
            PR_NUMBERS=$(gh pr list --label "has-pr" --state open --json number -q '.[].number')
          fi

          for pr in $PR_NUMBERS; do
            echo "Checking PR #$pr..."

            LABELS=$(gh pr view "$pr" --json labels -q '.labels[].name')

            HAS_PR=false
            NEEDS_REVIEW=false
            for label in $LABELS; do
              if [ "$label" = "has-pr" ]; then HAS_PR=true; fi
              if [ "$label" = "needs-review" ]; then NEEDS_REVIEW=true; fi
            done

            if [ "$HAS_PR" = "true" ] && [ "$NEEDS_REVIEW" = "false" ]; then
              echo "Enabling auto-merge for PR #$pr (squash merge)"
              gh pr merge "$pr" --auto --squash || echo "Skipping #$pr: Auto-merge could not be enabled (check repo settings or branch protection)."
            else
              if [ "$HAS_PR" = "false" ]; then
                echo "Skipping #$pr: Missing 'has-pr' label."
              fi
              if [ "$NEEDS_REVIEW" = "true" ]; then
                echo "Skipping #$pr: 'needs-review' label is present."
              fi
            fi
          done
