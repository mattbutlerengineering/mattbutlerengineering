name: Merge Queue

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, opened, reopened]
  schedule:
    - cron: "*/30 * * * *" # Every 30 minutes fallback
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          persist-credentials: false

      # Note: Do NOT add `gh auth login --with-token` here. The gh CLI
      # auto-picks GITHUB_TOKEN from env and exits 1 when --with-token
      # is invoked while the env var is set ("The value of the
      # GITHUB_TOKEN environment variable is being used for
      # authentication."). The step below relies on env-based auth.

      - name: Enable auto-merge for verified agent PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh auth status || true

          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR_NUMBERS="$EVENT_PR_NUMBER"
          else
            PR_NUMBERS=$(gh pr list --label "has-pr" --state open --json number -q '.[].number')
          fi

          for pr in $PR_NUMBERS; do
            echo "Checking PR #$pr..."

            LABELS=$(gh pr view "$pr" --json labels -q '[.labels[].name] | join(",")')

            # Eligibility (has-pr/needs-review + tier:* gating) is a pure,
            # unit-tested decision in scripts/merge-queue-eligibility.mjs
            # (#3787) — this step is a thin caller. docs/change-tiers.md:
            # T2 and above (tier:standard/sensitive/critical) always require
            # Matt's personal approval, so they must never get auto-merge
            # enabled here regardless of the needs-review label.
            RESULT=$(node scripts/merge-queue-eligibility.mjs check --labels "$LABELS")
            echo "$RESULT"

            ELIGIBLE=$(echo "$RESULT" | jq -r '.eligible')
            REASON=$(echo "$RESULT" | jq -r '.reason')

            if [ "$ELIGIBLE" = "true" ]; then
              echo "Enabling auto-merge for PR #$pr (squash merge): $REASON"
              gh pr merge "$pr" --auto --squash || echo "Skipping #$pr: Auto-merge could not be enabled."
            else
              echo "Skipping #$pr: $REASON"
            fi
          done
