name: Merge Queue

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, opened, reopened]
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes fallback
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4/v5
        with:
          persist-credentials: false

      - name: Enable auto-merge for verified agent PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth status || true
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBERS="${{ github.event.pull_request.number }}"
          else
            PR_NUMBERS=$(gh pr list --label "has-pr" --state open --json number -q '.[].number')
          fi

          for pr in $PR_NUMBERS; do
            echo "Checking PR #$pr..."
            
            LABELS=$(gh pr view "$pr" --json labels -q '.labels[].name')
            
            HAS_PR=false
            NEEDS_REVIEW=false
            for label in $LABELS; do
              if [ "$label" = "has-pr" ]; then HAS_PR=true; fi
              if [ "$label" = "needs-review" ]; then NEEDS_REVIEW=true; fi
            done

            if [ "$HAS_PR" = "true" ] && [ "$NEEDS_REVIEW" = "false" ]; then
              echo "Enabling auto-merge for PR #$pr (squash merge)"
              gh pr merge "$pr" --auto --squash || echo "Skipping #$pr: Auto-merge could not be enabled."
            else
              if [ "$HAS_PR" = "false" ]; then
                echo "Skipping #$pr: Missing 'has-pr' label."
              fi
              if [ "$NEEDS_REVIEW" = "true" ]; then
                echo "Skipping #$pr: 'needs-review' label is present."
              fi
            fi
          done
