name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "apps/**"
      - "packages/rialto/**"
      - "packages/rialto-catalog/**"

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    if: github.event.action != 'closed'
    name: Detect Changed Apps
    runs-on: ubuntu-latest
    outputs:
      marketing: ${{ steps.filter.outputs.marketing }}
      hospitality: ${{ steps.filter.outputs.hospitality }}
      rialto: ${{ steps.filter.outputs.rialto-web }}
      any_changed: ${{ steps.check.outputs.any }}
      # One matrix entry per changed app, so `deploy-preview` starts a runner
      # only for an app this run will actually deploy (#10009).
      apps: ${{ steps.check.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        id: filter
        with:
          filters: |
            marketing:
              - 'apps/marketing/**'
              - 'packages/rialto/**'
            hospitality:
              - 'apps/hospitality/**'
              - 'packages/rialto/**'
              - 'packages/rialto-catalog/**'
            rialto-web:
              - 'apps/rialto-web/**'
              - 'packages/rialto/**'

      - id: check
        env:
          MARKETING: ${{ steps.filter.outputs.marketing }}
          HOSPITALITY: ${{ steps.filter.outputs.hospitality }}
          RIALTO: ${{ steps.filter.outputs.rialto-web }}
        run: |
          # No `&&` chains here: the default shell is `bash -e`, so a false
          # test would abort the step rather than skip an app.
          APPS=""
          if [ "$MARKETING" = "true" ]; then
            APPS="${APPS}{\"app\":\"marketing\",\"package\":\"@mbe/marketing\"}"
          fi
          if [ "$HOSPITALITY" = "true" ]; then
            APPS="${APPS:+$APPS,}{\"app\":\"hospitality\",\"package\":\"@mbe/hospitality\"}"
          fi
          if [ "$RIALTO" = "true" ]; then
            APPS="${APPS:+$APPS,}{\"app\":\"rialto-web\",\"package\":\"@mbe/rialto-web\"}"
          fi
          echo "apps=[$APPS]" >> "$GITHUB_OUTPUT"
          if [ -n "$APPS" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-preview:
    needs: detect-changes
    # Dependabot PRs run with the Dependabot secret scope, which is empty here
    # (`gh api repos/.../dependabot/secrets` -> total_count: 0), not the Actions
    # scope that holds the credentials below. So this job cannot authenticate on
    # such a PR and fails every time for a reason that has nothing to do with the
    # dependency — permanent red that trains readers to ignore red (#5623).
    # Skip rather than fail. Do NOT "fix" this by copying the secrets into the
    # Dependabot scope: that would hand a live credential to a build whose whole
    # content is a third-party dependency change.
    if: needs.detect-changes.outputs.any_changed == 'true' && github.actor != 'dependabot[bot]'
    name: Deploy Preview
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Built by `detect-changes`, not a static list of all three apps. A
        # static matrix started a runner per app and gated each *step* on that
        # app's filter, so a one-app PR booted three jobs: one that deployed
        # and two that checked out and exited in 7-8s, each after minutes of
        # queue wait (runs 46108332395, 46106631247). Those slots count
        # against the account's concurrent-job cap, which is what sets
        # ci.yml's queue wait (#10009).
        include: ${{ fromJSON(needs.detect-changes.outputs.apps) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install and build
        env:
          PKG: ${{ matrix.package }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "$PKG..." build

      - name: Deploy preview Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUM: ${{ github.event.pull_request.number }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          WORKER_NAME="mbe-preview-${PR_NUM}-${APP}"
          npx wrangler@3.114.17 deploy \
            --config "apps/${APP}/wrangler.toml" \
            --name "$WORKER_NAME" \
            --no-bundle | tee wrangler-deploy.log

          # Hand-composing "https://${WORKER_NAME}.workers.dev" omits the
          # account subdomain (a real host is <name>.<account-subdomain>.workers.dev)
          # and resolves nowhere (#4451). wrangler deploy prints the real
          # deployed URL, so read it back from its own output instead of
          # guessing it.
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' wrangler-deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "::error::wrangler deploy did not print a workers.dev URL for $WORKER_NAME"
            exit 1
          fi
          echo "$URL" > preview-url.txt

      - name: Upload preview URL
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-url-${{ matrix.app }}
          path: preview-url.txt
          retention-days: 1

  comment-preview:
    needs: [detect-changes, deploy-preview]
    if: needs.detect-changes.outputs.any_changed == 'true'
    name: Comment Preview URL
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download preview URLs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: preview-url-*
          path: preview-urls

      - name: Post preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          MARKETING: ${{ needs.detect-changes.outputs.marketing }}
          HOSPITALITY: ${{ needs.detect-changes.outputs.hospitality }}
          RIALTO: ${{ needs.detect-changes.outputs.rialto }}
        run: |
          # pipefail matters here: without it the `gh api | node` lookup below
          # reports node's exit code even when the listing itself failed, and a
          # broken listing silently reads as "no existing comment" — a
          # duplicate post instead of a loud failure.
          set -euo pipefail

          # Real deployed URLs, read back from wrangler's own output by the
          # deploy-preview matrix (see its "Deploy preview Worker" step) —
          # never hand-composed, which used to omit the account subdomain
          # and resolve nowhere (#4451).
          URLS=""
          if [ "$MARKETING" = "true" ] && [ -f preview-urls/preview-url-marketing/preview-url.txt ]; then
            URLS="${URLS}- **Marketing**: $(cat preview-urls/preview-url-marketing/preview-url.txt)\n"
          fi
          if [ "$HOSPITALITY" = "true" ] && [ -f preview-urls/preview-url-hospitality/preview-url.txt ]; then
            URLS="${URLS}- **Hospitality**: $(cat preview-urls/preview-url-hospitality/preview-url.txt)\n"
          fi
          if [ "$RIALTO" = "true" ] && [ -f preview-urls/preview-url-rialto-web/preview-url.txt ]; then
            URLS="${URLS}- **Rialto**: $(cat preview-urls/preview-url-rialto-web/preview-url.txt)\n"
          fi

          BODY=$(printf "## Preview Deployed\n\n${URLS}\n*Auto-deployed. Cleaned up on merge/close.*")

          # jq does projection only; the decision — including the
          # github-actions[bot] author check — is scripts/preview-comment.mjs,
          # where it is unit-tested. An author-blind contains() lookup let any
          # commenter pre-post the marker and capture every later run's PATCH
          # (the same gap review finding F4 closed in the visual-diff
          # publisher's isStandingComment).
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/issues/${PR_NUM}/comments" \
            --paginate \
            --jq '.[] | {id: .id, body: .body, login: .user.login}' \
            | node scripts/preview-comment.mjs)

          if [ -n "$EXISTING" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/${EXISTING}" \
              -X PATCH -f body="$BODY"
          else
            gh pr comment "$PR_NUM" --body "$BODY"
          fi

  cleanup:
    if: github.event.action == 'closed'
    name: Cleanup Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Delete preview Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          for APP in marketing hospitality rialto-web; do
            WORKER_NAME="mbe-preview-${PR_NUM}-${APP}"
            npx wrangler@3.114.17 delete --name "$WORKER_NAME" 2>/dev/null && \
              echo "Deleted $WORKER_NAME" || \
              echo "No preview for $WORKER_NAME"
          done
