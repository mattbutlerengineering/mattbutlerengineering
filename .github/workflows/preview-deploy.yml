name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "apps/**"
      - "packages/rialto/**"
      - "packages/rialto-catalog/**"

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    if: github.event.action != 'closed'
    name: Detect Changed Apps
    runs-on: ubuntu-latest
    outputs:
      marketing: ${{ steps.filter.outputs.marketing }}
      hospitality: ${{ steps.filter.outputs.hospitality }}
      rialto: ${{ steps.filter.outputs.rialto-web }}
      any_changed: ${{ steps.check.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        id: filter
        with:
          filters: |
            marketing:
              - 'apps/marketing/**'
              - 'packages/rialto/**'
            hospitality:
              - 'apps/hospitality/**'
              - 'packages/rialto/**'
              - 'packages/rialto-catalog/**'
            rialto-web:
              - 'apps/rialto-web/**'
              - 'packages/rialto/**'

      - id: check
        env:
          MARKETING: ${{ steps.filter.outputs.marketing }}
          HOSPITALITY: ${{ steps.filter.outputs.hospitality }}
          RIALTO: ${{ steps.filter.outputs.rialto-web }}
        run: |
          if [ "$MARKETING" = "true" ] || [ "$HOSPITALITY" = "true" ] || [ "$RIALTO" = "true" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-preview:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_changed == 'true'
    name: Deploy Preview
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: marketing
            filter: marketing
            package: "@mbe/marketing"
          - app: hospitality
            filter: hospitality
            package: "@mbe/hospitality"
          - app: rialto-web
            filter: rialto
            package: "@mbe/rialto-web"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        if: needs.detect-changes.outputs[matrix.filter] == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        if: needs.detect-changes.outputs[matrix.filter] == 'true'
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install and build
        env:
          FILTER: ${{ needs.detect-changes.outputs[matrix.filter] }}
          PKG: ${{ matrix.package }}
        run: |
          if [ "$FILTER" != "true" ]; then
            echo "Skipping — no changes"
            exit 0
          fi
          pnpm install --frozen-lockfile
          pnpm --filter "$PKG..." build

      - name: Deploy preview Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUM: ${{ github.event.pull_request.number }}
          APP: ${{ matrix.app }}
          FILTER: ${{ needs.detect-changes.outputs[matrix.filter] }}
        run: |
          set -euo pipefail
          if [ "$FILTER" != "true" ]; then exit 0; fi
          WORKER_NAME="mbe-preview-${PR_NUM}-${APP}"
          npx wrangler deploy \
            --config "apps/${APP}/wrangler.toml" \
            --name "$WORKER_NAME" \
            --no-bundle | tee wrangler-deploy.log

          # Hand-composing "https://${WORKER_NAME}.workers.dev" omits the
          # account subdomain (a real host is <name>.<account-subdomain>.workers.dev)
          # and resolves nowhere (#4451). wrangler deploy prints the real
          # deployed URL, so read it back from its own output instead of
          # guessing it.
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' wrangler-deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "::error::wrangler deploy did not print a workers.dev URL for $WORKER_NAME"
            exit 1
          fi
          echo "$URL" > preview-url.txt

      - name: Upload preview URL
        if: needs.detect-changes.outputs[matrix.filter] == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-url-${{ matrix.app }}
          path: preview-url.txt
          retention-days: 1

  comment-preview:
    needs: [detect-changes, deploy-preview]
    if: needs.detect-changes.outputs.any_changed == 'true'
    name: Comment Preview URL
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download preview URLs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: preview-url-*
          path: preview-urls

      - name: Post preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          MARKETING: ${{ needs.detect-changes.outputs.marketing }}
          HOSPITALITY: ${{ needs.detect-changes.outputs.hospitality }}
          RIALTO: ${{ needs.detect-changes.outputs.rialto }}
        run: |
          # Real deployed URLs, read back from wrangler's own output by the
          # deploy-preview matrix (see its "Deploy preview Worker" step) —
          # never hand-composed, which used to omit the account subdomain
          # and resolve nowhere (#4451).
          URLS=""
          if [ "$MARKETING" = "true" ] && [ -f preview-urls/preview-url-marketing/preview-url.txt ]; then
            URLS="${URLS}- **Marketing**: $(cat preview-urls/preview-url-marketing/preview-url.txt)\n"
          fi
          if [ "$HOSPITALITY" = "true" ] && [ -f preview-urls/preview-url-hospitality/preview-url.txt ]; then
            URLS="${URLS}- **Hospitality**: $(cat preview-urls/preview-url-hospitality/preview-url.txt)\n"
          fi
          if [ "$RIALTO" = "true" ] && [ -f preview-urls/preview-url-rialto-web/preview-url.txt ]; then
            URLS="${URLS}- **Rialto**: $(cat preview-urls/preview-url-rialto-web/preview-url.txt)\n"
          fi

          BODY=$(printf "## Preview Deployed\n\n${URLS}\n*Auto-deployed. Cleaned up on merge/close.*")

          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/issues/${PR_NUM}/comments" \
            --jq '.[] | select(.body | contains("Preview Deployed")) | .id' | head -1)

          if [ -n "$EXISTING" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/${EXISTING}" \
              -X PATCH -f body="$BODY"
          else
            gh pr comment "$PR_NUM" --body "$BODY"
          fi

  cleanup:
    if: github.event.action == 'closed'
    name: Cleanup Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Delete preview Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          for APP in marketing hospitality rialto-web; do
            WORKER_NAME="mbe-preview-${PR_NUM}-${APP}"
            npx wrangler delete --name "$WORKER_NAME" 2>/dev/null && \
              echo "Deleted $WORKER_NAME" || \
              echo "No preview for $WORKER_NAME"
          done
