name: Scheduled Workflow Health

on:
  schedule:
    # Daily at 08:00 UTC. release.yml (370 consecutive failures over 30 days)
    # and chaos-agent.yml (6 consecutive Monday failures) both survived weeks
    # undetected — ci-monitor watches main and open PRs, nothing watched the
    # scheduled fleet (#4276).
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Consecutive failing scheduled runs required to flag a workflow"
        required: false
        default: "3"

permissions:
  contents: read
  issues: write

jobs:
  check-scheduled-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Build gh-client
        # scripts/scheduled-workflow-health.mjs imports @mbe/gh-client, whose
        # package.json "exports" resolves to dist/index.js under Node — a
        # bare `node scripts/...` run without this step throws
        # ERR_MODULE_NOT_FOUND (see .claude/rules/gotchas.md § Build).
        run: pnpm build --filter @mbe/gh-client

      - name: Check scheduled workflow health
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Routed through env rather than interpolated into the run: block —
          # a workflow_dispatch input expanded directly into the shell command
          # is executable text. Matches the convention in every other
          # dispatchable workflow here (stale-human-blocked.yml, tier-classifier.yml).
          THRESHOLD: ${{ github.event.inputs.threshold || '3' }}
        run: |
          node scripts/scheduled-workflow-health.mjs --threshold "$THRESHOLD"
