name: Rialto Web Visual Regression

# Covers apps/rialto-web/e2e/visual.spec.ts — the /visual-test harness page
# rendered against the published @mattbutlerengineering/rialto package. This
# is distinct from rialto-visual.yml, which runs the package-local Storybook
# visual suite (packages/rialto/src/test/visual/**).
on:
  push:
    branches: [main]
    paths:
      - "apps/rialto-web/**"
      - "packages/rialto/src/**"
  pull_request:
    paths:
      - "apps/rialto-web/**"
      - "packages/rialto/src/**"

permissions:
  contents: read

jobs:
  visual:
    name: Visual Regression (rialto-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build rialto (styles + dist export required by rialto-web)
        run: pnpm build --filter @mattbutlerengineering/rialto
      - name: Install Playwright browsers
        run: pnpm --dir apps/rialto-web exec playwright install --with-deps chromium
      - name: Run visual regression tests
        # Invoke playwright directly (not the root `test:visual` script) so
        # the run is scoped to visual.spec.ts only — the root script's args
        # pass through a literal "--" that playwright doesn't strip, which
        # causes it to fall back to running the whole apps/rialto-web/e2e/
        # directory (a11y/interaction/navigation/theme specs included).
        run: pnpm exec playwright test --config apps/rialto-web/playwright.config.ts apps/rialto-web/e2e/visual.spec.ts
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rialto-web-visual-diffs
          path: apps/rialto-web/e2e/test-results/
          retention-days: 14
