name: Weekly Audit Sweep
on:
  schedule:
    - cron: "23 16 * * 1" # Monday 9:23am PT (16:23 UTC)
  workflow_dispatch: {} # Manual trigger

permissions:
  contents: read
  issues: write # files `audit` issues for down/erroring surfaces

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      AUDIT_TOKEN: ${{ secrets.AUDIT_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - name: Validate AUDIT_TOKEN
        run: |
          if [ -z "${AUDIT_TOKEN:-}" ]; then
            echo "::error::AUDIT_TOKEN secret is not configured. Site-audit requests will be blocked by Cloudflare Bot Management (HTTP 403)."
            echo "::error::Set AUDIT_TOKEN as a GitHub Actions repository secret. See infrastructure/AUDIT_BYPASS.md for setup instructions."
            exit 1
          fi
          echo "::notice::AUDIT_TOKEN is configured — audit requests will bypass Cloudflare Bot Management."

      - name: Run live-site availability sweep
        # Executes the deep audit here (not on claude.ai): GitHub runners have
        # both outbound egress and the AUDIT_TOKEN secret. The claude.ai remote
        # environment cannot reach the live site — its proxy denies the outbound
        # CONNECT tunnel (curl 56 / HTTP 000), so a cloud RemoteTrigger can never
        # audit production. Files deduped `audit` issues for down surfaces.
        run: bash scripts/audit/live-sweep.sh
