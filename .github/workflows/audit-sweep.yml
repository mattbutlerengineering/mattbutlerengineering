name: Weekly Audit Sweep
on:
  schedule:
    - cron: "23 16 * * 1" # Monday 9:23am PT (16:23 UTC)
  workflow_dispatch: {} # Manual trigger

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      AUDIT_TOKEN: ${{ secrets.AUDIT_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4/v5

      - name: Validate AUDIT_TOKEN
        run: |
          if [ -z "${AUDIT_TOKEN:-}" ]; then
            echo "::error::AUDIT_TOKEN secret is not configured. Site-audit requests will be blocked by Cloudflare Bot Management (HTTP 403)."
            echo "::error::Set AUDIT_TOKEN as a GitHub Actions repository secret. See infrastructure/AUDIT_BYPASS.md for setup instructions."
            exit 1
          fi
          echo "::notice::AUDIT_TOKEN is configured — audit requests will bypass Cloudflare Bot Management."

      - name: Trigger sweep audit
        run: |
          echo "::notice::Sweep audit scheduled — run '/site-audit sweep' via Claude Code remote trigger"
          echo "This workflow serves as a scheduling backup. Primary execution is via RemoteTrigger 'mbe-deep-audit'."
          echo ""
          echo "To run manually: claude --print '/site-audit sweep'"
          # Note: Full sweep execution requires Claude Code CLI with API access.
          # This workflow creates a GitHub notification as a scheduling reminder.
          # The actual execution happens via RemoteTriggers on claude.ai/code/scheduled.
