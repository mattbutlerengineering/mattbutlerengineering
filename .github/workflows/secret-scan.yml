name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request supersedes its older run (#8723: runners are
# capped at 20 concurrent jobs). Push runs fall back to the unique run id, so
# a run on main is never cancelled and never queues behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan PR diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          gitleaks detect \
            --source . \
            --log-opts="$BASE_SHA..HEAD" \
            --config .gitleaks.toml \
            --verbose \
            --redact \
            --exit-code 1

      - name: Scan HEAD commit on push to main
        if: github.event_name == 'push'
        run: |
          gitleaks detect \
            --source . \
            --log-opts="HEAD~1..HEAD" \
            --config .gitleaks.toml \
            --verbose \
            --redact \
            --exit-code 1
