name: Apps Visual Regression

# The VR floor for marketing and hospitality
# (docs/features/ui-quality-loop/architecture.md § Components "VR floor") —
# rialto-web-e2e.yml's visual pattern applied twice, in its own workflow so a
# visual-baseline diff stays distinguishable from a functional E2E failure
# (e2e.yml runs the bare `test:e2e` for both apps, whose base configs
# testIgnore visual.spec.ts).
#
#   - <app>-visual: e2e/visual.spec.ts only, named by FULL PATH (never a glob —
#     #3955), through the app's playwright.visual.config.ts. The spec
#     enumerates the coverage ledger's `page` rows, so a new route fails here
#     with a missing snapshot. Baselines are Linux-CI-runner-specific,
#     committed from visual-noise-floor.yml's `visual-actuals-replica-a`
#     artifact (see .claude/rules/gotchas.md), never from macOS.
#   - publish-<app>-visual-diffs: pull requests only; one sticky comment per
#     suite (`VISUAL_SUITE`), exactly as rialto-web-e2e.yml's publisher.
#
# Advisory: no ci.yml job needs this workflow, so it never moves CI Gate.
# Hospitality signs in through its `setup` project with the E2E Auth0
# credential (e2e.yml's five secrets), so it is skipped for Dependabot, whose
# builds hold none.
on:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - "apps/hospitality/**"
      - "packages/rialto/src/**"
      # The specs read the route set from these two files at test time.
      - "metrics/ui-quality-ledger.jsonl"
      - "scripts/ui-quality/route-fixtures.json"
      # The publisher and the pure modules it runs.
      - "scripts/publish-visual-diffs.mjs"
      - "scripts/visual-diff-comment.mjs"
      - "scripts/visual-diff-report.mjs"
      - "scripts/visual-diff-refs.mjs"
      - ".github/workflows/apps-visual.yml"
  pull_request:
    paths:
      - "apps/marketing/**"
      - "apps/hospitality/**"
      - "packages/rialto/src/**"
      # The specs read the route set from these two files at test time.
      - "metrics/ui-quality-ledger.jsonl"
      - "scripts/ui-quality/route-fixtures.json"
      # The publisher and the pure modules it runs.
      - "scripts/publish-visual-diffs.mjs"
      - "scripts/visual-diff-comment.mjs"
      - "scripts/visual-diff-report.mjs"
      - "scripts/visual-diff-refs.mjs"
      - ".github/workflows/apps-visual.yml"

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      marketing: ${{ steps.filter.outputs.marketing }}
      hospitality: ${{ steps.filter.outputs.hospitality }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            shared: &shared
              - 'packages/rialto/src/**'
              - 'metrics/ui-quality-ledger.jsonl'
              - 'scripts/ui-quality/route-fixtures.json'
              - 'scripts/publish-visual-diffs.mjs'
              - 'scripts/visual-diff-*.mjs'
              - '.github/workflows/apps-visual.yml'
            marketing:
              - *shared
              - 'apps/marketing/**'
            hospitality:
              - *shared
              - 'apps/hospitality/**'

  marketing-visual:
    name: Visual Regression (marketing)
    needs: [changes]
    if: needs.changes.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build rialto (styles + dist export required by marketing)
        run: pnpm build --filter @mattbutlerengineering/rialto
      - name: Build marketing (the visual config serves dist via vite preview)
        run: pnpm --dir apps/marketing exec vite build
      - name: Install Playwright browsers
        run: pnpm --dir apps/marketing exec playwright install --with-deps chromium
      - name: Run visual regression tests
        # `github` first so the inline annotations stay; `json` feeds the
        # publisher. The report lands outside e2e/test-results/, which IS the
        # diffs artifact.
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/visual-report/report.json
        run: pnpm exec playwright test --reporter=github,json --config apps/marketing/playwright.visual.config.ts apps/marketing/e2e/visual.spec.ts
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketing-visual-diffs
          path: apps/marketing/e2e/test-results/
          retention-days: 14
      - name: Upload the JSON report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketing-visual-report
          path: visual-report/report.json
          retention-days: 14
          if-no-files-found: ignore

  publish-marketing-visual-diffs:
    name: Publish Visual Diffs (marketing)
    needs: [marketing-visual]
    # always() so a passing run can retract a stale failure comment; a skipped
    # suite (its app untouched) has nothing to say.
    if: always() && github.event_name == 'pull_request' && needs.marketing-visual.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Decline on pull requests from forks
        id: fork-check
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          if [ "$HEAD_REPO" = "$THIS_REPO" ]; then
            echo "declined=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A fork's GITHUB_TOKEN is read-only, so the push would 403.
          echo "declined=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Visual diff publisher (marketing)"
            echo
            echo "- Declined: this pull request's head is \`$HEAD_REPO\`, not \`$THIS_REPO\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Download the JSON report
        if: steps.fork-check.outputs.declined == 'false'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: marketing-visual-report
          path: visual-report
      - name: Download the diff images
        if: steps.fork-check.outputs.declined == 'false'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: marketing-visual-diffs
          path: visual-diffs
      - name: Publish the diffs and upsert the comment
        if: steps.fork-check.outputs.declined == 'false'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VISUAL_OUTCOME: ${{ needs.marketing-visual.result }}
          REPORT_FILE: ${{ github.workspace }}/visual-report/report.json
          DIFF_ARTIFACT_DIR: ${{ github.workspace }}/visual-diffs
          VISUAL_SUITE: marketing
        run: |
          set -o pipefail
          node scripts/publish-visual-diffs.mjs

  hospitality-visual:
    name: Visual Regression (hospitality)
    needs: [changes]
    # Dependabot builds hold no E2E secrets (e2e.yml, #5623): skip, never fail.
    if: needs.changes.outputs.hospitality == 'true' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build rialto (styles + dist export required by hospitality)
        run: pnpm build --filter @mattbutlerengineering/rialto
      - name: Install Playwright browsers
        run: pnpm --dir apps/hospitality exec playwright install --with-deps chromium
      - name: Run visual regression tests
        # The `setup` project signs the E2E user in once (auth.setup.ts); the
        # dev server bakes the VITE_AUTH_* values in. Same values as e2e.yml.
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/visual-report/report.json
          VITE_AUTH_AUTHORITY: https://${{ secrets.E2E_AUTH0_DOMAIN }}
          VITE_AUTH_CLIENT_ID: ${{ secrets.E2E_AUTH0_CLIENT_ID }}
          VITE_AUTH_AUDIENCE: ${{ secrets.E2E_AUTH0_AUDIENCE }}
          VITE_AUTH_REDIRECT_URI: http://localhost:3002/hospitality/callback
          VITE_API_URL: http://localhost:3002
          E2E_AUTH0_DOMAIN: ${{ secrets.E2E_AUTH0_DOMAIN }}
          E2E_AUTH0_CLIENT_ID: ${{ secrets.E2E_AUTH0_CLIENT_ID }}
          E2E_AUTH0_AUDIENCE: ${{ secrets.E2E_AUTH0_AUDIENCE }}
          E2E_AUTH_EMAIL: ${{ secrets.E2E_AUTH_EMAIL }}
          E2E_AUTH_PASSWORD: ${{ secrets.E2E_AUTH_PASSWORD }}
        run: pnpm exec playwright test --reporter=github,json --config apps/hospitality/playwright.visual.config.ts apps/hospitality/e2e/visual.spec.ts
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hospitality-visual-diffs
          path: apps/hospitality/e2e/test-results/
          retention-days: 14
      - name: Upload the JSON report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hospitality-visual-report
          path: visual-report/report.json
          retention-days: 14
          if-no-files-found: ignore

  publish-hospitality-visual-diffs:
    name: Publish Visual Diffs (hospitality)
    needs: [hospitality-visual]
    if: always() && github.event_name == 'pull_request' && needs.hospitality-visual.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Decline on pull requests from forks
        id: fork-check
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          if [ "$HEAD_REPO" = "$THIS_REPO" ]; then
            echo "declined=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A fork's GITHUB_TOKEN is read-only, so the push would 403.
          echo "declined=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Visual diff publisher (hospitality)"
            echo
            echo "- Declined: this pull request's head is \`$HEAD_REPO\`, not \`$THIS_REPO\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Download the JSON report
        if: steps.fork-check.outputs.declined == 'false'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hospitality-visual-report
          path: visual-report
      - name: Download the diff images
        if: steps.fork-check.outputs.declined == 'false'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hospitality-visual-diffs
          path: visual-diffs
      - name: Publish the diffs and upsert the comment
        if: steps.fork-check.outputs.declined == 'false'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VISUAL_OUTCOME: ${{ needs.hospitality-visual.result }}
          REPORT_FILE: ${{ github.workspace }}/visual-report/report.json
          DIFF_ARTIFACT_DIR: ${{ github.workspace }}/visual-diffs
          VISUAL_SUITE: hospitality
        run: |
          set -o pipefail
          node scripts/publish-visual-diffs.mjs
