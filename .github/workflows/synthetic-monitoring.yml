name: Synthetic Monitoring

on:
  schedule:
    # Twice daily (8 AM and 8 PM UTC)
    - cron: "0 8,20 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    name: System Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Query /health/system
        id: health
        run: |
          RESPONSE=$(curl -sf --max-time 15 "https://mattbutlerengineering.com/health/system")
          STATUS=$(echo "$RESPONSE" | jq -r '.status')
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "response<<HEALTH_EOF" >> "$GITHUB_OUTPUT"
          echo "$RESPONSE" | jq '.' >> "$GITHUB_OUTPUT"
          echo "HEALTH_EOF" >> "$GITHUB_OUTPUT"

          echo "### System Health: $STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" | jq '.' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" = "unhealthy" ]; then
            echo "::error::System health is UNHEALTHY"
          elif [ "$STATUS" = "degraded" ]; then
            echo "::warning::System health is DEGRADED"
          else
            echo "All systems healthy."
          fi

      - name: Record latency samples to KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          KV_NS_ID: ${{ secrets.HEALTH_KV_NAMESPACE_ID }}
          HEALTH_RESPONSE: ${{ steps.health.outputs.response }}
        run: |
          HOUR_KEY=$(date -u +%Y-%m-%d-%H)

          # Extract per-service latencies from the health response
          LATENCIES=$(echo "$HEALTH_RESPONSE" | jq -c '{
            timestamp: now | todate,
            services: (
              [.services // {} | to_entries[] | {key: .key, value: {latency: (.value.latency // .value.checks[0].latency // null), status: .value.status}}]
              | from_entries
            )
          }' 2>/dev/null || echo '{}')

          if [ "$LATENCIES" != "{}" ]; then
            curl -sf -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NS_ID}/values/latency%2F${HOUR_KEY}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$LATENCIES"
            echo "Recorded latency sample for $HOUR_KEY"
          fi

      - name: Notify webhook on status change
        if: vars.HEALTH_WEBHOOK_URL != ''
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          KV_NS_ID: ${{ secrets.HEALTH_KV_NAMESPACE_ID }}
          WEBHOOK_URL: ${{ vars.HEALTH_WEBHOOK_URL }}
          CURRENT_STATUS: ${{ steps.health.outputs.status }}
          HEALTH_RESPONSE: ${{ steps.health.outputs.response }}
        run: |
          # Read previous status from KV
          PREV=$(curl -sf \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NS_ID}/values/health%2Fprevious-status" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" 2>/dev/null || echo "unknown")

          echo "Previous: $PREV → Current: $CURRENT_STATUS"

          # Store current status for next comparison
          curl -sf -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NS_ID}/values/health%2Fprevious-status" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: text/plain" \
            -d "$CURRENT_STATUS"

          # Only fire webhook on status transitions
          if [ "$PREV" = "$CURRENT_STATUS" ]; then
            echo "No status change — skipping webhook."
            exit 0
          fi

          case "$CURRENT_STATUS" in
            healthy)  EMOJI="✅"; COLOR=65280 ;;
            degraded) EMOJI="⚠️"; COLOR=16776960 ;;
            *)        EMOJI="🔴"; COLOR=16711680 ;;
          esac

          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          FAILING=$(echo "$HEALTH_RESPONSE" | jq -r '
            [(.services // {} | to_entries[] | select(.value.status != "healthy" and .value.status != "ok") | .key)] | join(", ")' 2>/dev/null || echo "")

          PAYLOAD=$(jq -nc \
            --arg emoji "$EMOJI" \
            --arg prev "$PREV" \
            --arg curr "$CURRENT_STATUS" \
            --arg ts "$TIMESTAMP" \
            --arg failing "$FAILING" \
            --argjson color "$COLOR" \
            '{
              content: "\($emoji) **Health status changed: \($prev) → \($curr)**\nTime: \($ts)\nFailing: \(if $failing == "" then "none" else $failing end)\nDashboard: https://mattbutlerengineering.com/status",
              embeds: [{
                title: "\($emoji) Health: \($prev) → \($curr)",
                color: $color,
                fields: [
                  {name: "Previous", value: $prev, inline: true},
                  {name: "Current", value: $curr, inline: true},
                  {name: "Failing", value: (if $failing == "" then "none" else $failing end), inline: false}
                ],
                timestamp: $ts
              }]
            }')

          curl -sf -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

          echo "Webhook fired: $PREV → $CURRENT_STATUS"

      - name: Record status transition to KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          KV_NS_ID: ${{ secrets.HEALTH_KV_NAMESPACE_ID }}
          CURRENT_STATUS: ${{ steps.health.outputs.status }}
        run: |
          KV_BASE="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NS_ID}/values"
          AUTH="-H \"Authorization: Bearer ${CF_API_TOKEN}\""

          # Read previous status
          PREV=$(curl -sf "${KV_BASE}/health%2Fprevious-status" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" 2>/dev/null || echo "unknown")

          # Only record if status actually changed
          if [ "$PREV" = "$CURRENT_STATUS" ]; then
            echo "No transition — skipping."
            exit 0
          fi

          # Read existing transitions (max 20 entries)
          EXISTING=$(curl -sf "${KV_BASE}/health%2Ftransitions" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" 2>/dev/null || echo "[]")

          # Append new transition and keep last 20
          UPDATED=$(echo "$EXISTING" | jq -c \
            --arg from "$PREV" \
            --arg to "$CURRENT_STATUS" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '. + [{from: $from, to: $to, timestamp: $ts}] | .[-20:]')

          curl -sf -X PUT "${KV_BASE}/health%2Ftransitions" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$UPDATED"

          echo "Recorded transition: $PREV → $CURRENT_STATUS"
        id: transitions

      - name: Load recent transitions for issue body
        if: steps.health.outputs.status != 'healthy'
        id: timeline
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          KV_NS_ID: ${{ secrets.HEALTH_KV_NAMESPACE_ID }}
        run: |
          TRANSITIONS=$(curl -sf \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NS_ID}/values/health%2Ftransitions" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" 2>/dev/null || echo "[]")

          # Format last 5 as markdown list
          TIMELINE=$(echo "$TRANSITIONS" | jq -r '.[-5:] | reverse | .[] | "- \(.from) → \(.to) at \(.timestamp)"')

          echo "timeline<<TIMELINE_EOF" >> "$GITHUB_OUTPUT"
          echo "$TIMELINE" >> "$GITHUB_OUTPUT"
          echo "TIMELINE_EOF" >> "$GITHUB_OUTPUT"

      - name: Check for existing health issue
        if: steps.health.outputs.status != 'healthy'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_STATUS: ${{ steps.health.outputs.status }}
        run: |
          LABEL="ci-fix"
          if [ "$HEALTH_STATUS" = "degraded" ]; then
            LABEL="audit"
          fi
          COUNT=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$LABEL" --label "auto-health" --json number --jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Create health alert issue
        if: steps.health.outputs.status != 'healthy' && steps.existing.outputs.count == '0'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4/v5
        with:
          sparse-checkout: docs/runbooks

      - name: Create health alert issue (cont.)
        if: steps.health.outputs.status != 'healthy' && steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_STATUS: ${{ steps.health.outputs.status }}
          HEALTH_RESPONSE: ${{ steps.health.outputs.response }}
          ISSUE_LABEL: ${{ steps.existing.outputs.label }}
          TIMELINE: ${{ steps.timeline.outputs.timeline }}
        run: |
          # Build a concise summary of what's wrong
          FAILED_SERVICES=$(echo "$HEALTH_RESPONSE" | jq -r '
            [.subsystems.services.checks | to_entries[] | select(.value.status != "ok") | .key] | join(", ")')
          FAILED_SITES=$(echo "$HEALTH_RESPONSE" | jq -r '
            [.subsystems.static_sites.checks | to_entries[] | select(.value.status != "ok") | .key] | join(", ")')
          CI_STATUS=$(echo "$HEALTH_RESPONSE" | jq -r '.subsystems.ci.status')
          DEPLOY_STATUS=$(echo "$HEALTH_RESPONSE" | jq -r '.subsystems.deploys.status')

          SUMMARY=""
          [ -n "$FAILED_SERVICES" ] && SUMMARY="${SUMMARY}Services down: ${FAILED_SERVICES}. "
          [ -n "$FAILED_SITES" ] && SUMMARY="${SUMMARY}Static sites down: ${FAILED_SITES}. "
          [ "$CI_STATUS" != "healthy" ] && SUMMARY="${SUMMARY}CI: ${CI_STATUS}. "
          [ "$DEPLOY_STATUS" != "healthy" ] && SUMMARY="${SUMMARY}Deploys: ${DEPLOY_STATUS}. "

          TITLE="System health ${HEALTH_STATUS}: ${SUMMARY}"
          TITLE="${TITLE:0:256}"
          DETECTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          {
            echo "## System Health Alert"
            echo
            echo "**Status:** \`${HEALTH_STATUS}\`"
            echo "**Detected:** ${DETECTED}"
            echo "**Source:** Synthetic monitoring (twice daily)"
            echo
            echo "To check current status: \`curl -s https://mattbutlerengineering.com/health/system | jq .\`"
            echo
            if [ -n "$TIMELINE" ]; then
              echo "### Recent Status Transitions"
              echo
              echo "${TIMELINE}"
              echo
            fi
            echo "---"
            echo
            if [ -n "$FAILED_SERVICES" ] && [ -f docs/runbooks/services-unhealthy.md ]; then
              cat docs/runbooks/services-unhealthy.md
              echo
            fi
            if [ -n "$FAILED_SITES" ] && [ -f docs/runbooks/static-sites-unhealthy.md ]; then
              cat docs/runbooks/static-sites-unhealthy.md
              echo
            fi
            if [ "$CI_STATUS" != "healthy" ] && [ -f docs/runbooks/ci-unhealthy.md ]; then
              cat docs/runbooks/ci-unhealthy.md
              echo
            fi
            if [ "$DEPLOY_STATUS" != "healthy" ] && [ -f docs/runbooks/deploys-unhealthy.md ]; then
              cat docs/runbooks/deploys-unhealthy.md
              echo
            fi
            echo "---"
            echo "*This issue was auto-created by synthetic monitoring. It will be picked up by the ship-loop or issue-worker.*"
          } > /tmp/health-body.md

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --body-file /tmp/health-body.md \
            --label "$ISSUE_LABEL" \
            --label "auto-health" \
            --label "ready"

      - name: Auto-close resolved health issues
        if: steps.health.outputs.status == 'healthy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUES=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "auto-health" --json number --jq '.[].number')
          for ISSUE_NUM in $ISSUES; do
            gh issue close "$ISSUE_NUM" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "Auto-closed: system health returned to **healthy** at $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo "Closed issue #$ISSUE_NUM"
          done
