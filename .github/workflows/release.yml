name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write
  # Required for the "Dispatch CI" step below -- GITHUB_TOKEN needs
  # actions:write to call the workflow-dispatch API.
  actions: write

jobs:
  release:
    name: Release @mattbutlerengineering/rialto
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@mattbutlerengineering"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rialto
        # Runs on every push, before the action below decides whether to
        # open/update a Version PR or publish. Harmless when there's nothing
        # to release; required when there is, since `publish:` needs dist/
        # already built. changesets/action never runs `version` and
        # `publish` in the same invocation (see the step comment), so there
        # is no "built at the wrong version" hazard from building first.
        run: pnpm --filter @mattbutlerengineering/rialto build

      - name: Create Version Packages PR or publish to GitHub Packages
        id: changesets
        # Standard changesets "Version PR" flow (#3322, replacing the old
        # direct-push-to-main flow that #5713 exposed as broken -- see PR
        # body for the "Invalid tree" history). On a push to main with
        # pending changesets, this opens/updates a `changeset-release/main`
        # PR running `version:`. Once that PR is reviewed and merged (no
        # changesets left), the next run on main has nothing to version and
        # runs `publish:` instead, using NODE_AUTH_TOKEN against the
        # registry-url/scope configured above (#5713).
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit: "chore: version packages"
          title: "chore: version packages"
          version: |
            # Detect whether changeset version skips CHANGELOG.md write silently.
            # This happens when prettier cannot resolve @mbe/config (see gotchas.md).
            PREV_HASH=$(sha256sum packages/rialto/CHANGELOG.md 2>/dev/null | cut -d' ' -f1 || echo "absent")

            # Bump versions in package.json, update CHANGELOG.md, consume .changeset/*.md files.
            # GITHUB_TOKEN is required by @changesets/changelog-github to resolve PR links.
            pnpm version-packages

            # If the CHANGELOG hash is unchanged, prettier silently skipped the write.
            # Prepend the version block manually so the file stays accurate.
            CURR_HASH=$(sha256sum packages/rialto/CHANGELOG.md 2>/dev/null | cut -d' ' -f1 || echo "absent")
            if [ "$PREV_HASH" = "$CURR_HASH" ]; then
              echo "::warning::packages/rialto/CHANGELOG.md was not updated — prepending manually"
              NEW_VER=$(node -p "require('./packages/rialto/package.json').version")
              EXISTING=$(cat packages/rialto/CHANGELOG.md 2>/dev/null || echo "# @mattbutlerengineering/rialto")
              BODY=$(printf '%s' "$EXISTING" | sed '1{/^#[[:space:]]/d}')
              printf '# @mattbutlerengineering/rialto\n\n## %s\n\n### Changes\n\nSee changeset details in git history.\n\n%s\n' \
                "$NEW_VER" "$BODY" > packages/rialto/CHANGELOG.md
            fi
          publish: pnpm exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch CI on the Version Packages PR branch
        # The PR above is opened/updated with GITHUB_TOKEN, so its
        # `pull_request` event never fires ci.yml (GitHub's anti-recursion
        # rule for GITHUB_TOKEN-authored events) -- CI Gate would never
        # appear and the PR would sit with no CI signal. workflow_dispatch
        # is the documented exception (an explicit API call, not a passive
        # event); ci.yml's CI Gate job also publishes a commit status (not
        # just a check run), so a dispatched run's result surfaces on the PR
        # even though it didn't come from `pull_request`. See
        # .claude/rules/gotchas.md § CI ("GITHUB_TOKEN-authored PRs never
        # fire CI Gate"). AUTOMATION_PAT, which would sidestep this by
        # authoring the PR as a real identity, is not configured as a repo
        # secret (docs/SECRETS.md) as of this writing -- see the PR body's
        # open question for Matt.
        if: steps.changesets.outputs.pullRequestNumber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref changeset-release/main
