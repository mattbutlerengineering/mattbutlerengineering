name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write
  # Required for the "Dispatch CI" step below -- GITHUB_TOKEN needs
  # actions:write to call the workflow-dispatch API.
  actions: write

jobs:
  release:
    name: Release @mattbutlerengineering/rialto
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@mattbutlerengineering"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rialto
        # Runs on every push, before the action below decides whether to
        # open/update a Version PR or publish. Harmless when there's nothing
        # to release; required when there is, since `publish-script:` needs
        # dist/ already built. changesets/action never runs `version-script`
        # and `publish-script` in the same invocation (see the step
        # comment), so there is no "built at the wrong version" hazard from
        # building first.
        run: pnpm --filter @mattbutlerengineering/rialto build

      - name: Create Version Packages PR or publish to GitHub Packages
        id: changesets
        # Standard changesets "Version PR" flow (#3322, replacing the old
        # direct-push-to-main flow that #5713 exposed as broken -- see PR
        # body for the "Invalid tree" history). On a push to main with
        # pending changesets, this opens/updates a `changeset-release/main`
        # PR running `version-script:`. Once that PR is reviewed and merged
        # (no changesets left), the next run on main has nothing to version
        # and runs `publish-script:` instead, using NODE_AUTH_TOKEN against
        # the registry-url/scope configured above (#5713).
        #
        # Input/output names are v2 (verified against the pinned SHA's real
        # action.yml, not assumed from v1 memory -- #5721 review, round 3):
        # `version-script`/`publish-script`/`commit-message`/`pr-title`, and
        # the output is `pr-number`, not `pullRequestNumber`.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # v2's version-script/publish-script inputs run through
          # @actions/exec's exec()/getExecOutput() with no `args` array,
          # which tokenizes the command STRING itself (argv splitting) --
          # it does not spawn a shell. An inline multi-line block with `#`
          # comments, `$(...)`, `if`/`fi`, and a redirect can't run that
          # way. scripts/release-version.sh checks the same logic into a
          # real file so `bash` -- not the tokenizer -- interprets it.
          version-script: bash scripts/release-version.sh
          publish-script: pnpm exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch CI on the Version Packages PR branch
        # The PR above is opened/updated with GITHUB_TOKEN, so its
        # `pull_request` event never fires ci.yml (GitHub's anti-recursion
        # rule for GITHUB_TOKEN-authored events) -- CI Gate would never
        # appear and the PR would sit with no CI signal. workflow_dispatch
        # is the documented exception (an explicit API call, not a passive
        # event); ci.yml's CI Gate job also publishes a commit status (not
        # just a check run), so a dispatched run's result surfaces on the PR
        # even though it didn't come from `pull_request`. See
        # .claude/rules/gotchas.md § CI ("GITHUB_TOKEN-authored PRs never
        # fire CI Gate"). AUTOMATION_PAT, which would sidestep this by
        # authoring the PR as a real identity, is not configured as a repo
        # secret (docs/SECRETS.md) as of this writing -- see the PR body's
        # open question for Matt.
        if: steps.changesets.outputs.pr-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref changeset-release/main
