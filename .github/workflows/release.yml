name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for the "Dispatch CI" step below -- GITHUB_TOKEN needs
  # actions:write to call the workflow-dispatch API.
  actions: write

jobs:
  release:
    name: Version Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Version Packages PR
        id: changesets
        # Version-only changesets flow (#3322, #9698). On a push to main with
        # pending changesets, this opens/updates a `changeset-release/main`
        # PR running `version-script:`. Nothing is published: rialto is
        # versioned with changesets but published to no registry (#9698), so
        # there is no `publish-script` and no registry auth. When no
        # changesets remain the action does nothing.
        #
        # Input/output names are v2 (verified against the pinned SHA's real
        # action.yml, not assumed from v1 memory -- #5721 review, round 3):
        # `version-script`/`commit-message`/`pr-title`, and the output is
        # `pr-number`, not `pullRequestNumber`.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # v2's version-script input runs through @actions/exec's
          # exec()/getExecOutput() with no `args` array, which tokenizes the
          # command STRING itself (argv splitting) -- it does not spawn a
          # shell. scripts/release-version.sh checks the logic into a real
          # file so `bash` -- not the tokenizer -- interprets it.
          version-script: bash scripts/release-version.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch CI on the Version Packages PR branch
        # The PR above is opened/updated with GITHUB_TOKEN, so its
        # `pull_request` event never fires ci.yml (GitHub's anti-recursion
        # rule for GITHUB_TOKEN-authored events) -- CI Gate would never
        # appear and the PR would sit with no CI signal. workflow_dispatch
        # is the documented exception (an explicit API call, not a passive
        # event); ci.yml's CI Gate job also publishes a commit status (not
        # just a check run), so a dispatched run's result surfaces on the PR
        # even though it didn't come from `pull_request`. See
        # .claude/rules/gotchas.md § CI ("GITHUB_TOKEN-authored PRs never
        # fire CI Gate"). AUTOMATION_PAT, which would sidestep this by
        # authoring the PR as a real identity, is not configured as a repo
        # secret (docs/SECRETS.md) as of this writing -- see the PR body's
        # open question for Matt.
        if: steps.changesets.outputs.pr-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref changeset-release/main
