name: Pulumi Deploy

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/pulumi/**"
      - "infrastructure/worker/**"
      - "apps/gen/**"
      - "packages/rialto/**"
      - "packages/rialto-catalog/**"
      - "packages/auth/**"
  # Run after static deploys so Service Binding targets exist before
  # Pulumi tries to reference them. Only triggers on successful completion.
  workflow_run:
    workflows: ["Deploy Static Sites"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pulumi-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Skip if triggered by a failed static deploy
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4/v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build gen app (Pulumi uploads assets from dist/)
        run: pnpm build --filter=@mbe/gen
        env:
          VITE_AUTH_AUTHORITY: https://dev-ytbgmz5ls3wh4xdx.us.auth0.com
          VITE_AUTH_CLIENT_ID: ${{ secrets.AUTH0_GEN_CLIENT_ID }}
          VITE_AUTH_AUDIENCE: https://api.mattbutlerengineering.com
          VITE_AUTH_REDIRECT_URI: https://mattbutlerengineering.com/gen/callback
          VITE_API_URL: https://mattbutlerengineering.com

      - name: Bundle edge router worker
        run: |
          mkdir -p infrastructure/worker/dist
          pnpm exec esbuild infrastructure/worker/edge-router.js \
            --bundle \
            --format=esm \
            --outfile=infrastructure/worker/dist/edge-router.js

      - name: Pulumi Cancel + Clear Pending Operations
        run: |
          cd infrastructure/pulumi
          pulumi login "s3://mattbutlerengineering-pulumi-state?endpoint=https://59d5bec2d6e979d474efe54ec76c3658.r2.cloudflarestorage.com&s3ForcePathStyle=true"
          pulumi cancel --stack organization/mbe-infrastructure/prod --yes || true
          # Remove stale pending operations from cancelled runs.
          # Without this, pulumi up tries to reconcile all pending ops first.
          pulumi stack export --stack organization/mbe-infrastructure/prod \
            | python3 -c "
          import sys, json
          state = json.load(sys.stdin)
          deployment = state.get('deployment', {})
          pending = deployment.get('pending_operations', [])
          if pending:
              print(f'Clearing {len(pending)} pending operations', file=sys.stderr)
              deployment['pending_operations'] = []
          json.dump(state, sys.stdout)
          " | pulumi stack import --stack organization/mbe-infrastructure/prod
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto

      - name: Pulumi Refresh (Sync state with cloud)
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: refresh
          stack-name: prod
          work-dir: infrastructure/pulumi
          cloud-url: "s3://mattbutlerengineering-pulumi-state?endpoint=https://59d5bec2d6e979d474efe54ec76c3658.r2.cloudflarestorage.com&s3ForcePathStyle=true"
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}

      - name: Pulumi Up
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: prod
          work-dir: infrastructure/pulumi
          cloud-url: "s3://mattbutlerengineering-pulumi-state?endpoint=https://59d5bec2d6e979d474efe54ec76c3658.r2.cloudflarestorage.com&s3ForcePathStyle=true"
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}

  report-health:
    name: Report Deploy Health
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write deploy/infrastructure status to KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          KV_NS_ID: ${{ secrets.HEALTH_KV_NAMESPACE_ID }}
          GH_SHA: ${{ github.sha }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          # No deploy attempted (job skipped) — leave the previous
          # deploy/infrastructure KV state in place instead of writing a
          # "cancelled" that the health worker reads as unhealthy
          if [ "$DEPLOY_RESULT" = "skipped" ]; then
            echo "No infrastructure deploy attempted; preserving previous deploy/infrastructure status"
            exit 0
          fi
          CONCLUSION="success"
          if [ "$DEPLOY_RESULT" = "failure" ]; then
            CONCLUSION="failure"
          elif [ "$DEPLOY_RESULT" = "cancelled" ]; then
            CONCLUSION="cancelled"
          fi
          PAYLOAD=$(jq -n \
            --arg conclusion "$CONCLUSION" \
            --arg sha "$GH_SHA" \
            --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{conclusion: $conclusion, sha: $sha, updated_at: $updated_at}')
          curl -sf -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NS_ID}/values/deploy%2Finfrastructure" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
