name: Pulumi Deploy

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/pulumi/**"
      - "infrastructure/worker/**"
      - "apps/gen/**"
      - "packages/rialto/**"
      - "packages/rialto-catalog/**"
      - "packages/auth/**"
  # Run after static deploys so Service Binding targets exist before
  # Pulumi tries to reference them. Only triggers on successful completion.
  workflow_run:
    workflows: ["Deploy Static Sites"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pulumi-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Skip if triggered by a failed static deploy
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build gen app (Pulumi uploads assets from dist/)
        run: pnpm build --filter=@mbe/gen
        env:
          VITE_AUTH_AUTHORITY: ${{ secrets.VITE_AUTH_AUTHORITY || 'https://dev-ytbgmz5ls3wh4xdx.us.auth0.com' }}
          VITE_AUTH_CLIENT_ID: ${{ secrets.AUTH0_GEN_CLIENT_ID }}
          VITE_AUTH_AUDIENCE: https://api.mattbutlerengineering.com
          VITE_AUTH_REDIRECT_URI: https://mattbutlerengineering.com/gen/callback
          VITE_API_URL: https://mattbutlerengineering.com

      - name: Bundle edge router worker
        run: |
          mkdir -p infrastructure/worker/dist
          pnpm exec esbuild infrastructure/worker/edge-router.js \
            --bundle \
            --format=esm \
            --outfile=infrastructure/worker/dist/edge-router.js

      # The runner image ships a preinstalled Pulumi and the steps below call it
      # straight off PATH. On 2026-08-11 the ubuntu24 image went 20260720.247 ->
      # 20260810.271, taking Pulumi 3.253.0 -> 3.256.0, whose S3 blob layer sends
      # upload checksums Cloudflare R2 rejects (InvalidDigest on the lock-file
      # PutObject) — production infra deploys broke for hours with zero repo
      # changes. Pin so the runner image cannot pick the version that deploys prod.
      - name: Pin Pulumi CLI
        run: |
          # `set -o pipefail` is not decorative here: without it a failed `curl`
          # feeds an empty script to `sh`, which exits 0, the step goes green
          # with no Pulumi installed, and the steps below silently resolve the
          # runner image's floating binary — the exact outage this pin exists to
          # prevent, now wearing a green check.
          set -euo pipefail
          curl -fsSL https://get.pulumi.com | sh -s -- --version 3.253.0
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Pulumi Cancel + Clear Pending Operations
        run: |
          cd infrastructure/pulumi
          pulumi login "s3://mattbutlerengineering-pulumi-state?endpoint=https://59d5bec2d6e979d474efe54ec76c3658.r2.cloudflarestorage.com&s3ForcePathStyle=true"
          pulumi cancel --stack organization/mbe-infrastructure/prod --yes || true
          # Remove stale pending operations from cancelled runs.
          # Without this, pulumi up tries to reconcile all pending ops first.
          pulumi stack export --stack organization/mbe-infrastructure/prod \
            | python3 -c "
          import sys, json
          state = json.load(sys.stdin)
          deployment = state.get('deployment', {})
          pending = deployment.get('pending_operations', [])
          if pending:
              print(f'Clearing {len(pending)} pending operations', file=sys.stderr)
              deployment['pending_operations'] = []
          json.dump(state, sys.stdout)
          " | pulumi stack import --stack organization/mbe-infrastructure/prod
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto

      - name: Pulumi Refresh (Sync state with cloud)
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: 3.253.0
          command: refresh
          stack-name: prod
          work-dir: infrastructure/pulumi
          cloud-url: "s3://mattbutlerengineering-pulumi-state?endpoint=https://59d5bec2d6e979d474efe54ec76c3658.r2.cloudflarestorage.com&s3ForcePathStyle=true"
          # TEMPORARY BYPASS — maintenance:pulumi-refresh-blocks-apply (Refs #5169, #4848)
          # Two Auth0 records were left in prod state by #4924 (applied 2026-09-09T17:05Z,
          # 403 on update:*) and orphaned by revert #5165; the Pulumi M2M grant lacks
          # read:tenant_settings / read:branding, so refreshing them 403s and blocks every
          # apply. Excluding them here (refresh), on `Pulumi Up` below, and in pulumi-preview.yml is a
          # bypass, not a fix. REMOVE all three blocks and
          # scripts/__tests__/pulumi-orphan-exclude-bypass.test.mjs when EITHER
          #   (a) the M2M grant carries read/update:tenant_settings + read/update:branding, OR
          #   (b) both URNs below are deleted from prod state.
          # Recipe and ordering: docs/fixes/pulumi-refresh-blocks-apply/release.md
          exclude: |
            urn:pulumi:prod::mbe-infrastructure::auth0:index/tenant:Tenant::mattbutlerengineering-tenant
            urn:pulumi:prod::mbe-infrastructure::auth0:index/branding:Branding::mattbutlerengineering-branding
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}

      - name: Pulumi Up
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: 3.253.0
          command: up
          stack-name: prod
          work-dir: infrastructure/pulumi
          cloud-url: "s3://mattbutlerengineering-pulumi-state?endpoint=https://59d5bec2d6e979d474efe54ec76c3658.r2.cloudflarestorage.com&s3ForcePathStyle=true"
          # TEMPORARY BYPASS — maintenance:pulumi-refresh-blocks-apply (Refs #5169, #4848)
          # Two Auth0 records were left in prod state by #4924 (applied 2026-09-09T17:05Z,
          # 403 on update:*) and orphaned by revert #5165; the Pulumi M2M grant lacks
          # read:tenant_settings / read:branding, so refreshing them 403s and blocks every
          # apply. Excluding them here (up), on `Pulumi Refresh` above, and in pulumi-preview.yml is a
          # bypass, not a fix. REMOVE all three blocks and
          # scripts/__tests__/pulumi-orphan-exclude-bypass.test.mjs when EITHER
          #   (a) the M2M grant carries read/update:tenant_settings + read/update:branding, OR
          #   (b) both URNs below are deleted from prod state.
          # Recipe and ordering: docs/fixes/pulumi-refresh-blocks-apply/release.md
          exclude: |
            urn:pulumi:prod::mbe-infrastructure::auth0:index/tenant:Tenant::mattbutlerengineering-tenant
            urn:pulumi:prod::mbe-infrastructure::auth0:index/branding:Branding::mattbutlerengineering-branding
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}

  report-health:
    name: Report Deploy Health
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
      - uses: ./.github/actions/report-deploy-health
        with:
          kv-key: deploy/infrastructure
          deploy-result: ${{ needs.deploy.result }}
          cf-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cf-api-token: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          kv-namespace-id: ${{ secrets.HEALTH_KV_NAMESPACE_ID }}
