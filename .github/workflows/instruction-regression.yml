name: Instruction Regression Testing

on:
  push:
    branches: [main]
    paths:
      - "CLAUDE.md"
      - "AGENTS.md"
      # The eval harness the job runs; a harness change must run the evals.
      - "plugins/acmm/scripts/evals/**"
      # evals/index.js --report imports ../evals.js, which imports evals-freshness.js.
      - "plugins/acmm/scripts/evals.js"
      - "plugins/acmm/scripts/evals-freshness.js"
      # The job pulls the data branch with this script before running the evals.
      - "scripts/metrics-data.mjs"
  pull_request:
    branches: [main]
    paths:
      - "CLAUDE.md"
      - "AGENTS.md"
      # The eval harness the job runs; a harness change must run the evals.
      - "plugins/acmm/scripts/evals/**"
      # evals/index.js --report imports ../evals.js, which imports evals-freshness.js.
      - "plugins/acmm/scripts/evals.js"
      - "plugins/acmm/scripts/evals-freshness.js"
      # The job pulls the data branch with this script before running the evals.
      - "scripts/metrics-data.mjs"
  workflow_dispatch: # Allow manual trigger

# A new push to a pull request supersedes its older run (#8723: runners are
# capped at 20 concurrent jobs). Push and manual runs fall back to the unique
# run id, so they are never cancelled and never queue behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instruction-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check out metrics-data
        # Telemetry lives on the orphan metrics-data branch, not main
        # (scripts/metrics-data.mjs). The eval harness reads and writes it in .metrics-data/.
        run: node scripts/metrics-data.mjs pull

      - name: Run Instruction Evals (Dry Run)
        run: |
          node plugins/acmm/scripts/evals/index.js --dry-run
          node plugins/acmm/scripts/evals/index.js --report

      - name: Verify Instruction File Integrity
        run: |
          # Basic check to ensure AGENTS.md remains the source of truth
          grep -q "Primary Source of Truth" CLAUDE.md
          # Ensure no residual markers
          ! grep -rE "<<<<<<|======|>>>>>>" CLAUDE.md AGENTS.md
