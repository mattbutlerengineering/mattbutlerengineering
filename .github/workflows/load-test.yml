name: Load Test

on:
  schedule:
    - cron: "0 6 * * 6"  # Saturday 6am UTC
  workflow_dispatch:
    inputs:
      baseline:
        description: "Run as baseline (skip comparison)"
        required: false
        default: "false"
        type: boolean

jobs:
  load-test:
    name: Run load tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run marketing load test
        uses: k6/action@v0.2.0
        with:
          method: GET
          url: https://mattbutlerengineering.com/
          duration: 30s
          vus: 100
        env:
          OUTPUT_JSON: marketing.json

      - name: Run users API health test
        uses: k6/action@v0.2.0
        with:
          method: GET
          url: https://api.mattbutlerengineering.com/api/v1/users/health
          duration: 30s
          vus: 50
        env:
          OUTPUT_JSON: users-api.json

      - name: Run reservations API health test
        uses: k6/action@v0.2.0
        with:
          method: GET
          url: https://api.mattbutlerengineering.com/api/health
          duration: 30s
          vus: 50
        env:
          OUTPUT_JSON: reservations-api.json

      - name: Store results in KV
        if: always()
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          KV_NS_ID: ${{ secrets.HEALTH_KV_NAMESPACE_ID }}
        run: |
          DATE=$(date +%Y-%m-%d)
          
          # Combine results
          echo '{"date":"'"$DATE"'", "marketing":{}}' | jq -s '.[0] * .[1]' - marketing.json > combined.json
          echo '{"reservations-api":{}}' | jq -s '.[0] * .[1]' - combined.json reservations-api.json > combined2.json
          echo '{"users-api":{}}' | jq -s '.[0] * .[1]' - combined2.json users-api.json > final.json
          
          # Write to KV
          curl -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/kv/namespaces/$KV_NS_ID/keys/loadtest/$DATE" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d @final.json || true

      - name: Compare with previous baseline
        if: ${{ !inputs.baseline }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          KV_NS_ID: ${{ secrets.HEALTH_KV_NAMESPACE_ID }}
        run: |
          DATE=$(date +%Y-%m-%d)
          PREV_DATE=$(date -d "7 days ago" +%Y-%m-%d)
          
          # Get previous results
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/kv/namespaces/$KV_NS_ID/values/loadtest/$PREV_DATE" \
            -H "Authorization: Bearer $CF_API_TOKEN" > prev.json
          
          # Parse and compare p95
          # This is simplified - in production would compare actual metrics
          echo "Comparing $DATE with $PREV_DATE"
          
          # Check for regression (simplified)
          # Would create issue if regression >50% (ci-fix) or >20% (audit)
