name: Shipped Features Snapshot

# Regenerates apps/marketing/src/data/shipped-features.json weekly (#6904,
# feature shipped-stories). The marketing site is static and never calls
# GitHub at runtime; only the collector below touches the GitHub API.
#
# Lands through the same automation-PR path metrics-collectors.yml uses: a
# bare `git push` to protected `main` is rejected with GH006, and
# GITHUB_TOKEN-authored PRs need CI and tier-classifier dispatched by hand
# (.claude/rules/gotchas.md § CI). A week with no new shipped features leaves
# the file unchanged, so create-pull-request opens nothing.

on:
  schedule:
    # Mondays at 10:41 UTC. Off-minute and off-hour to avoid the runner
    # congestion of the on-the-hour scheduled fleet.
    - cron: "41 10 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  # Required by the `gh workflow run` dispatch steps below.
  actions: write

jobs:
  snapshot:
    name: Regenerate shipped-features snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      # Workspace install + gh-client build: the collector imports
      # collect-queue-telemetry-from-github.mjs, which reaches @mbe/gh-client
      # (scripts/check-workflow-deps.mjs).
      - uses: ./.github/actions/setup-workspace

      - name: Build gh-client
        run: pnpm build --filter @mbe/gh-client...

      - name: Collect shipped-features snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect-shipped-features.mjs

      - name: Open PR with shipped-features snapshot
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        env:
          # The action commits inside the runner, firing the husky pre-commit
          # hook; check-adr needs @mbe/agent-core built, which this job
          # deliberately does not do for a data-only commit.
          HUSKY: "0"
        with:
          # See docs/SECRETS.md — without AUTOMATION_PAT this falls back to
          # GITHUB_TOKEN, whose pushes park every pull_request check at
          # action_required (#3684).
          token: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore(marketing): refresh shipped-features snapshot"
          title: "chore(marketing): refresh shipped-features snapshot"
          body: |
            Automated weekly snapshot of features the factory shipped.

            Generated by `.github/workflows/shipped-features-snapshot.yml` (#6904).
          branch: automation/shipped-features
          delete-branch: true
          add-paths: |
            apps/marketing/src/data/shipped-features.json
          labels: auto-merge

      - name: Dispatch CI on the automation branch
        # GITHUB_TOKEN-authored pushes/PRs don't trigger other workflows
        # (anti-recursion), so the pull_request CI run never fires and the PR
        # sits BLOCKED. workflow_dispatch is the documented exception.
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref automation/shipped-features

      - name: Dispatch tier-classifier on the automation branch
        # Same anti-recursion gap; the eligibility gate below fails closed
        # without a tier:* label (#4070).
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh workflow run tier-classifier.yml --ref automation/shipped-features -f pr="$PR_NUMBER"

      - name: Approve pending automation workflow runs
        # #3684/#3982: pull_request runs on this PR park at action_required.
        # Scoped to automation/* branches with the auto-merge label from the
        # one trusted automation author — never a blanket approval.
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: node scripts/approve-automation-runs.mjs approve --pr "$PR_NUMBER"

      - name: Wait for tier-classifier label
        # workflow_dispatch is fire-and-forget; without waiting, the gate
        # below reads labels too early and fails closed every time (#4070).
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: node scripts/wait-for-tier-label.mjs --pr "$PR_NUMBER"

      - name: Enable auto-merge
        # Through the same eligibility gate auto-merge.yml enforces, never a
        # bare `gh pr merge --auto`. A skip is the gate failing closed.
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          set -o pipefail
          LABELS_CSV=$(gh pr view "$PR_NUMBER" --json labels -q '[.labels[].name] | join(",")')
          AUTHOR=$(gh pr view "$PR_NUMBER" --json author -q '.author.login')
          RESULT=$(node scripts/merge-queue-eligibility.mjs check-merge --labels "$LABELS_CSV" --login "$AUTHOR")
          echo "$RESULT"
          if [ "$(echo "$RESULT" | jq -r '.eligible')" != "true" ]; then
            echo "::notice::Auto-merge not enabled for PR #$PR_NUMBER: $(echo "$RESULT" | jq -r '.reason')"
            exit 0
          fi

          echo "Enabling auto-merge for PR #$PR_NUMBER (squash)"
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
