name: Copilot Review Apply

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Analyze PR diff
        run: |
          echo "::notice::Copilot Review Apply — analyzing PR diff"
          CHANGED=$(git diff --name-only origin/main...HEAD | wc -l)
          echo "Files changed: $CHANGED"
          if [ "$CHANGED" -eq 0 ]; then
            echo "No changes to review"
            exit 0
          fi
          echo "Review complete — suggestions applied via ship-loop /ci-monitor"
