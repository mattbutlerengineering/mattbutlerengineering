name: tier-classifier

# Assigns a risk-tier label to every PR based on the rules in
# docs/change-tiers.md. Reviewers (and reviewer agents) read the label
# to decide which scrutiny applies.
#
# Agents and humans applying review-criteria.md can also read
# docs/change-tiers.md to classify by hand when needed.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: >-
          PR number to classify. Used by the four automation producers
          (production-feedback, drift-fix, pr-metrics, acmm-regression)
          whose GITHUB_TOKEN/AUTOMATION_PAT-authored `pull_request` event
          never reliably runs this workflow (#4070; see
          .claude/rules/gotchas.md § CI).
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tier-classifier-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Quoted env vars guard every untrusted input against shell injection.
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (PR head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          fetch-depth: 0
          # For a `pull_request` event this is the real PR head commit (not
          # the ephemeral merge ref actions/checkout would otherwise use). For
          # `workflow_dispatch` there is no `pull_request` payload, so this
          # expression evaluates to an empty string; actions/checkout falls
          # back to checking out `github.ref` in that case, which is exactly
          # the ref the four automation producers pass via `--ref` when
          # dispatching this workflow — i.e. still the PR's own head branch.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve PR metadata
        # Needs the repo checked out above (it runs a script that lives in
        # it). A `pull_request` event already carries title/body/base-ref/
        # fork-status in its payload, but `workflow_dispatch` only carries
        # the `pr` number input above — rather than branch the rest of this
        # job on which fields the triggering event happened to supply, both
        # paths resolve everything from the API by PR number here. See
        # scripts/resolve-pr-metadata.mjs.
        id: pr
        run: node scripts/resolve-pr-metadata.mjs --pr "$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Compute base SHA and diff
        id: diff
        env:
          PR_BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          base_sha=$(git merge-base "origin/${PR_BASE_REF}" HEAD)
          git diff --name-only "${base_sha}...HEAD" > /tmp/changed-files.txt
          added=$(git diff --shortstat "${base_sha}...HEAD" | awk '{print $4+0}')
          {
            echo "added=${added}"
            echo "count=$(wc -l < /tmp/changed-files.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Classify
        id: classify
        env:
          ADDED_LINES: ${{ steps.diff.outputs.added }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_BODY: ${{ steps.pr.outputs.body }}
          PR_IS_FORK: ${{ steps.pr.outputs.is_fork }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const files = fs.readFileSync('/tmp/changed-files.txt', 'utf-8').split('\n').filter(Boolean);

          const T1 = 1, T2 = 2, T3 = 3, T4 = 4;
          const TIER_NAMES = { 1: 'trivial', 2: 'standard', 3: 'sensitive', 4: 'critical' };

          const rules = [
            // T4 — critical
            { tier: T4, when: (f) => /^prisma\/migrations\//.test(f), why: 'prisma migration (post-classifier: migration-reviewer must flag destructive ops)' },
            { tier: T4, when: (f) => f === 'prisma/schema.prisma', why: 'prisma schema change' },
            { tier: T4, when: (f) => /^infrastructure\/pulumi\//.test(f), why: 'pulumi infra change' },
            { tier: T4, when: (f) => f === '.github/CODEOWNERS', why: 'CODEOWNERS edit' },
            { tier: T4, when: (f) => /^\.github\/workflows\/(codeql|coverage-gate|tier-classifier)\.yml$/.test(f), why: 'merge-gate workflow edit' },
            { tier: T4, when: (f) => /^services\/users\/src\/auth\//.test(f) || /^packages\/auth\/src\/middleware\//.test(f), why: 'auth-critical code path' },
            { tier: T4, when: (f) => f === 'docs/SECURITY-AI.md', why: 'SECURITY-AI.md edit' },

            // T3 — sensitive
            { tier: T3, when: (f) => /^services\/[^/]+\/src\/routes\//.test(f) || /^services\/[^/]+\/src\/middleware\//.test(f), why: 'service route or middleware' },
            { tier: T3, when: (f) => /^packages\/rialto\/src\/components\//.test(f), why: 'rialto component change' },
            { tier: T3, when: (f) => f === 'package.json' || /^pnpm-lock\.yaml$/.test(f), why: 'root deps or lockfile' },
            { tier: T3, when: (f) => /^(eslint\.config\.js|tsconfig.*\.json|turbo\.json)$/.test(f), why: 'root build/lint config' },
            { tier: T3, when: (f) => /^scripts\/check-/.test(f), why: 'gate-enforcement script' },
            { tier: T3, when: (f) => /^\.husky\//.test(f), why: 'pre-commit hook' },
            { tier: T3, when: (f) => /^apps\/[^/]+\/wrangler\.toml$/.test(f), why: 'wrangler config' },

            // T2 — standard
            { tier: T2, when: (f) => /^packages\/rialto\//.test(f), why: 'rialto non-component' },
            { tier: T2, when: (f) => /^services\/[^/]+\/src\//.test(f), why: 'service code' },
            { tier: T2, when: (f) => /^apps\/[^/]+\/src\//.test(f), why: 'app code' },
            { tier: T2, when: (f) => /^docs\/adr\//.test(f), why: 'new ADR' },

            // T1 — trivial
            { tier: T1, when: (f) => /\.md$/.test(f) && !/(SECURITY-AI|change-tiers|review-criteria)/.test(f), why: 'markdown only' },
            { tier: T1, when: (f) => /^\.changeset\//.test(f), why: 'changeset' },
            { tier: T1, when: (f) => f === '.editorconfig' || /^\.vscode\//.test(f), why: 'editor config' },
            { tier: T1, when: (f) => /^metrics\//.test(f), why: 'metrics append' },
            { tier: T1, when: (f) => /^(llms|llms-full)\.txt$/.test(f) || /\/(llms|llms-full)\.txt$/.test(f), why: 'auto-generated llms.txt' },
            { tier: T1, when: (f) => /\.test\.[tj]sx?$/.test(f), why: 'test-only' },
          ];

          let highest = 0;
          const reasons = new Set();
          for (const f of files) {
            for (const r of rules) {
              if (r.tier > highest && r.when(f)) {
                highest = r.tier;
                reasons.add(`\`${f}\` -> T${r.tier}: ${r.why}`);
              }
            }
          }
          if (highest === 0) {
            highest = T2;
            reasons.add(`unmatched paths default to T2: ${files.slice(0,3).join(', ')}${files.length > 3 ? `…` : ''}`);
          }

          const title = process.env.PR_TITLE || '';
          const body = process.env.PR_BODY || '';
          const added = parseInt(process.env.ADDED_LINES || '0', 10);
          const isFork = process.env.PR_IS_FORK === 'true';

          // PULL_REQUEST_TEMPLATE.md's own checklist item "No hardcoded
          // secrets or credentials" matches the keyword regex below twice, so
          // every PR that fills in the standard template escalated to T4
          // regardless of what it actually changed. Strip boilerplate
          // checklist lines (`- [ ]` / `- [x]`) before scanning for keywords
          // so template usage alone can't trigger this rule.
          const bodyProse = body
            .split('\n')
            .filter((line) => !/^\s*-\s\[[ xX]\]/.test(line))
            .join('\n');

          if (/secret|credential|rotate|leak|incident/i.test(title + ' ' + bodyProse)) {
            highest = T4;
            reasons.add('escalate to T4: title/body mentions secrets or incident');
          }
          // docs/change-tiers.md: "PR body explicitly asks reviewers to
          // bypass a check." The old /bypass.*check|skip.*review/i matched any
          // MENTION, so prose that merely documents or critiques a bypass
          // escalated too — PR #3919 said "documents `SKIP=semgrep ...` as a
          // way to bypass the Semgrep pre-commit check" and was labelled T4,
          // which manufactured issue #3921 for a human to read and close
          // (#3657 is the same class from the secrets rule, fixed in #3606).
          // Replayed over the last 300 PR bodies the old pattern escalated 9,
          // every one of them descriptive prose; this one escalates none of
          // them and still fires on an actual request (see
          // scripts/__tests__/tier-classifier-workflow.test.mjs).
          //
          // The discriminator is a request cue in the SAME sentence as the
          // bypass phrase, or a line-leading imperative. Description has
          // neither. Note this reads `bodyProse`, not `body`, so #3606's
          // checklist stripping now covers this rule too — a future
          // PULL_REQUEST_TEMPLATE.md line mentioning "skip review" can no
          // longer escalate every template-filled PR the way the secrets
          // keyword once did.
          const BYPASS_PHRASE = /\b(?:bypass|skip|override|disable)\b[^.\n]{0,60}\b(?:check|checks|ci|review|reviews|gate|gates|lint|test|tests)\b|\b(?:merge|approv(?:e|al)|land|ship)\b[^.\n]{0,30}\bwithout\b[^.\n]{0,30}\b(?:review|reviews|check|checks|ci|approval|tests?)\b/i;
          const REQUEST_CUE = /\b(?:please|pls|kindly)\b|\bcan (?:you|we)\b|\bcould (?:you|we)\b|\brequest(?:ing|ed|s)?\b|\b(?:i|we)\b[^.\n]{0,30}\b(?:need|want|ask(?:ing)?)\b/i;
          const IMPERATIVE = /^\s*(?:[-*]\s*)?(?:please\s+)?(?:bypass|skip|override|disable)\b[^.\n]{0,60}\b(?:check|ci|review|gate|lint|test)/i;

          const asksToBypass = bodyProse
            .split(/(?<=[.!?])\s+|\n/)
            .some((s) => (BYPASS_PHRASE.test(s) && REQUEST_CUE.test(s)) || IMPERATIVE.test(s));

          if (asksToBypass) {
            highest = T4;
            reasons.add('escalate to T4: PR body asks reviewers to bypass a check');
          }
          if (added > 1000 && highest < T4) {
            highest = Math.min(T4, highest + 1);
            reasons.add(`escalate one tier: ${added} lines added`);
          }
          if (isFork && highest < T4) {
            highest = Math.min(T4, highest + 1);
            reasons.add('escalate one tier: PR from fork');
          }

          const labelName = `tier:${TIER_NAMES[highest]}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tier=${highest}\nlabel=${labelName}\nreasons=${[...reasons].join(' · ')}\n`);
          console.log(`Classified: ${labelName} (T${highest})`);
          for (const r of reasons) console.log(`  - ${r}`);
          NODE

      - name: Ensure tier labels exist
        run: |
          for tier in trivial standard sensitive critical; do
            case "$tier" in
              trivial)   color=cccccc;;
              standard)  color=1f883d;;
              sensitive) color=bf8700;;
              critical)  color=b60205;;
            esac
            gh label create "tier:${tier}" --force --color "$color" --description "Change-tier classification (see docs/change-tiers.md)" || true
          done

      - name: Apply tier label
        env:
          NEW_LABEL: ${{ steps.classify.outputs.label }}
        run: |
          for existing in $(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep '^tier:' || true); do
            if [ "$existing" != "$NEW_LABEL" ]; then
              gh pr edit "$PR_NUMBER" --remove-label "$existing"
            fi
          done
          gh pr edit "$PR_NUMBER" --add-label "$NEW_LABEL"

      - name: Comment classification rationale
        env:
          NEW_LABEL: ${{ steps.classify.outputs.label }}
          REASONS: ${{ steps.classify.outputs.reasons }}
        run: |
          # Untrusted inputs are quoted via env vars; the comment body is constructed
          # in a heredoc so no further interpolation happens at the shell level.
          body=$(cat <<EOF
          **Classified as \`${NEW_LABEL}\`** by tier-classifier.

          ${REASONS}

          See [docs/change-tiers.md](../blob/main/docs/change-tiers.md) for the rules and what review applies.
          EOF
          )
          gh pr comment "$PR_NUMBER" --body "$body"
