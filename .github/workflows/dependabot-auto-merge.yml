name: Auto-merge Dependabot dev deps

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        uses: dependabot/fetch-metadata@v2
        id: metadata

      - name: Auto-merge dev-deps (patch and minor only)
        if: >-
          steps.metadata.outputs.dependency-group == 'dev-deps' &&
          steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on production dependency PRs
        if: steps.metadata.outputs.dependency-group != 'dev-deps'
        run: |
          gh pr comment "$PR_URL" --body "⚠️ This is a production dependency update and requires manual review."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
