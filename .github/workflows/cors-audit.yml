name: CORS Audit

on:
  schedule:
    # 1st of every month at 5:00 AM UTC
    - cron: "0 5 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: CORS Configuration Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Build gh-client
        # scripts/cors-audit.mjs imports @mbe/gh-client (via
        # sensors-registry.mjs), whose package.json "exports" resolves to
        # dist/index.js under Node — a bare `node scripts/...` run without
        # this step throws ERR_MODULE_NOT_FOUND (see .claude/rules/gotchas.md
        # § Build).
        run: pnpm build --filter @mbe/gh-client

      - name: Run CORS audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cors-audit.mjs
