name: CORS Audit

on:
  schedule:
    # 1st of every month at 5:00 AM UTC
    - cron: "0 5 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: CORS Configuration Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run CORS audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cors-audit.mjs
