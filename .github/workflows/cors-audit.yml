name: CORS Audit

on:
  schedule:
    # 1st of every month at 5:00 AM UTC
    - cron: "0 5 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: CORS Configuration Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4/v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run CORS audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cors-audit.mjs
