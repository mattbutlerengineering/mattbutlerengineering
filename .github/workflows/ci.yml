name: CI

on:
  push:
    branches: [main]
    # `docs/**` and `**.md` are deliberately NOT ignored. `detect-changes` sets
    # has_code=false for a docs-only commit and every expensive job chains to
    # `prepare`, which is gated on has_code == 'true' — so such a push runs
    # only detect-changes + docs-format + trivy + ci-gate. Ignoring them here
    # instead meant a docs-only commit reaching main (by merge or by direct
    # push) was never prettier-checked, and the dirty files then failed "Run
    # Full Repository Audit" on the next code PR (#4787 -> #4790/#4792/#4797
    # and main a4473b0f9; the direct-push half is #4664, 7d259272a).
    paths-ignore:
      - "*.png"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  # Bare workflow_dispatch trigger — lets other workflows (e.g. pr-metrics.yml)
  # dispatch a CI run on a branch after a GITHUB_TOKEN-created PR, working
  # around GitHub's anti-recursion rule (workflow_dispatch is a documented
  # exception). Every job below is event-agnostic except migration-dry-run,
  # which is intentionally pull_request-only and treated as an allowed
  # "skipped" by the CI Gate job, so a dispatch run still completes and
  # reports CI Gate on the dispatched ref's head SHA.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_code: ${{ steps.filter.outputs.has_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: filter
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE_CHANGES=$(git diff --name-only "origin/$BASE_REF"...HEAD -- . ':!*.md' ':!docs/' ':!*.png' ':!.gitignore' ':!LICENSE' | wc -l | tr -d ' ')
          if [ "$CODE_CHANGES" -gt 0 ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: Prepare
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Cache Prisma clients
        id: cache-prisma
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/*/src/generated
          key: prisma-clients-${{ hashFiles('services/*/prisma/schema.prisma') }}

      - name: Generate Prisma clients
        if: steps.cache-prisma.outputs.cache-hit != 'true'
        run: |
          # Derive service list from the workspace — no hardcoded names
          for SERVICE in $(node scripts/discover-prisma-services.mjs); do
            PKG=$(node -e "const p=require('./services/$SERVICE/package.json'); process.stdout.write(p.name)")
            pnpm --filter "$PKG" db:generate
          done

  dependency-audit:
    name: Dependency Sync
    needs: [prepare]
    runs-on: ubuntu-latest
    # Measured 3m39s on main (run 33219164956) — 28 sequential npx spawns.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Run Dependency Audit
        run: node scripts/check-dep-sync.mjs

  # Docs-only PRs skip the entire Build chain (which is where `pnpm repo-audit`
  # runs `prettier --check .`) because it is gated on `has_code == 'true'`, and
  # the push trigger's `paths-ignore` lists `docs/**` / `**.md` so a docs-only
  # merge runs no push CI either. Measured consequence (2026-08-31): #4787
  # merged six unformatted run docs with CI Gate green, and the dirty files then
  # failed "Run Full Repository Audit" on the next code PR's merge ref and on
  # every main push -- reddening #4790/#4792/#4797 and main (`a4473b0f9`) for a
  # fault none of them contained. Recovery was worse than the break: `gh run
  # rerun --failed` re-uses the original merge SHA, so it kept failing after
  # main was fixed, and the docs-only fix commit triggered no push CI of its own
  # to retro-green main.
  #
  # This job is the missing half: when the Build chain will NOT run, run the
  # formatting check anyway. It calls `pnpm check:prettier` -- the very script
  # repo-audit calls -- rather than re-implementing the glob, so the two cannot
  # drift. Deliberately does not run when `has_code == 'true'`: the Build chain
  # already covers that case and duplicating it would just spend a runner.
  docs-format:
    name: Docs Formatting
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_code != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Check formatting
        run: pnpm check:prettier

  hadolint:
    name: Dockerfile Lint
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: "services/users/Dockerfile"

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: "services/reservations/Dockerfile"

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: "services/agent/Dockerfile"

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: "infrastructure/migrate/Dockerfile"

  trivy:
    name: Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # upload-sarif calls the code-scanning API, which requires
    # security-events: write. The workflow default is contents: read only,
    # so without this override the upload step fails with
    # "Resource not accessible by integration" and takes CI Gate red.
    permissions:
      contents: read
      security-events: write

    strategy:
      matrix:
        dockerfile:
          - { path: "services/users/Dockerfile", name: "users" }
          - { path: "services/reservations/Dockerfile", name: "reservations" }
          - { path: "services/agent/Dockerfile", name: "agent" }
          - { path: "infrastructure/migrate/Dockerfile", name: "migrate" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: "fs"
          scan-ref: ${{ matrix.dockerfile.path }}
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          format: "sarif"
          # Without this, trivy-action drops the `severity` filter for SARIF
          # output (it wants complete data for the Security tab), so `exit-code`
          # would trip on LOW/MEDIUM misconfig findings too (e.g. missing
          # HEALTHCHECK) instead of only CRITICAL/HIGH.
          limit-severities-for-sarif: "true"
          output: ${{ matrix.dockerfile.name }}-trivy-results.sarif

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always()
        # Best-effort: the Trivy scan above is the actual gate (exit-code 1 on
        # CRITICAL/HIGH). The Security-tab upload is a convenience; if it fails
        # (code-scanning disabled, API hiccup) it must never hold main red.
        continue-on-error: true
        with:
          sarif_file: ${{ matrix.dockerfile.name }}-trivy-results.sarif
          category: trivy-${{ matrix.dockerfile.name }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [prepare]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Cache for Turbo
        # #3388: see the Typecheck job's identical step for rationale.
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: [prepare]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Cache for Turbo
        # #3388: backs Turborepo remote caching with GitHub Actions' own
        # cache (actions/cache under the hood) instead of a Vercel
        # TURBO_TOKEN — no Vercel account or secret needed. Starts a local
        # proxy server and exports TURBO_API/TURBO_TOKEN/TURBO_TEAM (fixed,
        # non-secret values — the action always sets `turbogha`/`turbogha`
        # and a `localhost` API URL, see rharkor/caching-for-turbo's own
        # src/lib/server/utils.ts) for every later step in this job that
        # runs `turbo` (via `pnpm typecheck`/`lint`/`build`/`turbo
        # test:coverage`). Wired into the four jobs that actually invoke
        # turbo tasks (lint, typecheck, test, build) rather than the shared
        # setup-workspace action, so jobs with no turbo task (integrity,
        # docs-format, migrations, etc.) don't pay for a cache server they'd
        # never use. Pinned by commit SHA per repo convention.
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Restore Prisma clients
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/*/src/generated
          key: prisma-clients-${{ hashFiles('services/*/prisma/schema.prisma') }}

      - name: Restore turbo local cache
        # #4504: added when CI had zero turbo cache reuse of any kind (remote
        # caching was inert — TURBO_TOKEN unset — and nothing ever cached the
        # local `.turbo/cache` dir turbo.json pins, #3786). #3388 landed real
        # remote caching via the "Cache for Turbo" step above; this step
        # stays as a cheap, whole-directory same-lockfile restore that can
        # beat a per-task remote-cache round-trip. Keyed on the
        # pnpm-lock.yaml hash so a lockfile-touching PR (a turbo
        # globalDependencies entry) rotates the key instead of restoring a
        # stale cache across the change that invalidates every task.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Typecheck
        run: pnpm typecheck

  architecture-audit:
    name: Architecture Audit
    runs-on: ubuntu-latest
    needs: [prepare]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Build CLI and its dependencies
        run: pnpm build --filter @mbe/cli...

      - name: Run ADR and Dependency Checks
        run: |
          pnpm --filter @mbe/cli start check-adr
          pnpm --filter @mbe/cli start check-deps

  integrity:
    name: Integrity
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      # Generated-artifact staleness (llms.txt, registry.json, dep-graph.json,
      # generated-schemas.ts, dependency-graph.md) is now verified in one
      # manifest-driven step in the `build` job ("Verify generated artifacts are
      # in sync"). This job keeps the non-regenerated doc validators below.

      - name: Check for instruction rot
        run: node scripts/detect-instruction-rot.mjs

      - name: Check doc freshness
        run: node scripts/check-doc-freshness.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, architecture-audit]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          # Full history: repo-audit's check-rialto-changeset diffs against
          # `git merge-base HEAD origin/main`, which a depth-1 clone cannot
          # resolve (same requirement as migration-dry-run). The check fails
          # closed on an unresolvable base, so dropping this breaks the job
          # loudly rather than silently skipping the gate.
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Cache for Turbo
        # #3388: see the Typecheck job's identical step for rationale.
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Restore Prisma clients
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/*/src/generated
          key: prisma-clients-${{ hashFiles('services/*/prisma/schema.prisma') }}

      - name: Restore turbo local cache
        # #4504: see the Typecheck job's identical step for rationale.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Check rialto exports map is in sync
        run: pnpm --filter @mattbutlerengineering/rialto exports:check

      - name: Build all packages
        run: pnpm build

      - name: Run Full Repository Audit
        run: pnpm repo-audit

      - name: Run pnpm audit (network-resilient)
        # #4993: `pnpm audit --audit-level=high` lives in its own step, not
        # inside `repo-audit`'s chain, specifically so this outer retry loop
        # wraps ONLY the network-dependent registry call — never masking a
        # real repo-audit failure (lint/circular-deps/schema-compat/etc.)
        # behind a retry.
        #
        # pnpm's own built-in retry (2 attempts: 10s, then 1min backoff)
        # wasn't enough headroom for `ERR_SOCKET_TIMEOUT` against
        # registry.npmjs.org/-/npm/v1/security/audits — four separate Build
        # job runs hit the identical signature in one night, and it recurred
        # on PR #4967, while every other CI job passed on the same commits.
        # This adds a second, outer retry layer on top of pnpm's own.
        #
        # Only retry a TRANSIENT failure (classified by the pure, unit-tested
        # isTransientAuditError() in scripts/audit-transient-error.mjs, the
        # same pattern as the CI Gate commit-status publish step below) — a
        # real high-severity advisory must still fail the job on the first
        # attempt, never get masked by a retry. See the § Dependencies
        # gotcha in .claude/rules/gotchas.md for that failure mode.
        run: |
          for i in 1 2 3; do
            OUTPUT=$(pnpm run audit:security 2>&1) && { echo "$OUTPUT"; exit 0; }
            echo "$OUTPUT"
            if printf '%s' "$OUTPUT" | node scripts/audit-transient-error.mjs; then
              echo "pnpm audit attempt $i failed with a transient network error, retrying in 30s..."
              sleep 30
            else
              echo "::error::pnpm audit failed with a non-transient result (likely a real high-severity advisory)"
              exit 1
            fi
          done
          echo "::error::pnpm audit failed after 3 attempts, all classified transient — registry may be down"
          exit 1

      - name: Verify generated artifacts are in sync
        # Single manifest-driven staleness check (scripts/regen-manifest.mjs is
        # the source of truth), replacing five separate regenerate+git-diff
        # stanzas: llms.txt, registry.json, dep-graph.json, generated-schemas.ts,
        # and dependency-graph.md. `pnpm regen` regenerates every committed
        # artifact; `pnpm regen --check` then fails if any drifted, naming the
        # stale artifact and the exact fix command. Add new artifacts to the
        # manifest, not here.
        run: |
          pnpm regen
          pnpm regen --check

      - name: Check bundle size budgets
        run: pnpm size:check

  a11y-attribution:
    name: Accessibility AI Attribution
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'agent-') || startsWith(github.head_ref, 'worktree-agent-'))
    needs: [prepare]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Run a11y tests (accessibility vitest)
        run: pnpm --filter @mattbutlerengineering/rialto exec vitest run --reporter=json --outputFile=../../a11y-results.json src/test/accessibility src/test/token-contrast.test.ts

      - name: Process results and fail on agent violations
        if: always()
        run: node scripts/process-a11y-results.mjs
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Comment a11y violations on PR
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const violationsFile = 'a11y-violations.json';
            if (!fs.existsSync(violationsFile)) return;
            const entry = JSON.parse(fs.readFileSync(violationsFile, 'utf8'));
            if (!entry.violations || entry.violations.length === 0) return;

            const rows = entry.violations
              .map(v => `| ${v.name.replace(/\|/g, '\\|')} | ${v.error.split('\n')[0].replace(/\|/g, '\\|')} |`)
              .join('\n');

            const body = [
              '## Accessibility violations detected in AI-generated code',
              '',
              `**Branch:** \`${entry.branch}\`  `,
              `**Failures:** ${entry.numFailures} of ${entry.numTests} tests`,
              '',
              '| Test | Error |',
              '|------|-------|',
              rows,
              '',
              'Fix these violations before merging. Run `pnpm --filter @mattbutlerengineering/rialto exec vitest run src/test/accessibility` locally to reproduce.',
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [lint, typecheck, architecture-audit]

    # Single source of truth for the repo-wide coverage threshold, enforced on
    # the Node-22 leg below. The stricter agent-core package gate (80%) is a
    # deliberately separate, package-specific rule — not a competing repo number.
    env:
      COVERAGE_THRESHOLD: 60

    strategy:
      fail-fast: false
      matrix:
        # Single Node major, identical on every trigger (pull_request, push,
        # merge_group, schedule). Node 20 was previously tested only on
        # non-PR events, which let a Node-20-only failure land on main before
        # anyone saw it (#3558) — see #3570 and .claude/rules/gotchas.md.
        node-version: [22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache for Turbo
        # #3388: see the Typecheck job's identical step for rationale.
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Restore Prisma clients
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/*/src/generated
          key: prisma-clients-${{ hashFiles('services/*/prisma/schema.prisma') }}

      - name: Restore turbo local cache
        # #4504: see the Typecheck job's identical step for rationale.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Run tests with coverage
        # #4519 added `--concurrency=2` after that PR's Test job timed out
        # 3/3 while main stayed green. The comment here used to assert a
        # specific cause — that restoring .turbo/cache removed an incidental
        # stagger and let turbo's fan-out stampede a 2-core runner. That
        # explanation is retracted (#4558): the varying victim was already
        # explained by #4541 raising one test's timeout, and re-running the
        # failed jobs at e41d5a6a, the unchanged pre-cap commit, passed. The
        # stampede was never reproduced.
        #
        # The cap stays, and is no longer entirely unmeasured — but mind what
        # was measured. #5546 ran the suite on one developer machine, same
        # commit and cold cache, once per setting: turbo's default fan-out of
        # 10 failed on apps/rialto-web page-registry.test.ts at 15000ms, a cap
        # of 2 passed all 50 tasks. One sample per setting, off-runner,
        # pass/fail only, and 10-against-2 rather than cap-against-no-cap — it
        # shows the cap does something, not that this job needed it. The
        # CI-side A/B #4558 asks for (several runs per setting on one commit,
        # comparing this job's duration and failure rate) is still unrun.
        #
        # Nothing suggests the cap costs wall-clock time: capped 32810596143
        # took 7m45s, uncapped control 32776034661 9m35s, uncapped failing
        # 32772737595 5m59s. The control reran failed jobs only, so three
        # samples settle nothing either way — they are just not evidence
        # against the cap.
        #
        # Before dropping the flag, read
        # scripts/__tests__/nightly-compliance-workflow.test.mjs: it asserts
        # this line still declares a cap and fails if the nightly runs the
        # suite more parallel than this job — the mismatch behind ten red
        # nights (#5203 … #5517).
        run: pnpm turbo test:coverage --concurrency=2

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-node${{ matrix.node-version }}
          path: "**/test-results/*.xml"
          retention-days: 14

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/auth/coverage/coverage-final.json,./packages/agent-core/coverage/coverage-final.json,./packages/rialto/coverage/coverage-final.json,./packages/rialto-catalog/coverage/coverage-final.json,./packages/api-client/coverage/coverage-final.json,./packages/observability/coverage/coverage-final.json,./packages/mcp-server/coverage/coverage-final.json,./services/users/coverage/coverage-final.json,./services/reservations/coverage/coverage-final.json,./services/agent/coverage/coverage-final.json,./apps/hospitality/coverage/coverage-final.json,./tools/cli/coverage/coverage-final.json,./infrastructure/pulumi/coverage/coverage-final.json,./infrastructure/worker/coverage/coverage-final.json,./scripts/coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true

      - name: Enforce repo-wide coverage threshold
        if: matrix.node-version == 22
        run: |
          # Repo-wide statement coverage across every package's coverage-final.json,
          # folded in from the retired coverage-gate.yml so the suite runs at most
          # once per required Node version. Threshold source: COVERAGE_THRESHOLD env.
          TOTAL_LINES=0
          COVERED_LINES=0
          for REPORT in $(find . -path '*/coverage/coverage-final.json' -not -path '*/node_modules/*' | sort); do
            PKG_TOTAL=$(node -e "
              const c = require('./$REPORT');
              let t=0, cov=0;
              for (const f of Object.values(c)) {
                for (const v of Object.values(f.s)) { t++; if (v>0) cov++; }
              }
              console.log(t + ',' + cov);
            ")
            PKG_T=$(echo "$PKG_TOTAL" | cut -d',' -f1)
            PKG_C=$(echo "$PKG_TOTAL" | cut -d',' -f2)
            TOTAL_LINES=$((TOTAL_LINES + PKG_T))
            COVERED_LINES=$((COVERED_LINES + PKG_C))
          done
          if [ "$TOTAL_LINES" -eq 0 ]; then
            echo "::error::No coverage statements found across the repo"
            exit 1
          fi
          PERCENT=$((COVERED_LINES * 100 / TOTAL_LINES))
          echo "Repo-wide coverage: ${PERCENT}% (${COVERED_LINES}/${TOTAL_LINES} statements, threshold: ${COVERAGE_THRESHOLD}%)"
          if [ "$PERCENT" -lt "$COVERAGE_THRESHOLD" ]; then
            echo "::error::Coverage ${PERCENT}% is below threshold of ${COVERAGE_THRESHOLD}%"
            exit 1
          fi
          echo "Repo-wide coverage threshold met"

      - name: Enforce agent-core coverage threshold
        if: matrix.node-version == 22
        run: |
          COVERAGE_FILE="./packages/agent-core/coverage/coverage-final.json"
          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "ERROR: agent-core coverage report not found at $COVERAGE_FILE"
            exit 1
          fi
          TOTAL_STMTS=0
          COVERED_STMTS=0
          while IFS= read -r line; do
            file_total=$(echo "$line" | jq -r ".s | to_entries | length")
            file_covered=$(echo "$line" | jq -r "[.s | to_entries[] | select(.value > 0)] | length")
            TOTAL_STMTS=$((TOTAL_STMTS + file_total))
            COVERED_STMTS=$((COVERED_STMTS + file_covered))
          done < <(jq -c ".[]" "$COVERAGE_FILE")
          if [ "$TOTAL_STMTS" -eq 0 ]; then
            echo "ERROR: No statements found in coverage report"
            exit 1
          fi
          PCT=$((COVERED_STMTS * 100 / TOTAL_STMTS))
          echo "agent-core statement coverage: ${PCT}% (${COVERED_STMTS}/${TOTAL_STMTS})"
          if [ "$PCT" -lt 80 ]; then
            echo "ERROR: agent-core coverage ${PCT}% is below the 80% threshold"
            exit 1
          fi
          echo "agent-core coverage threshold met"

  migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Restore Prisma clients
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/*/src/generated
          key: prisma-clients-${{ hashFiles('services/*/prisma/schema.prisma') }}

      - name: Check for destructive migrations
        run: node scripts/check-destructive-migrations.js

      - name: Apply migrations
        # Derives service list from the workspace — adding a new service with
        # prisma/schema.prisma requires zero edits to this workflow.
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: |
          for SERVICE in $(node scripts/discover-prisma-services.mjs); do
            PKG=$(node -e "const p=require('./services/$SERVICE/package.json'); process.stdout.write(p.name)")
            echo "=== Applying migrations for $PKG ==="
            pnpm --filter "$PKG" db:migrate:deploy
          done

      - name: Verify schema is in sync
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: |
          for SERVICE in $(node scripts/discover-prisma-services.mjs); do
            PKG=$(node -e "const p=require('./services/$SERVICE/package.json'); process.stdout.write(p.name)")
            pnpm --filter "$PKG" db:migrate:status
          done

  # ──────────────────────────────────────────────────────────────────────────
  # RLS Integration (#5369) — the real-Postgres proof that ADR-026's RLS
  # backstop actually holds against the connection role the service deploys
  # with, not a separate probe role. Neither suite ran anywhere before this:
  # the ordinary `test` job above has no Postgres attached, so
  # `describe.skipIf(!DATABASE_URL)` silently no-ops both files there — which
  # is exactly how the seven-part RLS series (#5248-#5255, #5492) shipped and
  # closed green while providing zero protection (see the two suites' own doc
  # comments and docs/adr/ADR-026-postgres-rls-venue-backstop.md).
  # ──────────────────────────────────────────────────────────────────────────
  rls-integration:
    name: RLS Integration (owner role, #5369)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Restore Prisma clients
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/*/src/generated
          key: prisma-clients-${{ hashFiles('services/*/prisma/schema.prisma') }}

      # rls-owner-enforcement.integration.test.ts asserts the connection is
      # both the OWNER of all seven RLS tables (pg_has_role against
      # pg_class.relowner) and rolsuper=false/rolbypassrls=false. The
      # postgres:15 image's default POSTGRES_USER is a superuser, which fails
      # both assertions and — per ADR-026 §3.1 — a superuser bypasses RLS
      # unconditionally, so a run through it would prove nothing. This
      # provisions a role shaped like the one DO Managed Postgres gives us in
      # production instead: a plain, non-superuser owner. CREATEROLE (not
      # just CREATEDB) is required too — rls-isolation.integration.test.ts's
      # own beforeAll creates a second, ordinary probe role through this same
      # connection, and only a role with CREATEROLE can do that.
      - name: Provision a non-superuser table-owner role (production shape)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: test
          PGPASSWORD: test
          PGDATABASE: test
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE rls_owner LOGIN PASSWORD 'rls_owner_ci_pw' CREATEDB CREATEROLE;" \
            -c "CREATE DATABASE rls_scratch OWNER rls_owner;"

      # Deploys as rls_owner, not the "test" superuser service account, so
      # rls_owner ends up OWNING every table it creates — the production
      # shape being proven (DATABASE_URL is also the role that ran
      # `prisma migrate deploy`), unlike the `migrations` job above whose
      # superuser owner can never observe RLS at all.
      - name: Apply reservations migrations as the owner role
        env:
          DATABASE_URL: postgresql://rls_owner:rls_owner_ci_pw@localhost:5432/rls_scratch
        run: pnpm --filter @mbe/reservations-service db:migrate:deploy

      # rls-route-sweep.integration.test.ts (#5369 PR 2) is the first suite in
      # this job to call buildApp() — the other three test RLS directly
      # against raw pg/Prisma clients and never touch @mbe/auth. `pnpm
      # install` only LINKS workspace packages; it does not compile them, and
      # @mbe/types' exports resolve to ./dist/*, so without this the sweep
      # dies before its first test even runs:
      #   Error: Failed to resolve entry for package "@mbe/types".
      # (identical failure mode, same fix pattern, as mutation-testing.yml's
      # own "Build workspace dependencies" step). `...` builds the service
      # itself plus its transitive deps, not the whole workspace.
      - name: Build workspace dependencies
        run: pnpm build --filter @mbe/reservations-service...

      # All FIVE `DATABASE_URL`-gated suites, listed explicitly rather than
      # globbed: a glob fails silently in both directions (quietly picking up
      # or dropping files), and the coverage test below pins this list.
      # lapsed-guest-cron.rls.integration.test.ts was the third suite nobody
      # ran - it is named in both other suites' doc comments as the sibling
      # they coordinate the pg_advisory_lock(5369) key with, so leaving it
      # out would have reproduced, in this very job, the gap the job exists
      # to close. rls-route-sweep.integration.test.ts (#5369 PR 2) is the
      # fourth: a real buildApp() against this same owner role, injecting
      # every registered route (a drift guard fails if a new route ships
      # with no fixture) under RLS_CONTEXT_MODE=throw, plus three direct,
      # non-HTTP-invocation tests for the job-worker handlers and the
      # lapsed-guest cron. rls-venue-resolution.integration.test.ts (#5369
      # PR 3) is the fifth: proves app_resolve_venue_id and
      # app_reservation_venue_ids_for_user against the same owner role, under
      # its own FORCE window (so a pass means the admitting policy actually
      # ran, not owner-bypass). Measured locally against this same postgres:15
      # + rls_owner setup: 5 files pass in a few seconds, well inside the 15s
      # hookTimeout that bounds the advisory-lock wait.
      - name: Run RLS integration suites against the owner role
        env:
          DATABASE_URL: postgresql://rls_owner:rls_owner_ci_pw@localhost:5432/rls_scratch
        run: |
          set -o pipefail
          pnpm --filter @mbe/reservations-service exec vitest run \
            src/routes/rls-owner-enforcement.integration.test.ts \
            src/routes/rls-isolation.integration.test.ts \
            src/services/lapsed-guest-cron.rls.integration.test.ts \
            src/routes/rls-route-sweep.integration.test.ts \
            src/routes/rls-venue-resolution.integration.test.ts \
            --reporter=default --reporter=json --outputFile=rls-integration-results.json

      # `describe.skipIf` reports as a file-level PASS when its guard is
      # false — the summary line looks no different from a real pass, and a
      # `numPendingTests` count in the JSON report is the only signal that
      # nothing actually ran. That gap is exactly how these suites went
      # unexercised for the whole seven-part series. Assert on the real test
      # counts instead of trusting the step's exit code alone.
      - name: Prove the suites actually ran, not skipped
        run: node scripts/assert-vitest-ran.mjs services/reservations/rls-integration-results.json

  ai-antipattern-ratchet:
    name: AI Antipattern Ratchet
    needs: [prepare]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Check AI antipattern counts against baseline
        run: node scripts/check-ai-antipatterns.mjs

  visual-tolerance-check:
    name: Visual Tolerance Change Check
    # #4711: #4496 tightened apps/rialto-web/playwright.config.ts's visual
    # tolerance without updating any baseline and merged with `Visual
    # Regression (rialto-web)` (advisory, not part of this needs: list) red
    # on its own head SHA — main stayed red for three days. This narrow,
    # pure-node check fails only when a PR touches a visual-tolerance
    # surface without also touching the baselines it measures against; it
    # does not promote the visual suite itself to required.
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          fetch-depth: 0

      - name: Check for a visual-tolerance change without baseline updates
        run: node scripts/check-visual-tolerance-change.mjs

  report-health:
    name: Report CI Health
    needs: [detect-changes, lint, typecheck, build, test, migrations]
    # has_code is load-bearing, not decoration. The loop below treats anything
    # that is not `failure`/`cancelled` as success, and `skipped` is neither —
    # so on a docs-only push (where lint/typecheck/build/test/migrations all
    # skip) this would write conclusion=success to ci/latest and mask a red
    # code run that preceded it. Only report health for runs that tested code.
    if: always() && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Write CI status to KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          KV_NS_ID: ${{ secrets.HEALTH_KV_NAMESPACE_ID }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MIGRATIONS_RESULT: ${{ needs.migrations.result }}
        run: |
          CONCLUSION="success"
          for RESULT in "$LINT_RESULT" "$TYPECHECK_RESULT" "$BUILD_RESULT" "$TEST_RESULT" "$MIGRATIONS_RESULT"; do
            if [ "$RESULT" = "failure" ]; then
              CONCLUSION="failure"
              break
            elif [ "$RESULT" = "cancelled" ]; then
              CONCLUSION="cancelled"
            fi
          done
          PAYLOAD=$(jq -n \
            --argjson id "$GH_RUN_ID" \
            --arg conclusion "$CONCLUSION" \
            --arg branch "$GH_REF_NAME" \
            --arg sha "$GH_SHA" \
            --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{id: $id, conclusion: $conclusion, branch: $branch, sha: $sha, updated_at: $updated_at}')
          curl -sf -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NS_ID}/values/ci%2Flatest" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

  # ──────────────────────────────────────────────────────────────────────────
  # Migration Dry-Run — test Prisma migrations against a fresh DB on PRs
  # ──────────────────────────────────────────────────────────────────────────
  migration-dry-run:
    name: Migration Dry-Run
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          fetch-depth: 0

      - name: Check for migration changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'services/*/prisma/migrations/' | head -20)
          if [ -z "$CHANGED" ]; then
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
            echo "No migration changes detected"
          else
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            echo "Migration files changed:"
            echo "$CHANGED"
          fi

      - name: Start postgres
        if: steps.changes.outputs.has_migrations == 'true'
        run: |
          for i in 1 2 3; do
            docker pull postgres:16-alpine && break || (echo "Pull attempt $i failed, retrying in 10s..." && sleep 10)
          done
          docker run -d --name postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=dryrun \
            -e POSTGRES_PASSWORD=dryrun_test \
            -e POSTGRES_DB=dryrun \
            postgres:16-alpine
          for i in $(seq 1 20); do
            docker exec postgres pg_isready -U dryrun && break || sleep 3
          done

      - name: Install Prisma CLI
        if: steps.changes.outputs.has_migrations == 'true'
        run: npm install -g prisma@6

      - name: Apply existing migrations
        if: steps.changes.outputs.has_migrations == 'true'
        env:
          DATABASE_URL: "postgresql://dryrun:dryrun_test@localhost:5432/dryrun"
        run: |
          for SERVICE in users reservations agent; do
            SCHEMA="services/$SERVICE/prisma/schema.prisma"
            if [ -f "$SCHEMA" ]; then
              echo "=== Deploying $SERVICE migrations ==="
              prisma migrate deploy --schema "$SCHEMA" 2>&1 || {
                echo "::error::Migration deploy failed for $SERVICE"
                exit 1
              }
              echo "✓ $SERVICE migrations applied"
            fi
          done

      - name: Validate schema consistency
        if: steps.changes.outputs.has_migrations == 'true'
        env:
          DATABASE_URL: "postgresql://dryrun:dryrun_test@localhost:5432/dryrun"
        run: |
          for SERVICE in users reservations agent; do
            SCHEMA="services/$SERVICE/prisma/schema.prisma"
            if [ -f "$SCHEMA" ]; then
              echo "=== Checking $SERVICE schema drift ==="
              DIFF=$(prisma migrate diff \
                --from-migrations "services/$SERVICE/prisma/migrations" \
                --to-schema-datamodel "$SCHEMA" \
                --shadow-database-url "postgresql://dryrun:dryrun_test@localhost:5432/dryrun_shadow" 2>&1 || true)

              if echo "$DIFF" | grep -q "No difference"; then
                echo "✓ $SERVICE schema matches migrations"
              else
                echo "::warning::$SERVICE may have schema drift"
                echo "$DIFF"
              fi
            fi
          done

      - name: Run basic query tests
        if: steps.changes.outputs.has_migrations == 'true'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: dryrun
          PGPASSWORD: dryrun_test
          PGDATABASE: dryrun
        run: |
          TABLE_COUNT=$(psql -t -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'" | tr -d ' ')
          echo "Tables after migration: $TABLE_COUNT"

          MIGRATION_COUNT=$(psql -t -c "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL" | tr -d ' ')
          echo "Migrations applied: $MIGRATION_COUNT"

          FAILED=$(psql -t -c "SELECT count(*) FROM _prisma_migrations WHERE rolled_back_at IS NOT NULL" | tr -d ' ')
          if [ "$FAILED" != "0" ]; then
            echo "::error::$FAILED migration(s) were rolled back"
            psql -c "SELECT migration_name, started_at, rolled_back_at FROM _prisma_migrations WHERE rolled_back_at IS NOT NULL"
            exit 1
          fi

          echo "✓ All migrations applied successfully"

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      [
        detect-changes,
        prepare,
        lint,
        typecheck,
        architecture-audit,
        build,
        test,
        hadolint,
        trivy,
        migrations,
        migration-dry-run,
        rls-integration,
        dependency-audit,
        integrity,
        ai-antipattern-ratchet,
        visual-tolerance-check,
        a11y-attribution,
        docs-format,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to publish the commit status below (#4025) — the job-level
      # grant is additive on top of the workflow's default contents:read.
      statuses: write
    steps:
      # Checkout is needed here (unlike a bare status-check job) because the
      # "Publish CI Gate commit status" step below invokes the pure mapping
      # in scripts/ci-gate-commit-status.mjs (#4025).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
      - name: Determine target SHA for commit status
        # #4025: on `pull_request`, github.sha is the ephemeral merge commit
        # (refs/pull/N/merge), not the PR's head SHA that branch protection
        # evaluates required statuses against. Every other trigger this
        # workflow supports (push, merge_group, workflow_dispatch) uses
        # github.sha directly.
        id: target-sha
        run: echo "sha=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Check required job results
        id: gate-check
        env:
          DETECT_CHANGES: ${{ needs.detect-changes.result }}
          PREPARE: ${{ needs.prepare.result }}
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          ARCH: ${{ needs.architecture-audit.result }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
          HADOLINT: ${{ needs.hadolint.result }}
          TRIVY: ${{ needs.trivy.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
          DRY_RUN: ${{ needs.migration-dry-run.result }}
          RLS_INTEGRATION: ${{ needs.rls-integration.result }}
          DEPS: ${{ needs.dependency-audit.result }}
          INTEGRITY: ${{ needs.integrity.result }}
          ANTIPATTERNS: ${{ needs.ai-antipattern-ratchet.result }}
          VISUAL_TOLERANCE: ${{ needs.visual-tolerance-check.result }}
          A11Y_ATTRIBUTION: ${{ needs.a11y-attribution.result }}
          DOCS_FORMAT: ${{ needs.docs-format.result }}
        run: |
          echo "detect-changes=$DETECT_CHANGES prepare=$PREPARE lint=$LINT typecheck=$TYPECHECK arch=$ARCH build=$BUILD test=$TEST hadolint=$HADOLINT trivy=$TRIVY migrations=$MIGRATIONS dry-run=$DRY_RUN rls-integration=$RLS_INTEGRATION deps=$DEPS integrity=$INTEGRITY antipatterns=$ANTIPATTERNS visual-tolerance-check=$VISUAL_TOLERANCE a11y-attribution=$A11Y_ATTRIBUTION docs-format=$DOCS_FORMAT"
          # NOTE: "skipped" is intentionally allowed (path-filtered jobs, e.g. docs-only
          # PRs where detect-changes sets has_code=false and prepare legitimately skips,
          # and a11y-attribution which only runs on agent-* / worktree-agent-* branches
          # per its own `if:` condition). Only "failure"/"cancelled" trip the gate.
          # detect-changes and prepare are included here because they are the root of
          # the dependency chain: if prepare actually FAILS (not skips), every job that
          # needs it cascades to "skipped" by GitHub Actions' default behavior, which
          # would otherwise look identical to a legitimate path-filtered skip and let
          # the gate pass on a broken setup.
          for job_result in "$DETECT_CHANGES" "$PREPARE" "$LINT" "$TYPECHECK" "$ARCH" "$BUILD" "$TEST" "$HADOLINT" "$TRIVY" "$MIGRATIONS" "$DRY_RUN" "$RLS_INTEGRATION" "$DEPS" "$INTEGRITY" "$ANTIPATTERNS" "$VISUAL_TOLERANCE" "$A11Y_ATTRIBUTION" "$DOCS_FORMAT"; do
            if [ "$job_result" = "failure" ] || [ "$job_result" = "cancelled" ]; then
              echo "::error::Required job failed or was cancelled"
              exit 1
            fi
          done
      - name: Publish CI Gate commit status
        # #4025: a check RUN produced off the `pull_request` event is what
        # branch protection's required-status evaluation normally reads —
        # but a check run produced by a `workflow_dispatch` escape-hatch
        # (used when GITHUB_TOKEN-authored PRs can't trigger `pull_request`
        # at all, see the gotchas.md entry this closes) is invisible to
        # both `statusCheckRollup` and that evaluation. A commit STATUS,
        # published here via the REST statuses API, surfaces in both
        # regardless of which event produced this run. Additive: the job
        # above still reports the normal required check run unchanged.
        #
        # if: always() so this runs whether "Check required job results"
        # passed, failed, or the job was cancelled — a red/cancelled CI run
        # must never leave a stale green `CI Gate` status behind.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target-sha.outputs.sha }}
          OUTCOME: ${{ steps.gate-check.outcome }}
        run: |
          STATE=$(node scripts/ci-gate-commit-status.mjs state --outcome "$OUTCOME")
          # Retry transient failures only — a real 4xx rejection (bad token,
          # bad payload, etc.) should fail fast rather than burning three
          # attempts on a verdict that will not change. See #4333: a single
          # unretried 503 from a GitHub-side outage failed the whole CI Gate
          # job even though every substantive job had passed.
          #
          # The classification lives in the pure, unit-tested
          # isTransientPublishError() rather than an inline regex here. The
          # inline version #4333 shipped missed `unexpected end of JSON
          # input` and turned a fully green run (32081722175) red — an
          # untested regex embedded in YAML is exactly where that goes
          # unnoticed.
          for i in 1 2 3; do
            OUTPUT=$(gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/statuses/$SHA" \
              -f state="$STATE" \
              -f context="CI Gate" \
              -f description="CI Gate ${STATE}" \
              -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 2>&1) && { echo "$OUTPUT"; exit 0; }
            echo "$OUTPUT"
            if printf '%s' "$OUTPUT" | node scripts/ci-gate-commit-status.mjs transient; then
              echo "Publish attempt $i failed with a transient error, retrying in 10s..."
              sleep 10
            else
              echo "::error::Publish CI Gate commit status failed with a non-transient error"
              exit 1
            fi
          done
          echo "::error::Publish CI Gate commit status failed after 3 attempts"
          exit 1
