name: CI

on:
  push:
    branches: [main]
    # `docs/**` and `**.md` are deliberately NOT ignored. `prepare` sets
    # has_code=false for a docs-only commit and skips its install; every
    # expensive job is gated on has_code == 'true' — so such a push runs
    # only prepare + docs-format + containers + ci-gate. Ignoring them here
    # instead meant a docs-only commit reaching main (by merge or by direct
    # push) was never prettier-checked, and the dirty files then failed "Run
    # Full Repository Audit" on the next code PR (#4787 -> #4790/#4792/#4797
    # and main a4473b0f9; the direct-push half is #4664, 7d259272a).
    paths-ignore:
      - "*.png"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
    # #10188: drafts skip CI (see `prepare` and `ci-gate`), so marking a PR
    # ready must start the full run.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]
  # Bare workflow_dispatch trigger — lets other workflows (e.g. drift-fix.yml)
  # dispatch a CI run on a branch after a GITHUB_TOKEN-created PR, working
  # around GitHub's anti-recursion rule (workflow_dispatch is a documented
  # exception). Every job below is event-agnostic; the migrations job's
  # dry-run steps are pull_request-only at the step level, so a dispatch run
  # still completes and reports CI Gate on the dispatched ref's head SHA.
  workflow_dispatch:

# Each push to `main` gets its own group (keyed on the SHA). A shared `main`
# group made every merge discard the previous merge's PENDING run, even with
# `cancel-in-progress: false`: no job ever started, so no merged SHA got a CI
# result and Deploy Services' "Wait for CI" starved (#10194). PR refs still
# share a group per ref and cancel in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # #10064: change detection used to be its own `detect-changes` job, and
  # Prepare waited on it. Under the concurrent-job cap every serial job pays a
  # full queue wait (measured median 6.2 min for a 0.3 min job), so detection
  # is now Prepare's first step. Prepare's only `if:` is the draft guard (#10188); on a
  # docs-only change it stops after detection (every later step is gated on
  # has_code). CI Gate's module requires Prepare to succeed, and every
  # Build-chain job to succeed whenever has_code is "true".
  prepare:
    name: Prepare
    # #10188: a draft PR costs no CI. Every other job needs `prepare`, so this
    # one guard skips the whole chain. `ci-gate` still runs (always()) and
    # fails closed on the skipped root with a "draft PR" message, so a guard
    # that misfired on a ready PR can never read as a pass. A draft cannot
    # merge, and `ready_for_review` runs everything on the head SHA.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      has_code: ${{ steps.filter.outputs.has_code }}
      has_rialto: ${{ steps.filter.outputs.has_rialto }}
      has_container_changes: ${{ steps.filter.outputs.has_container_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: filter
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Fail closed: without pipefail a failing `git diff` is masked by
          # `| wc -l`, yielding CODE_CHANGES=0 -> has_code=false -> CI skipped.
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            echo "has_rialto=true" >> "$GITHUB_OUTPUT"
            echo "has_container_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Container Checks job (#10010): the Trivy and hadolint scans read
          # only the Dockerfiles. Also run when what the images copy at the
          # root (lockfile, workspace manifests, patches), .dockerignore, the
          # hadolint config or this workflow changed.
          CONTAINER_CHANGES=$(git diff --name-only "origin/$BASE_REF"...HEAD -- ':(glob)**/Dockerfile*' ':(glob)**/.dockerignore' pnpm-lock.yaml pnpm-workspace.yaml package.json patches/ .hadolint.yaml .github/workflows/ci.yml | wc -l | tr -d ' ')
          if [ "$CONTAINER_CHANGES" -gt 0 ]; then
            echo "has_container_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_container_changes=false" >> "$GITHUB_OUTPUT"
          fi
          # Files that define the rialto Storybook browser-test suite
          # (storybook-tests job, #8117). Only the storybook-tests job reads this.
          RIALTO_CHANGES=$(git diff --name-only "origin/$BASE_REF"...HEAD -- packages/rialto/ scripts/storybook-test-gate.mjs scripts/lib/storybook-gate-reporter.mjs pnpm-lock.yaml .github/workflows/ci.yml | wc -l | tr -d ' ')
          if [ "$RIALTO_CHANGES" -gt 0 ]; then
            echo "has_rialto=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_rialto=false" >> "$GITHUB_OUTPUT"
          fi
          CODE_CHANGES=$(git diff --name-only "origin/$BASE_REF"...HEAD -- . ':!*.md' ':!docs/' ':!*.png' ':!.gitignore' ':!LICENSE' | wc -l | tr -d ' ')
          if [ "$CODE_CHANGES" -gt 0 ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi

      # Every step below is gated on has_code: a docs-only change needs no
      # install or library build (#10064).
      - uses: ./.github/actions/setup-workspace
        if: steps.filter.outputs.has_code == 'true'

      - name: Cache Prisma clients
        if: steps.filter.outputs.has_code == 'true'
        id: cache-prisma
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/*/src/generated
          key: prisma-clients-${{ hashFiles('services/*/prisma/schema.prisma') }}

      - name: Generate Prisma clients
        if: steps.filter.outputs.has_code == 'true' && steps.cache-prisma.outputs.cache-hit != 'true'
        run: |
          # Derive service list from the workspace — no hardcoded names
          for SERVICE in $(node scripts/discover-prisma-services.mjs); do
            PKG=$(node -e "const p=require('./services/$SERVICE/package.json'); process.stdout.write(p.name)")
            pnpm --filter "$PKG" db:generate
          done

      - name: Cache for Turbo
        if: steps.filter.outputs.has_code == 'true'
        # #6665: see the Typecheck job's identical step for rationale.
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2

      - name: Restore turbo local cache
        if: steps.filter.outputs.has_code == 'true'
        # #6665: Prepare is the one job that saves this key now. Typecheck and
        # Test restore it exactly (same sha) once Prepare ends, so none of them
        # rebuilds the `^build` closure.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build library packages
        if: steps.filter.outputs.has_code == 'true'
        # #6665: produces the `^build` outputs Typecheck, Lint and every Test
        # leg replay as `cache hit`, so Test no longer waits on Typecheck for
        # them. Packages and services are every `^build` target; edge-worker is
        # the one dependency living outside both (verified against
        # `turbo run typecheck lint test:coverage --dry=json`). Single command,
        # no pipe: a pipe here would mask a failed build (no pipefail default).
        run: pnpm turbo run build --filter='./packages/*' --filter='./services/*' --filter=@mbe/edge-worker

  # Docs-only PRs skip the entire Build chain (which is where `pnpm repo-audit`
  # runs `prettier --check .`) because it is gated on `has_code == 'true'`, and
  # the push trigger's `paths-ignore` lists `docs/**` / `**.md` so a docs-only
  # merge runs no push CI either. Measured consequence (2026-08-31): #4787
  # merged six unformatted run docs with CI Gate green, and the dirty files then
  # failed "Run Full Repository Audit" on the next code PR's merge ref and on
  # every main push -- reddening #4790/#4792/#4797 and main (`a4473b0f9`) for a
  # fault none of them contained. Recovery was worse than the break: `gh run
  # rerun --failed` re-uses the original merge SHA, so it kept failing after
  # main was fixed, and the docs-only fix commit triggered no push CI of its own
  # to retro-green main.
  #
  # This job is the missing half: when the Build chain will NOT run, run the
  # formatting check anyway. It calls `pnpm check:prettier` -- the very script
  # repo-audit calls -- rather than re-implementing the glob, so the two cannot
  # drift. Deliberately does not run when `has_code == 'true'`: the Build chain
  # already covers that case and duplicating it would just spend a runner.
  docs-format:
    name: Docs Formatting
    needs: [prepare]
    if: needs.prepare.outputs.has_code != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Check formatting
        run: pnpm check:prettier

      # #6854: `.cursorrules` is generated from AGENTS.md, so an AGENTS.md-only
      # edit is the one change that causes this drift AND skips Build (where
      # repo-audit runs it) -- #6845 reddened main that way. The check is a
      # pure file compare; it needs no CLI build.
      - name: Check .cursorrules drift
        run: node scripts/check-cursorrules-drift.mjs

      # #8396: CLAUDE.md and gotchas.md are markdown, so a markdown-only PR is
      # the one change that can breach their byte budget AND skips the Test job
      # that runs instruction-budget.test.mjs (main sat 88 bytes over, green).
      # Same limits as that test -- both import scripts/check-instruction-budget.mjs.
      - name: Check instruction byte budget
        run: node scripts/check-instruction-budget.mjs

  # #10010: the sub-minute static checks each took a full runner slot, its own
  # queue wait and 30-60 s of boot. They now share three jobs, each check its
  # own named step so a failure stays attributable by step. Later steps run
  # `if: !cancelled()` so one red step does not hide the others. CI Gate needs
  # every job here, and ci-gate-required-results.mjs fails closed on any
  # non-success/skipped result, so a failing merged step still fails the gate.
  #
  # Old job -> new step:
  #   Lint, Typecheck, Architecture Audit            -> static-checks
  #   Dependency Sync, Integrity, AI Antipattern Ratchet,
  #   Visual Tolerance Change Check                  -> repo-checks
  #   Dockerfile Lint, Container Security Scan x4    -> containers
  #   Migration Dry-Run                              -> migrations
  #   Test Coverage Gate                             -> ci-gate
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    needs: [prepare]
    if: needs.prepare.outputs.has_code == 'true'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Cache for Turbo
        # #3388: backs Turborepo remote caching with GitHub Actions' own
        # cache (actions/cache under the hood) instead of a Vercel
        # TURBO_TOKEN — no Vercel account or secret needed. Starts a local
        # proxy server and exports TURBO_API/TURBO_TOKEN/TURBO_TEAM (fixed,
        # non-secret values — the action always sets `turbogha`/`turbogha`
        # and a `localhost` API URL, see rharkor/caching-for-turbo's own
        # src/lib/server/utils.ts) for every later step in this job that
        # runs `turbo` (via `pnpm typecheck`/`lint`/`build`/`turbo
        # test:coverage`). Wired into the jobs that actually invoke turbo
        # tasks (static-checks, test, build, rls-integration) rather than the
        # shared setup-workspace action, so jobs with no turbo task don't pay
        # for a cache server they'd never use. Pinned by commit SHA per repo
        # convention.
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2

      - name: Restore Prisma clients
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/*/src/generated
          key: prisma-clients-${{ hashFiles('services/*/prisma/schema.prisma') }}

      - name: Restore turbo local cache
        # #4504: added when CI had zero turbo cache reuse of any kind (remote
        # caching was inert — TURBO_TOKEN unset — and nothing ever cached the
        # local `.turbo/cache` dir turbo.json pins, #3786). #3388 landed real
        # remote caching via the "Cache for Turbo" step above; this step
        # stays as a cheap, whole-directory same-lockfile restore that can
        # beat a per-task remote-cache round-trip. Keyed on the
        # pnpm-lock.yaml hash so a lockfile-touching PR (a turbo
        # globalDependencies entry) rotates the key instead of restoring a
        # stale cache across the change that invalidates every task.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      # #10009: one turbo invocation, not `pnpm lint` then `pnpm typecheck`.
      # Both task graphs end in a long single-package tail (the big apps), so
      # running them in series left most of the 4-core runner idle twice;
      # together turbo schedules one graph's tail against the other's queue.
      # Measured locally on 4 cores (`turbo run ... --only --force`, two
      # trials): 257 s / 236 s in series versus 217 s / 216 s combined.
      #
      # `--continue` keeps the protection the two `if: ${{ !cancelled() }}`
      # steps gave: every package's lint AND typecheck still runs after one of
      # them fails, so one round reports every error, and the step still exits
      # non-zero (a planted TS2322 exits 2, a planted `no-debugger` exits 1,
      # both with every other task still executed).
      - name: Lint and Typecheck
        run: pnpm turbo run lint typecheck --continue

      # #6887: dead code / unused deps fail the gate. knip needs no build
      # output (knip.jsonc lists rialto-web's entries explicitly instead of
      # loading its manifest-reading vite config). Its own step, not folded
      # into the turbo run above: knip is memory-heavy and is not a turbo task.
      # A bare command, so a non-zero exit fails the step.
      - name: Dead code and unused dependencies (knip)
        if: ${{ !cancelled() }}
        run: pnpm check:knip

      - name: Architecture Audit - build CLI and its dependencies
        if: ${{ !cancelled() }}
        run: pnpm build --filter @mbe/cli...

      - name: Architecture Audit - ADR and dependency checks
        if: ${{ !cancelled() }}
        run: |
          pnpm --filter @mbe/cli start check-adr
          pnpm --filter @mbe/cli start check-deps

  repo-checks:
    name: Repo Checks
    # Not `build`: every check below reads committed files on this runner and
    # Build hands it no artifact (scripts/__tests__/ci-lint-critical-path.test.mjs).
    needs: [prepare]
    if: needs.prepare.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    # Dependency Sync alone measured 3m39s on main (run 33219164956).
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          # Full history for the visual-tolerance check, which diffs against
          # the base branch (same requirement as the old standalone job).
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      # Generated-artifact staleness (registry.json, dep-graph.json,
      # generated-schemas.ts, dependency-graph.md) is verified in one
      # manifest-driven step in the `build` job ("Verify generated artifacts are
      # in sync"). This job keeps the non-regenerated doc validators below.

      - name: Dependency Sync
        run: node scripts/check-dep-sync.mjs

      - name: Check for instruction rot
        if: ${{ !cancelled() }}
        run: node scripts/detect-instruction-rot.mjs

      - name: Check doc freshness
        if: ${{ !cancelled() }}
        run: node scripts/check-doc-freshness.mjs

      - name: Check AI antipattern counts against baseline
        if: ${{ !cancelled() }}
        run: node scripts/check-ai-antipatterns.mjs

      # #4711: #4496 tightened apps/rialto-web/playwright.config.ts's visual
      # tolerance without updating any baseline and merged with `Visual
      # Regression (rialto-web)` (advisory, not part of CI Gate's needs) red
      # on its own head SHA — main stayed red for three days. This narrow,
      # pure-node check fails only when a PR touches a visual-tolerance
      # surface without also touching the baselines it measures against; it
      # does not promote the visual suite itself to required.
      - name: Check for a visual-tolerance change without baseline updates
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: node scripts/check-visual-tolerance-change.mjs

  # Container scans and Dockerfile lint read only the Dockerfiles, so they run
  # only when a Dockerfile, .dockerignore, the lockfile/workspace manifests or
  # the patches the images copy changed (has_container_changes, #10010). Always
  # true off pull_request. A skipped run is a pass for CI Gate.
  containers:
    name: Container Checks
    needs: [prepare]
    if: needs.prepare.outputs.has_container_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # upload-sarif calls the code-scanning API, which requires
    # security-events: write. The workflow default is contents: read only,
    # so without this override the upload step fails with
    # "Resource not accessible by integration" and takes CI Gate red.
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - name: Lint services/users/Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: "services/users/Dockerfile"

      - name: Lint services/reservations/Dockerfile
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: "services/reservations/Dockerfile"

      - name: Lint services/agent/Dockerfile
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: "services/agent/Dockerfile"

      - name: Lint infrastructure/migrate/Dockerfile
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: "infrastructure/migrate/Dockerfile"

      # Without `limit-severities-for-sarif`, trivy-action drops the `severity`
      # filter for SARIF output (it wants complete data for the Security tab),
      # so `exit-code` would trip on LOW/MEDIUM misconfig findings too (e.g.
      # missing HEALTHCHECK) instead of only CRITICAL/HIGH. The SARIF upload is
      # best-effort: the scan is the actual gate, and a failed Security-tab
      # upload (code-scanning disabled, API hiccup) must never hold main red.
      - name: Trivy scan (users)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: "fs"
          scan-ref: "services/users/Dockerfile"
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          format: "sarif"
          limit-severities-for-sarif: "true"
          output: users-trivy-results.sarif

      - name: Upload Trivy SARIF (users)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: users-trivy-results.sarif
          category: trivy-users

      - name: Trivy scan (reservations)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: "fs"
          scan-ref: "services/reservations/Dockerfile"
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          format: "sarif"
          limit-severities-for-sarif: "true"
          output: reservations-trivy-results.sarif

      - name: Upload Trivy SARIF (reservations)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: reservations-trivy-results.sarif
          category: trivy-reservations

      - name: Trivy scan (agent)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: "fs"
          scan-ref: "services/agent/Dockerfile"
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          format: "sarif"
          limit-severities-for-sarif: "true"
          output: agent-trivy-results.sarif

      - name: Upload Trivy SARIF (agent)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: agent-trivy-results.sarif
          category: trivy-agent

      - name: Trivy scan (migrate)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: "fs"
          scan-ref: "infrastructure/migrate/Dockerfile"
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          format: "sarif"
          limit-severities-for-sarif: "true"
          output: migrate-trivy-results.sarif

      - name: Upload Trivy SARIF (migrate)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: migrate-trivy-results.sarif
          category: trivy-migrate

  build:
    name: Build
    runs-on: ubuntu-latest
    # Not `lint`: ESLint produces nothing this job consumes, and the turbo
    # `^build` cache it reuses comes from Prepare. CI Gate still requires
    # lint (scripts/__tests__/ci-lint-critical-path.test.mjs). Not
    # `architecture-audit` either: it builds the CLI on its own runner and
    # hands this job nothing; CI Gate still requires it.
    needs: [prepare]
    if: needs.prepare.outputs.has_code == 'true'
    # #9924: `issues: read` lets repo-audit's check-ready-label-exclusive query
    # live labels. A job-level block replaces the workflow default, so
    # `contents: read` is restated.
    permissions:
      contents: read
      issues: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          # Full history: repo-audit's check-rialto-changeset diffs against
          # `git merge-base HEAD origin/main`, which a depth-1 clone cannot
          # resolve (same requirement as migration-dry-run). The check fails
          # closed on an unresolvable base, so dropping this breaks the job
          # loudly rather than silently skipping the gate.
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Cache for Turbo
        # #3388: see the Typecheck job's identical step for rationale.
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2

      - name: Restore Prisma clients
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/*/src/generated
          key: prisma-clients-${{ hashFiles('services/*/prisma/schema.prisma') }}

      - name: Restore turbo local cache
        # #4504: see the Typecheck job's identical step for rationale.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Check rialto exports map is in sync
        run: pnpm --filter @mattbutlerengineering/rialto exports:check

      - name: Build all packages
        run: pnpm build

      - name: Restore prettier cache
        # Prettier caches by file content (a changed file is re-checked even
        # with its mtime held), so an older commit's cache cannot false-pass
        # this one; the key rotates on prettier's version/plugins and config.
        # 41s -> ~1s warm (scripts/__tests__/ci-prettier-cache.test.mjs).
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc.js', '.prettierignore') }}-${{ github.sha }}
          restore-keys: |
            prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc.js', '.prettierignore') }}-

      - name: Run Full Repository Audit
        run: pnpm repo-audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run pnpm audit (network-resilient)
        # #4993: `pnpm audit --audit-level=high` lives in its own step, not
        # inside `repo-audit`'s chain, specifically so this outer retry loop
        # wraps ONLY the network-dependent registry call — never masking a
        # real repo-audit failure (lint/circular-deps/schema-compat/etc.)
        # behind a retry.
        #
        # pnpm's own built-in retry (2 attempts: 10s, then 1min backoff)
        # wasn't enough headroom for `ERR_SOCKET_TIMEOUT` against
        # registry.npmjs.org/-/npm/v1/security/audits — four separate Build
        # job runs hit the identical signature in one night, and it recurred
        # on PR #4967, while every other CI job passed on the same commits.
        # This adds a second, outer retry layer on top of pnpm's own.
        #
        # Only retry a TRANSIENT failure (classified by the pure, unit-tested
        # isTransientAuditError() in scripts/audit-transient-error.mjs, the
        # same pattern as the CI Gate commit-status publish step below) — a
        # real high-severity advisory must still fail the job on the first
        # attempt, never get masked by a retry. See the § Dependencies
        # gotcha in .claude/rules/gotchas.md for that failure mode.
        run: |
          for i in 1 2 3; do
            OUTPUT=$(pnpm run audit:security 2>&1) && { echo "$OUTPUT"; exit 0; }
            echo "$OUTPUT"
            if printf '%s' "$OUTPUT" | node scripts/audit-transient-error.mjs; then
              echo "pnpm audit attempt $i failed with a transient network error, retrying in 30s..."
              sleep 30
            else
              echo "::error::pnpm audit failed with a non-transient result (likely a real high-severity advisory)"
              exit 1
            fi
          done
          echo "::error::pnpm audit failed after 3 attempts, all classified transient — registry may be down"
          exit 1

      - name: Verify generated artifacts are in sync
        # Single manifest-driven staleness check (scripts/regen-manifest.mjs is
        # the source of truth), replacing five separate regenerate+git-diff
        # stanzas: registry.json, dep-graph.json, generated-schemas.ts,
        # and dependency-graph.md. `pnpm regen` regenerates every committed
        # artifact; `pnpm regen --check` then fails if any drifted, naming the
        # stale artifact and the exact fix command. Add new artifacts to the
        # manifest, not here.
        run: |
          pnpm regen
          pnpm regen --check

      - name: Check bundle size budgets
        run: pnpm size:check

  a11y-attribution:
    name: Accessibility AI Attribution
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.has_code == 'true' && github.event_name == 'pull_request' && (startsWith(github.head_ref, 'agent-') || startsWith(github.head_ref, 'worktree-agent-'))
    needs: [prepare]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Run a11y tests (accessibility vitest)
        run: pnpm --filter @mattbutlerengineering/rialto exec vitest run --reporter=json --outputFile=../../a11y-results.json src/test/accessibility src/test/token-contrast.test.ts

      - name: Process results and fail on agent violations
        if: always()
        run: node scripts/process-a11y-results.mjs
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Comment a11y violations on PR
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const violationsFile = 'a11y-violations.json';
            if (!fs.existsSync(violationsFile)) return;
            const entry = JSON.parse(fs.readFileSync(violationsFile, 'utf8'));
            if (!entry.violations || entry.violations.length === 0) return;

            const rows = entry.violations
              .map(v => `| ${v.name.replace(/\|/g, '\\|')} | ${v.error.split('\n')[0].replace(/\|/g, '\\|')} |`)
              .join('\n');

            const body = [
              '## Accessibility violations detected in AI-generated code',
              '',
              `**Branch:** \`${entry.branch}\`  `,
              `**Failures:** ${entry.numFailures} of ${entry.numTests} tests`,
              '',
              '| Test | Error |',
              '|------|-------|',
              rows,
              '',
              'Fix these violations before merging. Run `pnpm --filter @mattbutlerengineering/rialto exec vitest run src/test/accessibility` locally to reproduce.',
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  test:
    # One job id, several matrix legs: `ci-gate` and `report-health` key on the
    # id `test`, and a `needs: test` edge waits on every leg, so sharding adds no
    # consumer edits. Legs are selected by turbo --filter; `rest` is derived by
    # exclusion so a new package can never fall outside every leg
    # (scripts/__tests__/ci-test-shards.test.mjs). Coverage gating lives in
    # `test-coverage-gate`, which joins all legs.
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.leg }})
    runs-on: ubuntu-latest
    # Not `typecheck` (#6665): the turbo `^build` cache it reuses is produced
    # by Prepare, so Test runs in parallel with Typecheck; CI Gate still
    # requires typecheck. Not `lint` or `architecture-audit` either: neither
    # hands this job anything (scripts/__tests__/ci-lint-critical-path.test.mjs).
    needs: [prepare]
    if: needs.prepare.outputs.has_code == 'true'

    strategy:
      fail-fast: false
      matrix:
        # Single Node major, identical on every trigger (pull_request, push,
        # merge_group, schedule). Node 20 was previously tested only on
        # non-PR events, which let a Node-20-only failure land on main before
        # anyone saw it (#3558) — see #3570 and .claude/rules/gotchas.md.
        node-version: [22]
        leg: [reservations, hospitality, rialto, rest]
        include:
          - leg: reservations
            filter: "--filter=@mbe/reservations-service"
          - leg: hospitality
            filter: "--filter=@mbe/hospitality"
          - leg: rialto
            filter: "--filter=@mattbutlerengineering/rialto"
          - leg: rest
            filter: "--filter=!@mbe/reservations-service --filter=!@mbe/hospitality --filter=!@mattbutlerengineering/rialto"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache for Turbo
        # #3388: see the Typecheck job's identical step for rationale.
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2

      - name: Restore Prisma clients
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/*/src/generated
          key: prisma-clients-${{ hashFiles('services/*/prisma/schema.prisma') }}

      - name: Restore turbo local cache
        # #4504: see the Typecheck job's identical step for rationale.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Run tests with coverage
        # #4519 added `--concurrency=2` after that PR's Test job timed out
        # 3/3 while main stayed green. The comment here used to assert a
        # specific cause — that restoring .turbo/cache removed an incidental
        # stagger and let turbo's fan-out stampede a 2-core runner. That
        # explanation is retracted (#4558): the varying victim was already
        # explained by #4541 raising one test's timeout, and re-running the
        # failed jobs at e41d5a6a, the unchanged pre-cap commit, passed. The
        # stampede was never reproduced.
        #
        # The cap stays, and is no longer entirely unmeasured — but mind what
        # was measured. #5546 ran the suite on one developer machine, same
        # commit and cold cache, once per setting: turbo's default fan-out of
        # 10 failed on apps/rialto-web page-registry.test.ts at 15000ms, a cap
        # of 2 passed all 50 tasks. One sample per setting, off-runner,
        # pass/fail only, and 10-against-2 rather than cap-against-no-cap — it
        # shows the cap does something, not that this job needed it. The
        # CI-side A/B #4558 asks for (several runs per setting on one commit,
        # comparing this job's duration and failure rate) is still unrun.
        #
        # Nothing suggests the cap costs wall-clock time: capped 32810596143
        # took 7m45s, uncapped control 32776034661 9m35s, uncapped failing
        # 32772737595 5m59s. The control reran failed jobs only, so three
        # samples settle nothing either way — they are just not evidence
        # against the cap.
        #
        # Before dropping the flag, read
        # scripts/__tests__/nightly-compliance-workflow.test.mjs: it asserts
        # this line still declares a cap and fails if the nightly runs the
        # suite more parallel than this job — the mismatch behind ten red
        # nights (#5203 … #5517).
        run: pnpm turbo test:coverage --concurrency=2 ${{ matrix.filter }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-node${{ matrix.node-version }}-${{ matrix.leg }}
          # Fixed depths, not `**`: a recursive pattern makes the glob walk all
          # of node_modules (73s for one file on run 37527830915). Covers the
          # root and every workspace package (ci-test-results-glob.test.mjs).
          path: |
            test-results/*.xml
            */test-results/*.xml
            */*/test-results/*.xml
          retention-days: 14

      - name: Upload coverage artifact
        # Per-leg, fixed depths (no `**`: see the test-results step above).
        # Covers scripts/ at depth 1 and every apps|packages|services|tools|
        # plugins|infrastructure/* at depth 2; the gate job downloads them all
        # into one workspace so its find-based scan sees repo-relative paths.
        # Success-only: a failed leg means the gate never runs anyway.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.leg }}
          path: |
            */coverage/coverage-final.json
            */*/coverage/coverage-final.json
          retention-days: 14
          if-no-files-found: error

  migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    needs: [prepare] # not lint/typecheck: nothing here consumes their output (#10010)
    if: needs.prepare.outputs.has_code == 'true'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
        with:
          # Full history: the PR-only dry-run steps below diff against
          # origin/main (the old Migration Dry-Run job did the same).
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Restore Prisma clients
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/*/src/generated
          key: prisma-clients-${{ hashFiles('services/*/prisma/schema.prisma') }}

      - name: Check for destructive migrations
        run: node scripts/check-destructive-migrations.js

      - name: Apply migrations
        # Derives service list from the workspace — adding a new service with
        # prisma/schema.prisma requires zero edits to this workflow.
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: |
          for SERVICE in $(node scripts/discover-prisma-services.mjs); do
            PKG=$(node -e "const p=require('./services/$SERVICE/package.json'); process.stdout.write(p.name)")
            echo "=== Applying migrations for $PKG ==="
            pnpm --filter "$PKG" db:migrate:deploy
          done

      - name: Verify schema is in sync
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: |
          for SERVICE in $(node scripts/discover-prisma-services.mjs); do
            PKG=$(node -e "const p=require('./services/$SERVICE/package.json'); process.stdout.write(p.name)")
            pnpm --filter "$PKG" db:migrate:status
          done

      # Migration Dry-Run (folded in from its own job, #10010): PR-only. Test
      # Prisma migrations against a fresh postgres:16 container on PRs that
      # change a migration. Needs full history to diff against origin/main, hence
      # the fetch-depth: 0 checkout above.
      - name: Dry-run - check for migration changes
        id: dry-run-changes
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'services/*/prisma/migrations/' | head -20)
          if [ -z "$CHANGED" ]; then
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
            echo "No migration changes detected"
          else
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            echo "Migration files changed:"
            echo "$CHANGED"
          fi

      - name: Dry-run - start postgres
        if: ${{ !cancelled() && steps.dry-run-changes.outputs.has_migrations == 'true' }}
        run: |
          for i in 1 2 3; do
            docker pull postgres:16-alpine && break || (echo "Pull attempt $i failed, retrying in 10s..." && sleep 10)
          done
          docker run -d --name dryrun-postgres \
            -p 5433:5432 \
            -e POSTGRES_USER=dryrun \
            -e POSTGRES_PASSWORD=dryrun_test \
            -e POSTGRES_DB=dryrun \
            postgres:16-alpine
          for i in $(seq 1 20); do
            docker exec dryrun-postgres pg_isready -U dryrun && break || sleep 3
          done

      - name: Dry-run - install Prisma CLI
        if: ${{ !cancelled() && steps.dry-run-changes.outputs.has_migrations == 'true' }}
        run: npm install -g prisma@6

      - name: Dry-run - apply existing migrations
        if: ${{ !cancelled() && steps.dry-run-changes.outputs.has_migrations == 'true' }}
        env:
          DATABASE_URL: "postgresql://dryrun:dryrun_test@localhost:5433/dryrun"
        run: |
          for SERVICE in users reservations agent; do
            SCHEMA="services/$SERVICE/prisma/schema.prisma"
            if [ -f "$SCHEMA" ]; then
              echo "=== Deploying $SERVICE migrations ==="
              prisma migrate deploy --schema "$SCHEMA" 2>&1 || {
                echo "::error::Migration deploy failed for $SERVICE"
                exit 1
              }
              echo "✓ $SERVICE migrations applied"
            fi
          done

      - name: Dry-run - validate schema consistency
        if: ${{ !cancelled() && steps.dry-run-changes.outputs.has_migrations == 'true' }}
        env:
          DATABASE_URL: "postgresql://dryrun:dryrun_test@localhost:5433/dryrun"
        run: |
          for SERVICE in users reservations agent; do
            SCHEMA="services/$SERVICE/prisma/schema.prisma"
            if [ -f "$SCHEMA" ]; then
              echo "=== Checking $SERVICE schema drift ==="
              DIFF=$(prisma migrate diff \
                --from-migrations "services/$SERVICE/prisma/migrations" \
                --to-schema-datamodel "$SCHEMA" \
                --shadow-database-url "postgresql://dryrun:dryrun_test@localhost:5433/dryrun_shadow" 2>&1 || true)

              if echo "$DIFF" | grep -q "No difference"; then
                echo "✓ $SERVICE schema matches migrations"
              else
                echo "::warning::$SERVICE may have schema drift"
                echo "$DIFF"
              fi
            fi
          done

      - name: Dry-run - basic query tests
        if: ${{ !cancelled() && steps.dry-run-changes.outputs.has_migrations == 'true' }}
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: dryrun
          PGPASSWORD: dryrun_test
          PGDATABASE: dryrun
        run: |
          TABLE_COUNT=$(psql -t -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'" | tr -d ' ')
          echo "Tables after migration: $TABLE_COUNT"

          MIGRATION_COUNT=$(psql -t -c "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL" | tr -d ' ')
          echo "Migrations applied: $MIGRATION_COUNT"

          FAILED=$(psql -t -c "SELECT count(*) FROM _prisma_migrations WHERE rolled_back_at IS NOT NULL" | tr -d ' ')
          if [ "$FAILED" != "0" ]; then
            echo "::error::$FAILED migration(s) were rolled back"
            psql -c "SELECT migration_name, started_at, rolled_back_at FROM _prisma_migrations WHERE rolled_back_at IS NOT NULL"
            exit 1
          fi

          echo "✓ All migrations applied successfully"

  # ──────────────────────────────────────────────────────────────────────────
  # RLS Integration (#5369) — the real-Postgres proof that ADR-026's RLS
  # backstop actually holds against the connection role the service deploys
  # with, not a separate probe role. Neither suite ran anywhere before this:
  # the ordinary `test` job above has no Postgres attached, so
  # `describe.skipIf(!DATABASE_URL)` silently no-ops both files there — which
  # is exactly how the seven-part RLS series (#5248-#5255, #5492) shipped and
  # closed green while providing zero protection (see the two suites' own doc
  # comments and docs/adr/ADR-026-postgres-rls-venue-backstop.md).
  # ──────────────────────────────────────────────────────────────────────────
  rls-integration:
    name: RLS Integration (owner role, #5369)
    runs-on: ubuntu-latest
    needs: [prepare] # not lint; Prepare builds the workspace closure
    if: needs.prepare.outputs.has_code == 'true'
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5

      - uses: ./.github/actions/setup-workspace

      - name: Cache for Turbo
        # #3388: same GitHub-Actions-backed remote cache as Build/Typecheck.
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2

      - name: Restore turbo local cache
        # #4504: see the Typecheck job's identical step for rationale.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Restore Prisma clients
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/*/src/generated
          key: prisma-clients-${{ hashFiles('services/*/prisma/schema.prisma') }}

      # rls-owner-enforcement.integration.test.ts asserts the connection is
      # both the OWNER of all seven RLS tables (pg_has_role against
      # pg_class.relowner) and rolsuper=false/rolbypassrls=false. The
      # postgres:15 image's default POSTGRES_USER is a superuser, which fails
      # both assertions and — per ADR-026 §3.1 — a superuser bypasses RLS
      # unconditionally, so a run through it would prove nothing. This
      # provisions a role shaped like the one DO Managed Postgres gives us in
      # production instead: a plain, non-superuser owner. CREATEROLE (not
      # just CREATEDB) is required too — rls-isolation.integration.test.ts's
      # own beforeAll creates a second, ordinary probe role through this same
      # connection, and only a role with CREATEROLE can do that.
      - name: Provision a non-superuser table-owner role (production shape)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: test
          PGPASSWORD: test
          PGDATABASE: test
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE rls_owner LOGIN PASSWORD 'rls_owner_ci_pw' CREATEDB CREATEROLE;" \
            -c "CREATE DATABASE rls_scratch OWNER rls_owner;"

      # Deploys as rls_owner, not the "test" superuser service account, so
      # rls_owner ends up OWNING every table it creates — the production
      # shape being proven (DATABASE_URL is also the role that ran
      # `prisma migrate deploy`), unlike the `migrations` job above whose
      # superuser owner can never observe RLS at all.
      - name: Apply reservations migrations as the owner role
        env:
          DATABASE_URL: postgresql://rls_owner:rls_owner_ci_pw@localhost:5432/rls_scratch
        run: pnpm --filter @mbe/reservations-service db:migrate:deploy

      # rls-route-sweep.integration.test.ts (#5369 PR 2) is the first suite in
      # this job to call buildApp() — the other three test RLS directly
      # against raw pg/Prisma clients and never touch @mbe/auth. `pnpm
      # install` only LINKS workspace packages; it does not compile them, and
      # @mbe/types' exports resolve to ./dist/*, so without this the sweep
      # dies before its first test even runs:
      #   Error: Failed to resolve entry for package "@mbe/types".
      # (identical failure mode, same fix pattern, as mutation-testing.yml's
      # own "Build workspace dependencies" step). `...` builds the service
      # itself plus its transitive deps, not the whole workspace.
      - name: Build workspace dependencies
        run: pnpm build --filter @mbe/reservations-service...

      # All SEVEN `DATABASE_URL`-gated suites, listed explicitly rather than
      # globbed: a glob fails silently in both directions (quietly picking up
      # or dropping files), and the coverage test below pins this list.
      # rls-app-reservations.integration.test.ts proves SET LOCAL ROLE
      # app_reservations against the same owner connection.
      # lapsed-guest-cron.rls.integration.test.ts was the third suite nobody
      # ran - it is named in both other suites' doc comments as the sibling
      # they coordinate the pg_advisory_lock(5369) key with, so leaving it
      # out would have reproduced, in this very job, the gap the job exists
      # to close. rls-route-sweep.integration.test.ts (#5369 PR 2) is the
      # fourth: a real buildApp() against this same owner role, injecting
      # every registered route (a drift guard fails if a new route ships
      # with no fixture) under RLS_CONTEXT_MODE=throw, plus three direct,
      # non-HTTP-invocation tests for the job-worker handlers and the
      # lapsed-guest cron. rls-venue-resolution.integration.test.ts (#5369
      # PR 3) is the fifth: proves app_resolve_venue_id and
      # app_reservation_venue_ids_for_user against the same owner role, under
      # its own FORCE window (so a pass means the admitting policy actually
      # ran, not owner-bypass). Measured locally against this same postgres:15
      # + rls_owner setup: 5 files pass in a few seconds, well inside the 15s
      # hookTimeout that bounds the advisory-lock wait.
      - name: Run RLS integration suites against the owner role
        env:
          DATABASE_URL: postgresql://rls_owner:rls_owner_ci_pw@localhost:5432/rls_scratch
        run: |
          set -o pipefail
          pnpm --filter @mbe/reservations-service exec vitest run \
            src/routes/rls-owner-enforcement.integration.test.ts \
            src/routes/rls-app-reservations.integration.test.ts \
            src/routes/rls-isolation.integration.test.ts \
            src/services/lapsed-guest-cron.rls.integration.test.ts \
            src/routes/rls-route-sweep.integration.test.ts \
            src/routes/rls-venue-resolution.integration.test.ts \
            src/services/availability-snapshot.integration.test.ts \
            src/services/venue-share-lock.integration.test.ts \
            src/services/availability-conflict.integration.test.ts \
            src/services/availability-conflict-series.integration.test.ts \
            src/services/closure-impact.integration.test.ts \
            src/services/availability-undo-order.integration.test.ts \
            src/services/closure-notice-refund.integration.test.ts \
            src/services/series-edit-carry.integration.test.ts \
            src/services/closure-reopen-date.integration.test.ts \
            src/services/availability-day-scope.integration.test.ts \
            src/services/floor-plan-lifecycle.integration.test.ts \
            src/services/bookable-tables.integration.test.ts \
            src/services/venue-delete-availability-cascade.integration.test.ts \
            src/services/date-rule-section-migration.integration.test.ts \
            src/services/section-closure-delete.integration.test.ts \
            src/services/holiday-decision.integration.test.ts \
            src/scripts/collapse-day-named-schedules.integration.test.ts \
            --reporter=default --reporter=json --outputFile=rls-integration-results.json

      # `describe.skipIf` reports as a file-level PASS when its guard is
      # false — the summary line looks no different from a real pass, and a
      # `numPendingTests` count in the JSON report is the only signal that
      # nothing actually ran. That gap is exactly how these suites went
      # unexercised for the whole seven-part series. Assert on the real test
      # counts instead of trusting the step's exit code alone.
      - name: Prove the suites actually ran, not skipped
        run: node scripts/assert-vitest-ran.mjs services/reservations/rls-integration-results.json

  report-health:
    name: Report CI Health
    needs: [prepare, static-checks, build, test, migrations]
    # has_code is load-bearing, not decoration. The loop below treats anything
    # that is not `failure`/`cancelled` as success, and `skipped` is neither —
    # so on a docs-only push (where static-checks/build/test/migrations all
    # skip) this would write conclusion=success to ci/latest and mask a red
    # code run that preceded it. Only report health for runs that tested code.
    if: always() && github.ref == 'refs/heads/main' && needs.prepare.outputs.has_code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Write CI status to KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          KV_NS_ID: ${{ secrets.HEALTH_KV_NAMESPACE_ID }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          STATIC_RESULT: ${{ needs.static-checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MIGRATIONS_RESULT: ${{ needs.migrations.result }}
        run: |
          set -o pipefail
          CONCLUSION="success"
          for RESULT in "$STATIC_RESULT" "$BUILD_RESULT" "$TEST_RESULT" "$MIGRATIONS_RESULT"; do
            if [ "$RESULT" = "failure" ]; then
              CONCLUSION="failure"
              break
            elif [ "$RESULT" = "cancelled" ]; then
              CONCLUSION="cancelled"
            fi
          done
          PAYLOAD=$(jq -n \
            --argjson id "$GH_RUN_ID" \
            --arg conclusion "$CONCLUSION" \
            --arg branch "$GH_REF_NAME" \
            --arg sha "$GH_SHA" \
            --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{id: $id, conclusion: $conclusion, branch: $branch, sha: $sha, updated_at: $updated_at}')
          # Skip the write when nothing a consumer reads has changed. Cloudflare's
          # free KV tier caps daily WRITES (error 10048, HTTP 429) far below reads, and
          # every push/deploy used to write. "Unchanged" means: same stored conclusion
          # AND the stored updated_at is under 24h old. sha/id/updated_at differ every
          # run and are ignored, because consumers (infrastructure/worker health)
          # classify by the CONCLUSION; the 24h bound keeps at most one refresh write
          # per day so updated_at stays fresh. Any GET failure (404 absent key, 5xx,
          # 000) falls through to the write.
          KV_URL="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NS_ID}/values/ci%2Flatest"
          RESP_FILE="$(mktemp)"
          GET_CODE="$(curl -s -o "$RESP_FILE" -w '%{http_code}' \
            "$KV_URL" \
            -H "Authorization: Bearer ${CF_API_TOKEN}")" || GET_CODE="000"
          if [ "$GET_CODE" = "200" ] && jq -e --arg c "$CONCLUSION" '(.conclusion == $c) and ((now - (.updated_at | fromdateiso8601)) < 86400)' "$RESP_FILE" >/dev/null 2>&1; then
            echo "Cloudflare KV unchanged (conclusion ${CONCLUSION}, record < 24h old); skipping write"
            rm -f "$RESP_FILE"
            exit 0
          fi

          # Capture the status and body instead of `curl -f` (which hides both
          # behind exit 22). Print only the status and Cloudflare's
          # errors[].code/message — never headers or the Authorization value.
          HTTP_CODE="$(curl -s -o "$RESP_FILE" -w '%{http_code}' -X PUT \
            "$KV_URL" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")" || HTTP_CODE="000"
          echo "Cloudflare KV write: HTTP ${HTTP_CODE}"
          case "$HTTP_CODE" in
            2??) rm -f "$RESP_FILE" ;;
            429)
              # Spent free-tier quota (10048) must not turn main red or fail a deploy.
              jq -r '.errors[]? | "  error \(.code): \(.message)"' "$RESP_FILE" 2>/dev/null || true
              rm -f "$RESP_FILE"
              echo "::warning::Cloudflare KV write rate/quota limited (HTTP 429); health record not updated"
              exit 0
              ;;
            *)
              jq -r '.errors[]? | "  error \(.code): \(.message)"' "$RESP_FILE" 2>/dev/null || true
              rm -f "$RESP_FILE"
              exit 1
              ;;
          esac

  # Storybook play functions and axe checks in real Chromium (#8088, promoted to
  # a CI Gate dependency in #8117 after 28 green runs on main). jsdom has no
  # layout, so Dialog.overlays.stories.tsx (an overlay is not clipped inside a
  # Dialog) can only be guarded here. Skipped (a pass for the gate) when no
  # rialto-relevant file changed. The gate script judges each story against
  # packages/rialto/storybook-quarantine.json rather than trusting the exit
  # code, and is itself the failing step.
  storybook-tests:
    name: Storybook browser tests (rialto)
    needs: [prepare]
    if: needs.prepare.outputs.has_rialto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        # #8678: an apt mirror hang inside --with-deps silently ate the whole
        # 15-minute job budget with zero retry, so the job was just cancelled.
        # Three short (300s) attempts (first fix attempt) still weren't long
        # enough for apt to fail over from the dead primary mirror to the
        # working fallback in the runner's mirrorlist — each retry just
        # re-hung on the same dead mirror. One long attempt gives apt time to
        # fail over and succeed; one short retry covers a genuine transient
        # blip. The job timeout is raised to fit the long attempt alongside
        # setup and the actual test run.
        run: |
          if timeout 720 pnpm --dir packages/rialto exec playwright install --with-deps chromium; then
            exit 0
          fi
          echo "playwright install attempt 1 failed or timed out, retrying..."
          sleep 10
          if timeout 180 pnpm --dir packages/rialto exec playwright install --with-deps chromium; then
            exit 0
          fi
          echo "::error::playwright install --with-deps chromium failed after 2 attempts"
          exit 1
      - name: Run Storybook browser tests
        run: node scripts/storybook-test-gate.mjs

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      [
        prepare,
        static-checks,
        repo-checks,
        containers,
        build,
        test,
        migrations,
        rls-integration,
        a11y-attribution,
        docs-format,
        storybook-tests,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to publish the commit status below (#4025) — the job-level
      # grant is additive on top of the workflow's default contents:read.
      statuses: write
    # Single source of truth for the repo-wide coverage threshold. The stricter
    # agent-core package gate (80%) is a deliberately separate, package-specific
    # rule — not a competing repo number.
    env:
      COVERAGE_THRESHOLD: 60
    steps:
      # Checkout is needed here (unlike a bare status-check job) because the
      # "Publish CI Gate commit status" step below invokes the pure mapping
      # in scripts/ci-gate-commit-status.mjs (#4025).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4/v5
      - name: Determine target SHA for commit status
        # #4025: on `pull_request`, github.sha is the ephemeral merge commit
        # (refs/pull/N/merge), not the PR's head SHA that branch protection
        # evaluates required statuses against. Every other trigger this
        # workflow supports (push, merge_group, workflow_dispatch) uses
        # github.sha directly.
        id: target-sha
        run: echo "sha=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"
      # Test Coverage Gate, folded in from its own job (#10010): it only joined
      # the `test` legs and cost one more queued runner on the required path.
      # Runs only when every `test` leg passed (a red or missing leg must mean
      # no coverage verdict, never a partial repo-wide percentage); on a
      # docs-only run `test` is skipped so these are skipped too. A failing
      # step here skips "Check required job results", and the publish step
      # below maps that skipped outcome to an `error` status, so CI Gate can
      # never go green past it.
      - name: Download coverage artifacts
        if: needs.test.result == 'success'
        # upload-artifact keeps paths relative to the workspace, so merging all
        # legs into `.` reconstructs <pkg>/coverage/coverage-final.json exactly
        # where the scan and the codecov file list below expect it.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
          path: .

      - name: Upload coverage reports
        if: needs.test.result == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/auth/coverage/coverage-final.json,./packages/config/coverage/coverage-final.json,./packages/agent-core/coverage/coverage-final.json,./packages/rialto/coverage/coverage-final.json,./packages/rialto-catalog/coverage/coverage-final.json,./packages/api-client/coverage/coverage-final.json,./services/users/coverage/coverage-final.json,./services/reservations/coverage/coverage-final.json,./services/agent/coverage/coverage-final.json,./apps/hospitality/coverage/coverage-final.json,./tools/cli/coverage/coverage-final.json,./tools/route-contract/coverage/coverage-final.json,./infrastructure/pulumi/coverage/coverage-final.json,./infrastructure/worker/coverage/coverage-final.json,./scripts/coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true

      - name: Enforce repo-wide coverage threshold
        if: needs.test.result == 'success'
        run: |
          # Repo-wide statement coverage across every package's coverage-final.json,
          # folded in from the retired coverage-gate.yml so the suite runs at most
          # once per required Node version. Threshold source: COVERAGE_THRESHOLD env.
          TOTAL_LINES=0
          COVERED_LINES=0
          for REPORT in $(find . -path '*/coverage/coverage-final.json' -not -path '*/node_modules/*' | sort); do
            PKG_TOTAL=$(node -e "
              const c = require('./$REPORT');
              let t=0, cov=0;
              for (const f of Object.values(c)) {
                for (const v of Object.values(f.s)) { t++; if (v>0) cov++; }
              }
              console.log(t + ',' + cov);
            ")
            PKG_T=$(echo "$PKG_TOTAL" | cut -d',' -f1)
            PKG_C=$(echo "$PKG_TOTAL" | cut -d',' -f2)
            TOTAL_LINES=$((TOTAL_LINES + PKG_T))
            COVERED_LINES=$((COVERED_LINES + PKG_C))
          done
          if [ "$TOTAL_LINES" -eq 0 ]; then
            echo "::error::No coverage statements found across the repo"
            exit 1
          fi
          PERCENT=$((COVERED_LINES * 100 / TOTAL_LINES))
          echo "Repo-wide coverage: ${PERCENT}% (${COVERED_LINES}/${TOTAL_LINES} statements, threshold: ${COVERAGE_THRESHOLD}%)"
          if [ "$PERCENT" -lt "$COVERAGE_THRESHOLD" ]; then
            echo "::error::Coverage ${PERCENT}% is below threshold of ${COVERAGE_THRESHOLD}%"
            exit 1
          fi
          echo "Repo-wide coverage threshold met"

      - name: Enforce agent-core coverage threshold
        if: needs.test.result == 'success'
        run: |
          COVERAGE_FILE="./packages/agent-core/coverage/coverage-final.json"
          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "ERROR: agent-core coverage report not found at $COVERAGE_FILE"
            exit 1
          fi
          TOTAL_STMTS=0
          COVERED_STMTS=0
          while IFS= read -r line; do
            file_total=$(echo "$line" | jq -r ".s | to_entries | length")
            file_covered=$(echo "$line" | jq -r "[.s | to_entries[] | select(.value > 0)] | length")
            TOTAL_STMTS=$((TOTAL_STMTS + file_total))
            COVERED_STMTS=$((COVERED_STMTS + file_covered))
          done < <(jq -c ".[]" "$COVERAGE_FILE")
          if [ "$TOTAL_STMTS" -eq 0 ]; then
            echo "ERROR: No statements found in coverage report"
            exit 1
          fi
          PCT=$((COVERED_STMTS * 100 / TOTAL_STMTS))
          echo "agent-core statement coverage: ${PCT}% (${COVERED_STMTS}/${TOTAL_STMTS})"
          if [ "$PCT" -lt 80 ]; then
            echo "ERROR: agent-core coverage ${PCT}% is below the 80% threshold"
            exit 1
          fi
          echo "agent-core coverage threshold met"

      - name: Check required job results
        id: gate-check
        # Fail-CLOSED decision (scripts/ci-gate-required-results.mjs): only
        # `success` and `skipped` pass; every other result (failure, cancelled,
        # abandoned, neutral, timed_out, empty, ...) fails. The previous inline
        # loop failed only on failure/cancelled, so on 2026-10-05 (PR #6077,
        # run 37363956419 attempt 2) `abandoned` jobs let CI Gate go green with
        # nothing verified. The module also checks the root of the chain:
        # prepare must succeed (its only `if:` is the draft guard), and every Build-chain job
        # must succeed whenever has_code == 'true', so a broken root or a
        # mistyped leaf `if:` can't masquerade as a docs-only skip (#10064).
        #
        # toJSON(needs) rather than a hand-listed env var per job: a job added
        # to `needs:` above is gated automatically.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IS_DRAFT_PR: ${{ github.event.pull_request.draft == true }}
        run: |
          set -euo pipefail
          node scripts/ci-gate-required-results.mjs
      - name: Publish CI Gate commit status
        # #4025: a check RUN produced off the `pull_request` event is what
        # branch protection's required-status evaluation normally reads —
        # but a check run produced by a `workflow_dispatch` escape-hatch
        # (used when GITHUB_TOKEN-authored PRs can't trigger `pull_request`
        # at all, see the gotchas.md entry this closes) is invisible to
        # both `statusCheckRollup` and that evaluation. A commit STATUS,
        # published here via the REST statuses API, surfaces in both
        # regardless of which event produced this run. Additive: the job
        # above still reports the normal required check run unchanged.
        #
        # if: always() so this runs whether "Check required job results"
        # passed, failed, or the job was cancelled — a red/cancelled CI run
        # must never leave a stale green `CI Gate` status behind.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target-sha.outputs.sha }}
          OUTCOME: ${{ steps.gate-check.outcome }}
        run: |
          STATE=$(node scripts/ci-gate-commit-status.mjs state --outcome "$OUTCOME")
          # Retry transient failures only — a real 4xx rejection (bad token,
          # bad payload, etc.) should fail fast rather than burning three
          # attempts on a verdict that will not change. See #4333: a single
          # unretried 503 from a GitHub-side outage failed the whole CI Gate
          # job even though every substantive job had passed.
          #
          # The classification lives in the pure, unit-tested
          # isTransientPublishError() rather than an inline regex here. The
          # inline version #4333 shipped missed `unexpected end of JSON
          # input` and turned a fully green run (32081722175) red — an
          # untested regex embedded in YAML is exactly where that goes
          # unnoticed.
          for i in 1 2 3; do
            OUTPUT=$(gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/statuses/$SHA" \
              -f state="$STATE" \
              -f context="CI Gate" \
              -f description="CI Gate ${STATE}" \
              -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 2>&1) && { echo "$OUTPUT"; exit 0; }
            echo "$OUTPUT"
            if printf '%s' "$OUTPUT" | node scripts/ci-gate-commit-status.mjs transient; then
              echo "Publish attempt $i failed with a transient error, retrying in 10s..."
              sleep 10
            else
              echo "::error::Publish CI Gate commit status failed with a non-transient error"
              exit 1
            fi
          done
          echo "::error::Publish CI Gate commit status failed after 3 attempts"
          exit 1
