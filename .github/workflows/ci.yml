name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "*.png"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      has_code: ${{ steps.filter.outputs.has_code }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4/v5
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: filter
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE_CHANGES=$(git diff --name-only "origin/$BASE_REF"...HEAD -- . ':!*.md' ':!docs/' ':!*.png' ':!.gitignore' ':!LICENSE' | wc -l | tr -d ' ')
          if [ "$CODE_CHANGES" -gt 0 ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: Prepare
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            services/*/node_modules
            tools/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Prisma clients
        id: cache-prisma
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            services/users/src/generated
            services/reservations/src/generated
            services/agent/src/generated
          key: prisma-clients-${{ hashFiles('services/users/prisma/schema.prisma', 'services/reservations/prisma/schema.prisma', 'services/agent/prisma/schema.prisma') }}

      - name: Generate Prisma clients
        if: steps.cache-prisma.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @mbe/users-service db:generate
          pnpm --filter @mbe/reservations-service db:generate
          pnpm --filter @mbe/agent-service db:generate

      - name: Login to Turborepo Remote Cache
        if: env.TURBO_TOKEN != ''
        run: pnpm turbo login --token "$TURBO_TOKEN"

      - name: Link to Turborepo Remote Cache
        if: env.TURBO_TOKEN != ''
        run: pnpm turbo link --team "$TURBO_TEAM" --token "$TURBO_TOKEN"

  dependency-audit:
    name: Dependency Sync
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Run Dependency Audit
        run: node scripts/check-dep-sync.mjs

  hadolint:
    name: Dockerfile Lint
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4/v5

      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: "services/users/Dockerfile"

      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: "services/reservations/Dockerfile"

      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: "services/agent/Dockerfile"

      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: "infrastructure/migrate/Dockerfile"

  trivy:
    name: Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        dockerfile:
          - { path: "services/users/Dockerfile", name: "users" }
          - { path: "services/reservations/Dockerfile", name: "reservations" }
          - { path: "services/agent/Dockerfile", name: "agent" }
          - { path: "infrastructure/migrate/Dockerfile", name: "migrate" }

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4/v5

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: "fs"
          scan-ref: ${{ matrix.dockerfile.path }}
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          format: "table"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [prepare]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            services/*/node_modules
            tools/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Ensure dependencies installed
        # Defensive — root-level node_modules cache often hits but
        # workspace-package node_modules symlinks can go missing,
        # leaving turbo unable to resolve transitive deps. A frozen
        # install is a fast no-op on cache hit and a real install on miss.
        run: pnpm install --frozen-lockfile

      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: [prepare]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            services/*/node_modules
            tools/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Ensure dependencies installed
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma clients
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            services/users/src/generated
            services/reservations/src/generated
            services/agent/src/generated
          key: prisma-clients-${{ hashFiles('services/users/prisma/schema.prisma', 'services/reservations/prisma/schema.prisma', 'services/agent/prisma/schema.prisma') }}

      - name: Typecheck
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        run: pnpm typecheck

  architecture-audit:
    name: Architecture Audit
    runs-on: ubuntu-latest
    needs: [prepare]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            services/*/node_modules
            tools/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Ensure dependencies installed
        run: pnpm install --frozen-lockfile

      - name: Build CLI and its dependencies
        run: pnpm build --filter @mbe/cli...

      - name: Run ADR and Dependency Checks
        run: |
          pnpm --filter @mbe/cli start check-adr
          pnpm --filter @mbe/cli start check-deps

  integrity:
    name: Integrity
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            services/*/node_modules
            tools/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Ensure dependencies installed
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build --filter @mbe/cli --force

      - name: Check instruction sync (llms.txt)
        run: |
          for pkg in packages/* apps/* services/*; do
            if [ -f "$pkg/llms.txt" ]; then
              echo "Regenerating $pkg..."
              node tools/cli/dist/index.js pack "$pkg"
            fi
          done
          git diff --exit-code -- '*/llms.txt' '*/llms-full.txt' || \
            (echo "ERROR: llms.txt files are out of sync. Run 'pnpm pack-changed' locally and commit." && exit 1)

      - name: Check for instruction rot
        run: node scripts/detect-instruction-rot.mjs

      - name: Check doc freshness
        run: node scripts/check-doc-freshness.mjs

      - name: Check component registry integrity
        run: |
          pnpm --filter @mattbutlerengineering/rialto build:registry
          git diff --exit-code packages/rialto/registry.json || \
            (echo "ERROR: registry.json is stale. Run 'pnpm --filter @mattbutlerengineering/rialto build:registry' locally and commit the result." && exit 1)

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, architecture-audit]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            services/*/node_modules
            tools/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Ensure dependencies installed
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma clients
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            services/users/src/generated
            services/reservations/src/generated
            services/agent/src/generated
          key: prisma-clients-${{ hashFiles('services/users/prisma/schema.prisma', 'services/reservations/prisma/schema.prisma', 'services/agent/prisma/schema.prisma') }}

      - name: Build all packages
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        run: pnpm build

      - name: Run Full Repository Audit
        run: pnpm repo-audit

      - name: Regenerate dependency graph
        run: |
          node scripts/generate-dep-graph.mjs
          git diff --exit-code infrastructure/worker/dep-graph.json || \
            (echo "ERROR: dep-graph.json is stale. Run 'pnpm generate:dep-graph' locally and commit the result." && exit 1)

      - name: Check catalog drift
        run: |
          pnpm --filter @mbe/rialto-catalog generate
          git diff --exit-code packages/rialto-catalog/src/generated-schemas.ts || \
            (echo "ERROR: generated-schemas.ts is stale. Run 'pnpm --filter @mbe/rialto-catalog generate' locally and commit the result." && exit 1)

      - name: Check dependency graph drift
        run: |
          pnpm graph
          git diff --exit-code docs/architecture/dependency-graph.md || \
            (echo "ERROR: dependency-graph.md is stale. Run 'pnpm graph' locally and commit the result." && exit 1)

      - name: Check bundle size budgets
        run: pnpm size:check

  a11y-attribution:
    name: Accessibility AI Attribution
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'agent-') || startsWith(github.head_ref, 'worktree-agent-'))
    needs: [prepare]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            services/*/node_modules
            tools/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Ensure dependencies installed
        run: pnpm install --frozen-lockfile

      - name: Run a11y tests (accessibility vitest)
        run: pnpm --dir packages/rialto vitest run --reporter=json --outputFile=../../a11y-results.json src/test/accessibility src/test/token-contrast.test.ts # accessibility
        continue-on-error: true

      - name: Process results for attribution
        run: node scripts/process-a11y-results.js || true
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_ACTOR: ${{ github.actor }}

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [lint, typecheck, architecture-audit]

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            services/*/node_modules
            tools/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Ensure dependencies installed
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma clients
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            services/users/src/generated
            services/reservations/src/generated
            services/agent/src/generated
          key: prisma-clients-${{ hashFiles('services/users/prisma/schema.prisma', 'services/reservations/prisma/schema.prisma', 'services/agent/prisma/schema.prisma') }}

      - name: Run tests with coverage
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        run: pnpm turbo test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/auth/coverage/coverage-final.json,./packages/agent-core/coverage/coverage-final.json,./packages/rialto/coverage/coverage-final.json,./packages/rialto-catalog/coverage/coverage-final.json,./packages/api-client/coverage/coverage-final.json,./packages/feature-flags/coverage/coverage-final.json,./packages/observability/coverage/coverage-final.json,./packages/mcp-server/coverage/coverage-final.json,./services/users/coverage/coverage-final.json,./services/reservations/coverage/coverage-final.json,./services/agent/coverage/coverage-final.json,./apps/hospitality/coverage/coverage-final.json,./tools/cli/coverage/coverage-final.json,./infrastructure/pulumi/coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true

      - name: Enforce agent-core coverage threshold
        if: matrix.node-version == 22
        run: |
          COVERAGE_FILE="./packages/agent-core/coverage/coverage-final.json"
          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "ERROR: agent-core coverage report not found at $COVERAGE_FILE"
            exit 1
          fi
          TOTAL_STMTS=0
          COVERED_STMTS=0
          while IFS= read -r line; do
            file_total=$(echo "$line" | jq -r ".s | to_entries | length")
            file_covered=$(echo "$line" | jq -r "[.s | to_entries[] | select(.value > 0)] | length")
            TOTAL_STMTS=$((TOTAL_STMTS + file_total))
            COVERED_STMTS=$((COVERED_STMTS + file_covered))
          done < <(jq -c ".[]" "$COVERAGE_FILE")
          if [ "$TOTAL_STMTS" -eq 0 ]; then
            echo "ERROR: No statements found in coverage report"
            exit 1
          fi
          PCT=$((COVERED_STMTS * 100 / TOTAL_STMTS))
          echo "agent-core statement coverage: ${PCT}% (${COVERED_STMTS}/${TOTAL_STMTS})"
          if [ "$PCT" -lt 80 ]; then
            echo "ERROR: agent-core coverage ${PCT}% is below the 80% threshold"
            exit 1
          fi
          echo "agent-core coverage threshold met"

  migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    needs: [lint, typecheck]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4/v5

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            services/*/node_modules
            tools/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Ensure dependencies installed
        run: pnpm install --frozen-lockfile

      - name: Restore Prisma clients
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            services/users/src/generated
            services/reservations/src/generated
            services/agent/src/generated
          key: prisma-clients-${{ hashFiles('services/users/prisma/schema.prisma', 'services/reservations/prisma/schema.prisma', 'services/agent/prisma/schema.prisma') }}

      - name: Check for destructive migrations
        run: node scripts/check-destructive-migrations.js

      - name: Apply migrations (users)
        run: pnpm --filter @mbe/users-service db:migrate:deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Apply migrations (reservations)
        run: pnpm --filter @mbe/reservations-service db:migrate:deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Apply migrations (agent)
        run: pnpm --filter @mbe/agent-service db:migrate:deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Verify schema is in sync
        run: |
          pnpm --filter @mbe/users-service db:migrate:status
          pnpm --filter @mbe/reservations-service db:migrate:status
          pnpm --filter @mbe/agent-service db:migrate:status
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  report-health:
    name: Report CI Health
    needs: [lint, typecheck, build, test, migrations]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Write CI status to KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.MBE_CLOUDFLARE_API_TOKEN }}
          KV_NS_ID: ${{ secrets.HEALTH_KV_NAMESPACE_ID }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MIGRATIONS_RESULT: ${{ needs.migrations.result }}
        run: |
          CONCLUSION="success"
          for RESULT in "$LINT_RESULT" "$TYPECHECK_RESULT" "$BUILD_RESULT" "$TEST_RESULT" "$MIGRATIONS_RESULT"; do
            if [ "$RESULT" = "failure" ]; then
              CONCLUSION="failure"
              break
            elif [ "$RESULT" = "cancelled" ]; then
              CONCLUSION="cancelled"
            fi
          done
          PAYLOAD=$(jq -n \
            --argjson id "$GH_RUN_ID" \
            --arg conclusion "$CONCLUSION" \
            --arg branch "$GH_REF_NAME" \
            --arg sha "$GH_SHA" \
            --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{id: $id, conclusion: $conclusion, branch: $branch, sha: $sha, updated_at: $updated_at}')
          curl -sf -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NS_ID}/values/ci%2Flatest" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

  # ──────────────────────────────────────────────────────────────────────────
  # Migration Dry-Run — test Prisma migrations against a fresh DB on PRs
  # ──────────────────────────────────────────────────────────────────────────
  migration-dry-run:
    name: Migration Dry-Run
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4/v5
        with:
          fetch-depth: 0

      - name: Start postgres
        run: |
          for i in 1 2 3; do
            docker pull postgres:16-alpine && break || (echo "Pull attempt $i failed, retrying in 10s..." && sleep 10)
          done
          docker run -d --name postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=dryrun \
            -e POSTGRES_PASSWORD=dryrun_test \
            -e POSTGRES_DB=dryrun \
            postgres:16-alpine
          for i in $(seq 1 20); do
            docker exec postgres pg_isready -U dryrun && break || sleep 3
          done

      - name: Check for migration changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'services/*/prisma/migrations/' | head -20)
          if [ -z "$CHANGED" ]; then
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
            echo "No migration changes detected"
          else
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            echo "Migration files changed:"
            echo "$CHANGED"
          fi

      - name: Install Prisma CLI
        if: steps.changes.outputs.has_migrations == 'true'
        run: npm install -g prisma@6

      - name: Apply existing migrations
        if: steps.changes.outputs.has_migrations == 'true'
        env:
          DATABASE_URL: "postgresql://dryrun:dryrun_test@localhost:5432/dryrun"
        run: |
          for SERVICE in users reservations agent; do
            SCHEMA="services/$SERVICE/prisma/schema.prisma"
            if [ -f "$SCHEMA" ]; then
              echo "=== Deploying $SERVICE migrations ==="
              prisma migrate deploy --schema "$SCHEMA" 2>&1 || {
                echo "::error::Migration deploy failed for $SERVICE"
                exit 1
              }
              echo "✓ $SERVICE migrations applied"
            fi
          done

      - name: Validate schema consistency
        if: steps.changes.outputs.has_migrations == 'true'
        env:
          DATABASE_URL: "postgresql://dryrun:dryrun_test@localhost:5432/dryrun"
        run: |
          for SERVICE in users reservations agent; do
            SCHEMA="services/$SERVICE/prisma/schema.prisma"
            if [ -f "$SCHEMA" ]; then
              echo "=== Checking $SERVICE schema drift ==="
              DIFF=$(prisma migrate diff \
                --from-migrations "services/$SERVICE/prisma/migrations" \
                --to-schema-datamodel "$SCHEMA" \
                --shadow-database-url "postgresql://dryrun:dryrun_test@localhost:5432/dryrun_shadow" 2>&1 || true)

              if echo "$DIFF" | grep -q "No difference"; then
                echo "✓ $SERVICE schema matches migrations"
              else
                echo "::warning::$SERVICE may have schema drift"
                echo "$DIFF"
              fi
            fi
          done

      - name: Run basic query tests
        if: steps.changes.outputs.has_migrations == 'true'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: dryrun
          PGPASSWORD: dryrun_test
          PGDATABASE: dryrun
        run: |
          TABLE_COUNT=$(psql -t -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'" | tr -d ' ')
          echo "Tables after migration: $TABLE_COUNT"

          MIGRATION_COUNT=$(psql -t -c "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL" | tr -d ' ')
          echo "Migrations applied: $MIGRATION_COUNT"

          FAILED=$(psql -t -c "SELECT count(*) FROM _prisma_migrations WHERE rolled_back_at IS NOT NULL" | tr -d ' ')
          if [ "$FAILED" != "0" ]; then
            echo "::error::$FAILED migration(s) were rolled back"
            psql -c "SELECT migration_name, started_at, rolled_back_at FROM _prisma_migrations WHERE rolled_back_at IS NOT NULL"
            exit 1
          fi

          echo "✓ All migrations applied successfully"

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      [
        lint,
        typecheck,
        architecture-audit,
        build,
        test,
        hadolint,
        migrations,
        migration-dry-run,
        dependency-audit,
        integrity,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Check required job results
        env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          ARCH: ${{ needs.architecture-audit.result }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
          HADOLINT: ${{ needs.hadolint.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
          DRY_RUN: ${{ needs.migration-dry-run.result }}
          DEPS: ${{ needs.dependency-audit.result }}
          INTEGRITY: ${{ needs.integrity.result }}
        run: |
          echo "lint=$LINT typecheck=$TYPECHECK arch=$ARCH build=$BUILD test=$TEST hadolint=$HADOLINT migrations=$MIGRATIONS dry-run=$DRY_RUN deps=$DEPS integrity=$INTEGRITY"
          for job_result in "$LINT" "$TYPECHECK" "$ARCH" "$BUILD" "$TEST" "$HADOLINT" "$MIGRATIONS" "$DRY_RUN" "$DEPS" "$INTEGRITY"; do
            if [ "$job_result" = "failure" ] || [ "$job_result" = "cancelled" ]; then
              echo "::error::Required job failed or was cancelled"
              exit 1
            fi
          done
