name: Enhancement
description: Suggest a feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? Why is it needed?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this work?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know this is done? Clear, testable criteria help agents and reviewers.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: textarea
    id: user_story
    attributes:
      label: User story / use case
      description: Who benefits and how? (e.g., "As a guest, I can cancel my reservation so I free the table for others")
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - "Marketing site"
        - "Hospitality app"
        - "Users service"
        - "Reservations service"
        - "Agent service"
        - "Rialto design system"
        - "CI/CD"
        - "Developer experience"
        - "Other"
    validations:
      required: true
