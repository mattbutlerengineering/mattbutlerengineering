name: Documentation
description: Suggest improvements or report issues in documentation
labels: ["documentation"]
body:
  - type: textarea
    id: description
    attributes:
      label: What needs to be improved?
      description: Describe the gap or error in existing documentation.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion
      description: How should the documentation be updated?
