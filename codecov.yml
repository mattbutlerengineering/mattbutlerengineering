codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "50...100"

  status:
    project:
      default:
        target: 80%
        threshold: 2%
        if_ci_failed: ignore
    patch:
      default:
        target: 75%
        threshold: 5%

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: false

flag_management:
  default_rules:
    carryforward: true

flags:
  auth:
    paths:
      - packages/auth/
    carryforward: true
  agent-core:
    paths:
      - packages/agent-core/
    carryforward: true
  rialto:
    paths:
      - packages/rialto/
    carryforward: true
  rialto-catalog:
    paths:
      - packages/rialto-catalog/
    carryforward: true
  users:
    paths:
      - services/users/
    carryforward: true
  reservations:
    paths:
      - services/reservations/
    carryforward: true
  agent:
    paths:
      - services/agent/
    carryforward: true
  hospitality:
    paths:
      - apps/hospitality/
    carryforward: true
  pulumi:
    paths:
      - infrastructure/pulumi/
    carryforward: true
